name: Market action - vérification toutes les 15 min
on:
  schedule:
    # Vise 08h00-22h30 heure de Paris, lundi a vendredi, toutes les 15 min
    # (decision du 12/08/2026 - 30 min jugee trop lente par l'utilisateur).
    # Cible en UTC : 06h00-20h30 (CEST, UTC+2, en vigueur actuellement).
    # Meme limite de derive DST assumee que les autres crons de ce depot
    # (voir market-action-reset.yml) : en heure d'hiver (CET, UTC+1), la
    # fenetre reelle cote Paris devient 07h00-21h30 (1h plus tot).
    - cron: '0,15,30,45 6-20 * * 1-5'
  workflow_dispatch: {}  # déclenchement manuel pour les tests
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collectors/market_check.py
      - name: Commit et push si changements
        run: |
          git config user.name "omnium-news-bot"
          git config user.email "actions@github.com"
          git add data/marketAction.json
          git diff --cached --quiet || git commit -m "Market action : mise a jour $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
