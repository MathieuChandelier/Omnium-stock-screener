name: Veille news Omnium
on:
  schedule:
    # 06:15 UTC = 08:15 heure de Paris en ete (CEST, UTC+2). GitHub Actions
    # n'ajuste jamais automatiquement pour l'heure d'hiver (CET, UTC+1) :
    # de fin octobre a fin mars, ce run tournera donc a 07:15 heure
    # francaise, pas 08:15 - decalage d'1h assume plutot que deux crons
    # saisonniers separes (voir INSTRUCTIONS/discussion pour le meme choix
    # applique precedemment a l'ancien creneau de 07:00 UTC).
    #
    # Avance a 08:15 (au lieu de 09:00 initialement) delibrement : les
    # schedules GitHub Actions sont "best effort" et peuvent subir un
    # retard variable (observe : jusqu'a ~2h30 un jour donne, sans SLA
    # garanti par GitHub). Ce delai avant l'heure cible reelle (~09h-10h
    # souhaitee) absorbe ce risque plutot que de le subir.
    #
    # La fenetre de fraicheur (voir get_window_start) s'aligne d'elle-meme
    # sur "depuis le run d'hier" des lors que ce cron tourne de façon
    # fiable chaque jour ouvre - aucun autre reglage necessaire.
    - cron: '15 6 * * 1-5'
  workflow_dispatch: {}  # déclenchement manuel pour les tests
permissions:
  contents: write
jobs:
  communiques:
    runs-on: ubuntu-latest
    continue-on-error: true  # un flux IR cassé ne doit jamais bloquer web/youtube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install feedparser
      - run: python collectors/communiques.py
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-communiques
          path: artifacts/communiques.json
          if-no-files-found: warn
  web:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic
      - run: python collectors/web.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-web
          path: artifacts/web.json
          if-no-files-found: warn
  youtube:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client
      - run: python collectors/youtube.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-youtube
          path: artifacts/youtube.json
          if-no-files-found: warn
  merge:
    needs: [communiques, web, youtube]
    if: always()  # tourne même si un ou plusieurs collecteurs ont échoué
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: artifacts
          merge-multiple: false
      # Les artifacts téléchargés atterrissent dans artifacts/artifact-<nom>/<nom>.json
      # - on les remet à plat en artifacts/<nom>.json pour que merge.py les trouve.
      - name: Aplatir les artifacts téléchargés
        run: |
          mkdir -p artifacts_flat
          for d in artifacts/artifact-*; do
            name=$(basename "$d" | sed 's/artifact-//')
            [ -f "$d/$name.json" ] && cp "$d/$name.json" "artifacts_flat/$name.json"
          done
          rm -rf artifacts
          mv artifacts_flat artifacts
      - run: python collectors/merge.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit et push si changements
        run: |
          git config user.name "omnium-news-bot"
          git config user.email "actions@github.com"
          git add data/news/ data/newsAll.json data/newsDigest.json data/newsState.json
          git diff --cached --quiet || git commit -m "Veille news : mise à jour automatique $(date -u +%Y-%m-%d)"
          git push
