name: Veille news Omnium - web (hebdo, Sonnet, portefeuille complet)
on:
  schedule:
    # Hebdomadaire (lundi) plutot que quotidien : decision du 17/08/2026,
    # remplace l'ancienne rotation par moitie en Haiku (voir collectors/
    # web.py). Horaire decale de 06:15 UTC (pipeline quotidien communiques/
    # youtube, voir news-collector.yml) et de 06:45 UTC (conferences, voir
    # conferences-collector.yml) pour eviter toute collision au moment du
    # commit/push - meme logique de decalage par 30 min deja en place entre
    # ces deux workflows.
    - cron: '15 7 * * 1'
  workflow_dispatch: {}  # déclenchement manuel pour les tests
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    continue-on-error: true  # une erreur ici ne doit jamais empecher le job de fusion de tourner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic
      - run: python collectors/web.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-web
          path: artifacts/web.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-web-calendar
          path: artifacts/webCalendarProposals.json
          if-no-files-found: ignore  # absent la plupart des runs (aucune proposition ce coup-ci) - pas une erreur
  merge:
    needs: [web]
    if: always()  # tourne même si le collecteur a échoué
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: artifact-web
          path: artifacts_dl
      - uses: actions/download-artifact@v4
        with:
          name: artifact-web-calendar
          path: artifacts_dl
          # Pas de "continue-on-error" ici : sur ce runner, un artifact
          # absent fait simplement que ce step ne trouve rien a telecharger
          # plutot que d'echouer bruyamment tant que le nom existe cote
          # upload (if-no-files-found: ignore, voir job web ci-dessus) -
          # mais si le NOM d'artifact lui-meme n'a jamais ete cree (job web
          # en echec avant l'upload), ce download echouerait : le if: always()
          # ci-dessus laisse quand meme tourner ce job, et merge_web.py
          # tolere deja une absence totale d'artifacts (voir merge.py).
        continue-on-error: true
      # Les artifacts telecharges atterrissent dans artifacts_dl/*.json -
      # on les remet en place en artifacts/*.json pour que merge_web.py les
      # trouve (meme convention que les autres pipelines).
      - name: Placer les artifacts téléchargés
        run: |
          mkdir -p artifacts
          [ -f artifacts_dl/web.json ] && cp artifacts_dl/web.json artifacts/web.json
          [ -f artifacts_dl/webCalendarProposals.json ] && cp artifacts_dl/webCalendarProposals.json artifacts/webCalendarProposals.json
      - run: python collectors/merge_web.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit et push si changements
        run: |
          git config user.name "omnium-news-bot"
          git config user.email "actions@github.com"
          git add data/news/ data/newsAll.json data/webState.json data/calendarProposals.json
          git diff --cached --quiet || git commit -m "Veille news web (hebdo) : mise à jour $(date -u +%Y-%m-%d)"
          git push
