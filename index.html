<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Omnium — Modèle d'investissement</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000190">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Model">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&amp;family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
:root {
  --navy:#000190; --navy-dark:#00004a; --navy-light:#eeeffe;
  --teal:#2BD8C2; --teal-light:#e6faf8; --teal-text:#25CFB4; /* intermediaire entre les deux stops du logo (#1CBBA1 / #2EE3C6) */
  --teal-dark-text:#169886; /* turquoise de marque assombri (nuance B) */
  --gold:#FFD700; --gold-light:#fffce6;
  --bg:#ffffff; --surface:#fff; --border:#e6e6f0;
  --text:#0d0d1a; --muted:#64748b;
  --proj-bg:#f7f9ff;
  --ok:#10b981; --err:#ef4444; --gold-text:#92700a;
  /* Echelle typo : appliquee aux classes CSS statiques ci-dessous ; les tailles
     generees en JS (return-block, badges dynamiques) restent en dur pour ne pas
     multiplier les points de regression a chaque ajustement. */
  --text-xs:11px; --text-sm:12px; --text-base:14px; --text-lg:16px; --text-2xl:28px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Quattrocento Sans',Georgia,serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;}
h1,h2,.tab,.kpi-value,.card-title,.step-title,.btn,.badge,.kpi-label,.adj-label,th{font-family:'Poppins',system-ui,sans-serif;}

/* ── HEADER ── */
header{background:linear-gradient(120deg, var(--navy) 0%, var(--navy-dark) 100%);color:#fff;padding:35px 34px 40px;display:flex;align-items:center;justify-content:space-between;}
.h-tagline{display:flex;align-items:center;gap:7px;margin-top:1px;margin-left:1px;}
.h-tagline span{font-size:27px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:1;font-family:'Poppins',sans-serif;}
.h-logo{height:79px;width:auto;display:block;}

/* ── TABS ── */
.tab-bar{background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 75%,var(--navy-dark) 100%);align-items:center;padding:11px 24px;}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 20px 8px 15px;cursor:pointer;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:22px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;box-shadow:0 1px 3px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.08);transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;}
.back-btn:hover{background:linear-gradient(160deg,#39e6d0,var(--teal) 65%);border-color:var(--teal);color:var(--navy);box-shadow:0 3px 10px rgba(43,216,194,.35),inset 0 1px 0 rgba(255,255,255,.5);transform:translateY(-1px);}
.back-btn:active{transform:scale(.96);}
.back-btn-arrow{font-size:15px;display:inline-block;transition:transform .15s;}
.back-btn:hover .back-btn-arrow{transform:translateX(-2px);}
.panel{display:none;}.panel.active{display:block;}

/* ── LAYOUT ── */
.container{max-width:1160px;margin:0 auto;padding:22px 24px;}

/* ── CARDS ── */
.card{background:var(--surface);border-radius:12px;box-shadow:0 2px 14px rgba(0,1,144,.06),0 1px 3px rgba(0,0,0,.04);padding:20px 24px;margin-bottom:18px;}
/* Tableau de projections : pas d'encadré, il vit directement sur le fond de page (même comportement desktop/mobile). */
#analyse-tbl-card{background:transparent;box-shadow:none;padding:0;}
.card-title{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);margin-bottom:14px;}
.card-title b{color:var(--navy);}

/* ── KPI ── */
.pf-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.10em;font-family:'Poppins',sans-serif;}
.pf-count{font-size:11px;color:var(--muted);font-family:'Quattrocento Sans',serif;}
.pf-list{display:flex;flex-direction:column;gap:0;background:transparent;}
.pf-item{display:flex;align-items:center;gap:22px;background:transparent;padding:11px 22px;cursor:pointer;transition:background .12s;border-left:4px solid transparent;border-bottom:1px solid rgba(0,1,144,.16);}
.pf-item:last-child{border-bottom:none;}
.pf-metric-return .pf-mv,.pf-metric-pe .pf-mv{color:var(--teal-dark-text);font-weight:600;}
.pf-item:hover{background:rgba(43,216,194,.055);}
/* .pf-active retire volontairement : CT est initialise sur le 1er ticker du select
   au chargement (voir loadTicker), ce qui surlignait en permanence la 1ere ligne
   du portefeuille avant tout clic - effet visuellement confondu avec un survol fige.
   Le vrai survol (:hover ci-dessus) reste inchange. */
.pf-main{flex:1.6;min-width:0;}
.pf-name{font-size:14.5px;font-weight:600;color:var(--navy);font-family:'Poppins',sans-serif;}
.pf-sym覆{font-size:11px;font-weight:600;color:var(--muted);margin-left:8px;letter-spacing:.04em;}
.pf-sub{font-size:10.5px;color:var(--muted);margin-top:2px;font-family:'Quattrocento Sans',serif;}
.pf-metrics{display:flex;gap:28px;flex-shrink:0;}
.pf-metric{text-align:center;min-width:60px;}
.pf-ml{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-family:'Poppins',sans-serif;margin-bottom:5px;white-space:nowrap;}
.pf-mv{font-size:13.5px;font-weight:600;color:var(--muted);font-family:'Poppins',sans-serif;line-height:1;}
.pf-mv-event{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.pf-col-header{display:flex;align-items:center;gap:22px;padding:0 22px 8px;margin-top:4px;}
.pf-col-name-spacer{flex:1 1 auto;max-width:360px;min-width:0;display:flex;align-items:center;gap:4px;text-align:left;font-size:11px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;user-select:none;transition:color .12s;}
.pf-col-name-spacer:hover{color:var(--teal-text);}
.pf-col-labels{display:flex;gap:28px;flex-shrink:0;}
.pf-col-lbl{min-width:60px;text-align:center;font-size:11px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;}
.pf-col-lbl.pf-col-sortable{cursor:pointer;user-select:none;position:relative;display:block;transition:color .12s;}
.pf-col-lbl.pf-col-sortable:hover{color:var(--teal-text);}
.pf-sort-arrow{font-size:8px;opacity:.75;display:inline-block;min-width:7px;position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:2px;}
/* Colonne "Next event" : alignee a gauche (titre + contenu), pas centree comme les autres. */
.pf-metric-event{text-align:left;}
.pf-col-lbl.pf-metric-event{text-align:left;padding-left:2px;}
.pf-col-lbl.pf-metric-event .pf-sort-arrow{position:static;transform:none;margin-left:3px;}
.pf-score{text-align:center;min-width:52px;padding:7px 12px;background:rgba(0,1,144,.04);border-radius:9px;flex-shrink:0;}
.pf-score-val{font-size:20px;font-weight:900;color:var(--navy);font-family:'Poppins',sans-serif;line-height:1;}
.pf-score-lbl{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:'Poppins',sans-serif;margin-top:3px;}
.pf-empty{text-align:center;padding:48px;color:var(--muted);font-family:'Quattrocento Sans',serif;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:var(--surface);border-radius:12px;padding:16px 18px;box-shadow:0 2px 14px rgba(0,1,144,.06);border-left:3px solid var(--teal);}
.kpi.gold{border-left-color:var(--gold);}
.kpi.navy{border-left-color:var(--navy);}
.kpi.red{border-left-color:var(--err);}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;font-weight:700;}
.kpi-value{font-size:var(--text-2xl);font-weight:800;color:var(--navy);line-height:1.1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;font-family:'Quattrocento Sans',serif;}

/* ── TABLES ── */
table{width:100%;border-collapse:collapse;font-size:var(--text-base);}
thead th{background:var(--navy);color:#fff;text-align:right;padding:10px 14px;font-weight:600;font-size:12px;letter-spacing:.02em;white-space:nowrap;width:7%;}
thead th:first-child{width:16%;}
thead th:first-child{text-align:left;}
thead th.proj-head{background:var(--navy-light);color:var(--navy);}
tbody td{padding:9px 14px;text-align:right;white-space:nowrap;}
tbody td:first-child{text-align:left;font-weight:500;color:var(--navy);font-family:'Poppins',sans-serif;font-size:11px;}
tbody td.unit{text-align:left;font-size:10px;color:var(--muted);font-style:italic;font-weight:400;font-family:'Quattrocento Sans',serif;}
tbody tr:hover td{background:rgba(43,216,194,.03);}
tbody tr.hist-last td{background:rgba(0,1,144,.03);}
tbody tr.proj-row td{background:var(--proj-bg);color:var(--muted);font-style:italic;}
tbody tr.proj-row td:first-child{font-style:normal;color:var(--navy);opacity:.75;}
tbody td.proj-first{border-left:2px solid var(--teal);}
/* Lignes EPS et P/E : police legerement epaissie (600) par rapport aux
   autres lignes du tableau, pour les distinguer un peu au coup d'oeil -
   applique a la fois a la colonne "Indicateur" (500 -> 600) et aux
   valeurs historiques/projetees (normalement 400, ou 400 italique en
   projection). Volontairement discret : pas de changement de couleur ni
   de taille, juste la graisse. */
/* Lignes EPS et P/E : SEULES les valeurs (historique + projection) sont
   en gras, jamais la colonne "Indicateur" qui reste rigoureusement
   identique (typo, taille, graisse) a celle de toutes les autres lignes.
   IMPORTANT : les valeurs du tableau heritent de la police du body,
   'Quattrocento Sans', qui n'existe QUE en 400 et 700 (voir le <link>
   Google Fonts dans <head> - pas de graisse intermediaire reelle pour
   cette police). Demander un poids intermediaire (500/600) forcerait le
   navigateur a SYNTHETISER cette graisse manquante, ce qui deforme
   legerement les glyphes et les fait paraitre plus grands - c'est ce qui
   causait le probleme de taille. 700 est un poids REELLEMENT charge :
   memes metriques, meme taille, uniquement plus epais.*/
tbody tr.row-emph td:not(:first-child){font-weight:700;}
td input[type=number]{width:100%;border:1px solid transparent;background:transparent;text-align:right;font-size:12px;padding:2px 0;color:inherit;border-radius:4px;font-family:'Quattrocento Sans',serif;transition:border-color .1s,background .1s;-moz-appearance:textfield;}
td input[type=number]::-webkit-outer-spin-button,td input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
td input[type=number]:focus{border-color:var(--teal);background:var(--teal-light);outline:none;}
td input[type=number]:hover{border-color:var(--border);}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.02em;}
.badge-up{background:#dcfce7;color:var(--ok);}
.badge-dn{background:#fee2e2;color:var(--err);}
.badge-nu{background:#f1f5f9;color:#475569;}
.badge-tl{background:var(--teal-light);color:var(--teal-text);}
.badge-gd{background:var(--gold-light);color:var(--gold-text);}
.badge-nv{background:var(--navy-light);color:var(--navy);}

/* ── ALERTS ── */
.alert{padding:9px 13px;border-radius:8px;font-size:11px;margin-bottom:14px;border-left:3px solid;line-height:1.5;}
.alert-warn{background:var(--gold-light);border-color:var(--gold);color:var(--gold-text);}
.alert-info{background:var(--teal-light);border-color:var(--teal);color:var(--teal-text);}

/* ── BUTTONS ── */
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;}
.btn{padding:9px 20px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:transform .1s,box-shadow .1s,opacity .15s;letter-spacing:.02em;}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.1);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-light{background:var(--border);color:var(--text);}
.btn-danger{background:#fee2e2;color:#991b1b;}

/* ── CONTROLS ── */
.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:var(--navy-light);border-radius:10px;margin-bottom:18px;border:1px solid rgba(0,1,144,.08);}
.ctrl{display:flex;align-items:center;gap:8px;}
.ctrl label{font-size:11px;font-weight:700;color:var(--navy);white-space:nowrap;font-family:'Poppins',sans-serif;}
.ctrl input[type=number]{width:90px;border:1px solid rgba(0,1,144,.15);border-radius:6px;padding:5px 8px;font-size:12px;background:#fff;}

/* ── HEADER ANALYSE (nom + cours), compact, une seule ligne, meme typo ── */
.analyse-header{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.analyse-id{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.analyse-name{font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.01em;line-height:1.1;}
.analyse-price-wrap{display:flex;align-items:baseline;gap:8px;}
.analyse-price{display:flex;align-items:baseline;gap:0;}
.analyse-price input#cours{border:none;border-bottom:1.5px solid transparent;background:transparent;font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:var(--navy);padding:0 1px 1px 0;width:60px;text-align:right;transition:border-color .15s;-moz-appearance:textfield;}
.analyse-price input#cours::-webkit-outer-spin-button,.analyse-price input#cours::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.analyse-price input#cours:hover{border-bottom-color:rgba(0,1,144,.18);}
.analyse-price input#cours:focus{outline:none;border-bottom-color:var(--teal);}
.analyse-price-cur{font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:var(--navy);}

/* ── FORMS ── */
select,input[type=text],input[type=date],textarea{border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12px;background:#fff;color:var(--text);font-family:'Quattrocento Sans',serif;transition:border-color .1s,box-shadow .1s;}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(43,216,194,.15);}
textarea{resize:vertical;width:100%;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-field label{font-size:11px;font-weight:700;color:var(--navy);display:block;margin-bottom:4px;font-family:'Poppins',sans-serif;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.sep{height:1px;background:var(--border);margin:16px 0;}

/* ── STEP BOX ── */
.step-box{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;}
.step-num{background:var(--navy);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px;}
.step-content{flex:1;}
.step-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;}

/* ── ADJ GRIDS ── */
.adj-eps-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0;}
.adj-cell{text-align:center;}
.adj-label{font-size:10px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;}
.adj-cell input{width:100%;text-align:center;border:1px solid var(--border);border-radius:6px;padding:6px 4px;font-size:13px;font-weight:700;font-family:'Quattrocento Sans',serif;}
.metrics-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px;}
.metrics-tbl th{text-align:right;padding:5px 8px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.metrics-tbl th:first-child{text-align:left;}
.metrics-tbl td{padding:4px 6px;text-align:center;}
.metrics-tbl td:first-child{text-align:left;font-weight:700;color:var(--navy);font-size:11px;white-space:nowrap;}
.metrics-tbl td input{width:72px;text-align:center;border:1px solid var(--border);border-radius:5px;padding:4px;font-size:11px;font-family:'Quattrocento Sans',serif;}

/* ── CHARTS ── */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

/* ── ANNUAL CHECKBOX BOX ── */
.annual-box{margin-top:14px;padding:12px 14px;background:var(--gold-light);border-radius:8px;border:1px solid rgba(255,215,0,.4);}
.annual-box label.main-lbl{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;}

/* ── OMNIUM BUTTONS ── */
@keyframes omn-spin{to{transform:rotate(360deg);}}
.omn-ring-active{stroke-dasharray:30 70 !important;transform-origin:center;transform-box:fill-box;animation:omn-spin 1s linear infinite;}
.btn-omn-wrap{display:inline-flex;flex-direction:column;gap:5px;}
.btn-omn-wrap.right{align-items:flex-end;}
.btn-omn-status{font-size:10px;font-weight:700;letter-spacing:.06em;height:13px;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none;}
.btn-omn-body{display:flex;align-items:center;border:none;cursor:pointer;padding:0;transition:background .15s,transform .12s,opacity .15s;}
.btn-omn-body:hover:not(:disabled){transform:translateY(-1px);}
.btn-omn-body:disabled{opacity:.6;cursor:not-allowed;transform:none !important;}
.btn-navy{background:linear-gradient(160deg,#0006d8 0%,#000190 55%,#00017e 100%);border-radius:10px;border:1px solid rgba(255,255,255,.13);box-shadow:0 3px 10px rgba(0,1,144,.35),inset 0 1px 0 rgba(255,255,255,.09);}
.btn-navy:hover:not(:disabled){background:linear-gradient(160deg,#0008f0 0%,#0001b0 55%,#000190 100%);}
.btn-teal{background:#2BD8C2;border-radius:11px;}
.btn-teal:hover:not(:disabled){background:#22c9b4;}
.omn-logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.omn-ring-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.omn-vsep-white{width:1px;background:rgba(255,255,255,.18);flex-shrink:0;align-self:stretch;}
.omn-vsep-navy{width:1px;background:rgba(0,1,144,.2);flex-shrink:0;align-self:stretch;}

/* ── COLLAPSIBLE ── */
.coll-hd{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:10px;user-select:none;}
.coll-hd span{font-size:11px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.04em;}
.coll-chevron{font-size:10px;color:var(--muted);transition:transform .2s;}
.coll-hd.open .coll-chevron{transform:rotate(180deg);}

/* ── PROJ LABEL PILL ── */
.proj-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;font-family:'Poppins',sans-serif;padding:3px 10px;border-radius:10px;background:var(--gold-light);color:var(--gold-text);border:1px solid rgba(255,215,0,.4);}
.proj-pill.cagr{background:var(--teal-light);color:var(--teal-text);border-color:rgba(43,216,194,.4);}

/* ── FISCAL YEAR (exercice décalé) PILL ── */
.fy-pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;font-family:'Poppins',sans-serif;padding:4px 11px;border-radius:10px;background:var(--navy-light);color:var(--navy);border:1px solid rgba(0,1,144,.16);letter-spacing:.02em;}
.fy-pill .fy-dot{width:6px;height:6px;border-radius:50%;background:var(--navy);opacity:.55;flex-shrink:0;}
.fy-month-tag{display:block;font-size:9px;font-weight:600;color:var(--teal-text);opacity:.9;letter-spacing:.03em;margin-top:1px;}
thead th .fy-month-tag{color:#8be9dc;}

/* ── FOOTER ── */
footer{text-align:center;color:var(--muted);font-size:10px;padding:22px;border-top:1px solid var(--border);margin-top:22px;font-family:'Quattrocento Sans',serif;}

@media(max-width:700px){.kpi-grid,.chart-grid,.form-grid{grid-template-columns:1fr 1fr;}.adj-eps-grid{grid-template-columns:repeat(3,1fr);}}

/* context bullets */
.ctx-bullet{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(226,232,240,.5);font-size:13px;line-height:1.5;}
.ctx-bullet:last-child{border-bottom:none;}
.ctx-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:7px;}
.ctx-dot.pos{background:var(--ok);}
.ctx-dot.neg{background:var(--err);}
.ctx-dot.neu{background:var(--muted);}
.ctx-dot.inf{background:var(--teal);}
/* ── PRICE AUTO ── */
.price-auto{font-size:10px;color:var(--muted);font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:4px;}
.price-auto .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block;}
.price-auto .dot.fresh{background:var(--ok);}
.price-auto .dot.stale{background:var(--gold);}

/* ══════════════════════════════════════════════════════════════
   STRUCTURE — classes utilisées par renderPortfolio()/renderReturnBlock()
   pour la mise en page (les couleurs/valeurs dynamiques restent en style
   inline). Neutres en desktop, reprises et surchargées en mobile ci-dessous.
   ══════════════════════════════════════════════════════════════ */
.pf-row-top{display:flex;align-items:center;gap:22px;flex:1 1 auto;max-width:360px;min-width:0;}
.pf-metric-return{flex:0 0 72px;}
.pf-metric-pe{flex:0 0 64px;}
.pf-metric-event{flex:0 0 132px;}
.pf-ml-mobile{display:none;}
.pf-sort-mobile{display:none;}

.rb-header{padding:10px 20px 6px;display:flex;align-items:center;justify-content:space-between;}
.rb-total-row{display:flex;align-items:center;padding:0 20px 10px;gap:14px;}
.rb-bridge-wrap{padding:0 20px 12px;}
/* rb-eps-grid remplace l'ancien rb-eps-row (flex). Grille explicite a 3
   colonnes (CY / separateur / NY) x N lignes (entete, puces trimestrielles,
   legende) : chaque LIGNE de grille a sa propre hauteur, commune aux deux
   colonnes, INDEPENDAMMENT du contenu des autres lignes. C'est ce qui
   garantit que les puces T1-T4 de CY et NY demarrent TOUJOURS a la meme
   hauteur, quelle que soit l'asymetrie du contenu au-dessus (rb-eps-src
   n'existe que cote CY) ou en dessous (note de coherence presente sur un
   seul cote, legende...) - contrairement a l'ancien systeme en flex/
   margin-top:auto qui ne fonctionnait que si les DEUX blocs de puces
   avaient exactement la meme hauteur cumulee. Regle structurelle valable
   quel que soit le contenu futur, jamais a re-verifier a chaque refresh. */
.rb-eps-grid{display:grid;grid-template-columns:1fr 1px 1fr;padding:14px 20px 16px;}
.rb-eps-headCY{grid-column:1;grid-row:1;padding-right:14px;}
.rb-eps-headNY{grid-column:3;grid-row:1;padding-left:14px;}
.rb-eps-qtrCY{grid-column:1;grid-row:2;padding-right:14px;padding-top:12px;}
.rb-eps-qtrNY{grid-column:3;grid-row:2;padding-left:14px;padding-top:12px;}
.rb-eps-legend-row{grid-column:1/-1;grid-row:3;margin-top:8px;}
.rb-eps-sep{grid-column:2;background:var(--border);margin:0 4px;}
.rb-eps-val{font-family:'Poppins',sans-serif;line-height:1;font-size:13px;font-weight:700;color:inherit;}
.rb-eps-year{font-family:'Poppins',sans-serif;font-size:16px;font-weight:900;color:var(--navy);margin-bottom:5px;}
.rb-eps-line{display:flex;align-items:baseline;gap:9px;margin-bottom:5px;}
/* Omnium et Consensus sur la MEME ligne (plutot que l'un sous l'autre) :
   les deux paires libelle/valeur cohabitent dans un seul .rb-eps-line,
   separees par une barre oblique discrete. Le libelle garde une largeur
   fixe (98px) quand les deux lignes sont empilees (alignement vertical
   des valeurs entre Omnium et Consensus) mais passe en largeur auto ici,
   ce alignement n'ayant plus de sens sur une ligne unique. */
.rb-eps-line-combo{flex-wrap:wrap;color:var(--navy);}
.rb-eps-line-combo .rb-eps-lbl{width:auto;}
.rb-eps-combo-sep{color:var(--muted);font-weight:400;font-family:'Poppins',sans-serif;font-size:13px;}
.rb-eps-lbl{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;color:inherit;text-transform:uppercase;letter-spacing:.02em;width:98px;flex-shrink:0;}
.rb-eps-src{font-size:9.5px;color:var(--muted);font-family:'Poppins',sans-serif;font-style:italic;margin-top:2px;}

/* ══════════════════════════════════════════════════════════════
   DÉTAIL TRIMESTRIEL/SEMESTRIEL DE L'EPS + P/E — voir hypothese.
   quarterlyEPS dans INSTRUCTIONS.md (E5 ter). Vit dans .rb-eps-grid (voir
   plus haut) : rb-eps-headCY/headNY portent l'entete (annee/Omnium/
   Consensus/source), rb-eps-qtrCY/qtrNY portent les puces T1-T4 - deux
   LIGNES DE GRILLE distinctes, chacune de hauteur commune aux deux
   colonnes. Consequence : les puces CY et NY demarrent TOUJOURS a la
   meme hauteur, quel que soit le contenu au-dessus (source consensus,
   presente uniquement cote CY) ou en dessous (note de coherence
   .coherence, presente sur un seul cote si un seul ecart est materiel) -
   ce n'est plus un alignement negocie au pixel pres (ancien systeme flex/
   margin-top:auto) mais une garantie structurelle de la grille, valable
   pour n'importe quelle combinaison de contenu future sans jamais avoir
   besoin d'etre revalidee a chaque refresh.
   La legende Publié/Estimé (transversale : ne s'applique qu'a l'annee en
   cours, NY etant par definition toujours estime) vit dans sa propre
   ligne de grille .rb-eps-legend-row, sous les deux colonnes de puces.
   ══════════════════════════════════════════════════════════════ */
.qs-qtr-block{margin-top:auto;padding-top:12px;}
.qtr-legend-row{display:flex;justify-content:center;margin-top:6px;}
.qtr-legend{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:400;font-size:9.5px;color:var(--muted);font-family:'Poppins',sans-serif;}
.leg-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;}
.qs-chips-row{display:flex;gap:6px;}
.qs-chip{flex:1;text-align:center;border-radius:7px;padding:6px 2px;}
.qs-chip.actual{background:var(--navy-light);}
.qs-chip.estim{background:#fff;border:1.5px dashed var(--border);}
.chip-q{font-family:'Poppins',sans-serif;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
.qs-chip.actual .chip-q{color:var(--navy);opacity:.7;}
.chip-v{font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:800;}
.qs-chip.actual .chip-v{color:var(--navy);}
.qs-chip.estim .chip-v{color:var(--muted);}
/* Total trimestriel (Σ) affiche sous les puces de chaque colonne, pour
   rendre visible d'un coup d'oeil l'ecart entre la somme du detail
   trimestriel (qe.CY/qe.NY) et l'EPS Omnium affiche juste au-dessus dans
   la meme colonne - c'est ce chiffre, calcule en direct, qui decide si la
   note qe.coherenceNoteCY/NY s'affiche (voir buildQuarterlyEPS), plutot
   qu'un statut ok/ecart fourni a part et potentiellement perime. */
.qs-sum{margin-top:6px;text-align:center;font-family:'Poppins',sans-serif;font-size:9.5px;font-weight:600;color:var(--muted);}
.qs-sum.ecart{color:#c0392b;}
.coherence{margin-top:8px;display:flex;align-items:flex-start;gap:6px;font-family:'Poppins',sans-serif;font-size:10px;color:var(--muted);font-weight:600;text-align:left;line-height:1.4;}
.coherence svg{flex-shrink:0;margin-top:2px;}
/* P/E stack : une seule section compacte (pas de separateur entre les 3
   lignes) - CY, puis le forward 12 mois (a cheval sur CY/NY), puis NY,
   l'ordre reflete sa position temporelle entre les deux. Valeur rapprochee
   du libelle (gap fixe) plutot que plaquee au bord droit de la carte. Le
   sous-libelle de periode du forward (pe-fwd-sub) suit la VALEUR, jamais
   le libelle, pour ne pas faire varier la largeur fixe du libelle entre
   les 3 lignes.  */
/* P/E stack : grille a 4 colonnes (libelle / valeur / detail periode
   forward / P/E ex-cash) pour garantir un alignement pixel-parfait des
   valeurs entre les 3 lignes - un flex row par ligne ne peut pas aligner
   une colonne dont le contenu varie en largeur d'une ligne a l'autre (ex.
   detail de periode uniquement sur la ligne forward). */
.pe-stack{padding:14px 20px 16px;border-bottom:1px solid var(--border);margin-top:2px;display:grid;grid-template-columns:max-content max-content max-content;column-gap:20px;row-gap:5px;align-items:baseline;}
.pe-exhead{grid-column:3;font-family:'Poppins',sans-serif;font-size:9.5px;font-weight:700;color:var(--teal-text);text-transform:uppercase;letter-spacing:.03em;text-align:center;margin-bottom:1px;}
.pe-lbl{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;}
.pe-val{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;color:var(--navy);}
.pe-sub{font-family:'Poppins',sans-serif;font-size:9px;font-weight:600;color:var(--muted);}
.pe-exval{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;color:var(--navy);text-align:center;}


/* ══════════════════════════════════════════════════════════════
   TABLEAU — colonne "Indicateur" fixée au défilement horizontal.
   Règle universelle (desktop ET mobile) : sur desktop les colonnes
   tiennent généralement dans le conteneur donc ceci reste inactif ;
   sur mobile, ça permet de faire défiler les années tout en gardant
   le libellé de ligne visible. Le fond de chaque cellule fixe est
   explicite (aucun encadré blanc derrière depuis la suppression de
   la carte : la table vit directement sur le fond de page).
   ══════════════════════════════════════════════════════════════ */
#analyse-tbl thead th:first-child,#analyse-tbl tbody td:first-child{
  position:sticky;left:0;z-index:2;
  box-shadow:2px 0 5px rgba(0,0,0,.08);
}
#analyse-tbl tbody td:first-child{background:var(--bg);}
#analyse-tbl tbody tr.proj-row td:first-child{background:var(--proj-bg);}
#analyse-tbl tbody tr.hist-last td:first-child{background:var(--navy-light);}

/* ══════════════════════════════════════════════════════════════
   MOBILE — écran ≤ 760px : même design que le desktop (mêmes blocs,
   même structure, mêmes en-têtes), uniquement redimensionné pour
   qu'une ligne de portefeuille tienne entièrement sur une largeur de
   téléphone. Le zoom JS proportionnel desktop est désactivé sous ce
   seuil (voir script en bas de <body>) au profit de ces règles.
   ══════════════════════════════════════════════════════════════ */
@media(max-width:760px){
  html,body{overflow-x:hidden;}
  body{font-size:13px;}

  /* Le prix passe sur sa propre ligne au wrap (analyse-header en
     flex-wrap) : le champ etant text-align:right par defaut (pour aligner
     les decimales en desktop cote a cote avec la devise), il laissait un
     vide visuel a gauche sur mobile au lieu de demarrer sous le nom du
     titre. Aligne a gauche uniquement sur mobile. */
  .analyse-price input#cours{text-align:left;}

  header{padding:20px 18px 22px;}
  .h-logo{height:55px;}
  .h-tagline{gap:5px;margin-top:0;}
  .h-tagline span{font-size:18px;}

  .tab-bar{padding:8px 12px;}
  .back-btn{padding:7px 15px 7px 12px;font-size:12px;gap:6px;}

  .container{padding:10px 8px 30px;}

  .card{padding:14px 12px;border-radius:11px;margin-bottom:12px;}

  /* ── Portefeuille : logo ── */

  /* En-tête de colonnes : conservé (même design), juste réduit. */
  .pf-col-header{padding:0 8px 6px;gap:8px;}
  .pf-col-name-spacer{font-size:9px;}
  .pf-col-labels{gap:5px;}
  .pf-col-lbl{font-size:8.5px;letter-spacing:.03em;}

  /* Une seule ligne compacte par titre — structure identique au desktop. */
  .pf-list{gap:0;}
  .pf-item{gap:8px;padding:11px 8px;}
  .pf-row-top{gap:6px;}
  .pf-name{font-size:10.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .pf-metrics{gap:5px;}
  .pf-metric-return{flex:0 0 50px;}
  .pf-metric-pe{flex:0 0 38px;}
  .pf-metric-event{flex:0 0 78px;}
  .pf-mv{font-size:10.5px !important;font-weight:600 !important;color:#8896ab !important;white-space:nowrap;}
  .pf-metric-return .pf-mv,.pf-metric-pe .pf-mv{color:var(--teal-dark-text) !important;font-weight:600 !important;}
  .pf-mv-event{font-size:10px !important;font-weight:600 !important;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ── Analyse : en-tête titre + cours ── */
  /* En-tête analyse : déjà compact et identique en base CSS, rien à surcharger ici. */

  /* ── Tableau historique & projections ── */
  #analyse-tbl-card{padding-right:10px;}
  #analyse-tbl-card > div[style*="overflow-x"]{-webkit-overflow-scrolling:touch;}
  #analyse-tbl{font-size:11.5px;}
  #analyse-tbl thead th{padding:8px 10px;font-size:10.5px;}
  #analyse-tbl tbody td{padding:7px 10px;}
  #analyse-tbl tbody td:first-child{font-size:10px;padding-right:6px;}
  #analyse-tbl thead th:first-child{width:auto;min-width:98px;padding-right:6px;}

  /* ── Thèse Omnium (return-block) ── */
  .rb-header{padding:12px 14px 4px;}
  .rb-total-row{padding:2px 14px 10px;gap:12px;flex-wrap:wrap;}
  .rb-bridge-wrap{padding:0 14px 12px;}
  /* rb-eps-grid en mobile : grille -> flex column, avec un ORDRE explicite
     par classe (plutot que l'ordre naturel du DOM) pour que le groupe CY
     (entete + puces trimestrielles + legende Publié/Estimé, qui ne
     concerne QUE l'annee en cours) reste visuellement ensemble avant le
     groupe NY, meme si en desktop les puces vivent dans une ligne de
     grille separee de l'entete et la legende dans une 3e ligne
     transversale sous les deux colonnes (of. rb-eps-legend-row, ligne 3
     de la grille desktop - inchangee, alignement CY/NY toujours garanti
     par le grid-row commun). Le separateur dashed (qui marquait
     auparavant la fin de la colonne CY) se deplace donc sur le DERNIER
     element du groupe CY - rb-eps-legend-row si des puces trimestrielles
     existent (classe .has-qtr posee par JS sur rb-eps-grid, la legende
     suit alors toujours les puces CY), sinon rb-eps-headCY en repli pour
     les tickers pas encore migres vers quarterlyEPS (comportement mobile
     inchange pour ceux-la). */
  .rb-eps-grid{display:flex;flex-direction:column;padding:12px 14px 14px;}
  .rb-eps-sep{display:none;}
  .rb-eps-headCY,.rb-eps-headNY,.rb-eps-qtrCY,.rb-eps-qtrNY{padding:0 !important;}
  .rb-eps-headCY{order:1;}
  .rb-eps-qtrCY{order:2;margin-top:10px;}
  .rb-eps-legend-row{order:3;margin-top:8px;}
  .rb-eps-headNY{order:4;margin-top:4px;}
  .rb-eps-qtrNY{order:5;margin-top:10px;}
  .rb-eps-grid:not(.has-qtr) .rb-eps-headCY{padding-bottom:14px !important;margin-bottom:14px;border-bottom:1px dashed var(--border);}
  .rb-eps-grid.has-qtr .rb-eps-legend-row{padding-bottom:14px !important;margin-bottom:14px;border-bottom:1px dashed var(--border);}
  .rb-eps-val{font-size:11.5px !important;}
  .rb-eps-lbl{font-size:11.5px;width:88px;}
  .rb-eps-line-combo{gap:6px;}
  .rb-eps-line-combo .rb-eps-lbl{width:auto;}

  /* ── Détail trimestriel/semestriel + P/E, sur mobile ── */
  .qtr-legend-row{margin-top:0;}
  .qtr-legend{font-size:8.5px;gap:10px;}
  .qs-qtr-block{margin-top:0;padding-top:0;}
  .qs-chip{padding:5px 1px;}
  .chip-q{font-size:7.5px;}
  .chip-v{font-size:9.5px;}
  .qs-sum{font-size:8.5px;}
  .coherence{font-size:8.5px;margin-top:6px;}
  .pe-stack{padding:10px 14px 12px;margin-top:0;row-gap:4px;column-gap:12px;grid-template-columns:max-content max-content max-content;}
  .pe-lbl{font-size:11.5px;}
  .pe-val{font-size:11.5px;}
  .pe-sub{font-size:8px;}
  .pe-exhead{font-size:8.5px;}
  .pe-exval{font-size:11.5px;}

  /* ── Dernières hypothèses / bandeaux (dernier call, actionnariat, compliance) ── */
  #context-card{padding:14px}

  footer{padding:14px;font-size:9.5px;}
}
</style>
</head>

<script>
// Mise à l'échelle proportionnelle de l'application selon la largeur d'écran.
// L'app est conçue pour desktop uniquement : plutôt qu'un responsive qui réarrange
// les blocs, on garde EXACTEMENT la même mise en page/proportions et on l'agrandit
// ou la réduit dans son ensemble (comme un zoom navigateur piloté automatiquement),
// pour un rendu propre aussi bien sur un 15" que sur un 29".
(function(){
  var REF_WIDTH = 1440;    // largeur de référence = échelle 100% sur portable 15"
  var CAP_WIDTH = 1920;    // largeur repère d'un écran 23" : au-delà, on n'agrandit plus (marges visibles)
  var MOBILE_BREAKPOINT = 760; // doit rester synchronisé avec le @media(max-width:760px) du CSS
  var MIN_ZOOM = 0.80;
  var MAX_ZOOM = CAP_WIDTH / REF_WIDTH; // ≈ 1.33, plafond atteint dès 23"
  function applyAppZoom(){
    var w = window.innerWidth;
    // En dessous du seuil mobile, on abandonne le "zoom proportionnel"
    // (pensé pour redimensionner un même agencement desktop) : le CSS
    // responsive prend le relais avec une vraie mise en page empilée,
    // donc le zoom doit rester à 1 pour que les media queries s'appuient
    // sur la largeur réelle du viewport.
    if(w <= MOBILE_BREAKPOINT){
      document.documentElement.style.zoom = 1;
      return;
    }
    var z = w / REF_WIDTH;
    if(z < MIN_ZOOM) z = MIN_ZOOM;
    if(z > MAX_ZOOM) z = MAX_ZOOM;
    document.documentElement.style.zoom = z;
  }
  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t=setTimeout(applyAppZoom,120); });
  applyAppZoom();
  window.__applyAppZoom = applyAppZoom;
})();
</script>

// Abréviations FR des mois, utilisées uniquement pour signaler un exercice
// fiscal décalé (clôture ≠ décembre). Index 1-12, index 0 inutilisé.
const MONTH_ABBR_FR = ['','janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

// Renvoie le mois de clôture d'exercice du titre (1-12). Absent ou invalide
// => 12 (calendaire standard, comportement inchangé pour tous les titres
// existants qui n'ont pas ce champ).
function fyEndMonth(ticker){
  const d = state.tickers[ticker];
  const m = +d?.fyEndMonth;
  return (m>=1 && m<=12) ? m : 12;
}

// La première année de projection de CHAQUE titre n'est plus déduite de
// l'horloge système, mais de la dernière année réellement présente dans
// son historique "data" (+1). Tant qu'un refresh n'a pas intégré les
// résultats d'un exercice clôturé, rien ne bouge pour ce titre - peu
// importe la date du jour. Chaque titre suit ainsi son propre calendrier
// de publication réel plutôt qu'une règle de date générique.
function yearsFor(ticker){
  const d = state.tickers[ticker];
  const lastHist = (d && d.data && d.data.length) ? d.data[d.data.length-1].year : (new Date().getFullYear()-1);
  const cy = lastHist + 1;
  const py = [cy, cy+1, cy+2, cy+3, cy+4];
  return { CY: cy, PY: py, LY: py[4] };
}

function tickerCur(ticker){

     sym.endsWith('.AS')||sym.endsWith('.MC')||sym.endsWith('.BR')||
     sym.endsWith('.LS')||sym.endsWith('.HE')||sym.endsWith('.CO')||
     sym.endsWith('.ST')||sym.endsWith('.OL'))return'€';

  if(sym.endsWith('.T')||sym.endsWith('.TK'))return'¥';

}

// Libellé affiché dans la colonne "Next event" de la vue portefeuille.
// Convention COURTE et anglo-saxonne (annee sur 2 chiffres, mois abrege
// anglais) : { label: "Q3 26" | "Q3 FY 27" | "H1 26" | "CMD" | tout libelle
// court, date: "2026-10-23" | null }
// - label seul si la date n'est pas encore annoncée : ex. "Q3 26".
// - label + date des qu'elle est connue/annoncee : ex. "Q3 26 - Oct 23".
// - permet aussi un evenement alternatif important (Capital Markets Day,
//   Investor Day, etc.) via un label libre au lieu d'un trimestre.
//
// DOUBLE STOCKAGE AVEC PRIORITE (choix delibere, voir INSTRUCTIONS.md) :
// - source prioritaire : data/nextEvents.json (fichier dedie, optionnel,
//   charge dans state.nextEvents par loadState()), alimente UNIQUEMENT par
//   une mise a jour groupee (Operation C). Rafraichi en un seul fichier,
//   donc facile a relancer regulierement (ex. toutes les deux semaines).
// - fallback : le champ nextEvent du JSON du titre lui-meme, ecrit a la
//   creation/au refresh (Operations A/B). Utilise UNIQUEMENT si le ticker
//   est absent de state.nextEvents (titre pas encore couvert par un C).
// Cette priorite volontaire accepte une petite fenetre d'incoherence entre
// deux passages de l'Operation C, en echange d'une mise a jour groupee en
// un seul fichier, plutot qu'un double-fetch systematique par titre.
function nextEventLabel(ticker){
  const d=state.tickers[ticker];
  const ne=(state.nextEvents&&state.nextEvents[ticker])||d?.nextEvent;
  if(!ne || !ne.label) return '—';
  if(!ne.date) return ne.label;
  const dt=new Date(ne.date);
  if(isNaN(dt)) return ne.label;
  const formatted=dt.toLocaleDateString('en-US',{day:'numeric',month:'short'});
  return `${ne.label} - ${formatted}`;
}
// Valeur brute (timestamp) du prochain evenement, pour le tri chronologique
// de la colonne "Next event". Retourne null si aucune date confirmee n'est
// disponible (evenement absent, label sans date, ou date invalide) - ces
// titres sont alors relegues en fin de liste quel que soit le sens du tri.
function nextEventDate(ticker){
  const d=state.tickers[ticker];
  const ne=(state.nextEvents&&state.nextEvents[ticker])||d?.nextEvent;
  if(!ne || !ne.date) return null;
  const dt=new Date(ne.date);
  return isNaN(dt) ? null : dt.getTime();
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x+y,r);
    this.arcTo(x,y,x+r,y,r);this.closePath();return this;
  };
}

function normalizeTicker(key,d){
  if(!d.particularites)d.particularites=[];

function normalizeState(s){
  if(!s.tickers)s.tickers={};
  if(!s.nextEvents)s.nextEvents={};
  Object.keys(s.tickers).forEach(key=>normalizeTicker(key,s.tickers[key]));
  return s;
}

function fingerprint(str){
  let h=5381;
  for(let i=0;i<str.length;i++){h=((h*33)^str.charCodeAt(i))>>>0;}
  return h.toString(16).padStart(8,'0');
}

async function loadState() {
  try {
    // 1. Charge le manifeste : la liste des codes de titres a charger.
    const manRes = await fetch('data/manifest.json');
    if (!manRes.ok) throw new Error(`data/manifest.json introuvable: ${manRes.status}`);
    const manifest = await manRes.json();
    const codes = manifest.tickers || [];

    // 2. Charge chaque fichier de titre en parallele. Un fichier manquant ou
    //    invalide ne bloque PAS les autres : il est juste ignore avec un
    //    avertissement, pour qu'une erreur sur un seul titre n'empeche pas
    //    l'affichage de tout le portefeuille (c'est tout le sens du
    //    decoupage par fichier).
    // 2bis. En parallele, charge aussi data/nextEvents.json : fichier dedie
    //    et OPTIONNEL (source prioritaire pour la colonne "Next event",
    //    alimente uniquement par une mise a jour groupee -
    //    Operation C). Son absence ou son invalidite est silencieuse : elle
    //    ne doit jamais bloquer le chargement, chaque titre retombe alors
    //    sur son propre champ nextEvent (voir nextEventLabel()).
    const [results, nextEvents] = await Promise.all([
      Promise.all(codes.map(async code => {
        try {
          const r = await fetch(`data/${code}.json`);
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const obj = await r.json();
          return [code, obj];
        } catch (e) {
          console.error(`loadState: data/${code}.json illisible -`, e);
          showToast(`⚠ Titre ${code} illisible (data/${code}.json) - ignore.`, 6000);
          return null;
        }
      })),
      fetch('data/nextEvents.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))
    ]);

    const tickers = {};
    results.forEach(pair => { if (pair) tickers[pair[0]] = pair[1]; });
    const jsonData = { tickers, nextEvents: nextEvents || {} };

    // Empreinte calculee sur l'ensemble reconstitue, pour rester comparable
    // a l'ancien comportement (verification de coherence entre onglets).
    const fp = fingerprint(JSON.stringify(jsonData));
    const elFp = document.getElementById('data-fingerprint');
    if (elFp) elFp.textContent = fp;

    return normalizeState(jsonData);
  } catch (e) {
    console.error('loadState:', e);
    showToast('⚠ Impossible de charger data/manifest.json. Verifiez sa presence.', 8000);
    return normalizeState({tickers:{}});
  }
}

function cagr(arr){
  let i0=-1,i1=-1;
  arr.forEach((v,i)=>{if(v>0){if(i0<0)i0=i;i1=i;}});
  if(i0<0||i1<=i0)return 0;
  return Math.pow(arr[i1]/arr[i0],1/(i1-i0))-1;
}

function particulariteYieldPct(d){
  return (d.particularites||[]).filter(p=>p.valuePct!==null&&p.valuePct!==undefined&&p.valuePct!=='').reduce((s,p)=>s+(+p.valuePct||0),0);
}

function getProj(ticker){
  const d=state.tickers[ticker];
  if(!d || !d.data || d.data.length === 0) return {proj:{}, date:null, evtName:null};
  const ca=d.data.map(r=>r.ca),eb=d.data.map(r=>r.ebit),
        nt=d.data.map(r=>r.net),nd=d.data.map(r=>r.nd),sh=d.data.map(r=>r.shares);
  const ly=d.data[d.data.length-1].year;
  const PY=[ly+1,ly+2,ly+3,ly+4,ly+5]; // propre à CE titre, voir yearsFor()
  const lastCA=ca[ca.length-1],lastEB=eb[eb.length-1],
        lastNT=nt[nt.length-1],lastND=nd[nd.length-1],lastSH=sh[sh.length-1];
  const st=a=>{const s=cagr(a.slice(-3));return s||cagr(a);};
  const cCA_st=st(ca),cEB_st=st(eb),cNT_st=st(nt); 
  const cCA_lt=cagr(ca),cEB_lt=cagr(eb),cNT_lt=cagr(nt),cND_lt=cagr(nd);
  const grow=(last,h,rst,rlt)=>h<=2?last*Math.pow(1+rst,h):last*Math.pow(1+rst,2)*Math.pow(1+rlt,h-2);
  const cSH = sh.filter(v=>v>0).length>=2 ? cagr(sh) : 0;
  const base={};
  PY.forEach(y=>{
    const h=y-ly;
    const projShares=Math.max(1, lastSH*Math.pow(1+cSH,h));
    const projNet=grow(lastNT,h,cNT_st,cNT_lt);
    base[y]={
      eps:projNet/projShares,
      ca:grow(lastCA,h,cCA_st,cCA_lt),
      ebit:grow(lastEB,h,cEB_st,cEB_lt),
      net:projNet,
      nd:grow(lastND,h,cND_lt,cND_lt),
      shares:projShares
    };
  });
  const hyp=d.hypothese;
  const hasAdj=hyp&&['adjEPS','adjCA','adjEBIT','adjNet','adjND','adjShares'].some(k=>hyp[k]&&Object.values(hyp[k]).some(v=>v!=null&&v!==''));
  if(!hasAdj)return{proj:base,date:null,evtName:null};
  const out={};
  PY.forEach(y=>{ out[y]={...base[y]}; });
  const has=(o,y)=>o&&o[y]!=null&&o[y]!=='';
  PY.forEach(y=>{
    if(has(hyp.adjCA,y))     out[y].ca    =+hyp.adjCA[y];
    if(has(hyp.adjEBIT,y))   out[y].ebit  =+hyp.adjEBIT[y];
    if(has(hyp.adjNet,y))    out[y].net   =+hyp.adjNet[y];
    if(has(hyp.adjND,y))     out[y].nd    =+hyp.adjND[y];
    if(has(hyp.adjShares,y)) out[y].shares=+hyp.adjShares[y];
    if(has(hyp.adjEPS,y))    out[y].eps   =+hyp.adjEPS[y];
    else if((has(hyp.adjNet,y)||has(hyp.adjShares,y))&&out[y].shares>0)
      out[y].eps=out[y].net/out[y].shares;
  });
  return{proj:out,date:hyp.date,evtName:hyp.source||null};
}

function checkEpsCoherence(d){
  const hyp=d&&d.hypothese;
  if(!hyp)return [];
  const bad=[];
  Object.keys(hyp.adjEPS||{}).forEach(y=>{
    const eps=+hyp.adjEPS[y],net=+(hyp.adjNet?.[y]),sh=+(hyp.adjShares?.[y]);
    if(!eps||!net||!sh)return;
    const implied=net/sh;
    if(Math.abs(eps-implied)/Math.abs(implied)>0.02)
      bad.push({y,eps,implied});
  });
  return bad;
}

  // en quelques secondes au lieu de defiler titre par titre.
  // Relevé de 6 à 10 : avec price.php qui répond désormais en quelques

  // (~52 titres) - plus de parallélisme ici raccourcit d'autant le temps
  // total d'affichage des cours à l'ouverture de l'onglet Portefeuille.
  const CONCURRENCY=10;

// price.php fait desormais tout le travail cote serveur : il sert en
// priorite un prix Google Finance pousse par le trigger Apps Script en
// arriere-plan (frais, <15 min - voir refreshAllCachedPrices cote script),
// et ne retombe sur son propre fetch Yahoo que si ce cache est perime.
// L'app n'appelle donc plus JAMAIS script.google.com en direct au clic
// utilisateur : ce round-trip a un plancher de latence incompressible
// d'environ 1s cote Apps Script (verifie le 2026-07-26), non lie au code
// mais a la plateforme elle-meme - un seul appel a price.php suffit desormais,
// et repond en general en quelques dizaines/centaines de ms.
const PRICE_PROXY_URL='https://model.omnium-capital.com/price.php';
const _fetchInFlight={}; 

function _priceIsPlausible(p,ref,liveConfirmed){
  if(!Number.isFinite(p)||p<=0)return false;
  // Le "cours" venant du JSON n'est qu'une valeur de secours (jamais
  // réécrite sur GitHub après un fetch live - voir saveState()). Tant
  // qu'aucun prix live n'a été confirmé dans CETTE session, on ne doit
  // pas s'en servir comme borne : un cours de secours obsolète ou faux
  // bloquerait alors indéfiniment toute correction (le filtre se
  // compare toujours à la dernière valeur connue, qui resterait la
  // valeur fausse puisqu'elle ne serait jamais remplacée). Seul un prix
  // déjà confirmé en live sert de garde-fou contre un vrai bug d'API.
  if(liveConfirmed && ref>0 && (p>ref*4 || p<ref/4))return false;
  return true;
}

async function _fetchPrice(sym){
  // Timeout genereux (12s) : dans le pire cas (ticker jamais pousse par le
  // trigger ET cache Yahoo perime), price.php doit faire lui-meme un fetch
  // Yahoo cote serveur (jusqu'a 10s de timeout cURL interne, voir price.php)
  // avant de repondre. Ce cas reste rare - la plupart du temps price.php
  // repond en quelques dizaines/centaines de ms via son cache.
  try{
    const r=await fetch(PRICE_PROXY_URL+'?ticker='+encodeURIComponent(sym),{signal:AbortSignal.timeout(12000)});
    if(!r.ok)return null;
    const j=await r.json();
    if(!j||!j.price)return null;
    return{price:+j.price, div:(j.div!=null?+j.div:null), source:j.source||null};
  }catch(e){ return null; }
}

async function autoFetchPrice(ticker,force){
  const d=state.tickers[ticker];
  if(!d||!(d.yahooSymbol||'').trim())return;
  updatePriceDot(d._priceUpdatedAt||d._lastFetchAttemptAt||null,true);
  if(!force && d._priceCache && (Date.now()-d._priceCache.ts)<PRICE_TTL){
    updatePriceDot(d._priceUpdatedAt||d._lastFetchAttemptAt||null,false);
    return;
  }
  if(_fetchInFlight[ticker])return;
  _fetchInFlight[ticker]=true;
  const sym=(d.yahooSymbol||'').trim();
  const ref=+d.cours||0;
  const liveConfirmed=!!d._liveConfirmed;
  let finalPrice=null, finalDiv=null, source='';
  try{
    const r=await _fetchPrice(sym);
    if(r && _priceIsPlausible(r.price,ref,liveConfirmed)){
      finalPrice=r.price; finalDiv=r.div; source=r.source||'price.php';
    }
  }catch(e){}
  d._lastFetchAttemptAt=Date.now();
  if(finalPrice!==null){
    d.cours=+finalPrice.toFixed(2);
    d._liveConfirmed=true;
    d._priceCache={price:d.cours,ts:Date.now()};
    d._priceUpdatedAt=Date.now();
    d._priceSource=source;
    if(finalDiv!==null && finalDiv>=0){
      d.dividende=+(+finalDiv).toFixed(4);
    }
    updatePriceDot(d._priceUpdatedAt,false);
    // Mise a jour ciblee : pas de renderAnalyse() complet ici, pour ne pas
    // recreer le graphe EPS (effet de "saut" visuel) ni refermer le panneau
    // "Hypothese actuelle" que l'utilisateur est peut-etre en train de lire.
    refreshPriceOnly(ticker);
    renderPortfolio();
  } else {
    updatePriceDot(d._priceUpdatedAt||d._lastFetchAttemptAt,true);
  }
  _fetchInFlight[ticker]=false;
}

    tr.innerHTML=c;tbody.appendChild(tr);
  });

  scrollAnalyseTblToDefault(last5.length);

}

// Position par defaut du defilement horizontal du tableau Historique &
// Projections : centree sur "les 2 dernieres annees publiees + les 2
// premieres annees projetees", ce qui correspond a la zone la plus
// consultee (transition passe/futur). Le reste de l'historique reste
// accessible en scrollant vers la gauche, le futur plus lointain vers la
// droite. Purement cosmetique (aucun impact sur les donnees) : no-op sur
// desktop des que toutes les colonnes tiennent deja dans le conteneur.
function scrollAnalyseTblToDefault(histCount){
  const headRow=document.getElementById('analyse-head');
  const table=document.getElementById('analyse-tbl');
  if(!headRow||!table)return;
  const wrap=table.parentElement; // div avec overflow-x:auto
  if(!wrap)return;
  // Index (0-based, hors colonne "Indicateur") de la 1ere colonne a
  // garder visible a gauche : on masque tout sauf les 2 dernieres
  // annees historiques (ex. histCount=5 -> on cache les 3 premieres).
  const targetIdx=Math.max(0,histCount-2);
  const dataThs=Array.from(headRow.children).slice(1); // hors <th>Indicateur</th>
  const targetTh=dataThs[targetIdx];
  const firstTh=headRow.children[0]; // colonne "Indicateur", fixee (sticky) au defilement
  if(!targetTh||!firstTh)return;
  requestAnimationFrame(()=>{
    try{
      // offsetLeft = position de la colonne dans le flux normal du tableau
      // (inchangee par le sticky, qui ne fait que la deplacer visuellement).
      // On soustrait la largeur de la colonne fixe pour que la colonne
      // ciblee arrive juste APRES elle, et non dessous/masquee par elle.
      const stickyW=firstTh.getBoundingClientRect().width;
      wrap.scrollLeft=Math.max(0,targetTh.offsetLeft-stickyW);
    }catch(e){}
  });
}

// Detail trimestriel/semestriel de l'EPS + les 3 P/E (annee courante, annee
// suivante, 12 mois glissants forward) - voir hypothese.quarterlyEPS dans
// INSTRUCTIONS.md (E5 ter). Affiche sous le bloc EPS CY/NY existant, dans
// la meme carte "These Omnium". Absent gracieusement si le titre n'a pas
// encore ce champ (retraitement progressif au fil des refresh, pas de
// backfill retroactif force).
// Retourne les morceaux a placer par renderReturnBlock (les puces CY vont
// DANS la colonne EPS CY, les puces NY DANS la colonne EPS CY+1 - plutot
// qu'un bloc "Détail trimestriel" a part, pour que chaque trimestre
// s'affiche a cote de l'annee a laquelle il appartient) ; retourne null si
// le champ est absent (comportement gracieux inchange).
function buildQuarterlyEPS(qe, cours, epsCY, epsNY, CY, cur, ndCY, shCY, ndNY, shNY){
  if(!qe || !Array.isArray(qe.CY) || !Array.isArray(qe.NY) || !qe.CY.length || !qe.NY.length) return null;
  const esc=s=>(s||'').toString().replace(/</g,'&lt;');
  const chip=p=>`<div class="qs-chip ${p.actual?'actual':'estim'}"><div class="chip-q">${esc(p.label)}</div><div class="chip-v">${(+p.eps).toFixed(2)}</div></div>`;
  const chipsRow=arr=>`<div class="qs-chips-row">${arr.map(chip).join('')}</div>`;
  const icons={
    ok:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>`,
    ecart:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path></svg>`
  };
  // Total trimestriel (Σ) confronte a l'EPS annuel affiche juste au-dessus,
  // dans la meme colonne (epsCY/epsNY). Le statut ok/ecart n'est plus un
  // champ fourni par l'assistant (risque de flag perime face au chiffre
  // reel) : il est calcule ICI, en direct, a partir de l'ecart affiche.
  // note (coherenceNoteCY/NY) ne s'affiche QUE si l'ecart est non-nul -
  // seuil aligne sur l'arrondi affiche (0.05pt), pas la materialite E5 ter
  // (~3%) qui ne pilote plus que la couleur d'alerte. Rien a justifier
  // quand la reconciliation est exacte : le Σ a cote de l'EPS annuel suffit.
  const legend=`<span class="qtr-legend">
      <span><span class="leg-dot" style="background:var(--navy);"></span>Publié</span>
      <span><span class="leg-dot" style="background:#fff;border:1.5px dashed var(--border);"></span>Estimé</span>
    </span>`;
  // La legende Publié/Estimé ne concerne que l'annee EN COURS (NY est par
  // definition toujours estime, la distinction n'a pas de sens la-bas) :
  // elle est desormais retournee A PART (voir legendRow ci-dessous) et
  // affichee UNE SEULE FOIS, dans sa propre ligne de grille sous les deux
  // colonnes de puces - jamais nichee dans le bloc CY, precisement pour
  // ne plus faire varier la hauteur du bloc CY par rapport au bloc NY
  // (c'est cette variation qui cassait l'alignement des puces avant).
  const colBlock=(arr,annual,note)=>{
    const sum=arr.reduce((a,p)=>a+(+p.eps||0),0);
    const delta=(annual>0)?((sum-annual)/annual*100):null;
    const hasGap=delta!=null&&Math.abs(delta)>=0.05;
    const material=delta!=null&&Math.abs(delta)>=3;
    const deltaTxt=delta!=null?` (${delta>=0?'+':''}${delta.toFixed(1)}%)`:'';
    const sumHtml=`<div class="qs-sum${material?' ecart':''}">Σ ${sum.toFixed(2)}${cur||'$'}${deltaTxt}</div>`;
    const noteHtml=(hasGap&&note)?`<div class="coherence"${material?' style="color:#c0392b;"':''}>${icons[material?'ecart':'ok']} ${esc(note)}</div>`:'';
    return `<div class="qs-qtr-block">${chipsRow(arr)}${sumHtml}${noteHtml}</div>`;
  };
  const legendRow=`<div class="qtr-legend-row">${legend}</div>`;
  const peCY=(cours>0&&epsCY>0)?(cours/epsCY):null;
  const peNY=(cours>0&&epsNY>0)?(cours/epsNY):null;
  const peFwd=(cours>0&&qe.epsForward12m>0)?(cours/qe.epsForward12m):null;
  // P/E "ex-cash" : neutralise la tresorerie/dette nette du bilan de
  // l'annee concernee avant de calculer le multiple, pour ne pas
  // penaliser/avantager artificiellement des societes tres cash-riches ou
  // tres endettees dans une comparaison de P/E brut. adjND est deja negatif
  // pour du cash net (convention du JSON) -> prix_ajuste = cours +
  // adjND/adjShares ramene mecaniquement le P/E ex-cash EN DESSOUS du P/E
  // brut quand il y a du cash net, et AU-DESSUS quand il y a de la dette
  // nette. Le forward reutilise le bilan de l'annee en cours (CY), pas
  // celui de l'annee suivante, puisque les 12 prochains mois glissants
  // partent d'aujourd'hui. Absence gracieuse : si adjND/adjShares ne sont
  // pas renseignes pour l'annee concernee, ou si le prix ajuste tombe a
  // zero ou en dessous (tresorerie nette par action > cours, cas limite
  // des tres petites capitalisations tres cash-riches), pas de suffixe
  // ex-cash affiche plutot qu'un nombre trompeur.
  const exCashPrice=(nd,sh)=>{
    if(nd==null||!(sh>0))return null;
    const p=cours+(nd/sh);
    return p>0?p:null;
  };
  const priceExCY=exCashPrice(ndCY,shCY);
  const priceExNY=exCashPrice(ndNY,shNY);
  const peExCY=(priceExCY!=null&&epsCY>0)?(priceExCY/epsCY):null;
  const peExFwd=(priceExCY!=null&&qe.epsForward12m>0)?(priceExCY/qe.epsForward12m):null;
  const peExNY=(priceExNY!=null&&epsNY>0)?(priceExNY/epsNY):null;
  const hasExCash=peExCY!=null||peExFwd!=null||peExNY!=null;
  const exCell=v=>hasExCash?`<div class="pe-exval">${v!=null?v.toFixed(1)+'×':'—'}</div>`:'';
  // Ordre : P/E CY, puis le forward 12 mois (a cheval entre les deux
  // annees), puis P/E NY - reflete sa position temporelle entre les deux
  // plutot que de le releguer en dernier. Grille a 3 colonnes (libelle /
  // valeur / P/E ex-cash) : le P/E ex-cash est volontairement place juste
  // apres la valeur principale (le plus a gauche possible tout en gardant
  // le column-gap, jamais colle) puisque c'est une variante du MEME P/E,
  // plus lisible proche de sa valeur source que relegue en bord droit. Le
  // detail de periode du forward (qui n'existe que sur la ligne du milieu)
  // vit DANS la cellule du libelle, entre parentheses et en gris (.pe-sub)
  // juste apres "P/E 1Y FWD" - jamais une colonne a part, ca n'a pas
  // besoin d'un alignement propre puisque une seule ligne le porte. Chaque
  // ligne emet EXACTEMENT 3 cellules dans le meme ordre pour que le
  // placement automatique de la grille aligne les valeurs entre les 3
  // lignes, meme quand une cellule est vide (span vide plutot qu'omise).
  const peStack=`<div class="pe-stack">
      ${hasExCash?`<div></div><div></div><div class="pe-exhead">P/E ex-cash</div>`:''}
      <div class="pe-lbl">P/E ${CY}</div><div class="pe-val">${peCY?peCY.toFixed(1)+'×':'—'}</div>${exCell(peExCY)}
      <div class="pe-lbl">P/E 1Y FWD${qe.forwardPeriodLabel?` <span class="pe-sub">(${esc(qe.forwardPeriodLabel)})</span>`:''}</div><div class="pe-val">${peFwd?peFwd.toFixed(1)+'×':'—'}</div>${exCell(peExFwd)}
      <div class="pe-lbl">P/E ${CY+1}</div><div class="pe-val">${peNY?peNY.toFixed(1)+'×':'—'}</div>${exCell(peExNY)}
    </div>`;
  return {
    // chipsCY/chipsNY peuvent avoir des hauteurs differentes (note de
    // coherence presente sur un seul cote) SANS consequence sur
    // l'alignement des puces : celles-ci vivent dans leur propre ligne de
    // grille (.rb-eps-qtrCY/.rb-eps-qtrNY), la note eventuelle s'empile
    // simplement EN DESSOUS dans la meme cellule - voir .rb-eps-grid.
    chipsCY: colBlock(qe.CY,epsCY,qe.coherenceNoteCY),
    chipsNY: colBlock(qe.NY,epsNY,qe.coherenceNoteNY),
    legendRow,
    peStack
  };
}

function renderReturnBlock(ticker, proj, cours){
  const el=document.getElementById('return-block');
  if(!el)return;
  const d=state.tickers[ticker];
  const {CY,LY}=yearsFor(ticker);
  const cur=tickerCur(ticker)||'€';
  const div=d.dividende||0;
  const epsCY=proj[CY]?.eps||0;
  const epsNY=proj[CY+1]?.eps||0;
  const epsLY=proj[LY]?.eps||0;
  const cagrEps=(epsCY>0&&epsLY>0)?((Math.pow(epsLY/epsCY,0.25))-1)*100:0;
  const bonusYield=particulariteYieldPct(d);
  const yieldPct=(cours>0&&div>0?(div/cours)*100:0)+bonusYield;
  const total=cagrEps+yieldPct;
  const cons=(d.epsConsensus?.year===CY)?d.epsConsensus:null;
  const consDelta=(cons?.eps&&epsCY>0)?((epsCY-cons.eps)/cons.eps*100):null;
  const consNY=d.epsConsensus?.epsNY||0;
  const deltaConsNY=(consNY>0&&epsNY>0)?((epsNY-consNY)/consNY*100):null;
  const rawSrc=(cons?.source||'').replace(/consensus sell-side[,\s]*/i,'').trim();
  const srcLine=[rawSrc,cons?.date].filter(Boolean).join(' · ');
  // Ecart vs la projection Omnium PRECEDENTE (snapshot pris au refresh precedent,
  // voir hypothese.priorEPS = {date, eps:{annee:valeur}}). Absent tant qu'aucun
  // refresh n'a encore ecrit ce champ pour ce titre.
  const priorEPS=d.hypothese?.priorEPS||null;
  const priorCY=priorEPS?.eps?.[CY];
  const priorNY=priorEPS?.eps?.[CY+1];
  const hasPriorCY=priorCY!=null&&priorCY!==''&&+priorCY>0&&epsCY>0;
  const hasPriorNY=priorNY!=null&&priorNY!==''&&+priorNY>0&&epsNY>0;
  const deltaPriorCY=hasPriorCY?((epsCY-priorCY)/priorCY*100):null;
  const deltaPriorNY=hasPriorNY?((epsNY-priorNY)/priorNY*100):null;
  const fmtShortDate=(iso)=>{
    if(!iso)return'';
    const p=String(iso).split('-');
    return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:iso;
  };
  const priorDateFmt=fmtShortDate(priorEPS?.date);
  const ndCY=d.hypothese?.adjND?.[CY];
  const shCY=d.hypothese?.adjShares?.[CY];
  const ndNY=d.hypothese?.adjND?.[CY+1];
  const shNY=d.hypothese?.adjShares?.[CY+1];
  const qeBlock=buildQuarterlyEPS(d.hypothese?.quarterlyEPS||null, cours, epsCY, epsNY, CY, cur, ndCY, shCY, ndNY, shNY);

  el.innerHTML = `
    <div class="rb-header">
      <div class="rb-eps-year" style="margin-bottom:0;color:var(--navy);">Thèse Omnium</div>
    </div>
    <div class="rb-total-row">
      <div class="rb-eps-val" style="color:var(--navy);">Total Return ${total>=0?'+':''}${total.toFixed(1)}%</div>
      <span style="font-size:18px;color:var(--muted);flex-shrink:0;">→</span>
      <div style="font-family:'Poppins',sans-serif;flex:1;line-height:1.8;">
        <div class="rb-eps-val" style="color:var(--navy);">EPS CAGR ${cagrEps>=0?'+':''}${cagrEps.toFixed(1)}%</div>
        <div class="rb-eps-val" style="color:var(--navy);margin-top:5px;">Div. yield +${yieldPct.toFixed(1)}%</div>
      </div>
    </div>

// Formatte un montant en millions vers un affichage compact "X,XX Md" ou "X M"
// (pas de decimales inutiles en dessous de 10). Purement cosmetique.
function fmtBigNum(v){
  if(v===null||v===undefined||v==='')return null;
  const n=+v; if(!isFinite(n))return null;
  return Math.abs(n)>=1000 ? (n/1000).toFixed(2).replace(/\.00$/,'')+' Md' : n.toFixed(n<10&&n!==0?2:0)+' M';
}
function fmtPctDelta(actual,consensus){
  if(actual==null||consensus==null||consensus===0||!isFinite(+actual)||!isFinite(+consensus))return null;
  return ((+actual-+consensus)/Math.abs(+consensus))*100;
}
function pctBadge(delta){
  if(delta===null)return '';
  const col=delta>=0?'var(--teal-text)':'#e05252';
  const bg=delta>=0?'rgba(43,216,194,.14)':'rgba(224,82,82,.1)';
  return `<span style="font-size:10.5px;font-weight:800;font-family:'Poppins',sans-serif;color:${col};background:${bg};border-radius:5px;padding:1px 6px;white-space:nowrap;">${delta>=0?'+':''}${delta.toFixed(1)}%</span>`;
}

// Bloc "dernier trimestre publie" (resultats vs consensus, guidance, points cles
// du call) - voir hypothese.dernierCall dans INSTRUCTIONS.md. Affiche juste sous
// la ligne date/source, AVANT le resume/texte de la these (ne s'y substitue pas).
// Recoit `hyp` (hypothese complete, pas seulement dernierCall) pour pouvoir
// aussi afficher l'EVOLUTION de la guidance annuelle (hyp.guidanceHistory,
// propre a l'exercice fiscal en cours, pas de suivi necessaire pour la
// guidance trimestrielle qui est un one-off par nature) et de la guidance
// long terme (hyp.guidanceLongTerme + son historique hyp.
// guidanceLongTermeHistory, qui ne change que rarement). Rien de tout ca ne
// s'affiche si `dernierCall` est absent (refresh non lie a un resultat).
function renderDernierCall(hyp, ticker, opts={}){
  const dc=hyp?.dernierCall||null;
  if(!dc)return '';
  const cur=tickerCur(ticker)||'€';
  const q=(dc.quarter||'').trim();
  const esc=s=>(s||'').toString().replace(/</g,'&lt;');
  const fmtShortDate=(iso)=>{
    if(!iso)return'';
    const p=String(iso).split('-');
    return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:iso;
  };
  const ca=dc.resultatsVsConsensus?.ca||null;
  const eps=dc.resultatsVsConsensus?.epsAdj||null;
  const caActual=ca&&ca.actual!=null?fmtBigNum(ca.actual):null;
  const caCons=ca&&ca.consensus!=null?fmtBigNum(ca.consensus):null;
  const caDelta=ca?fmtPctDelta(ca.actual,ca.consensus):null;
  const epsDelta=eps?fmtPctDelta(eps.actual,eps.consensus):null;

  const caLine=caActual?`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;">
      <span style="font-size:13px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;">CA</span>
      <span style="font-size:13px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;">${caActual}${cur}</span>
      ${caCons?`<span style="font-size:10.5px;color:var(--muted);font-family:'Poppins',sans-serif;">cons. ${caCons}${cur}</span>`:''}
      ${pctBadge(caDelta)}
    </div>`:'';
  const epsLine=(eps&&eps.actual!=null)?`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;">
      <span style="font-size:13px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;">EPS${eps.basis?' ('+eps.basis+')':''}</span>
      <span style="font-size:13px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;">${(+eps.actual).toFixed(2)}${cur}</span>
      ${eps.consensus!=null?`<span style="font-size:10.5px;color:var(--muted);font-family:'Poppins',sans-serif;">cons. ${(+eps.consensus).toFixed(2)}${cur}</span>`:''}
      ${pctBadge(epsDelta)}
    </div>`:'';
  // Badge "Communique"/"Transcript" : tick turquoise si le document a ete
  // analyse pour ce refresh (dc.communiqueAnalyse/dc.transcriptAnalyse),
  // croix grise sinon - remplace l'ancienne ligne date/source (trop
  // longue, peu lisible pour l'utilisateur final) quand le dernier refresh
  // est bien un resultat trimestriel (dc present). Voir INSTRUCTIONS.md
  // pour la description complete de ces deux champs.
  const checkIcon=`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>`;
  const crossIcon=`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>`;
  const srcBadge=(label,analyzed)=>`<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;font-family:'Poppins',sans-serif;color:${analyzed?'var(--teal-text)':'var(--muted)'};">${analyzed?checkIcon:crossIcon}${label}</span>`;
  const sourcesHeading=q?`<div style="display:flex;align-items:center;justify-content:flex-start;gap:14px;flex-wrap:wrap;">
      <div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;">Résultats ${esc(q)}</div>
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
        ${srcBadge('Communiqué',!!dc.communiqueAnalyse)}
        ${srcBadge('Transcript',!!dc.transcriptAnalyse)}
      </div>
    </div>`:'';
  const resultsBlock=(caLine||epsLine)?`<div>${caLine}${epsLine}</div>`:'';
  const guidQ=dc.guidanceProchainTrimestre?`<div style="margin-top:8px;">
      <div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;">Guidance prochain trimestre</div>
      <div style="font-size:12px;color:var(--text);line-height:1.5;margin-top:1px;">${esc(dc.guidanceProchainTrimestre)}</div>
    </div>`:'';
  // Evolution de la guidance ANNUELLE au fil de l'exercice fiscal en cours
  // (hyp.guidanceHistory, deja borne a l'exercice courant par sa propre
  // mecanique de reset - voir SCHEMA). Le DERNIER point de guidanceHistory
  // correspond toujours au call en cours (meme texte que dc.guidanceAnnuelle,
  // affiche juste au-dessus) : on l'exclut donc de la liste pour ne jamais
  // repeter deux fois la meme information. Les points PRECEDENTS sont
  // affiches en dessous, du plus recent au plus ancien (ordre inverse de la
  // mecanique d'accumulation qui est chronologique croissante), en simple
  // ligne muette - meme gabarit que le "Precedemment" de la guidance long
  // terme juste plus bas (harmonisation des polices/styles entre les deux
  // mecaniques de suivi, plutot que des chips encadrees en navy).
  const gHist=(hyp?.guidanceHistory||[]).filter(h=>h&&h.guidanceAnnuelle);
  const gHistPrev=gHist.slice(0,-1).reverse();
  const guidTrend=gHistPrev.length?`<div style="font-size:9.5px;color:var(--muted);font-family:'Poppins',sans-serif;margin-top:4px;line-height:1.5;">Précédemment : ${gHistPrev.map(h=>`${esc(h.quarter||'')} : ${esc(h.guidanceAnnuelle)}`).join(' → ')}</div>`:'';
  const guidFY=dc.guidanceAnnuelle?`<div style="margin-top:8px;">
      <div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;">Guidance annuelle</div>
      <div style="font-size:12px;color:var(--text);line-height:1.5;margin-top:1px;">${esc(dc.guidanceAnnuelle)}</div>
      ${guidTrend}
    </div>`:'';
  // Guidance LONG TERME : vit au niveau de `hypothese` (pas de
  // `dernierCall`, un objectif pluriannuel n'est pas propre a un
  // trimestre), avec son propre historique cumulatif (guidanceLongTerme
  // History, snapshot uniquement quand le texte change reellement - voir
  // SCHEMA), affiche en simple ligne "Precedemment" (evolution rare,
  // contrairement a la guidance annuelle qui justifie des chips).
  const ltHist=(hyp?.guidanceLongTermeHistory||[]).filter(h=>h&&h.text);
  const ltTrail=ltHist.length?`<div style="font-size:9.5px;color:var(--muted);font-family:'Poppins',sans-serif;margin-top:3px;">Précédemment : ${ltHist.map(h=>`${esc(h.text)}${h.asOf?` (${fmtShortDate(h.asOf)})`:''}`).join(' → ')}</div>`:'';
  const guidLT=hyp?.guidanceLongTerme?`<div style="margin-top:8px;">
      <div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;">Guidance long terme</div>
      <div style="font-size:12px;color:var(--text);line-height:1.5;margin-top:1px;">${esc(hyp.guidanceLongTerme)}</div>
      ${ltTrail}
    </div>`:'';
  const points=(dc.pointsCles||[]).filter(Boolean);
  const pointsBlock=points.length?`<div style="margin-top:8px;">
      <div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;">Points clés du call</div>
      ${points.map(p=>`<div style="font-size:12px;color:var(--text);line-height:1.5;margin-top:1px;">• ${esc(p)}</div>`).join('')}
    </div>`:'';

  if(!sourcesHeading&&!resultsBlock&&!guidQ&&!guidFY&&!guidLT&&!pointsBlock)return '';
  return `<div style="${opts.first?'':'border-top:1px solid var(--border);margin-top:10px;'}padding-top:${opts.first?'0':'10px'};">
    ${sourcesHeading}${resultsBlock?`<div style="margin-top:${sourcesHeading?'8px':'0'};">${resultsBlock}</div>`:''}${guidQ}${guidFY}${guidLT}${pointsBlock}
  </div>`;
}

// Bloc "Actionnariat" (insiders + fonds notables au dernier 13F) - voir le
// champ `ownership` (racine du JSON, hors `hypothese`) dans INSTRUCTIONS.md.
// Champ FACTUEL et APPROXIMATIF par nature (sources d'actionnariat souvent
// contradictoires entre elles, delai structurel des 13F ~45j) : jamais
// utilise pour un calcul, purement informatif pour l'utilisateur. Affiche
// juste sous le bloc "dernier trimestre publie", avant le texte de these.
// L'evolution du % insiders au fil des refresh (voir ownership.history,
// mecanique de snapshot cumulatif plafonnee a 8 points - voir
// INSTRUCTIONS.md) est visualisee via un badge de delta vs le point
// precedent, plus une ligne "Historique" compacte reprenant toute la serie.
function renderOwnership(own, ticker){
  if(!own)return '';
  const esc=s=>(s||'').toString().replace(/</g,'&lt;');
  const fmtShortDate=(iso)=>{
    if(!iso)return'';
    const p=String(iso).split('-');
    return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:iso;
  };
  const hasInsider=own.insiderPct!=null&&own.insiderPct!=='';
  const hist=(own.history||[]).filter(h=>h&&h.insiderPct!=null&&h.insiderPct!=='');
  const lastHist=hist.length?hist[hist.length-1]:null;
  const deltaPt=(hasInsider&&lastHist)?(+own.insiderPct-+lastHist.insiderPct):null;
  const deltaBadge=deltaPt!=null?`<span title="vs ${(+lastHist.insiderPct).toFixed(1)}% au ${fmtShortDate(lastHist.asOf)}" style="font-size:10.5px;font-weight:700;font-family:'Poppins',sans-serif;color:var(--muted);white-space:nowrap;">(${deltaPt>=0?'+':''}${deltaPt.toFixed(1)}pt)</span>`:'';

  const insiderLine=hasInsider?`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;">
      <span style="font-size:10.5px;color:var(--muted);font-family:'Poppins',sans-serif;font-weight:700;">Insiders</span>
      <span style="font-size:13px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;">${(+own.insiderPct).toFixed(1)}%</span>
      ${deltaBadge}
      ${own.insiderDesc?`<span style="font-size:10.5px;color:var(--muted);font-family:'Poppins',sans-serif;">${esc(own.insiderDesc)}</span>`:''}
    </div>`:'';
  const insiderSrc=own.insiderSource?`<div style="font-size:9.5px;color:var(--muted);font-family:'Poppins',sans-serif;font-style:italic;margin-top:1px;">${esc(own.insiderSource)}</div>`:'';

  const trail=hist.concat(hasInsider?[{asOf:own.asOf,insiderPct:own.insiderPct}]:[]);
  const trailLine=trail.length>1?`<div style="font-size:9.5px;color:var(--muted);font-family:'Poppins',sans-serif;margin-top:4px;">Historique : ${trail.map(h=>`${(+h.insiderPct).toFixed(1)}% (${fmtShortDate(h.asOf)})`).join(' → ')}</div>`:'';

  const holders=(own.notableHolders||[]).filter(h=>h&&h.investor);
  const holdersBlock=holders.length?`<div style="margin-top:8px;">
      <div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;">Fonds notables (13F)</div>
      ${holders.map(h=>`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;">
        <span style="font-size:12px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;">${esc(h.investor)}</span>
        ${h.pct!=null?`<span style="font-size:11.5px;color:var(--text);">${(+h.pct).toFixed(1)}%</span>`:''}
        ${h.asOf?`<span style="font-size:9.5px;color:var(--muted);font-family:'Poppins',sans-serif;">${esc(h.asOf)}</span>`:''}
      </div>`).join('')}
    </div>`:'';

  const coverageNote=own.coverageNote?`<div style="font-size:10.5px;color:var(--muted);font-family:'Quattrocento Sans',serif;font-style:italic;line-height:1.4;margin-top:${holders.length||hasInsider?8:0}px;">⚠ ${esc(own.coverageNote)}</div>`:'';

  if(!insiderLine&&!holdersBlock&&!coverageNote)return '';
  return `<div style="border-top:1px solid var(--border);padding-top:10px;margin-top:10px;">
    <div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;">Actionnariat${own.asOf?` <span style="font-weight:400;opacity:.75;text-transform:none;letter-spacing:0;">· recherche du ${esc(own.asOf)}</span>`:''}</div>
    ${insiderLine}${insiderSrc}${trailLine}${holdersBlock}${coverageNote}
  </div>`;
}

function formatThesisText(txt, insertAfterFirst){
  const esc=s=>(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines=(txt||'').split(/\n/);
  let html='', buf=[], first=true, sectionCount=0, injected=false;
  const flush=()=>{
    const t=buf.join('\n');
    if(t.trim()){
      html+=`<div style="font-size:12px;color:var(--text);line-height:1.6;white-space:pre-wrap;margin-bottom:10px;">${esc(t)}</div>`;
    }
    buf=[];
  };
  lines.forEach(line=>{
    const m=line.trim().match(/^==\s*(.+?)\s*==$/);
    if(m){
      flush();
      sectionCount++;
      if(sectionCount===2 && insertAfterFirst && !injected){
        html+=insertAfterFirst;
        injected=true;
      }
      html+=`<div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:${first?'0':'14px'} 0 6px;">${esc(m[1])}</div>`;
      first=false;
    }else{
      buf.push(line);
      first=false;
    }
  });
  flush();
  if(insertAfterFirst && !injected){ html+=insertAfterFirst; }
  return html;
}

function renderContextBullets(ticker, proj, cours){

  const fullSumm=(lastEvt.summary||'').trim();
