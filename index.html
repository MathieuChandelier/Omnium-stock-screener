      </div>
      <div class="news-card">
        ${sec.companies.map(c=>`
          <div class="news-company-block">
            <div class="news-company-name">${esc(c.name)}</div>
            ${c.items.map(it=>`
              <div class="news-item-row">
                <a href="${esc(it.url||'#')}" target="_blank" rel="noopener noreferrer">${esc(it.title||'')}</a>
                <span class="news-item-date">${formatNewsDayMonth(it.dateEvenement)}</span>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

let pfNameFilter='';
function pfNormalize(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function pfFilterByName(v){
  pfNameFilter=v;
  renderPortfolio();
}
function pfOpenTicker(tk,cours){
  CT=tk;refreshSelects();
  const coursEl=document.getElementById('cours');
  if(coursEl){ coursEl.value=cours; sizeCoursInput(); }
  syncAnalyseHeader(tk);showTab('analyse',null);autoFetchPrice(tk,true);
}
function pfNameFilterKeydown(e){
  if(e.key==='Escape'){
    e.target.value='';pfFilterByName('');e.target.blur();
    return;
  }
  if(e.key!=='Enter')return;
  const q=pfNormalize(pfNameFilter);
  if(!q)return;
  const match=pfLastFilteredItems.find(({d,tk})=>pfNormalize(d.name||tk).startsWith(q));
  if(match) pfOpenTicker(match.tk,match.cours);
}
let pfLastFilteredItems=[];

let pfSort={key:'name',dir:'asc'};
function pfSortBy(key){
  if(pfSort.key===key){ pfSort.dir = pfSort.dir==='asc'?'desc':'asc'; }
  else{ pfSort.key=key; pfSort.dir = (key==='name'||key==='nextEvent'||key==='peN'||key==='peN1')?'asc':'desc'; }
  renderPortfolio();
}
function pfSortItems(items){
  const{key,dir}=pfSort;
  const mul=dir==='asc'?1:-1;
  return items.slice().sort((a,b)=>{
    if(key==='name'){
      return mul*(a.d.name||a.tk).localeCompare(b.d.name||b.tk,'fr',{sensitivity:'base'});
    }
    if(key==='nextEvent'){
      const av=a.nextEvtDate, bv=b.nextEvtDate;
      if(av==null&&bv==null)return 0;
      if(av==null)return 1;
      if(bv==null)return -1;
      return mul*(av-bv);
    }
    let av,bv;
    switch(key){
      case 'return': av=a.totalReturn; bv=b.totalReturn; break;
      case 'peN': av=a.peFwd??Infinity; bv=b.peFwd??Infinity; break;
      case 'peN1': av=a.pe27??Infinity; bv=b.pe27??Infinity; break;
      default: av=a.score; bv=b.score;
    }
    return mul*(av-bv);
  });
}
function pfUpdateSortHeaderUI(){
  document.querySelectorAll('.pf-sort-arrow').forEach(el=>{
    const k=el.getAttribute('data-key');
    el.textContent=(pfSort.key===k)?(pfSort.dir==='asc'?'▲':'▼'):'';
  });
  const sel=document.getElementById('pf-sort-select');
  if(sel && sel.value!==pfSort.key) sel.value=pfSort.key;
}

function renderPortfolio(){
  renderNewsBar();
  renderMarketActionBar();
  const list=document.getElementById('pf-list');
  const countEl=document.getElementById('pf-count');
  const esc=s=>(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(!list)return;list.innerHTML='';
  
  const items=Object.entries(state.tickers)
    .filter(([,d])=>d.data&&d.data.length>=2)
    .map(([tk,d])=>{
      try{
        const cours=d.cours||100;
        const{proj}=getProj(tk);
        const {CY,LY}=yearsFor(tk);
        const div=d.dividende||0;
        const epsCY=proj[CY]?.eps||0,eps27=proj[CY+1]?.eps||0,eps30=proj[LY]?.eps||0;
        const cagrEps=(epsCY>0&&eps30>0)?((Math.pow(eps30/epsCY,0.25))-1)*100:0;
        const yieldPct=((cours>0&&div>0)?(div/cours)*100:0)+particulariteYieldPct(d);
        const totalReturn=cagrEps+yieldPct;
        const peFwd=(cours>0&&epsCY>0)?cours/epsCY:null;
        const pe27=(cours>0&&eps27>0)?cours/eps27:null;
        const score=calcScore(tk);
        const nextEvt=nextEventLabel(tk);
        const nextEvtDate=nextEventDate(tk);
        return{tk,d,cours,totalReturn,peFwd,pe27,score,nextEvt,nextEvtDate};
      }catch(e){return null;}
    }).filter(Boolean);

  const hdr=document.getElementById('pf-col-header');
  if(hdr) hdr.style.display = items.length ? 'flex' : 'none';

  if(!items.length){
    if(countEl)countEl.textContent='0 titre';
    list.innerHTML='<div class="pf-empty">Aucun titre. database.json est peut-être vide ou non configuré.</div>';
    pfLastFilteredItems=[];
    return;
  }

  const q=pfNormalize(pfNameFilter);
  const filtered=q?items.filter(({tk,d})=>pfNormalize(d.name||tk).startsWith(q)||pfNormalize(tk).startsWith(q)):items;

  if(countEl)countEl.textContent=q
    ? filtered.length+' titre'+(filtered.length!==1?'s':'')+' (sur '+items.length+')'
    : items.length+' titre'+(items.length!==1?'s':'');

  const sorted=q
    ? filtered.slice().sort((a,b)=>(a.d.name||a.tk).localeCompare(b.d.name||b.tk,'fr',{sensitivity:'base'}))
    : pfSortItems(filtered);
  pfLastFilteredItems=sorted;

  if(!sorted.length){
    list.innerHTML='<div class="pf-empty">Aucun titre ne correspond à « '+esc(pfNameFilter)+' ».</div>';
    return;
  }

  const maxScore=Math.max(...items.map(x=>x.score),0.1);
  sorted.forEach(({tk,d,cours,totalReturn,peFwd,pe27,score,nextEvt},idx)=>{
    const el=document.createElement('div');
    el.className='pf-item'+(tk===CT?' pf-active':'');
    el.onclick=()=>pfOpenTicker(tk,cours);
    el.innerHTML=`
      <div class="pf-row-top">
        <div class="pf-main">
         <div class="pf-name">${d.name||tk}</div>
        </div>
      </div>
      <div class="pf-metrics">
        <div class="pf-metric pf-metric-return"><div class="pf-mv">${totalReturn>=0?'+':''}${totalReturn.toFixed(1)}%</div></div>
        <div class="pf-metric pf-metric-pe"><div class="pf-mv">${peFwd?peFwd.toFixed(1)+'×':'—'}</div></div>
        <div class="pf-metric pf-metric-pe"><div class="pf-mv">${pe27?pe27.toFixed(1)+'×':'—'}</div></div>
        <div class="pf-metric pf-metric-event"><div class="pf-mv pf-mv-event">${nextEvt}</div></div>
      </div>
    `;
    list.appendChild(el);
  });
  pfUpdateSortHeaderUI();
}

const PRICE_TTL=60*60*1000;
function startPricePoll(){
  if(CT) fetchLivePrice(CT);
  setInterval(()=>{ if(CT) fetchLivePrice(CT); },PRICE_TTL);
}

document.addEventListener('DOMContentLoaded', async function(){
  const accessGranted=await ensureAccessGranted();
  if(!accessGranted)return;
  await ensureUserIdentity();
  state = await loadState();
  const keys = Object.keys(state.tickers);
  let lastView=null;
  try{ lastView=JSON.parse(localStorage.getItem(LAST_VIEW_KEY)||'null'); }catch(e){}
  if(keys.length > 0){
    CT = (lastView && lastView.ticker && state.tickers[lastView.ticker]) ? lastView.ticker : keys[0];
    try{loadTicker();}catch(e){}
  }
  refreshSelects();
  const wantAnalyse = lastView && lastView.tab==='analyse' && CT && state.tickers[CT];
  const wantOtherTab = lastView && ['valuerankings','news'].includes(lastView.tab) ? lastView.tab : null;
  const restoredTab = wantAnalyse ? 'analyse' : (wantOtherTab || 'portefeuille');
  try{ history.replaceState({omniumTab: restoredTab, omniumTicker: CT}, '', location.pathname+location.search); }catch(e){}
  if(wantAnalyse){
    showTab('analyse', null, true);
  } else if(wantOtherTab){
    showTab(wantOtherTab, null, true);
  } else {
    showTab('portefeuille', document.getElementById('tab-btn-pf'), true);
  }
  const gd=document.getElementById('gen-date');
  if(gd)gd.textContent=new Date().toLocaleDateString('fr-FR');
  setTimeout(startPricePoll,1500);
});
