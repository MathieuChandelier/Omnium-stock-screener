// ── Courbe de projection (translation de la courbe EPS dans le temps) ──
// A la difference de buildValoChartSVG (une metrique dans le temps, axe X
// = dates), cette vue prend la courbe de projection ENTIERE (EPS par
// annee fiscale, axe X = annee) telle qu'elle existait a differents
// instants passes, et superpose plusieurs de ces courbes pour montrer
// comment la projection elle-meme a bouge - translation vers le haut/bas,
// changement de pente, revision concentree sur une annee precise.
// Carte des EVENEMENTS SOCIETE d'un titre : dates declarees par la fiche
// (guidanceHistory, coherenceQualitative.historique, revisionEvent). C'est
// la seule source des marqueurs de graphique - jamais une date de refresh
// interne Omnium (principe E7 quinquies).
function companyEventsMap(ticker){
  const t=state.tickers && state.tickers[ticker];
  const map={};
  if(!t) return map;
  ((t.coherenceQualitative||{}).historique||[]).forEach(e=>{
    if(e && e.date && e.quarter) map[e.date]={label:e.quarter,type:'earnings'};
  });
  ((t.hypothese||{}).guidanceHistory||[]).forEach(g=>{
    if(g && g.date && !map[g.date]) map[g.date]={label:g.quarter||'Earnings',type:'earnings'};
  });
  const rev=(t.hypothese||{}).revisionEvent;
  if(rev && rev.date && !map[rev.date]) map[rev.date]={label:rev.label||'Event',type:rev.type||'event'};
  return map;
}

function distinctEpsByYearStates(snapshots){
  // Un point par REVISION reelle, jamais un point par snapshot - la
  // courbe est identique entre deux refresh, la dupliquer n'apporterait
  // rien et surchargerait le graphique.
  const out=[];
  let lastKey=null;
  snapshots.forEach(s=>{
    if(!s.epsByYear) return;
    const key=JSON.stringify(Object.keys(s.epsByYear).sort().map(y=>[y,s.epsByYear[y]]));
    if(key!==lastKey){
      out.push({date:s.date, epsByYear:s.epsByYear, revisionEvent:s.revisionEvent||null});
      lastKey=key;
    }
  });
  return out;
}

function buildValoProjectionCurvesSVG(ticker, maxCurves, chartW){
  if(typeof _epsRevTicker!=='undefined'&&_epsRevTicker!==ticker){ _epsRevTicker=ticker; _epsRevVintage={}; }
  const ph=state.priceHistory;
  const entry=ph && ph.tickers ? ph.tickers[ticker] : null;
  const snaps=entry ? (entry.snapshots||[]) : [];
  const rawStates=distinctEpsByYearStates(snaps);
  if(!rawStates.length) return null;
  // Chaque frontiere entre deux etats est rattachee a son EVENEMENT SOCIETE :
  // revisionEvent du snapshot porteur, sinon un evenement declare dans
  // l'intervalle. Sans evenement, ou si l'evenement est le meme que celui de
  // la courbe precedente (revision interne affinant la meme publication),
  // le nouvel etat ABSORBE le precedent : l'archive garde tout, l'affichage
  // ne montre que les etats correspondant a la vie de la societe.
  const evMap=companyEventsMap(ticker);
  const evDates=Object.keys(evMap).sort();
  const states=[];
  rawStates.forEach((st,i)=>{
    if(i===0){ states.push({...st, event:null}); return; }
    let ev=null;
    if(st.revisionEvent && st.revisionEvent.date)
      ev={date:st.revisionEvent.date, label:st.revisionEvent.label, type:st.revisionEvent.type||'earnings'};
    else{
      const prev=rawStates[i-1].date;
      const d=evDates.filter(x=>x>prev && x<=st.date).pop();
      if(d) ev={date:d, label:evMap[d].label, type:evMap[d].type};
    }
    const last=states[states.length-1];
    if(!ev || (last.event && last.event.date===ev.date)){
      last.epsByYear=st.epsByYear; last.date=st.date;   // absorption
    }else{
      states.push({...st, event:ev});
    }
  });
  const shown=states.slice(-(maxCurves||6));

  // COURBE CONSENSUS (20/08/2026) : les valeurs sell-side quittent les
  // blocs EPS pour vivre ICI, face a la projection Omnium - une seule
  // comparaison, au meme endroit. Points CY/CY+1 depuis epsConsensus
  // (+CY+2 quand epsY2 est renseigne - retrieve consensus 3 ans, voir
  // doctrine). Bornee aux annees deja tracees : elle ne peut pas etendre
  // l'axe des millesimes.
  const dCons=(state.tickers[ticker]||{}).epsConsensus||null;
  const consMapAll={};
  if(dCons&&dCons.year){
    if(+dCons.eps>0) consMapAll[+dCons.year]=+dCons.eps;
    if(+dCons.epsNY>0) consMapAll[+dCons.year+1]=+dCons.epsNY;
    if(+dCons.epsY2>0) consMapAll[+dCons.year+2]=+dCons.epsY2;
  }
  // Instantanes consensus ARCHIVES (epsConsensusHistory) : pointilles
  // attenues sans etiquette - la date reste en donnee, pas a l'ecran.
  const consHistList=(Array.isArray((state.tickers[ticker]||{}).epsConsensusHistory)?(state.tickers[ticker]||{}).epsConsensusHistory:[])
    .filter(h=>h&&h.year&&!h.excluded).map(h=>{
      const m={};
      if(+h.eps>0) m[+h.year]=+h.eps;
      if(+h.epsNY>0) m[+h.year+1]=+h.epsNY;
      if(+h.epsY2>0) m[+h.year+2]=+h.epsY2;
      return {date:h.date||null, m};
    });
  const consHistMaps=consHistList.map(x=>x.m);

  const allYears=new Set();
  shown.forEach(s=>Object.keys(s.epsByYear).forEach(y=>allYears.add(+y)));
  const years=Array.from(allYears).sort((a,b)=>a-b);
  if(years.length<2) return null;
  const consYears=years.filter(y=>typeof consMapAll[y]==='number');
  // EXTRAPOLATION LINEAIRE (decision 20/08/2026) : au-dela du dernier
  // point REEL (CY+2), la courbe consensus se prolonge en droite jusqu'a
  // l'horizon du plan - les consensus long terme etant eux-memes des
  // extrapolations, la droite est l'approximation honnete. Segment
  // ATTENUE et etiquete, jamais stocke : seuls les points reels vivent
  // dans epsConsensus.
  const consExtra={};
  if(consYears.length>=2){
    const l=consYears[consYears.length-1], p=consYears[consYears.length-2];
    const slope=(consMapAll[l]-consMapAll[p])/(l-p);
    years.filter(y=>y>l).forEach(y=>{ consExtra[y]=consMapAll[l]+slope*(y-l); });
  }
  const consExtraYears=Object.keys(consExtra).map(Number).sort((a,b)=>a-b);
  // Les instantanes consensus ARCHIVES s'etendent eux aussi a l'horizon
  // du plan par la MEME regle (droite depuis leurs deux derniers points
  // reels) : les trainees et le registre des deltas portent ainsi sur
  // TOUS les millesimes de la courbe, pas seulement sur les annees que
  // l'ancien snapshot stockait (retour 20/08 : un historique 2 ans
  // tronquait la comparaison a 2026-2027).
  consHistMaps.forEach(m=>{
    const ys=Object.keys(m).map(Number).sort((a,b)=>a-b);
    if(ys.length<2) return;
    const l=ys[ys.length-1], p2=ys[ys.length-2];
    const slope=(m[l]-m[p2])/(l-p2);
    years.filter(y=>y>l).forEach(y=>{ m[y]=m[l]+slope*(y-l); });
  });

  // Logique d'affichage (20/08 v5) : par defaut, SEULES les deux courbes
  // courantes (Omnium + consensus) s'affichent, chacune datee au bout
  // droit. Les revisions passees se revelent a la demande (bouton
  // "Revisions") sous forme de TRAINEES par millesime - pas de courbes
  // empilees : representation scalable a toute profondeur d'archive.
  const REV=(typeof _epsRevShow!=='undefined')&&_epsRevShow;
  // Echelle STABLE : seules les deux courbes COURANTES la fixent, dans
  // tous les modes - basculer les revisions ne redimensionne jamais le
  // trace (les puces R1 vivent SOUS l axe, pas dessus).
  let yMin=Infinity, yMax=-Infinity;
  years.forEach(y=>{
    const v=shown[shown.length-1].epsByYear[String(y)];
    if(typeof v==='number'){ if(v<yMin)yMin=v; if(v>yMax)yMax=v; }
  });
  consYears.forEach(y=>{ const v=consMapAll[y]; if(v<yMin)yMin=v; if(v>yMax)yMax=v; });
  consExtraYears.forEach(y=>{ const v=consExtra[y]; if(v<yMin)yMin=v; if(v>yMax)yMax=v; });
  if(!isFinite(yMin)||!isFinite(yMax)) return null;
  if(yMin===yMax){ yMin-=Math.abs(yMin*0.1)||1; yMax+=Math.abs(yMax*0.1)||1; }
  const margin=(yMax-yMin)*0.12;
  yMin-=margin; yMax+=margin;

  // Meme geometrie que le graphique P/E : viewBox a la largeur reelle du
  // conteneur (sinon preserveAspectRatio centre le trace), depart a x=0,
  // unite portee par une etiquette en tete d'axe.
  // padR loge les etiquettes de millesime posees au bout de chaque courbe.
  // Il doit tenir la plus longue ("30 Oct '26"), sinon le libelle est rogne
  // par le viewBox - defaut constate en sandbox a 375px.
  const narrow=(chartW||640)<430;
  const W=chartW||640, H=260, padL=0, padR=narrow?24:28, padT=40, padB=32;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const yFirst=years[0], yLast=years[years.length-1];
  const xOf=(year)=> yLast>yFirst ? padL + ((year-yFirst)/(yLast-yFirst))*plotW : padL+plotW/2;
  const yOf=(v)=> padT + (1-(v-yMin)/(yMax-yMin))*plotH;

  const ticks=4;
  const gridlines=Array.from({length:ticks+1},(_, i)=>{
    const v=yMin+(yMax-yMin)*(i/ticks);
    const y=yOf(v).toFixed(1);
    return `<line x1="${padL}" x2="${(padL+plotW).toFixed(1)}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
  }).join('');
  // Seuls le haut et le bas sont chiffres, dans les bandes de marge que
  // le trace n'atteint jamais - donc sans aplat de fond.
  // Pas de bornes d'echelle (retour 20/08 v7, "le 3.6 doit
  // disparaitre") : chaque point Omnium porte deja sa valeur, les
  // bornes hautes/basses n'apprenaient rien et flottaient seules.
  const yLabels='';
  const unitTxt=`EPS, in ${tickerCur(ticker)||'$'}`;
  const unitLabel=`<text x="${padL}" y="15" font-size="13" font-weight="700" font-family="Poppins,sans-serif" fill="var(--navy)">${unitTxt}</text>`;
  // Le trace demarrant a x=0, une etiquette centree sur le premier (ou le
  // dernier) point deborderait du viewBox et serait rognee : on ancre ces
  // deux-la sur leur bord.
  const xLabels=years.map((y,i)=>{
    const anchor=i===0?'start':(i===years.length-1?'end':'middle');
    return `<text x="${xOf(y).toFixed(1)}" y="${H-8}" font-size="10" font-weight="700" fill="var(--muted)" text-anchor="${anchor}">${y}</text>`;
  }).join('');

  const n=shown.length;
  const lastState=shown[n-1];
  // Norme d'abreviation des dates posees sur les charts : "29 Jul 26".
  const shortDate=(iso)=>{
    const d=new Date(iso+'T00:00:00Z');
    if(isNaN(d)) return iso;
    const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
    return `${d.getUTCDate()} ${m} ${String(d.getUTCFullYear()).slice(2)}`;
  };
  // Turquoise pour le consensus (decision 20/08 v6) : se detache mieux
  // du navy que l or, qui reste la couleur du scorecard guidance.
  const CONS_COL='var(--teal-text)';
  const consCurMap={...consExtra, ...consMapAll};
  const mapYAt=(m,x)=>{
    const ys=years.filter(y=>typeof m[y]==='number');
    if(ys.length<2) return null;
    const fy=yFirst+((x-padL)/plotW)*(yLast-yFirst);
    if(fy<ys[0]||fy>ys[ys.length-1]) return null;
    let k=1; while(k<ys.length&&ys[k]<fy) k++;
    const a=ys[k-1], b=ys[k];
    return yOf(m[a]+(m[b]-m[a])*((fy-a)/(b-a)));
  };
  // Toutes les courbes AFFICHEES (les deux courantes) - support de la
  // regle anti-barrage des etiquettes.
  const allCurveYAt=(x)=>{
    const out=[];
    const y1=mapYAt(lastState.epsByYear,x); if(y1!=null) out.push(y1);
    if(consYears.length){ const y2=mapYAt(consCurMap,x); if(y2!=null) out.push(y2); }
    return out;
  };
  // TRAINEES DE REVISION (mode "Revisions") : a chaque millesime, une
  // trainee verticale part de l estimation la plus ANCIENNE vers le point
  // ACTUEL - les etats intermediaires sont des points en fondu (plus
  // vieux = plus efface). Une seule figure par millesime, quel que soit
  // le nombre de revisions archivees : scalable, et la direction de la
  // migration se lit d un coup d oeil. Navy = Omnium, or = consensus.
  // ── PANNEAU REVISIONS R1 (20/08 v6) : puces par millesime ──────────
  //
  // Trois niveaux de lecture, du plus quotidien au plus profond :
  //   1. bouton "Revisions" -> puces YTD par millesime (total des
  //      revisions depuis le debut de l annee CIVILE ; tant que les
  //      archives ne remontent pas avant le 1er janvier, la fenetre
  //      YTD EST l origine - l ecart disparait avec le temps) ;
  //   2. micro-lien "full" sous un millesime porteur d archives
  //      ANTERIEURES au 1er janvier -> total depuis les PREMIERES
  //      projections, micro-legende "since {date}" (le millesime de
  //      l exercice en cours ne peut jamais porter ce lien : il sort
  //      du chart au roulement avant d accumuler un passe) ;
  //   3. "detail" -> bandeau pleine largeur : le film complet du
  //      millesime, etape par etape, series navy et turquoise.
  // Le chart, lui, reste PUR : les puces vivent sous l axe, la legende
  // tient dans le bouton ("Revisions · YTD"), le code couleur suffit.
  let revLedger='';
  if(REV){
    const fmtD=v=>{const a=Math.abs(v); return (a>=10?a.toFixed(0):a.toFixed(1))+'%';};
    const chip=(cls,v)=>{
      if(v==null) return '';
      if(Math.abs(v)<0.05) return `<span class="epsrev-chip ${cls} eq">=</span>`;
      return `<span class="epsrev-chip ${cls}">${v>0?'▲':'▼'} ${fmtD(v)}</span>`;
    };
    // Series chronologiques completes (les cartes archivees ont deja ete
    // etendues a l horizon par extrapolation) - l entree COURANTE ferme
    // chaque serie.
    const omnEntries=shown.map(st=>({date:st.date,
      lab:shortDate(st.event&&st.event.date?st.event.date:st.date), m:st.epsByYear}));
    const consEntries=consHistList.map(h=>({date:h.date||'', lab:h.date?shortDate(h.date):'—', m:h.m}))
      .concat(consYears.length&&dCons?[{date:dCons.date||'', lab:dCons.date?shortDate(dCons.date):'—', m:consCurMap}]:[]);
    const jan1=`${new Date().getFullYear()}-01-01`;
    // Base YTD = dernier etat date d AVANT le 1er janvier (sinon le
    // premier etat = l origine) ; base origine = premier etat.
    const baseOf=(entries,mode)=>{
      if(entries.length<2) return null;
      if(mode==='all') return entries[0];
      let b=null;
      entries.slice(0,-1).forEach(e=>{ if(e.date&&e.date<jan1) b=e; });
      return b||entries[0];
    };
    const val=(e,y)=>{ const v=e&&e.m?e.m[String(y)]??e.m[y]:null; return (typeof v==='number')?v:null; };
    const delta=(entries,y,mode)=>{
      const b=baseOf(entries,mode); if(!b) return null;
      const cur=val(entries[entries.length-1],y), old=val(b,y);
      if(cur==null||old==null||Math.abs(old)<1e-9) return null;
      return (cur-old)/Math.abs(old)*100;
    };
    const hasPrior=(entries,y)=>entries.length>=2
      && entries.slice(0,-1).some(e=>e.date&&e.date<jan1&&val(e,y)!=null);
    const st=(typeof _epsRevVintage!=='undefined')?_epsRevVintage:{};
    let cells='', strip='', any=false, anyMore=false;
    years.forEach(y=>{
      const mode=(st[y]||0)>=1?'all':'ytd';
      const dO=delta(omnEntries,y,mode), dC=delta(consEntries,y,mode);
      if(dO==null&&dC==null) return;
      any=true;
      const eligible=hasPrior(omnEntries,y)||hasPrior(consEntries,y);
      if(eligible) anyMore=true;
      const lx=(xOf(y)/W*100).toFixed(2);
      const i=years.indexOf(y);
      const tr=i===0?'translateX(0)':(i===years.length-1?'translateX(-100%)':'translateX(-50%)');
      let more='';
      if(eligible){
        const lvl=st[y]||0;
        const lbl=lvl===0?'full ⌄':(lvl===1?'detail ⌄':'close ⌃');
        more=`<span class="epsrev-more" onclick="epsRevCycle(${y})">${lbl}</span>`;
        if(lvl>=1){
          const b=baseOf(omnEntries,y,'all')||baseOf(consEntries,y,'all');
          if(b&&b.date) more+=`<span class="epsrev-since">since ${shortDate(b.date)}</span>`;
        }
      }
      cells+=`<div class="epsrev-cell" style="left:${lx}%;transform:${tr};">${chip('omn',dO)}${chip('cons',dC)}${more}</div>`;
      // ── niveau 3 : bandeau detail du millesime ──
      if((st[y]||0)===2){
        const line=(entries,col,name)=>{
          const pts2=entries.map(e=>({lab:e.lab, v:val(e,y)})).filter(x=>x.v!=null);
          if(pts2.length<2) return '';
          let out=`<div class="epsrev-line" style="color:${col};"><span class="sw"></span>`;
          pts2.forEach((x,k)=>{
            if(k) out+=`<span class="arr">→</span>`;
            out+=`<span class="stp">${x.lab} <b>${x.v.toFixed(2)}</b></span>`;
          });
          const d0=pts2[0].v, d1=pts2[pts2.length-1].v;
          if(Math.abs(d0)>1e-9){
            const dv=(d1-d0)/Math.abs(d0)*100;
            out+=`<span class="tot">${Math.abs(dv)<0.05?'=':(dv>0?'▲ ':'▼ ')+fmtD(dv)}</span>`;
          }
          return out+'</div>';
        };
        strip+=`<div class="epsrev-strip">
          <div class="epsrev-t"><span>${y} — revision history</span><span class="epsrev-x" onclick="epsRevCycle(${y})">✕ close</span></div>
          ${line(omnEntries,'var(--navy)')}${line(consEntries,'var(--teal-text)')}
        </div>`;
      }
    });
    if(any)
      revLedger=`<div class="epsrev-row" style="height:${anyMore?66:46}px;">${cells}</div>${strip}`;
  }
  // COURBE OMNIUM COURANTE seule (les revisions ne s empilent plus).
  const curvesSvg=(s=>{
    const ptYears=years.filter(y=>typeof s.epsByYear[String(y)]==='number');
    if(ptYears.length<2) return '';
    const pts=ptYears.map(y=>`${xOf(y).toFixed(1)},${yOf(s.epsByYear[String(y)]).toFixed(1)}`).join(' ');
    const dots=ptYears.map((y,j)=>{
      const v=s.epsByYear[String(y)];
      const px=xOf(y), py=yOf(v);
      const r=3.5;
      const dcx=Math.max(px, padL+r+0.5);
      // Etiquette perpendiculaire cote superieur, puis REGLE ANTI-BARRAGE :
      // aucune valeur ne doit etre barree par une courbe. Bande de
      // detection 9px (la demi-hauteur REELLE du texte plus une marge -
      // a 7px une courbe pouvait FROLER le haut des chiffres sans
      // declencher le deplacement, defaut constate sur "9.0").
      const pv=ptYears[j-1], nv=ptYears[j+1];
      const ax=pv!=null?xOf(pv):px, ay=pv!=null?yOf(s.epsByYear[String(pv)]):py;
      const bx=nv!=null?xOf(nv):px, by=nv!=null?yOf(s.epsByYear[String(nv)]):py;
      let dx=bx-ax, dy=by-ay;
      const len=Math.hypot(dx,dy)||1; dx/=len; dy/=len;
      let nx=-dy, ny=dx;
      if(ny>0){ nx=-nx; ny=-ny; }
      const ox=px+nx*15;
      let oy=py+ny*15;
      const txt=v.toFixed(2), halfW=txt.length*3.2;
      const anchor=(ox-halfW<padL)?'start':((ox+halfW>padL+plotW)?'end':'middle');
      const cx=anchor==='start'?Math.max(ox,padL):(anchor==='end'?Math.min(ox,padL+plotW):ox);
      const x0=anchor==='start'?cx:(anchor==='end'?cx-halfW*2:cx-halfW);
      const clash=(yy)=>{
        for(let k=0;k<=4;k++){
          const xx=Math.max(padL, Math.min(padL+plotW, x0+halfW*2*k/4));
          for(const cy of allCurveYAt(xx)){ if(Math.abs(cy-yy)<9) return cy; }
        }
        return null;
      };
      let hit, guard=0;
      while((hit=clash(oy))!=null && guard++<12){ oy+=(hit>oy?-5:5); }
      oy=Math.max(padT+6, Math.min(padT+plotH-2, oy));
      const label=`<text x="${cx.toFixed(1)}" y="${(oy+3).toFixed(1)}" font-size="10.5" font-weight="700" font-family="Poppins,sans-serif" fill="var(--navy)" text-anchor="${anchor}" style="paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;">${txt}</text>`;
      return `<circle cx="${dcx.toFixed(1)}" cy="${py.toFixed(1)}" r="${r}" fill="var(--navy)"/>${label}`;
    }).join('');
    return `<polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  })(lastState);

  // COURBE CONSENSUS COURANTE : trait plein fin or, datee au bout DROIT
  // comme la courbe Omnium (l espace y est reserve).
  let consSvg='';
  if(consYears.length){
    const chain=[...consYears, ...consExtraYears];
    const vOf=(y)=>consExtraYears.includes(y)?consExtra[y]:consMapAll[y];
    const pts=chain.map(y=>`${xOf(y).toFixed(1)},${yOf(vOf(y)).toFixed(1)}`).join(' ');
    consSvg+=(chain.length>1?`<polyline points="${pts}" fill="none" stroke="${CONS_COL}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`:'');
  }
  // LEGENDE : a gauche, dans le sillage du titre d axe. Noms seuls.
  let legSvg='';
  {
    const items=[{col:'var(--navy)', sw:1.8, txt:'Omnium'}];
    if(consYears.length) items.push({col:CONS_COL, sw:1.8, txt:'Consensus'});
    let x=padL+unitTxt.length*7.4+22;
    const parts=[];
    items.forEach(it=>{
      parts.push(`<line x1="${x.toFixed(1)}" x2="${(x+13).toFixed(1)}" y1="11.8" y2="11.8" stroke="${it.col}" stroke-width="${it.sw}" stroke-linecap="round"/>`);
      x+=18;
      parts.push(`<text x="${x.toFixed(1)}" y="15" font-size="9.5" font-weight="600" font-family="Poppins,sans-serif" fill="${it.col}">${it.txt}</text>`);
      x+=it.txt.length*5.1+16;
    });
    legSvg=parts.join('');
  }
  // BOUTON "Revisions" : en tete de chart, a droite - present des qu il
  // existe au moins une revision archivee (Omnium ou consensus).
  // v8 : vraie pilule HTML superposee au coin du chart - fond voile,
  // icone historique, badge compteur ; a l etat actif elle passe navy
  // plein avec le badge "YTD".
  const revCount=(n-1)+consHistMaps.length;
  let revBtnHtml='';
  if(revCount>0){
    const ic=`<svg class="epsrev-ic" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 3.2A4.4 4.4 0 1 1 1.6 6"/><polyline points="2.4 1.2 2.6 3.3 4.7 3.1"/><polyline points="6 3.9 6 6.2 7.8 7.1"/></svg>`;
    revBtnHtml=`<button class="epsrev-btn${REV?' on':''}" onclick="toggleEpsRevisions()">${ic}<span>Revisions</span><span class="epsrev-ct">· ${REV?'YTD':revCount}</span></button>`;
  }

  // Pas de dates en bout de courbe (retour 20/08 v7) : on s attend a
  // voir les DERNIERES projections - la date n apportait qu une info
  // legere, prenait de la place, et deux dates differentes posaient
  // question. Les dates restent en donnee et dans le film de detail
  // du panneau Revisions.
  const endLabels='';

  return {
    svg: `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMinYMid meet" style="display:block;overflow:visible;">${unitLabel}${legSvg}${gridlines}${yLabels}${consSvg}${curvesSvg}${xLabels}${endLabels}</svg>`,
    single: n<2,
    revLedger,
    revBtnHtml
  };
}

// ── Historique de valorisation (fiche titre) ─────────────────────
let _valoHistState={mode:'pe', seriesKind:'cy', period:'all'};
// Affichage des revisions sur le chart EPS projections (defaut : OFF -
// seules les deux courbes COURANTES s'affichent, datees a droite).
let _epsRevShow=false, _epsRevVintage={}, _epsRevTicker=null;
function toggleEpsRevisions(){ _epsRevShow=!_epsRevShow; if(!_epsRevShow)_epsRevVintage={}; renderValoHistory(CT); }
function epsRevCycle(y){ _epsRevVintage[y]=((_epsRevVintage[y]||0)+1)%3; renderValoHistory(CT); }

function renderValoHistory(ticker){
  // Rendu dans le creneau ouvert par la table de multiples (fusion des deux
  // sections) ; repli sur l'ancien conteneur si le bloc n'est pas encore la.
  const card=document.getElementById('valo-hist-slot')||document.getElementById('valo-hist-card');
  if(!card) return;
  const ph=state.priceHistory;
  const entry=ph && ph.tickers ? ph.tickers[ticker] : null;
  const snaps=entry ? (entry.snapshots||[]) : [];

  if(_valoHistPending){
    _valoHistState.period=_valoHistPending.period;
    _valoHistState.mode='pe';
    _valoHistState.seriesKind=_valoHistPending.role;   // 'cy' | 'ny' | 'y2'
    _valoHistPending=null;
  }

  if(snaps.length<2){
    const msg=snaps.length===1
      ? `Valuation history available from ${formatFrDate(snaps[0].date)} (collection in progress, check back after the next capture).`
      : `Valuation history not yet available for this ticker — collection starts at the next snapshot (2 times/week).`;
    card.innerHTML=`<div class="vr-empty">${msg}</div>`;
    return;
  }

  const latest=snaps[snaps.length-1];
  const earliest=snaps[0].date;
  const st=_valoHistState;
  const finIss=isFinancialIssuer(state.tickers[ticker]);
  const seriesDesc=st.mode!=='pe' ? null
    // Ex-cash par defaut ; sur capitalisation PAR DECLARATION pour un
    // emetteur financier (issuerType), meme si l'archive porte un nd reel
    // (MERCADOLIBRE : funding du livre de credit, pas un levier).
    : {kind:'role', role:st.seriesKind, exCash:!finIss};

  const modeBtn=(m,label)=>`<button class="vr-pill${st.mode===m?' active':''}" onclick="setValoHistMode('${m}')">${label}</button>`;

  // Ligne "periode" masquee tant qu'aucune fenetre n'est atteignable :
  // avec 3 points sur une semaine, proposer 1 mois / 3 mois / 1 an griss
  // n'apporte rien. Les boutons apparaissent au fur et a mesure que
  // l'historique les rend reellement selectionnables.
  const snapsTraces=snaps.filter(x=>x && x.price>0);
  const availPeriods=Object.keys(VALO_PERIOD_DAYS)
    .filter(pk=>valoFilterByPeriod(snapsTraces,pk).length<snapsTraces.length);
  const periodBtn=(pk)=>`<button class="vr-pill${st.period===pk?' active':''}" onclick="setValoHistPeriod('${pk}')">${VALO_PERIOD_LABELS[pk]}</button>`;
  const allBtn=`<button class="vr-pill${st.period==='all'?' active':''}" onclick="setValoHistPeriod('all')">All</button>`;

  // Largeur reelle disponible : le viewBox s'y cale au pixel pres, ce qui
  // supprime a la fois la mise a l'echelle du texte et la gouttiere de
  // centrage laissee par preserveAspectRatio.
  const chartW=Math.max(280, Math.round(card.clientWidth||640));

  let chartHtml, legendHtml;
  if(st.mode==='projection'){
    const proj=buildValoProjectionCurvesSVG(ticker, 6, chartW);
    if(!proj){
      chartHtml='<div class="vr-empty">Not enough history yet to plot a projection curve (at least 2 projected years required).</div>';
      legendHtml='';
    }else{
      chartHtml=`<div style="position:relative;">${proj.svg}${proj.revBtnHtml||''}</div>`+(proj.revLedger||'');
      // Plus de legende de correspondance : chaque courbe porte sa date au
      // bout d'elle-meme. Le cas "une seule courbe" ne merite rien non
      // plus (retour Nemetschek 20/08 : la mention n'apprenait rien).
      legendHtml='';
    }
  }else{
    // La legende se construit APRES le trace, a partir de ce qu'il
    // contient reellement : annoncer "Revised estimate" alors qu'aucun
    // point or n'est a l'ecran etait le principal defaut de lecture.
    const out={};
    // Les trois echeances de la table de multiples sont tracees ENSEMBLE,
    // chacune nommee au bout de sa courbe. Il n'y a donc plus de selection
    // a operer : la table redevient un rappel chiffre au lieu d'etre un
    // controle sans affordance (invisible au doigt, faute de survol).
    const lastSnap=(state.priceHistory?.tickers?.[ticker]?.snapshots||[]).slice(-1)[0];
    const yrOf=(role)=>lastSnap?roleYear(lastSnap,role):null;
    const extraSeries=st.mode==='pe' ? ['ny','y2']
      .map(r=>({series:{kind:'role', role:r, exCash:!finIss}, label:String(yrOf(r)||'')}))
      .filter(e=>e.label) : [];
    const chart=buildValoChartSVG(ticker, {mode:st.mode, series:seriesDesc, periodKey:st.period,
      compact:false, width:chartW, out, extraSeries,
      seriesLabel:String(yrOf(st.seriesKind)||'')});
    chartHtml=chart || '<div class="vr-empty">Not enough data points for this period.</div>';
    // Plus de legende : chaque marqueur porte son intitule au-dessus de
    // lui (pastilles d'evenements documentees), une correspondance a
    // decoder n'a plus d'objet.
    legendHtml='';
  }
  const showPeriodRow=st.mode!=='projection' && availPeriods.length>0;

  // Plus de titre ni de rangee de series : la section est celle de la table
  // de multiples juste au-dessus, qui nomme deja les series et sert de
  // selecteur.
  card.innerHTML=`
    <div class="vr-hist-controls">
      <div class="vr-control-row">${modeBtn('pe','P/E')}${modeBtn('projection','EPS')}</div>
      ${showPeriodRow ? `<div class="vr-control-row">${availPeriods.map(periodBtn).join('')}${allBtn}</div>` : ''}
    </div>
    <div class="vr-hist-legend">${legendHtml}</div>
    <div class="vr-hist-chart">${chartHtml}</div>
  `;
}

function setValoHistMode(m){ _valoHistState.mode=m; renderValoHistory(CT); }
// kind : 'cy' | 'ny' | 'y2' (les trois lignes de la table de multiples)
function setValoHistSeries(kind){
  _valoHistState.mode='pe';
  _valoHistState.seriesKind=kind;
  // La table porte l'etat selectionne : elle doit se redessiner aussi.
  renderAnalyse();
}
function setValoHistPeriod(p){ _valoHistState.period=p; renderValoHistory(CT); }

function renderDernierCall(hyp, ticker, opts={}){
  const dc=hyp?.dernierCall||null;
  if(!dc)return '';
  const cur=tickerCur(ticker)||'€';
  const q=(dc.quarter||'').trim();
  const esc=s=>(s||'').toString().replace(/</g,'&lt;');
  const fmtShortDate=(iso)=>{
    if(!iso)return'';
    const p=String(iso).split('-');
    return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:iso;
  };
  const ca=dc.resultatsVsConsensus?.ca||null;
  const eps=dc.resultatsVsConsensus?.epsAdj||null;
  const caActual=ca&&ca.actual!=null?fmtBigNum(ca.actual):null;
  const caCons=ca&&ca.consensus!=null?fmtBigNum(ca.consensus):null;
  const caDelta=ca?fmtPctDelta(ca.actual,ca.consensus):null;
  const epsDelta=eps?fmtPctDelta(eps.actual,eps.consensus):null;

  // Delta minimal - texte seul, meme taille que "cons. $X", turquoise/
  // rouge, jamais gras, jamais de pastille coloree (decision du
  // 18/08/2026 : l'ancien pctBadge - fond colore + gras - "attirait trop
  // l'oeil" sur un chiffre secondaire). Volontairement PAS pctBadge (qui
  // reste utilise tel quel par Value Rankings, design deja arbitre
  // separement - ne jamais coupler les deux).
  const plainDelta=(delta)=>{
    if(delta==null)return '';
    const col=delta>=0?'var(--teal-text)':'#e05252';
    return `<span style="font-size:10.5px;font-weight:400;color:${col};font-family:'Poppins',sans-serif;">${delta>=0?'+':''}${delta.toFixed(1)}%</span>`;
  };
  const caLine=caActual?`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;">
      <span style="font-size:13px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;">Revenue</span>
      <span style="font-size:13px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;">${caActual}${cur}</span>
      ${caCons?`<span style="font-size:10.5px;color:var(--muted);font-family:'Poppins',sans-serif;">cons. ${caCons}${cur}</span>`:''}
      ${plainDelta(caDelta)}
    </div>`:'';
  const epsLine=(eps&&eps.actual!=null)?`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;">
      <span style="font-size:13px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;">EPS${eps.basis?' ('+eps.basis+')':''}</span>
      <span style="font-size:13px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;">${(+eps.actual).toFixed(2)}${cur}</span>
      ${eps.consensus!=null?`<span style="font-size:10.5px;color:var(--muted);font-family:'Poppins',sans-serif;">cons. ${(+eps.consensus).toFixed(2)}${cur}</span>`:''}
      ${plainDelta(epsDelta)}
    </div>`:'';
  // Badges Press release/Transcript retires (decision du 18/08/2026) :
  // le protocole exige deja les deux a chaque refresh earnings (E8-bis),
  // le rare cas ou l'un manque est deja signale dans le texte/watch-list -
  // le badge n'apportait rien de plus dans 95% des cas.
  const sourcesHeading=q?`<div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;">Earnings ${esc(q)}</div>`:'';
  const resultsBlock=(caLine||epsLine)?`<div>${caLine}${epsLine}</div>`:'';
  // Colonne de droite optionnelle (le resume du Guidance Scorecard,
  // discret - voir buildGuidanceScorecard) : n'occupe une grille a deux
  // colonnes QUE quand elle existe ET qu'il y a des chiffres a gauche,
  // sinon repli sur l'affichage pleine largeur d'avant (titre seul,
  // titre absent, etc. - tous les cas geres par renderContextBullets
  // avant cette fonction ne changent pas).

function formatThesisText(txt, insertAfterFirst){
  const esc=s=>(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines=(txt||'').split(/\n/);
  let html='', buf=[], first=true, sectionCount=0, injected=false;
  const flush=()=>{
    const t=buf.join('\n');
    if(t.trim()){
      html+=`<div style="font-size:12px;color:var(--text);line-height:1.6;white-space:pre-wrap;margin-bottom:10px;">${esc(t)}</div>`;
    }
    buf=[];
  };
  lines.forEach(line=>{
    const m=line.trim().match(/^==\s*(.+?)\s*==$/);
    if(m){
      flush();
      sectionCount++;
      if(sectionCount===2 && insertAfterFirst && !injected){
        html+=insertAfterFirst;
        injected=true;
      }
      html+=`<div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:${first?'0':'14px'} 0 6px;">${esc(m[1])}</div>`;
      first=false;
    }else{
      buf.push(line);
      first=false;
    }
  });
  flush();
  if(insertAfterFirst && !injected){ html+=insertAfterFirst; }
  return html;
}

// Resume TOUJOURS calcule cote client depuis les champs structures -
// jamais stocke separement dans le JSON (memes risques de
// desynchronisation que publishedEps, voir quarterlyEPS.retraitements).
// Palette navy/gris uniquement, aucun code couleur (decision du
// 18/08/2026 apres plusieurs iterations visuelles - chaque ligne de
// cette carte est deja significative par construction, pas de bruit de
// fond a distinguer par la couleur).
function buildGuidanceScorecardSummary(gs){
  const esc=s=>(s||'').toString().replace(/</g,'&lt;');
  const latest=(gs.timeline||[])[0]||null;
  const latestIsWarning=latest&&latest.type==='guidance_revision'&&latest.flag==='warning';
  // annualBeatPct (architecture du 18/08/2026) prime : c'est la metrique
  // qui pilote la projection. weightedBeatPct (trimestriel) n'est qu'un
  // indicateur de suivi, servi en repli pour les fiches pre-architecture.
  if(typeof gs.annualBeatPct==='number'){
    const verb=gs.annualBeatPct>=0?'Beats':'Misses';
    const against=gs.comparedAgainst==='guidance'?'initial annual guidance':'initial annual consensus';
    const warnSuffix=latestIsWarning?' · guidance warning this cycle':'';
    return `${verb} ${against} by ${Math.abs(gs.annualBeatPct).toFixed(1)}% on average${warnSuffix}`;
  }
  if(gs.weightedBeatPct!=null){
    const verb=gs.weightedBeatPct>=0?'Beats':'Misses';
    const against=gs.comparedAgainst==='guidance'?'guidance':'consensus';
    const warnSuffix=latestIsWarning?' · guidance warning this cycle':'';
    return `${verb} ${against} by ${Math.abs(gs.weightedBeatPct).toFixed(1)}% on average${warnSuffix}`;
  }
  if(gs.paceCheckpoint) return esc(gs.paceCheckpoint);
  if(latest&&latest.type==='guidance_revision'){
    return `Guidance ${latest.flag==='warning'?'cut':'revised'} ${formatFrDate(latest.date)}${latestIsWarning?' · warning':''}`;
  }
  return 'No guidance or consensus track record yet.';
}

function buildGuidanceScorecard(ticker){
  // SECTION DEDIEE (19/08/2026, variante B "barres divergentes") : le
  // scorecard quitte la colonne de droite de dernierCall pour une carte
  // a part entiere juste avant Latest assumptions. Principes : 3 corps
  // de texte seulement (22 heros / 11,5 libelles-valeurs / 9,5 contexte),
  // chaque exercice mesure = une barre autour d'un axe zero central
  // (navy = beat, dore = miss, pastille cerclee = pile sur l'ancre),
  // seuls les DEUX derniers exercices affiches, le reste en archives
  // depliables - on conserve tout, on ne montre que le recent.
  const d=state.tickers[ticker];
  const gs=d?.hypothese?.guidanceScorecard;
  if(!gs) return '';
  const esc=v=>(v||'').toString().replace(/</g,'&lt;');
  const cadenceLabel={quarterly:'Quarterly guidance',annual:'Annual guidance',annual_kpi:'Annual guidance (KPI)',none:'No guidance'}[gs.cadence]||gs.cadence;
  const srcLbl={initial_guidance:'initial guidance',initial_consensus:'initial consensus',outlook_quantifie:'quantified outlook',own_vintage:'own vintage'};
  const fmtAnchor=v=>v==null?'':(Math.abs(v)>=1000?Math.round(v).toLocaleString('fr-FR'):(+v).toFixed(2)+'$');

  const allHist=(gs.annualBeatHistory||[]).filter(e=>e);
  const hist=allHist.filter(e=>!e.excluded&&typeof e.beatPct==='number').sort((a,b)=>b.fy-a.fy);
  const excl=allHist.filter(e=>e.excluded||typeof e.beatPct!=='number');
  const shown=hist.slice(0,2), older=hist.slice(2);

  // Une ligne d'exercice : FY / piste a axe central / valeur signee.
  // Piste bornee (bloc 520px) : en pleine largeur desktop les barres
  // devenaient des poutres. Barre PLEINE = exercice clos ; barre EVIDEE =
  // lecture provisoire de l'exercice en cours (E-scorecard, 19/08/2026).
  const rowHtml=(e,opts2)=>{
    const prov=!!(opts2&&opts2.provisional);
    const pct=prov?e.deltaPct:e.beatPct;
    const miss=pct<0;
    const col=miss?'var(--gold-text)':'var(--navy)';
    const w=Math.max(4, Math.abs(pct)/((opts2&&opts2.maxAbs)||1)*46);
    const bar= pct===0
      ? `<span style="position:absolute;top:50%;left:50%;width:7px;height:7px;border-radius:50%;background:#fff;border:2px solid var(--navy);transform:translate(-50%,-50%);"></span>`
      : prov
        ? `<div style="position:absolute;top:2px;bottom:2px;${miss?'right':'left'}:50%;width:${w.toFixed(1)}%;border-radius:3px;border:1.5px solid ${col};background:transparent;"></div>`
        : `<div style="position:absolute;top:2px;bottom:2px;${miss?'right':'left'}:50%;width:${w.toFixed(1)}%;border-radius:3px;background:${col};opacity:.92;"></div>`;
    const small=prov
      ? `initial ${fmtAnchor(e.initialValue)} → guided ${fmtAnchor(e.currentValue)}${e.asOf?` as of ${formatFrDate(e.asOf)}`:''}`
      : `${e.beatPct===0?'on the':'vs'} ${srcLbl[e.source]||esc(e.source)}${e.anchorValue!=null?' '+fmtAnchor(e.anchorValue):''}`;
    return `<div style="display:grid;grid-template-columns:44px 1fr 132px;align-items:center;gap:9px;" title="${esc(e.note)}">
      <span style="font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;color:var(--navy);">FY${String(e.fy).slice(2)}</span>
      <div style="position:relative;height:14px;"><span style="position:absolute;top:0;bottom:0;left:50%;width:1px;background:#c9cede;"></span>${bar}</div>
      <div style="font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;color:${col};line-height:1.25;">${pct>0?'+':pct<0?'−':''}${Math.abs(pct).toFixed(1)}%${prov?' projected':''}
        <small style="display:block;font-size:9.5px;font-weight:500;color:var(--muted);${prov?'':'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'}">${small}</small></div>
    </div>`;
  };

  // Heros : annualBeatPct (moyenne FONDUE des que inProgress existe -
  // l'ecart previsionnel de l'exercice en cours pese 3, les exercices
  // clos 2 puis 1). Qualificatif en NAVY, meme corps que les valeurs.
  const against=(()=>{const ss=hist.map(e=>e.source);
    return ss.length&&ss.every(x=>x==='initial_guidance')?'initial guidance'
      :ss.length&&ss.every(x=>x==='initial_consensus')?'initial consensus':'initial anchors';})();
  const ip=(gs.inProgress&&typeof gs.inProgress.deltaPct==='number')?gs.inProgress:null;
  const measured=typeof gs.annualBeatPct==='number';
  const beat=!measured||gs.annualBeatPct>=0;
  const ai=gs.anchorInitial||{};
  const hero=measured
    ? `<div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;">
        <span style="font-family:'Poppins',sans-serif;font-size:22px;font-weight:800;line-height:1;color:${beat?'var(--navy)':'var(--gold-text)'};">${gs.annualBeatPct>=0?'+':'−'}${Math.abs(gs.annualBeatPct).toFixed(1)}%</span>
        <span style="font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:600;color:var(--navy);">${beat?'above':'below'} ${against} on average</span>
      </div>`
    : `<div style="font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:600;color:var(--navy);">No fiscal year measured yet</div>`;
  // Pas de jargon de ponderation en surface ("weighted 3/2" illisible,
  // retour 19/08) - la methode s'explique en clair dans les archives.
  const heroSub=ip
    ? `FY${String(ip.fy).slice(2)} in progress + ${hist.length} closed fiscal year${hist.length>1?'s':''}`
    : measured
      ? `${hist.length} fiscal year${hist.length>1?'s':''} measured vs ${against}`
      : (ai.fy?`First verdict at the FY${String(ai.fy).slice(2)} close`:'No measurable closed fiscal year');

  const maxAbs=Math.max(...hist.map(e=>Math.abs(e.beatPct)), ip?Math.abs(ip.deltaPct):0, 1);
  const rowsArr=[];
  if(ip) rowsArr.push(rowHtml(ip,{provisional:true,maxAbs}));
  shown.forEach(e=>rowsArr.push(rowHtml(e,{maxAbs})));
  const rows=rowsArr.length?`<div style="margin-top:13px;max-width:520px;display:flex;flex-direction:column;gap:8px;">${rowsArr.join('')}</div>`:'';

  // Ancre de l'exercice en cours : seulement si la ligne inProgress ne la
  // porte pas deja (sinon redondant). Detail applicationNote en infobulle.
  const anchorLine='';   // ancre releguee dans Details (retour CPRT 19/08)

  // "Details" (retour 19/08, exemple Insulet) : PAS d'historique verbeux -
  // une ligne par exercice "initiale -> realise" (ou "-> guide" pour
  // l'exercice en cours), et un complement UNIQUEMENT si necessaire
  // (changement de perimetre, decalage de metrique...) porte par les
  // notes structurees. Les timelines detaillees restent en donnee.
  const olderRows=older.length?`<div style="max-width:520px;display:flex;flex-direction:column;gap:8px;margin-top:9px;">${older.map(e=>rowHtml(e,{maxAbs})).join('')}</div>`:'';
  const line=(txt)=>`<p style="font-size:9.5px;color:var(--muted);margin:6px 0 0;line-height:1.6;">${txt}</p>`;
  const fyLine=(e)=>{
    const init=e.initialDisplay?esc(e.initialDisplay):(e.anchorValue!=null?fmtAnchor(e.anchorValue):srcLbl[e.source]||esc(e.source));
    const real=e.realizedDisplay?esc(e.realizedDisplay):(e.anchorValue!=null?fmtAnchor(e.anchorValue*(1+e.beatPct/100)):null);
    const sign=`${e.beatPct>0?'+':e.beatPct<0?'\u2212':''}${Math.abs(e.beatPct).toFixed(1)}%`;
    return line(`<b style="color:var(--navy);">FY${String(e.fy).slice(2)}</b> \u2014 initial ${init}${real?` \u2192 realized ${real}`:''} (${sign})`);
  };
  const anchorDetail=(!ip&&ai.fy&&ai.value!=null)?line(`<b style="color:var(--navy);">FY${String(ai.fy).slice(2)}</b> — anchor ${fmtAnchor(ai.value)} (${srcLbl[ai.source]||esc(ai.source)})`):'';
  const ipLine=ip?line(`<b style="color:var(--navy);">FY${String(ip.fy).slice(2)}</b> \u2014 initial ${fmtAnchor(ip.initialValue)} \u2192 guided ${fmtAnchor(ip.currentValue)}${ip.asOf?` as of ${formatFrDate(ip.asOf)}`:''} (${ip.deltaPct>0?'+':ip.deltaPct<0?'\u2212':''}${Math.abs(ip.deltaPct).toFixed(1)}% projected)`)
    +(ip.note?line(esc(ip.note)):''):'';
  const histLines=hist.map(fyLine).join('');
  const exclRows=excl.length?excl.map(e=>line(`<b style="color:var(--navy);">FY${String(e.fy).slice(2)}</b> \u2014 excluded${e.note?`: ${esc(e.note)}`:''}`)).join(''):'';
  // Base comptable : la meme phrase SYNTHETIQUE que la section EPS
  // (buildAccountingBasisNote) - la basisNote brute (longue) reste en
  // donnee mais ne s'affiche plus (retour 20/08).
  const basisHtml=gs.basisAligned===false?(b=>b?line(b):'')(buildAccountingBasisNote(d)):'';
  // Titre sans guidance : le scorecard est ANCRE CONSENSUS et le dit
  // en clair sous le heros (retour Copart 20/08) - la mesure se deroule
  // alors sur les consensus initiaux dates, exactement comme une
  // guidance. L'ancienne ligne "Consensus source: ..." (qui ne se
  // rapportait a rien) disparait.
  const consBased=gs.comparedAgainst==='consensus';

  return `${hero}
    <p style="font-family:'Poppins',sans-serif;font-size:9.5px;color:var(--muted);margin:4px 0 0;">${esc(heroSub)}</p>
    ${consBased?`<p style="font-family:'Poppins',sans-serif;font-size:9.5px;color:var(--muted);margin:2px 0 0;">Based on consensus \u2014 ${esc(d.name||ticker)} does not guide.</p>`:''}
    ${rows}
    ${anchorLine}
    <div class="rb-eps-py-toggle" id="gs-toggle" onclick="toggleGuidanceScorecard()" style="margin-top:11px;">
      <span class="lbl" style="text-transform:none;font-size:9.5px;font-weight:600;color:var(--muted);">Details</span>
      <span class="rb-eps-py-chevron">\u25bc</span>
    </div>
    <div class="rb-eps-py-content" id="gs-content">
      ${olderRows}
      <p style="font-size:9.5px;color:var(--muted);margin:9px 0 0;">Average: the year in progress counts for half, closed years share the rest equally.</p>
      ${ipLine}${anchorDetail}${histLines}${exclRows}${basisHtml}
    </div>`;
}

function calcScore(ticker){
  const d=state.tickers[ticker];
  if(!d||!d.data||d.data.length<2)return 0;
  const cours=d.cours||100;
  const{proj}=getProj(ticker);
  const {CY}=yearsFor(ticker);
  const LY=analysisLY(ticker);
  const epsCY=proj[CY]?.eps||0,eps30=proj[LY]?.eps||0;
  if(epsCY<=0||eps30<=0||LY<=CY)return 0;
  const cagrEps=((Math.pow(eps30/epsCY,1/(LY-CY)))-1)*100;
  const div=d.dividende||0;
  const yieldPct=(cours>0&&div>0?(div/cours)*100:0)+particulariteYieldPct(d);
  const peFwd=cours>0?cours/epsCY:null;
  if(!peFwd||peFwd<=0)return 0;
  return (cagrEps+yieldPct)/peFwd;
}

// de bruit pour un prospect qui decouvre l'app, sans rapport avec le
// suivi personnel de Mathieu que cette barre sert a l'origine.
function newsBarLines(){
  if(IS_GUEST_SESSION)return [];
  const digest=state.newsDigest||[];
  if(!digest.length)return [];
  const dismissed=state.dismissedNewsDates||new Set();
  return digest
    .filter(e=>e && (+e.total||0)>0 && !dismissed.has(e.date))
    .slice()
    .sort((a,b)=>b.date.localeCompare(a.date))
    .slice(0,NEWS_MAX_LINES);
}

// du jour, voir collectors/market_reset.py + market_check.py). Meme
// pattern visuel que le bandeau news, en plus simple : un seul etat "du
// jour" (pas un digest multi-jours), donc une seule ligne possible a la
// fois. Dismissal en localStorage UNIQUEMENT (pas de sync serveur comme
// pour les news) - assume car cette notification ne vit qu'une seule
// journee de toute facon (voir la conversation de design du 12/08/2026) :
// la valeur d'une synchro multi-appareils est faible pour un etat qui

const MARKET_ACTION_DISMISS_KEY='omniumMarketActionDismissedDate';

// "Jour" cote Paris (PAS le fuseau local du visiteur) - le backend
// (market_check.py) raisonne en heure de Paris, la comparaison cote client
// doit utiliser le meme referentiel pour ne jamais afficher une ligne
// perimee (ou en cacher une valide) a cause d'un visiteur dans un autre
// fuseau horaire. Cutoff a 01h00 (pas minuit pile) - decision du
// 13/08/2026 : en retranchant 1h avant de lire la date, la notification
// de la veille reste affichee jusqu'a 01h00 heure de Paris plutot que de
// disparaitre a minuit pile, avant que market_reset.py (recale sur le
// meme cutoff, voir sa docstring) n'ait ecrit la nouvelle baseline du
// jour - utile pour une consultation tardive en soiree.
function todayParisDateStr(){
  const shifted=new Date(Date.now()-60*60*1000);
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(shifted);
}

function isMarketActionDismissed(dateStr){
  try{ return localStorage.getItem(MARKET_ACTION_DISMISS_KEY)===dateStr; }catch(e){ return false; }
}

  try{ localStorage.setItem(MARKET_ACTION_DISMISS_KEY,dateStr); }catch(e){}

// fichier vs todayParisDateStr), au moins un titre concerne, et pas deja

  const ma=state.marketAction;
  if(!ma || !ma.date || !Array.isArray(ma.movers) || !ma.movers.length)return null;

  if(isMarketActionDismissed(ma.date))return null;

}

// bandeau news bleu classique. Meme pattern qu'un etat "du jour" (Market
// Action) plutot qu'un digest multi-jours : un seul run pertinent a la fois
// (le dernier), dismissal en localStorage uniquement (pas de sync serveur -
// la valeur d'une synchro multi-appareils est faible ici, et ca reapparait
// de toute facon automatiquement la semaine suivante des que la date change).
// Volontairement PAS masque pour une session invite (contrairement a
// newsBarLines()) : c'est exactement le public cible (visiteurs d'une demo).

const WEEKLY_AI_DISMISS_KEY='omniumWeeklyAiDismissedDate';
const MATERIALITE_LABEL={fort:'High',moyen:'Medium',faible:'Low',nul:'None'};
const MATERIALITE_ORDER={fort:3,moyen:2,faible:1,nul:0};

// Date (YYYY-MM-DD) du dernier run hebdo reussi, ou null si le pipeline n'a
// pas encore tourne une seule fois (data/webState.json absent avant le
// tout premier run reussi - voir collectors/merge_web.py).
function weeklyAiRunDate(){
  const iso=state.webState && state.webState.lastSuccessfulRun;
  if(!iso)return null;
  const d=String(iso).split('T')[0];
  return d||null;
}

// Items du DERNIER run precisement (pas tout l'historique "web") : filtre
// sur dateCollecte, meme logique que groupNewsAll() pour le digest quotidien
// (le champ qui date le RUN, pas l'evenement sous-jacent).
function weeklyAiItems(){
  const runDate=weeklyAiRunDate();
  if(!runDate)return [];
  return (state.newsAll||[]).filter(it=>it && it.type==='web' && it.dateCollecte===runDate);
}

function weeklyAiCalendarProposals(){
  const runDate=weeklyAiRunDate();
  if(!runDate)return [];
  return (state.calendarProposals||[]).filter(p=>p && p.dateProposition===runDate);
}

function isWeeklyAiDismissed(dateStr){
  try{ return localStorage.getItem(WEEKLY_AI_DISMISS_KEY)===dateStr; }catch(e){ return false; }
}
function dismissWeeklyAi(dateStr){
  try{ localStorage.setItem(WEEKLY_AI_DISMISS_KEY,dateStr); }catch(e){}
  renderWeeklyAiBar();
}

  const wrap=document.getElementById('weekly-ai-bar-wrap');
  if(!wrap)return;

  // web qui l'alimentait est supprime, la notification n'a plus de source.
  wrap.innerHTML=''; return;
  const runDate=weeklyAiRunDate();

// filterDate : si fourni, ne conserve QUE les items dont dateCollecte
// correspond exactement - PAS dateEvenement (correctif : le digest, voir
// merge.py update_digest(), regroupe ses lignes par date de COLLECTE - le
// jour ou le run a tourne - pas par date de l'evenement sous-jacent. Un
// item dont l'evenement date d'hier mais collecte aujourd'hui est compte
// dans la ligne "aujourd'hui" du digest ; filtrer sur dateEvenement le
// faisait donc disparaitre a tort de la vue detaillee correspondante,
// donnant l'impression trompeuse d'une ligne "vide" alors que le compteur
// affichait bien un total > 0). Le tri interne reste sur dateEvenement
// (ordre de lecture chronologique de l'evenement lui-meme, inchange) -
// seul le FILTRE change de champ.
function groupNewsAll(filterDate){
  const all=(state.newsAll||[]).filter(it=>!filterDate || it.dateCollecte===filterDate);
  const byType={};
  all.forEach(it=>{
    if(!it||!it.type)return;
    (byType[it.type]=byType[it.type]||[]).push(it);
  });
  return NEWS_TYPE_ORDER.filter(t=>byType[t]&&byType[t].length).map(t=>{
    const byCompany={};
    byType[t].forEach(it=>{
      const key=it.ticker||it.name||'?';
      if(!byCompany[key])byCompany[key]={name:it.name||it.ticker||'?', items:[]};
      byCompany[key].items.push(it);
    });
    const companies=Object.values(byCompany).map(c=>{
      c.items.sort((a,b)=>String(b.dateEvenement||'').localeCompare(String(a.dateEvenement||'')));
      return c;
    }).sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'}));
    return {type:t, label:NEWS_TYPE_LABEL[t]||t, companies};
  });
}

let pfNameFilter='';
function pfNormalize(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function pfFilterByName(v){
  pfNameFilter=v;
  renderPortfolio();
}
function pfOpenTicker(tk,cours){
  CT=tk;refreshSelects();

  if(coursEl){ coursEl.value=cours; sizeCoursInput(); }
  syncAnalyseHeader(tk);showTab('analyse',null);autoFetchPrice(tk,true);
}
function pfNameFilterKeydown(e){
  if(e.key==='Escape'){
    e.target.value='';pfFilterByName('');e.target.blur();
    return;
  }
  if(e.key!=='Enter')return;
  const q=pfNormalize(pfNameFilter);
  if(!q)return;
  const match=pfLastFilteredItems.find(({d,tk})=>pfNormalize(d.name||tk).startsWith(q));
  if(match) pfOpenTicker(match.tk,match.cours);
}
let pfLastFilteredItems=[];

let pfSort={key:'name',dir:'asc'};
function pfSortBy(key){
  if(pfSort.key===key){ pfSort.dir = pfSort.dir==='asc'?'desc':'asc'; }
  else{ pfSort.key=key; pfSort.dir = (key==='name'||key==='nextEvent'||key==='peN'||key==='peN1')?'asc':'desc'; }
  renderPortfolio();
}
function pfSortItems(items){
  const{key,dir}=pfSort;
  const mul=dir==='asc'?1:-1;
  return items.slice().sort((a,b)=>{
    if(key==='name'){
      return mul*(a.d.name||a.tk).localeCompare(b.d.name||b.tk,'fr',{sensitivity:'base'});
    }
    if(key==='nextEvent'){
      const av=a.nextEvtDate, bv=b.nextEvtDate;
      if(av==null&&bv==null)return 0;
      if(av==null)return 1;
      if(bv==null)return -1;
      return mul*(av-bv);
    }
    let av,bv;
    switch(key){
      case 'return': av=a.totalReturn; bv=b.totalReturn; break;
      case 'peN': av=a.peFwd??Infinity; bv=b.peFwd??Infinity; break;
      case 'peN1': av=a.pe27??Infinity; bv=b.pe27??Infinity; break;
      default: av=a.score; bv=b.score;
    }
    return mul*(av-bv);
  });
}
function pfUpdateSortHeaderUI(){
  document.querySelectorAll('.pf-sort-arrow').forEach(el=>{
    const k=el.getAttribute('data-key');
    el.textContent=(pfSort.key===k)?(pfSort.dir==='asc'?'▲':'▼'):'';
  });
  const sel=document.getElementById('pf-sort-select');
  if(sel && sel.value!==pfSort.key) sel.value=pfSort.key;
}

function actionQueues(){
  const attente=[], horsEnum=[];
  const today=new Date();
  Object.entries(state.tickers).forEach(([tk,d])=>{
    const dc=d?.hypothese?.dernierCall;
    if(!dc) return;
    // Champ absent == false : etat par defaut de toute fiche anterieure a la
    // regle. Ce n'est pas une anomalie, c'est une file d'attente.
    const ef=dc.etatsFinanciers;
    if(!ef || ef.analyse!==true) attente.push(tk);
    const b=(dc.resultatsVsConsensus||{}).epsAdj?.basis;
    if(typeof b==='string' && !['GAAP','non-GAAP'].includes(b.trim())) horsEnum.push(tk);
  });
  // nextEvents : passage mensuel (Operation C). L'alerte s'ouvre le 1er du
  // mois et s'eteint quand _meta.lastRun passe dans le mois courant.
  const lastRun=state.nextEvents?._meta?.lastRun||null;
  const moisCourant=today.toISOString().slice(0,7);
  const nextEventsDu=!lastRun || lastRun.slice(0,7)<moisCourant;
  return {attente:attente.sort(), horsEnum:horsEnum.sort(), nextEventsDu, lastRunNE:lastRun};
}

// MARKET CALENDAR (19/08/2026) - boucle hebdomadaire MANUELLE :
// pastille NAVY "Refresh calendar" le jeudi (action due) -> run manuel
// (INSTRUCTIONS_CALENDAR.md) -> pastille TEAL "Calendar actions" (tri)
// -> selections stockees cote serveur (calendar.php, meme infra que
// dismiss.php) avec repli localStorage transparent tant que l'endpoint
// n'est pas deploye -> carte "Market Calendar" du dashboard + agenda
// Google (ajout instantane par ligne + flux ics abonnable).
// ══════════════════════════════════════════════════════════════
const CAL_ENDPOINT='https://model.omnium-capital.com/calendar.php';
let _calRemote=null;                       // null=inconnu, true/false apres 1er contact
let _calData={selected:[],dismissed:[],lastTriaged:null};
// Un id de candidat embarque sa date (TICKER-YYYY-MM-DD-slug) : on purge
// des refus tout ce qui est passe, la liste ne peut pas enfler sans fin.
function _calPruneDismissed(){
  const today=new Date().toISOString().slice(0,10);
  _calData.dismissed=(_calData.dismissed||[]).filter(id=>{
    const m=/(\d{4}-\d{2}-\d{2})/.exec(id||'');
    return m && m[1]>=today;
  });
}
let _calDueOpen=false, _calTriageOpen=false;

function _calLocal(){ try{ return JSON.parse(localStorage.getItem('omniumCalSel')||'{"selected":[],"dismissed":[],"lastTriaged":null}'); }catch(e){ return {selected:[],dismissed:[],lastTriaged:null}; } }
function _calLocalSave(){ try{ localStorage.setItem('omniumCalSel',JSON.stringify(_calData)); }catch(e){} }

async function calFetch(){
  const u=getUserId();
  if(u){
    try{
      const r=await fetch(CAL_ENDPOINT+'?user='+encodeURIComponent(u),{signal:AbortSignal.timeout(5000)});
      if(r.ok){
        _calData=await r.json(); _calRemote=true;
        if(!Array.isArray(_calData.selected))_calData.selected=[];
        if(!Array.isArray(_calData.dismissed))_calData.dismissed=[];
        _calPruneDismissed();
        // Migration douce : selections faites hors-ligne poussees au serveur.
        const loc=_calLocal();
        const ids=new Set(_calData.selected.map(e=>e.id));
        const pending=(loc.selected||[]).filter(e=>e&&e.id&&!ids.has(e.id));
        for(const e of pending){ await calPost('add',{event:e}); _calData.selected.push(e); }
        if(pending.length){ try{localStorage.removeItem('omniumCalSel');}catch(err){} }
        return;
      }
    }catch(e){}
  }
  _calRemote=false; _calData=_calLocal();
  if(!Array.isArray(_calData.selected))_calData.selected=[];
  if(!Array.isArray(_calData.dismissed))_calData.dismissed=[];
  _calPruneDismissed();
}

async function calPost(action,payload){
  if(_calRemote){
    try{
      await fetch(CAL_ENDPOINT+'?user='+encodeURIComponent(getUserId())+'&action='+action,
        {method:'POST',body:JSON.stringify(payload||{}),signal:AbortSignal.timeout(5000)});
      return;
    }catch(e){ _calRemote=false; }
  }
  _calLocalSave();
}

// Jeudi 00:00 le plus recent (aujourd'hui inclus) - pivot de la cadence.
function lastThursday(){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()-4+7)%7));
  return d;
}
function calUpcoming(list){
  const today=new Date().toISOString().slice(0,10);
  return (list||[]).filter(e=>e&&e.date&&e.date>=today).sort((a,b)=>a.date<b.date?-1:1);
}
function calPillState(){
  const cc=state.calendarCandidates||null;
  const gen=cc&&cc._meta&&cc._meta.generatedAt||null;
  const due=!gen || new Date(gen)<lastThursday();
  // Fenetre stricte d'UN MOIS (J+31 depuis le run) et DEDUP : un
  // evenement deja accepte ne se re-propose JAMAIS (id stable).
  let cands=calUpcoming(cc&&cc.events);
  // SCALABILITE (21/08/2026) : un titre retire du portefeuille ne propose
  // plus jamais d'evenement — filtre manifest sur les candidats.
  cands=cands.filter(e=>!e.ticker||state.tickers[e.ticker]);
  if(gen){
    const lim=new Date(new Date(gen.slice(0,10)+'T00:00:00Z').getTime()+31*86400e3).toISOString().slice(0,10);
    cands=cands.filter(e=>e.date<=lim);
  }
  const dism=new Set(_calData.dismissed||[]);
  cands=cands.filter(e=>!calIsSelected(e.id) && !dism.has(e.id));
  const actions=(gen && cands.length && (!_calData.lastTriaged || _calData.lastTriaged<gen)) ? cands.length : 0;
  return {due, actions, gen, cands};
}
function calFeedUrl(){ return 'https://model.omnium-capital.com/calendar.php?user='+encodeURIComponent(getUserId())+'&ics=1'; }
// Abonnement Google Calendar (20/08) : le flux .ics ne peut apparaitre
// dans Google qu'apres un abonnement UNE FOIS ("From URL") - etape
// d'onboarding qui manquait au design "silencieux". Copie l'URL
// personnelle puis ouvre le formulaire Google d'ajout par URL.
async function calSubscribeGoogle(ev){
  const el=ev&&ev.target;
  try{ await navigator.clipboard.writeText(calFeedUrl()); if(el) el.textContent='Feed URL copied — paste it in the Google form'; }
  catch(e){ if(el) el.textContent=calFeedUrl(); }
  window.open('https://calendar.google.com/calendar/u/0/r/settings/addbyurl','_blank');
  // Une fois le flux copie, l invitation n a plus de raison d etre :
  // elle disparait definitivement sur ce navigateur (la ✕ fait pareil).
  try{ localStorage.setItem('omniumCalSubscribed','1'); }catch(e){}
  setTimeout(()=>renderMarketCalendar(), 4000);
}
function calSubscribeDismiss(){
  try{ localStorage.setItem('omniumCalSubscribed','1'); }catch(e){}
  renderMarketCalendar();
}
function calGoogleLink(cls){
  if(_calRemote!==true) return '';
  const href='https://calendar.google.com/calendar/render?cid='+encodeURIComponent(calFeedUrl());
  return `<a href="${href}" target="_blank" rel="noopener" style="font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;color:var(--navy);text-decoration:none;text-transform:none;letter-spacing:0;" title="One-time: adds the Omnium Market Calendar feed to your Google Calendar. Every event you tick then syncs on its own.">Add to Google Calendar</a>`;
}
function calIsSelected(id){ return (_calData.selected||[]).some(e=>e&&e.id===id); }
// SCALABILITE (21/08/2026) : purge des evenements deja COCHES dont le
// titre a quitte le portefeuille — cote client ET cote flux .ics (le
// calPost('remove') retire l'evenement du calendar_store, Google le
// desynchronise au prochain rafraichissement du flux). Une passe par
// session, apres le chargement des fiches.
let _calPrunedRemoved=false;
function calPruneRemovedTickers(){
  if(_calPrunedRemoved||!state.tickers||!Object.keys(state.tickers).length) return;
  _calPrunedRemoved=true;
  const gone=(_calData.selected||[]).filter(e=>e&&e.ticker&&!state.tickers[e.ticker]);
  if(!gone.length) return;
  _calData.selected=_calData.selected.filter(e=>!(e&&e.ticker&&!state.tickers[e.ticker]));
  gone.forEach(e=>calPost('remove',{id:e.id}));
  if(_calRemote!==true) _calLocalSave();
}
function calToggleEvent(id){
  const st=calPillState();
  const ev=(st.cands||[]).find(e=>e.id===id)||( _calData.selected||[]).find(e=>e.id===id);
  if(!ev) return;
  if(calIsSelected(id)){
    _calData.selected=_calData.selected.filter(e=>e.id!==id);
    calPost('remove',{id});
  } else {
    // Silencieux par design (decision 19/08) : la coche part au serveur,
    // le flux .ics se met a jour, Google le relit tout seul - aucune
    // fenetre Google n'est ouverte.
    _calData.selected.push(ev);
    calPost('add',{event:ev});
  }
  renderActionsBar(); renderMarketCalendar();
}
function calTriageDone(){
  // "Vu = tranche" (decision 19/08) : ce qui reste non coche a la cloture
  // du tri est marque REFUSE et ne sera jamais re-propose (l'utilisateur
  // a eu l'occasion d'accepter et ne l'a pas voulu).
  const st=calPillState();
  const rejected=(st.cands||[]).map(e=>e.id);
  _calData.dismissed=Array.from(new Set([...(_calData.dismissed||[]),...rejected]));
  _calPruneDismissed();
  _calData.lastTriaged=st.gen||new Date().toISOString();
  calPost('triaged',{generatedAt:_calData.lastTriaged, dismissedIds:_calData.dismissed});
  _calTriageOpen=false;
  renderActionsBar(); renderMarketCalendar();
}

// ── SOURCE DATA GAPS (20/08/2026) ─────────────────────────────────
// Trous de donnees sources malgre les cascades de back-up : le compteur
// se peuple DYNAMIQUEMENT au fil des refreshes et des creations de
// titres, et le panneau fournit le texte pret a coller pour lancer une
// boucle de collecte (Seeking Alpha via Chrome pour les transcripts,
// MarketScreener via navigateur pour les consensus).
// - CONSENSUS : calcule en direct depuis les fiches (eps/epsNY/epsY2
//   manquants, ou snapshot >45 jours - meme seuil que W7).
// - TRANSCRIPTS : deux signaux fusionnes - dernierCall.transcriptAnalyse
//   =false (le refresh n'a pas pu lire le transcript) et les entrees de
//   data/sourceGaps.json (archives Drive sous le seuil de richesse,
//   entretenues par les boucles de collecte).
function computeSourceGaps(){
  // SCALABILITE (21/08/2026) : TOUT est filtre par le manifest — un titre
  // retire du portefeuille disparait de chaque groupe, y compris les
  // entrees de data/sourceGaps.json qui le mentionnent encore.
  const cons=[], trans=[];
  const today=new Date();
  const todayIso=today.toISOString().slice(0,10);
  // Meta de blocage par titre (data/sourceGaps.json, section OPTIONNELLE
  // "consensus" entretenue par les boucles) : blockedBy = quota|source_absente.
  const consMeta={};
  (state.sourceGaps?.consensus||[]).forEach(g=>{
    if(g&&g.ticker&&state.tickers[g.ticker]) consMeta[g.ticker]=g;
  });
  Object.entries(state.tickers).forEach(([tk,d])=>{
    const co=d.epsConsensus||null;
    const miss=[];
    // Un consensus NEGATIF est un consensus valide (emetteur en perte,
    // ex. SNAP -0.07) : seul null/absent/non-numerique compte comme trou
    // (faux positif corrige le 21/08/2026 - l'ancien test eps>0 rangeait
    // les loss-makers en gap permanent).
    const has=v=>v!=null&&isFinite(+v);
    if(!co||!has(co.eps)) miss.push('eps CY');
    else{
      if(!has(co.epsNY)) miss.push('epsNY');
      if(!has(co.epsY2)) miss.push('epsY2');
      const dt=co.date?new Date(String(co.date).slice(0,10)):null;
      if(dt&&isFinite(dt)&&(today-dt)/864e5>45) miss.push(`stale ${Math.round((today-dt)/864e5)} j`);
    }
    if(miss.length){
      const m=consMeta[tk]||null;
      // Typage du cas : pilote le sous-groupe du panneau et le prompt associe.
      let kase='fetch';
      if(m&&m.blockedBy==='source_absente') kase='manual';
      else if(m&&String(m.blockedBy||'').startsWith('quota')) kase=(m.blockedDate===todayIso)?'quota_today':'quota_reset';
      cons.push({tk, detail:miss.join(' · ')+(m&&m.note?` — ${m.note}`:''), kase});
    }
    const dc=d.hypothese?.dernierCall;
    if(dc&&dc.transcriptAnalyse===false)
      trans.push({tk, detail:`${(dc.quarter||'dernier trimestre')} — transcript non lu au refresh`});
  });
  (state.sourceGaps?.transcripts||[]).forEach(g=>{
    if(g&&g.ticker&&state.tickers[g.ticker]&&g.status!=='ok'&&!trans.some(t=>t.tk===g.ticker))
      trans.push({tk:g.ticker, detail:`${g.event||''} — ${g.note||'archive sous le seuil de richesse'}`});
  });
  // ECHECS DU RUN CALENDRIER (21/08/2026) : quand la page IR d'un titre a
  // resiste aux strategies sans navigateur pendant le run hebdomadaire,
  // le run l'inscrit dans sourceGaps.calendar - le panneau porte alors
  // l'action SPECIFIQUE "passe navigateur Claude in Chrome" pour ce titre.
  const cal=[];
  (state.sourceGaps?.calendar||[]).forEach(g=>{
    if(g&&g.ticker&&state.tickers[g.ticker]&&g.status!=='ok')
      cal.push({tk:g.ticker, detail:g.note||'page IR inaccessible sans navigateur', url:g.url||null});
  });
  cons.sort((a,b)=>a.tk.localeCompare(b.tk)); trans.sort((a,b)=>a.tk.localeCompare(b.tk)); cal.sort((a,b)=>a.tk.localeCompare(b.tk));
  return {cons, trans, cal, total:cons.length+trans.length+cal.length};
}

// Fenetre de la moyenne de reference (selecteur discret de la tuile) :
// '1m' par defaut - '1y' et 'all' prennent leur sens a mesure que la
// collecte (2 captures/semaine) s'accumule.
let _peAvgPeriod='1m';
function setPeAvgPeriod(p){ _peAvgPeriod=p; renderMarketCalendar(); }
function peVsAverageExtremes(nEach){
  const ph=state.priceHistory; const out=[];
  const DAYS={'1m':31,'1y':365,'all':null}[_peAvgPeriod];
  if(ph&&ph.tickers){
    const seriesDesc=seriesDescForRole('cy');
    Object.keys(ph.tickers).forEach(tk=>{
      if(!state.tickers[tk]) return;
      const snaps=ph.tickers[tk].snapshots||[];
      if(snaps.length<2) return;
      const sd=isFinancialIssuer(state.tickers[tk])?{...seriesDesc,exCash:false}:seriesDesc;
      let win=snaps;
      if(DAYS){
        const last=snaps[snaps.length-1];
        const cutoff=isoDateMinusDays(last.date, DAYS);
        const f=snaps.filter(x=>x.date>=cutoff);
        if(f.length>=2) win=f;
      }
      const vals=win.map(x=>snapPEForSeries(x,sd)).filter(v=>v!=null&&isFinite(v));
      if(vals.length<2) return;
      const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
      const cur=vals[vals.length-1];
      if(!avg||!isFinite(avg)) return;
      out.push({ticker:tk, pe:cur, avg, devPct:(cur/avg-1)*100});
    });
  }
  const disc=out.filter(r=>r.devPct<0).sort((a,b)=>a.devPct-b.devPct).slice(0,nEach);
  const stretch=out.filter(r=>r.devPct>0).sort((a,b)=>b.devPct-a.devPct).slice(0,nEach);
  return {disc, stretch};
}

  if(st.due) items.push({k:'caldue',dot:'var(--navy)',lbl:'Refresh calendar — weekly run due',cnt:'Thu',panel:buildCalDuePanel(st)});
  const nStat=q.attente.length+q.horsEnum.length;
  if(nStat) items.push({k:'stat',dot:'#c2c8d4',lbl:'Statements pending — GAAP/IFRS to reconcile',cnt:String(nStat),
    panel:grp('Projections provisoires — awaiting GAAP/IFRS statements',
      'Earnings refreshed from the press release and transcript, but no reporting-standard financial statements recorded as used. Projections stand until they are.',
      q.attente,
      'Refresh comptable groupé — pour les titres ci-dessous, reprends les états financiers en référentiel (US GAAP ou IFRS), désormais disponibles, applique les retraitements Omnium, et renseigne dernierCall.etatsFinanciers {analyse, referentiel, source, date} :')
    +(q.horsEnum.length?grp('epsAdj.basis hors énumération',
      'The field carries a sentence instead of GAAP / non-GAAP, so the app treats it as absent.',
      q.horsEnum,
      "Pour les titres ci-dessous, ramène dernierCall.resultatsVsConsensus.epsAdj.basis à l'énumération GAAP / non-GAAP (ou null) et déplace la justification vers pointsCles :"):'')});
  // Boucle 13F ABANDONNEE (19/08/2026) - le champ ownership des fiches
  // reste de la donnee, mais plus aucune file ni operation dediee.

  // Trous de donnees sources : compteur dynamique (voir computeSourceGaps).
  const gaps=computeSourceGaps();
  if(gaps.total) items.push({k:'gaps',dot:'var(--navy)',lbl:'Source data gaps — transcripts & consensus',cnt:String(gaps.total),panel:buildSourceGapsPanel(gaps)});

  if(!items.length){ wrap.innerHTML=''; return; }
  const rows=items.map((it,i)=>{
    const open=_actRowOpen===it.k;
    return `<div onclick="toggleActionRow('${it.k}')" style="display:grid;grid-template-columns:14px 1fr 46px 14px;gap:10px;align-items:center;height:36px;${i?'border-top:1px solid #e9ebf7;':''}cursor:pointer;">
        <span style="width:7px;height:7px;border-radius:50%;background:${it.dot};"></span>
        <span style="font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:600;color:var(--navy);">${it.lbl}</span>
        <span style="text-align:right;font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;color:var(--navy);">${it.cnt}</span>
        <span style="color:#c2c8d4;font-size:11.5px;text-align:center;${open?'transform:rotate(90deg);':''}">›</span>
      </div>${open?`<div onclick="event.stopPropagation();" style="padding:6px 0 12px;border-top:1px solid #e9ebf7;">${it.panel}</div>`:''}`;
  }).join('');
  // Panneau au meme gabarit B1 que le calendrier et le P/E (20/08).
  wrap.innerHTML=`<div class="dashb-act">
    <div class="dashb-head" style="margin-bottom:4px;"><span class="card-title" style="margin-bottom:0;color:var(--teal-text);">Actions</span></div>
    ${rows}
  </div>`;
}

function renderPortfolio(){
  renderWeeklyAiBar();
  renderActionsBar();
  renderMarketCalendar();
  renderNewsBar();
  renderMarketActionBar();
  const list=document.getElementById('pf-list');
  const countEl=document.getElementById('pf-count');
  const esc=s=>(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(!list)return;list.innerHTML='';
  
  const items=Object.entries(state.tickers)
    .filter(([,d])=>d.data&&d.data.length>=2)
    .map(([tk,d])=>{
      try{
        const cours=d.cours||100;
        const{proj}=getProj(tk);
        const {CY}=yearsFor(tk);
        const LY=analysisLY(tk);
        const div=d.dividende||0;
        const epsCY=proj[CY]?.eps||0,eps27=proj[CY+1]?.eps||0,eps30=proj[LY]?.eps||0;
        const cagrEps=(epsCY>0&&eps30>0&&LY>CY)?((Math.pow(eps30/epsCY,1/(LY-CY)))-1)*100:0;
        const yieldPct=((cours>0&&div>0)?(div/cours)*100:0)+particulariteYieldPct(d);
        const totalReturn=cagrEps+yieldPct;
        const peFwd=(cours>0&&epsCY>0)?cours/epsCY:null;
        const pe27=(cours>0&&eps27>0)?cours/eps27:null;
        const score=calcScore(tk);
        const nextEvt=nextEventLabel(tk);
        const nextEvtDate=nextEventDate(tk);
        return{tk,d,cours,totalReturn,peFwd,pe27,score,nextEvt,nextEvtDate};
      }catch(e){return null;}
    }).filter(Boolean);

  const hdr=document.getElementById('pf-col-header');
  if(hdr) hdr.style.display = items.length ? 'flex' : 'none';

  if(!items.length){
    if(countEl)countEl.textContent='0 tickers';
    list.innerHTML='<div class="pf-empty">No tickers. database.json may be empty or not configured.</div>';
    pfLastFilteredItems=[];
    return;
  }

  const q=pfNormalize(pfNameFilter);
  const filtered=q?items.filter(({tk,d})=>pfNormalize(d.name||tk).startsWith(q)||pfNormalize(tk).startsWith(q)):items;

  if(countEl)countEl.textContent=q
    ? filtered.length+' ticker'+(filtered.length!==1?'s':'')+' (of '+items.length+')'
    : items.length+' ticker'+(items.length!==1?'s':'');

  const sorted=q
    ? filtered.slice().sort((a,b)=>(a.d.name||a.tk).localeCompare(b.d.name||b.tk,'fr',{sensitivity:'base'}))
    : pfSortItems(filtered);
  pfLastFilteredItems=sorted;

  if(!sorted.length){
    list.innerHTML='<div class="pf-empty">No ticker matches "'+esc(pfNameFilter)+'".</div>';
    return;
  }

  const maxScore=Math.max(...items.map(x=>x.score),0.1);
  sorted.forEach(({tk,d,cours,totalReturn,peFwd,pe27,score,nextEvt},idx)=>{
    const el=document.createElement('div');
    el.className='pf-item'+(tk===CT?' pf-active':'');
    el.onclick=()=>pfOpenTicker(tk,cours);
    el.innerHTML=`
      <div class="pf-row-top">
        <div class="pf-main">
         <div class="pf-name">${d.name||tk}</div>
        </div>
      </div>
      <div class="pf-metrics">
        <div class="pf-metric pf-metric-return"><div class="pf-mv">${totalReturn>=0?'+':''}${totalReturn.toFixed(1)}%</div></div>
        <div class="pf-metric pf-metric-pe"><div class="pf-mv">${peFwd?peFwd.toFixed(1)+'×':'—'}</div></div>
        <div class="pf-metric pf-metric-pe"><div class="pf-mv">${pe27?pe27.toFixed(1)+'×':'—'}</div></div>
        <div class="pf-metric pf-metric-event"><div class="pf-mv pf-mv-event">${nextEvt}</div></div>
      </div>
    `;
    list.appendChild(el);
  });
  pfUpdateSortHeaderUI();
}

const PRICE_TTL=60*60*1000;
function startPricePoll(){
  if(CT) fetchLivePrice(CT);
  setInterval(()=>{ if(CT) fetchLivePrice(CT); },PRICE_TTL);
}

// data/marketAction.json est reecrit par market_check.py en cours de
// journee (voir docstring du script) - sans ce polling, la banniere ne
// se met a jour qu'au chargement de la page, jamais en cours de
// consultation (bug remonte le 17/08/2026 : ARGENX/IBKR passes >=2% sans
// que la banniere apparaisse pour un onglet deja ouvert).
const MARKET_ACTION_TTL=5*60*1000;
async function pollMarketAction(){
  try{
    const r=await fetch('data/marketAction.json', NO_STORE);
    if(r.ok){ state.marketAction=await r.json(); renderMarketActionBar(); }
  }catch(e){}
}
function startMarketActionPoll(){
  return;   // significant moves supprimes (19/08/2026)
  setInterval(pollMarketAction, MARKET_ACTION_TTL);
}

document.addEventListener('DOMContentLoaded', async function(){
  const guestStatus=await checkGuestLink();
  if(guestStatus==='invalid'){
    showAccessScreen('This access link has expired. Contact Mathieu Chandelier to get a new one.');
    return;
  }
  if(guestStatus==='error'){
    showAccessScreen('Unable to verify access right now. Please try again shortly.');
    return;
  }
  if(guestStatus==='none'){
    await ensureUserIdentity();
  }
  state = await loadState();
  const keys = Object.keys(state.tickers);
  let lastView=null;
  try{ lastView=JSON.parse(localStorage.getItem(LAST_VIEW_KEY)||'null'); }catch(e){}
  if(keys.length > 0){
    CT = (lastView && lastView.ticker && state.tickers[lastView.ticker]) ? lastView.ticker : keys[0];
    try{loadTicker();}catch(e){}
  }
  refreshSelects();
  const wantAnalyse = lastView && lastView.tab==='analyse' && CT && state.tickers[CT];
  const wantOtherTab = lastView && ['valuerankings'].includes(lastView.tab) ? lastView.tab : null;
  const restoredTab = wantAnalyse ? 'analyse' : (wantOtherTab || 'portefeuille');
  try{ history.replaceState({omniumTab: restoredTab, omniumTicker: CT}, '', location.pathname+location.search); }catch(e){}
  if(wantAnalyse){
    showTab('analyse', null, true);
  } else if(wantOtherTab){
    showTab(wantOtherTab, null, true);
  } else {
    showTab('portefeuille', document.getElementById('tab-btn-pf'), true);
  }
  const gd=document.getElementById('gen-date');
  if(gd)gd.textContent=new Date().toLocaleDateString('fr-FR');
  setTimeout(startPricePoll,1500);
  startMarketActionPoll();
  calFetch().then(()=>{ try{renderActionsBar();renderMarketCalendar();}catch(e){} });
});
