<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Omnium — Modèle d'investissement</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000190">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Model">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&amp;family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
:root {
  --navy:#000190; --navy-dark:#00004a; --navy-light:#eeeffe;
  --teal:#2BD8C2; --teal-light:#e6faf8; --teal-text:#25CFB4; /* intermediaire entre les deux stops du logo (#1CBBA1 / #2EE3C6) */
  --teal-dark-text:#169886; /* turquoise de marque assombri (nuance B) */
  --gold:#FFD700; --gold-light:#fffce6;
  --bg:#ffffff; --surface:#fff; --border:#e6e6f0;
  --text:#0d0d1a; --muted:#64748b;
  --proj-bg:#f7f9ff;
  --ok:#10b981; --err:#ef4444; --gold-text:#92700a;
  --text-xs:11px; --text-sm:12px; --text-base:14px; --text-lg:16px; --text-2xl:28px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Quattrocento Sans',Georgia,serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;}
h1,h2,.tab,.kpi-value,.card-title,.step-title,.btn,.badge,.kpi-label,.adj-label,th{font-family:'Poppins',system-ui,sans-serif;}

header{background:linear-gradient(120deg, var(--navy) 0%, var(--navy-dark) 100%);color:#fff;padding:35px 34px 40px;display:flex;align-items:center;justify-content:space-between;}
.h-tagline{display:flex;align-items:center;gap:7px;margin-top:1px;margin-left:1px;}
.h-tagline span{font-size:27px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:1;font-family:'Poppins',sans-serif;}
.h-logo{height:79px;width:auto;display:block;}

.header-access-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:7px 14px;color:rgba(255,255,255,.85);font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:600;text-decoration:none;transition:background .12s,border-color .12s,color .12s;}
.header-access-btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.36);color:#fff;}
.header-access-btn svg{flex-shrink:0;}

.access-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(120deg, var(--navy) 0%, var(--navy-dark) 100%);}
.access-gate-card{max-width:360px;text-align:center;}
.access-gate-title{font-family:'Poppins',sans-serif;font-size:19px;font-weight:800;color:#fff;margin-bottom:10px;}
.access-gate-msg{font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.75);line-height:1.6;}

.tab-bar{background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 75%,var(--navy-dark) 100%);align-items:center;padding:11px 24px;}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 20px 8px 15px;cursor:pointer;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:22px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;box-shadow:0 1px 3px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.08);transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;}
.back-btn:hover{background:linear-gradient(160deg,#39e6d0,var(--teal) 65%);border-color:var(--teal);color:var(--navy);box-shadow:0 3px 10px rgba(43,216,194,.35),inset 0 1px 0 rgba(255,255,255,.5);transform:translateY(-1px);}
.back-btn:active{transform:scale(.96);}
.back-btn-arrow{font-size:15px;display:inline-block;transition:transform .15s;}
.back-btn:hover .back-btn-arrow{transform:translateX(-2px);}
.panel{display:none;}.panel.active{display:block;}

.container{max-width:1160px;margin:0 auto;padding:22px 29px;}

.card{background:var(--surface);border-radius:12px;box-shadow:0 2px 14px rgba(0,1,144,.06),0 1px 3px rgba(0,0,0,.04);padding:20px 24px;margin-bottom:18px;}
#analyse-tbl-card{background:transparent;box-shadow:none;padding:0;}
#return-block,#context-card{background:transparent;box-shadow:none;padding:0;}
.card-title{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);margin-bottom:14px;}
.card-title b{color:var(--navy);}

.pf-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.10em;font-family:'Poppins',sans-serif;}
.pf-count{font-size:11px;color:var(--muted);font-family:'Quattrocento Sans',serif;}
.pf-list{display:flex;flex-direction:column;gap:0;background:transparent;}
.pf-item{display:flex;align-items:center;gap:22px;background:transparent;padding:11px 22px;cursor:pointer;transition:background .12s;border-left:4px solid transparent;border-bottom:1px solid rgba(0,1,144,.16);}
.pf-item:last-child{border-bottom:none;}
.pf-metric-return .pf-mv,.pf-metric-pe .pf-mv{color:var(--teal-dark-text);font-weight:600;}
.pf-item:hover{background:rgba(43,216,194,.055);}
.pf-main{flex:1.6;min-width:0;}
.pf-name{font-size:14.5px;font-weight:600;color:var(--navy);font-family:'Poppins',sans-serif;}
.pf-sub{font-size:10.5px;color:var(--muted);margin-top:2px;font-family:'Quattrocento Sans',serif;}
.pf-metrics{display:flex;gap:28px;flex-shrink:0;}
.pf-metric{text-align:center;min-width:60px;}
.pf-ml{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-family:'Poppins',sans-serif;margin-bottom:5px;white-space:nowrap;}
.pf-mv{font-size:13.5px;font-weight:600;color:var(--muted);font-family:'Poppins',sans-serif;line-height:1;}
.pf-mv-event{font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.pf-col-header{display:flex;align-items:center;gap:22px;padding:0 22px 8px;margin-top:4px;}
.pf-col-name-spacer{flex:1 1 auto;max-width:360px;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;font-size:11px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.07em;}
.pf-name-sort-lbl{cursor:pointer;user-select:none;transition:color .12s;white-space:nowrap;flex-shrink:0;}
.pf-name-sort-lbl:hover{color:var(--teal-text);}
.pf-name-filter{flex:0 0 auto;width:118px;min-width:0;border:none;border-bottom:1.5px solid rgba(0,1,144,.18);background:transparent;color:var(--navy);font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;text-transform:none;letter-spacing:normal;line-height:1;padding:0 1px 1px;margin:0;height:14px;cursor:text;transition:border-color .12s;}
.pf-name-filter::placeholder{color:var(--muted);font-weight:500;}
.pf-name-filter:focus{outline:none;border-bottom-color:var(--teal-text);}
.pf-col-labels{display:flex;gap:28px;flex-shrink:0;}
.pf-col-lbl{min-width:60px;text-align:center;font-size:11px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;}
.pf-col-lbl.pf-col-sortable{cursor:pointer;user-select:none;position:relative;display:block;transition:color .12s;}
.pf-col-lbl.pf-col-sortable:hover{color:var(--teal-text);}
.pf-sort-arrow{font-size:8px;opacity:.75;display:inline-block;min-width:7px;position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:2px;}
.pf-metric-event{text-align:left;}
.pf-col-lbl.pf-metric-event{text-align:left;padding-left:2px;}
.pf-col-lbl.pf-metric-event .pf-sort-arrow{position:static;transform:none;margin-left:3px;}
.pf-score{text-align:center;min-width:52px;padding:7px 12px;background:rgba(0,1,144,.04);border-radius:9px;flex-shrink:0;}
.pf-score-val{font-size:20px;font-weight:900;color:var(--navy);font-family:'Poppins',sans-serif;line-height:1;}
.pf-score-lbl{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:'Poppins',sans-serif;margin-top:3px;}
.pf-empty{text-align:center;padding:48px;color:var(--muted);font-family:'Quattrocento Sans',serif;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:var(--surface);border-radius:12px;padding:16px 18px;box-shadow:0 2px 14px rgba(0,1,144,.06);border-left:3px solid var(--teal);}
.kpi.gold{border-left-color:var(--gold);}
.kpi.navy{border-left-color:var(--navy);}
.kpi.red{border-left-color:var(--err);}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;font-weight:700;}
.kpi-value{font-size:var(--text-2xl);font-weight:800;color:var(--navy);line-height:1.1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;font-family:'Quattrocento Sans',serif;}

table{width:100%;border-collapse:collapse;font-size:var(--text-base);}
thead th{background:var(--navy);color:#fff;text-align:right;padding:10px 14px;font-weight:600;font-size:12px;letter-spacing:.02em;white-space:nowrap;width:7%;}
thead th:first-child{width:16%;}
thead th:first-child{text-align:left;}
thead th.proj-head{background:var(--navy-light);color:var(--navy);}
tbody td{padding:9px 14px;text-align:right;white-space:nowrap;}
tbody td:first-child{text-align:left;font-weight:500;color:var(--navy);font-family:'Poppins',sans-serif;font-size:11px;}
tbody td.unit{text-align:left;font-size:10px;color:var(--muted);font-style:italic;font-weight:400;font-family:'Quattrocento Sans',serif;}
tbody tr:hover td{background:rgba(43,216,194,.03);}
tbody tr.hist-last td{background:rgba(0,1,144,.03);}
tbody tr.proj-row td{background:var(--proj-bg);color:var(--muted);font-style:italic;}
tbody tr.proj-row td:first-child{font-style:normal;color:var(--navy);opacity:.75;}
tbody td.proj-first{border-left:2px solid var(--teal);}
tbody tr.row-emph td:not(:first-child){font-weight:700;}
td input[type=number]{width:100%;border:1px solid transparent;background:transparent;text-align:right;font-size:12px;padding:2px 0;color:inherit;border-radius:4px;font-family:'Quattrocento Sans',serif;transition:border-color .1s,background .1s;-moz-appearance:textfield;}
td input[type=number]::-webkit-outer-spin-button,td input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
td input[type=number]:focus{border-color:var(--teal);background:var(--teal-light);outline:none;}
td input[type=number]:hover{border-color:var(--border);}

.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.02em;}
.badge-up{background:#dcfce7;color:var(--ok);}
.badge-dn{background:#fee2e2;color:var(--err);}
.badge-nu{background:#f1f5f9;color:#475569;}
.badge-tl{background:var(--teal-light);color:var(--teal-text);}
.badge-gd{background:var(--gold-light);color:var(--gold-text);}
.badge-nv{background:var(--navy-light);color:var(--navy);}

.alert{padding:9px 13px;border-radius:8px;font-size:11px;margin-bottom:14px;border-left:3px solid;line-height:1.5;}
.alert-warn{background:var(--gold-light);border-color:var(--gold);color:var(--gold-text);}
.alert-info{background:var(--teal-light);border-color:var(--teal);color:var(--teal-text);}

.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;}
.btn{padding:9px 20px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:transform .1s,box-shadow .1s,opacity .15s;letter-spacing:.02em;}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.1);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-light{background:var(--border);color:var(--text);}
.btn-danger{background:#fee2e2;color:#991b1b;}

.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:var(--navy-light);border-radius:10px;margin-bottom:18px;border:1px solid rgba(0,1,144,.08);}
.ctrl{display:flex;align-items:center;gap:8px;}
.ctrl label{font-size:11px;font-weight:700;color:var(--navy);white-space:nowrap;font-family:'Poppins',sans-serif;}
.ctrl input[type=number]{width:90px;border:1px solid rgba(0,1,144,.15);border-radius:6px;padding:5px 8px;font-size:12px;background:#fff;}

.analyse-header{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.analyse-id{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.analyse-name{font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.01em;line-height:1.1;margin-left:2px;}
.analyse-price-wrap{display:flex;align-items:baseline;gap:8px;}
.analyse-price{display:flex;align-items:baseline;gap:0;}
.analyse-price input#cours{border:none;border-bottom:1.5px solid transparent;background:transparent;font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:var(--navy);padding:0 1px 1px 0;width:60px;text-align:right;transition:border-color .15s;-moz-appearance:textfield;}
.analyse-price input#cours::-webkit-outer-spin-button,.analyse-price input#cours::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.analyse-price input#cours:hover{border-bottom-color:rgba(0,1,144,.18);}
.analyse-price input#cours:focus{outline:none;border-bottom-color:var(--teal);}
.analyse-price-cur{font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:var(--navy);}

select,input[type=text],input[type=date],textarea{border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12px;background:#fff;color:var(--text);font-family:'Quattrocento Sans',serif;transition:border-color .1s,box-shadow .1s;}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(43,216,194,.15);}
textarea{resize:vertical;width:100%;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-field label{font-size:11px;font-weight:700;color:var(--navy);display:block;margin-bottom:4px;font-family:'Poppins',sans-serif;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.sep{height:1px;background:var(--border);margin:16px 0;}

.step-box{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;}
.step-num{background:var(--navy);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px;}
.step-content{flex:1;}
.step-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;}

.adj-eps-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0;}
.adj-cell{text-align:center;}
.adj-label{font-size:10px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;}
.adj-cell input{width:100%;text-align:center;border:1px solid var(--border);border-radius:6px;padding:6px 4px;font-size:13px;font-weight:700;font-family:'Quattrocento Sans',serif;}
.metrics-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px;}
.metrics-tbl th{text-align:right;padding:5px 8px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.metrics-tbl th:first-child{text-align:left;}
.metrics-tbl td{padding:4px 6px;text-align:center;}
.metrics-tbl td:first-child{text-align:left;font-weight:700;color:var(--navy);font-size:11px;white-space:nowrap;}
.metrics-tbl td input{width:72px;text-align:center;border:1px solid var(--border);border-radius:5px;padding:4px;font-size:11px;font-family:'Quattrocento Sans',serif;}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

.annual-box{margin-top:14px;padding:12px 14px;background:var(--gold-light);border-radius:8px;border:1px solid rgba(255,215,0,.4);}
.annual-box label.main-lbl{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;}

@keyframes omn-spin{to{transform:rotate(360deg);}}
.omn-ring-active{stroke-dasharray:30 70 !important;transform-origin:center;transform-box:fill-box;animation:omn-spin 1s linear infinite;}
.btn-omn-wrap{display:inline-flex;flex-direction:column;gap:5px;}
.btn-omn-wrap.right{align-items:flex-end;}
.btn-omn-status{font-size:10px;font-weight:700;letter-spacing:.06em;height:13px;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none;}
.btn-omn-body{display:flex;align-items:center;border:none;cursor:pointer;padding:0;transition:background .15s,transform .12s,opacity .15s;}
.btn-omn-body:hover:not(:disabled){transform:translateY(-1px);}
.btn-omn-body:disabled{opacity:.6;cursor:not-allowed;transform:none !important;}
.btn-navy{background:linear-gradient(160deg,#0006d8 0%,#000190 55%,#00017e 100%);border-radius:10px;border:1px solid rgba(255,255,255,.13);box-shadow:0 3px 10px rgba(0,1,144,.35),inset 0 1px 0 rgba(255,255,255,.09);}
.btn-navy:hover:not(:disabled){background:linear-gradient(160deg,#0008f0 0%,#0001b0 55%,#000190 100%);}
.btn-teal{background:#2BD8C2;border-radius:11px;}
.btn-teal:hover:not(:disabled){background:#22c9b4;}
.omn-logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.omn-ring-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.omn-vsep-white{width:1px;background:rgba(255,255,255,.18);flex-shrink:0;align-self:stretch;}
.omn-vsep-navy{width:1px;background:rgba(0,1,144,.2);flex-shrink:0;align-self:stretch;}

.coll-hd{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:10px;user-select:none;}
.coll-hd span{font-size:11px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.04em;}
.coll-chevron{font-size:10px;color:var(--muted);transition:transform .2s;}
.coll-hd.open .coll-chevron{transform:rotate(180deg);}

.proj-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;font-family:'Poppins',sans-serif;padding:3px 10px;border-radius:10px;background:var(--gold-light);color:var(--gold-text);border:1px solid rgba(255,215,0,.4);}
.proj-pill.cagr{background:var(--teal-light);color:var(--teal-text);border-color:rgba(43,216,194,.4);}

.fy-pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;font-family:'Poppins',sans-serif;padding:4px 11px;border-radius:10px;background:var(--navy-light);color:var(--navy);border:1px solid rgba(0,1,144,.16);letter-spacing:.02em;}
.fy-pill .fy-dot{width:6px;height:6px;border-radius:50%;background:var(--navy);opacity:.55;flex-shrink:0;}
.fy-month-tag{display:block;font-size:9px;font-weight:600;color:var(--teal-text);opacity:.9;letter-spacing:.03em;margin-top:1px;}
thead th .fy-month-tag{color:#8be9dc;}

.news-bar-wrap{display:flex;flex-direction:column;gap:8px;margin:20px 0;}
.news-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:#f1f4ff;border-radius:14px;gap:12px;}
.news-bar-text{font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:600;color:var(--navy);cursor:pointer;flex:1;min-width:0;}
.news-bar-text b{font-weight:800;}
.news-bar-close{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:var(--navy);opacity:.55;transition:opacity .12s,background .12s;padding:0;}
.news-bar-close:hover{opacity:1;background:rgba(0,1,144,.08);}
.market-action-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:#e8f9ee;border-radius:14px;gap:12px;margin:0 0 8px;}

<script>
(function(){
  var REF_WIDTH = 1440;
  var CAP_WIDTH = 1920;
  var MOBILE_BREAKPOINT = 760;
  var MIN_ZOOM = 0.80;
  var MAX_ZOOM = CAP_WIDTH / REF_WIDTH;
  function applyAppZoom(){
    var w = window.innerWidth;
    if(w <= MOBILE_BREAKPOINT){
      document.documentElement.style.zoom = 1;
      return;
    }
    var z = w / REF_WIDTH;
    if(z < MIN_ZOOM) z = MIN_ZOOM;
    if(z > MAX_ZOOM) z = MAX_ZOOM;
    document.documentElement.style.zoom = z;
  }
  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t=setTimeout(applyAppZoom,120); });
  applyAppZoom();
  window.__applyAppZoom = applyAppZoom;
})();
</script>

function yearsFor(ticker){

  const cy = lastHist + 1;

function tickerCur(ticker){

  if(sym.endsWith('.MI')||sym.endsWith('.PA')||sym.endsWith('.DE')||
     sym.endsWith('.AS')||sym.endsWith('.MC')||sym.endsWith('.BR')||

if(!CanvasRenderingContext2D.prototype.roundRect){

    this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x+y,r);
    this.arcTo(x,y,x+r,y,r);this.closePath();return this;
  };
}

function fingerprint(str){
  let h=5381;
  for(let i=0;i<str.length;i++){h=((h*33)^str.charCodeAt(i))>>>0;}
  return h.toString(16).padStart(8,'0');
}

// Endpoint PHP dedie (a deployer sur model.omnium-capital.com, meme serveur
// que price.php) pour synchroniser l'etat "news ignorees" entre TOUS les
// appareils - contrairement a l'ancien mecanisme localStorage, propre a
// chaque navigateur/appareil. GET renvoie la liste complete ; POST ajoute
// une date. Stockage cote serveur volontairement simple (fichier JSON plat),
// coherent avec le reste de l'infra (pas de base de donnees dediee pour
// cette app). Absence gracieuse : si l'endpoint n'est pas encore deploye ou
// injoignable, l'app degrade silencieusement vers "rien n'est jamais
// ignore" plutot que de planter.
const DISMISS_ENDPOINT='https://model.omnium-capital.com/dismiss.php';

// ══════════════════════════════════════════════════════════════
// ACCES INVITE — lien a duree limitee genere depuis admin.html (bouton
// "Accès invité" du header). Le token (horodatage d'expiration + signature
// HMAC) est verifie cote serveur (verify.php, cle secrete jamais exposee
// au navigateur) : impossible de le forger ou d'en prolonger la duree
// depuis le client. Un lien recu via ?access=... est memorise en
// sessionStorage (efface a la fermeture de l'onglet, jamais persistant) et
// revalide a CHAQUE chargement de page - un lien expire entre deux visites
// bloque donc bien l'acces au rechargement suivant, pas seulement au
// moment de la premiere ouverture.
// ══════════════════════════════════════════════════════════════
const ACCESS_VERIFY_ENDPOINT='https://model.omnium-capital.com/verify.php';
const ACCESS_TOKEN_KEY='omniumAccessToken';

async function ensureAccessGranted(){
  const params=new URLSearchParams(location.search);
  const urlToken=params.get('access');
  if(urlToken){
    try{ sessionStorage.setItem(ACCESS_TOKEN_KEY, urlToken); }catch(e){}
    try{ history.replaceState({}, '', location.pathname); }catch(e){}
  }
  let token=urlToken;
  if(!token){ try{ token=sessionStorage.getItem(ACCESS_TOKEN_KEY); }catch(e){ token=null; } }
  if(!token){
    showAccessScreen('Cette application nécessite un lien d’invitation. Contactez Mathieu Chandelier pour y accéder.');
    return false;
  }
  try{
    const r=await fetch(ACCESS_VERIFY_ENDPOINT+'?token='+encodeURIComponent(token),{signal:AbortSignal.timeout(8000)});
    const j=await r.json();
    if(j && j.valid)return true;
    showAccessScreen('Ce lien d’accès a expiré. Contactez Mathieu Chandelier pour en obtenir un nouveau.');
    return false;
  }catch(e){
    showAccessScreen('Impossible de vérifier l’accès pour le moment. Merci de réessayer dans un instant.');
    return false;
  }
}

function showAccessScreen(msg){
  document.body.innerHTML=`<div class="access-gate"><div class="access-gate-card"><div class="access-gate-title">Accès restreint</div><div class="access-gate-msg">${msg}</div></div></div>`;
}

// ══════════════════════════════════════════════════════════════
// IDENTITE UTILISATEUR (leger, sans mot de passe) — permet de scoper la
// dismissal des news PAR PERSONNE plutot que globalement pour tout le
// monde qui charge la page. Demande le prenom UNE SEULE FOIS par appareil
// (stocke ensuite en localStorage, jamais redemande sur ce meme appareil).
// NORMALISATION : le nom saisi est reduit a un identifiant stable
// (minuscules, sans accents, sans espaces/ponctuation) - "Mathieu" et
// "mathieu " donnent le meme identifiant "mathieu", donc taper le meme
// prenom sur desktop et mobile pointe vers le MEME compte cote serveur,
// sans jamais avoir besoin de mot de passe pour le prouver. Aucune
// verification d'unicite/collision n'est faite (deux personnes au meme
// prenom partageraient le meme compte) - limite assumee pour cette
// premiere version "sans mot de passe".
// ══════════════════════════════════════════════════════════════
const USER_ID_KEY='omniumUserId';

function slugifyUserName(name){
  return String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'').trim();
}
function getUserId(){
  try{ return localStorage.getItem(USER_ID_KEY)||''; }catch(e){ return ''; }
}
function setUserId(id){
  try{ localStorage.setItem(USER_ID_KEY, id); }catch(e){}
}

// Bloque le demarrage de l'app UNIQUEMENT si aucun identifiant n'est deja
// stocke sur cet appareil (premiere visite) - affiche un mini-formulaire
// plein ecran, resout des que le prenom est saisi et valide.
function ensureUserIdentity(){
  return new Promise(resolve=>{
    const existing=getUserId();
    if(existing){ resolve(existing); return; }
    const overlay=document.createElement('div');
    overlay.id='uid-overlay';
    overlay.innerHTML=`
      <div class="uid-modal">
        <div class="uid-modal-title">Qui êtes-vous ?</div>
        <div class="uid-modal-sub">Pour synchroniser vos préférences (news déjà vues) entre vos appareils. Pas de mot de passe à ce stade.</div>
        <input type="text" id="uid-input" class="uid-modal-input" placeholder="Votre prénom" autocomplete="off">
        <button class="btn btn-primary uid-modal-btn" id="uid-submit-btn" type="button">Continuer</button>
      </div>`;
    document.body.appendChild(overlay);
    const input=overlay.querySelector('#uid-input');
    const btn=overlay.querySelector('#uid-submit-btn');
    const submit=()=>{
      const slug=slugifyUserName(input.value);
      if(!slug){ input.focus(); return; }
      setUserId(slug);
      overlay.remove();
      resolve(slug);
    };
    btn.addEventListener('click',submit);
    input.addEventListener('keydown',e=>{ if(e.key==='Enter')submit(); });
    setTimeout(()=>input.focus(),50);
  });
}

// no-store sur tous les fetch de data/*.json : ces fichiers changent
// plusieurs fois par jour (news, market action, refresh de titres) et
// GitHub Pages les sert avec un cache-control de 10 min - un rechargement
// force cote navigateur (Cmd/Ctrl+Maj+R) ne garantit PAS de contourner le
// cache HTTP pour des fetch() declenches en JS (contrairement au
// chargement du document lui-meme), ce qui pouvait laisser l'app afficher
// des donnees perimees plusieurs minutes apres une mise a jour reelle -
// correctif du 14/08/2026.
const NO_STORE = { cache: 'no-store' };

async function loadState() {
  try {
    const manRes = await fetch('data/manifest.json', NO_STORE);
    if (!manRes.ok) throw new Error(`data/manifest.json introuvable: ${manRes.status}`);
    const manifest = await manRes.json();
    const codes = manifest.tickers || [];

    const [results, nextEvents, newsDigest, newsAll, dismissedNewsDates, marketAction, priceHistory] = await Promise.all([
      Promise.all(codes.map(async code => {
        try {
          const r = await fetch(`data/${code}.json`, NO_STORE);
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const obj = await r.json();
          return [code, obj];
        } catch (e) {
          console.error(`loadState: data/${code}.json illisible -`, e);
          showToast(`⚠ Titre ${code} illisible (data/${code}.json) - ignore.`, 6000);
          return null;
        }
      })),
      fetch('data/nextEvents.json', NO_STORE).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      fetch('data/newsDigest.json', NO_STORE).then(r => r.ok ? r.json() : []).catch(() => []),
      fetch('data/newsAll.json', NO_STORE).then(r => r.ok ? r.json() : []).catch(() => []),
      fetchDismissedNewsDates(),
      fetch('data/marketAction.json', NO_STORE).then(r => r.ok ? r.json() : null).catch(() => null),
      // Historique hebdo de prix/EPS pour "Value Rankings" et la section
      // "Historique de valorisation" - absence graciable (feature encore
      // recente, demarrage propre sans backfill) : null tant que le
      // collecteur n'a pas tourne au moins une fois, l'UI degrade
      // proprement plutot que de planter (voir normalizeState).
      fetch('data/priceHistory.json', NO_STORE).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);

    const tickers = {};
    results.forEach(pair => { if (pair) tickers[pair[0]] = pair[1]; });
    const jsonData = { tickers, nextEvents: nextEvents || {}, newsDigest: newsDigest || [], newsAll: newsAll || [], dismissedNewsDates, marketAction: marketAction || null, priceHistory: priceHistory || null };

    const fp = fingerprint(JSON.stringify({tickers, nextEvents, newsDigest, newsAll}));
    const elFp = document.getElementById('data-fingerprint');
    if (elFp) elFp.textContent = fp;

    return normalizeState(jsonData);
  } catch (e) {
    console.error('loadState:', e);
    showToast('⚠ Impossible de charger data/manifest.json. Verifiez sa presence.', 8000);
    return normalizeState({tickers:{}});
  }
}

function showToast(msg,dur=3000){
  let t=document.getElementById('omnium-toast');
  if(!t){t=document.createElement('div');t.id='omnium-toast';
    t.style.cssText='position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;font-family:\'Poppins\',sans-serif;font-size:12px;font-weight:600;padding:10px 18px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._to);t._to=setTimeout(()=>t.style.opacity='0',dur);
}

const epsR=r=>r.shares>0?r.net/r.shares:0;
const margeR=r=>r.ca>0?r.ebit/r.ca:0;
const dnebtR=r=>r.ebit>0?r.nd/r.ebit:null;
const f2=v=>v!=null?(+v).toFixed(2):'—';
const fpct=v=>v!=null?(v*100).toFixed(1)+'%':'—';
const fX=v=>v!=null?(+v).toFixed(1)+'×':'—';
const fM=v=>v!=null?Math.round(+v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '):'—';

const PRICE_CACHE_PREFIX='omnium_price_v2_';

function cagr(arr){
  let i0=-1,i1=-1;
  arr.forEach((v,i)=>{if(v>0){if(i0<0)i0=i;i1=i;}});
  if(i0<0||i1<=i0)return 0;
  return Math.pow(arr[i1]/arr[i0],1/(i1-i0))-1;
}

function particulariteYieldPct(d){
  return (d.particularites||[]).filter(p=>p.valuePct!==null&&p.valuePct!==undefined&&p.valuePct!=='').reduce((s,p)=>s+(+p.valuePct||0),0);
}

function getProj(ticker){
  const d=state.tickers[ticker];
  if(!d || !d.data || d.data.length === 0) return {proj:{}, date:null, evtName:null};
  const ca=d.data.map(r=>r.ca),eb=d.data.map(r=>r.ebit),
        nt=d.data.map(r=>r.net),nd=d.data.map(r=>r.nd),sh=d.data.map(r=>r.shares);
  const ly=d.data[d.data.length-1].year;
  const PY=[ly+1,ly+2,ly+3,ly+4,ly+5];
  const lastCA=ca[ca.length-1],lastEB=eb[eb.length-1],
        lastNT=nt[nt.length-1],lastND=nd[nd.length-1],lastSH=sh[sh.length-1];
  const st=a=>{const s=cagr(a.slice(-3));return s||cagr(a);};
  const cCA_st=st(ca),cEB_st=st(eb),cNT_st=st(nt); 
  const cCA_lt=cagr(ca),cEB_lt=cagr(eb),cNT_lt=cagr(nt),cND_lt=cagr(nd);
  const grow=(last,h,rst,rlt)=>h<=2?last*Math.pow(1+rst,h):last*Math.pow(1+rst,2)*Math.pow(1+rlt,h-2);
  const cSH = sh.filter(v=>v>0).length>=2 ? cagr(sh) : 0;
  const base={};
  PY.forEach(y=>{
    const h=y-ly;
    const projShares=Math.max(1, lastSH*Math.pow(1+cSH,h));
    const projNet=grow(lastNT,h,cNT_st,cNT_lt);
    base[y]={
      eps:projNet/projShares,
      ca:grow(lastCA,h,cCA_st,cCA_lt),
      ebit:grow(lastEB,h,cEB_st,cEB_lt),
      net:projNet,
      nd:grow(lastND,h,cND_lt,cND_lt),
      shares:projShares
    };
  });
  const hyp=d.hypothese;
  const hasAdj=hyp&&['adjEPS','adjCA','adjEBIT','adjNet','adjND','adjShares'].some(k=>hyp[k]&&Object.values(hyp[k]).some(v=>v!=null&&v!==''));
  if(!hasAdj)return{proj:base,date:null,evtName:null};
  const out={};
  PY.forEach(y=>{ out[y]={...base[y]}; });
  const has=(o,y)=>o&&o[y]!=null&&o[y]!=='';
  PY.forEach(y=>{
    if(has(hyp.adjCA,y))     out[y].ca    =+hyp.adjCA[y];
    if(has(hyp.adjEBIT,y))   out[y].ebit  =+hyp.adjEBIT[y];
    if(has(hyp.adjNet,y))    out[y].net   =+hyp.adjNet[y];
    if(has(hyp.adjND,y))     out[y].nd    =+hyp.adjND[y];
    if(has(hyp.adjShares,y)) out[y].shares=+hyp.adjShares[y];
    if(has(hyp.adjEPS,y))    out[y].eps   =+hyp.adjEPS[y];
    else if((has(hyp.adjNet,y)||has(hyp.adjShares,y))&&out[y].shares>0)
      out[y].eps=out[y].net/out[y].shares;
  });
  return{proj:out,date:hyp.date,evtName:hyp.source||null};
}

function checkEpsCoherence(d){
  const hyp=d&&d.hypothese;
  if(!hyp)return [];
  const bad=[];
  Object.keys(hyp.adjEPS||{}).forEach(y=>{
    const eps=+hyp.adjEPS[y],net=+(hyp.adjNet?.[y]),sh=+(hyp.adjShares?.[y]);
    if(!eps||!net||!sh)return;
    const implied=net/sh;
    if(Math.abs(eps-implied)/Math.abs(implied)>0.02)
      bad.push({y,eps,implied});
  });
  return bad;
}

const PRICE_PROXY_URL='https://model.omnium-capital.com/price.php';
const _fetchInFlight={}; 

function _priceIsPlausible(p,ref,liveConfirmed){
  if(!Number.isFinite(p)||p<=0)return false;
  if(liveConfirmed && ref>0 && (p>ref*4 || p<ref/4))return false;
  return true;
}

async function _fetchPrice(sym){
  try{
    const r=await fetch(PRICE_PROXY_URL+'?ticker='+encodeURIComponent(sym),{signal:AbortSignal.timeout(12000)});
    if(!r.ok)return null;
    const j=await r.json();
    if(!j||!j.price)return null;
    return{price:+j.price, div:(j.div!=null?+j.div:null), source:j.source||null};
  }catch(e){ return null; }
}

async function autoFetchPrice(ticker,force){
  const d=state.tickers[ticker];
  if(!d||!(d.yahooSymbol||'').trim())return;
  updatePriceDot(d._priceUpdatedAt||d._lastFetchAttemptAt||null,true);
  if(!force && d._priceCache && (Date.now()-d._priceCache.ts)<PRICE_TTL){
    updatePriceDot(d._priceUpdatedAt||d._lastFetchAttemptAt||null,false);
    return;
  }
  if(_fetchInFlight[ticker])return;
  _fetchInFlight[ticker]=true;
  const sym=(d.yahooSymbol||'').trim();
  const ref=+d.cours||0;
  const liveConfirmed=!!d._liveConfirmed;
  let finalPrice=null, finalDiv=null, source='';
  try{
    const r=await _fetchPrice(sym);
    if(r && _priceIsPlausible(r.price,ref,liveConfirmed)){
      finalPrice=r.price; finalDiv=r.div; source=r.source||'price.php';
    }
  }catch(e){}
  d._lastFetchAttemptAt=Date.now();
  if(finalPrice!==null){
    d.cours=+finalPrice.toFixed(2);
    d._liveConfirmed=true;
    d._priceCache={price:d.cours,ts:Date.now()};
    d._priceUpdatedAt=Date.now();
    d._priceSource=source;
    if(finalDiv!==null && finalDiv>=0){
      d.dividende=+(+finalDiv).toFixed(4);
    }
    updatePriceDot(d._priceUpdatedAt,false);
    refreshPriceOnly(ticker);
    renderPortfolio();
  } else {
    updatePriceDot(d._priceUpdatedAt||d._lastFetchAttemptAt,true);
  }
  _fetchInFlight[ticker]=false;
}

function scrollAnalyseTblToDefault(histCount){
  const headRow=document.getElementById('analyse-head');
  const table=document.getElementById('analyse-tbl');
  if(!headRow||!table)return;
  const wrap=table.parentElement;
  if(!wrap)return;
  const targetIdx=Math.max(0,histCount-2);
  const dataThs=Array.from(headRow.children).slice(1);
  const targetTh=dataThs[targetIdx];
  const firstTh=headRow.children[0];
  if(!targetTh||!firstTh)return;
  requestAnimationFrame(()=>{
    try{
      const stickyW=firstTh.getBoundingClientRect().width;
      wrap.scrollLeft=Math.max(0,targetTh.offsetLeft-stickyW);
    }catch(e){}
  });
}

function buildQuarterlyEPS(qe, cours, epsCY, epsNY, CY, cur, ndCY, shCY, ndNY, shNY){
  if(!qe || !Array.isArray(qe.CY) || !Array.isArray(qe.NY) || !qe.CY.length || !qe.NY.length) return null;
  const esc=s=>(s||'').toString().replace(/</g,'&lt;');
  const chip=(p,forceActual)=>`<div class="qs-chip ${(forceActual||p.actual)?'actual':'estim'}"><div class="chip-q">${esc(p.label)}</div><div class="chip-v">${(+p.eps).toFixed(2)}</div></div>`;
  const chipsRow=(arr,forceActual)=>`<div class="qs-chips-row">${arr.map(p=>chip(p,forceActual)).join('')}</div>`;
  const colBlock=(arr,annual,note,opts={})=>{
    const sum=arr.reduce((a,p)=>a+(+p.eps||0),0);
    let sumHtml='', noteHtml='';
    if(!opts.hideSum){
      if(opts.hideDelta){
        sumHtml=`<div class="qs-sum">Σ ${sum.toFixed(2)}${cur||'$'}</div>`;
      }else{
        const delta=(annual>0)?((sum-annual)/annual*100):null;
        const material=delta!=null&&Math.abs(delta)>=3;
        const deltaTxt=delta!=null?` (${delta>=0?'+':''}${delta.toFixed(1)}%)`:'';
        sumHtml=`<div class="qs-sum${material?' ecart':''}">Σ ${sum.toFixed(2)}${cur||'$'}${deltaTxt}</div>`;
      }
    }
    return `<div class="qs-qtr-block">${chipsRow(arr,opts.forceActual)}${opts.legend?`<div class="qtr-legend-row"><span class="qtr-legend"><span><span class="leg-dot" style="background:var(--navy);"></span>Publié</span><span><span class="leg-dot" style="background:#fff;border:1.5px dashed var(--border);"></span>Estimé</span></span></div>`:''}${sumHtml}${noteHtml}</div>`;
  };
  const pyBlock=(Array.isArray(qe.PY)&&qe.PY.length)?{
    year: CY-1,
    annualEps: qe.PY.reduce((a,p)=>a+(+p.eps||0),0),
    html: colBlock(qe.PY, null, null, {forceActual:true, hideSum:true})
  }:null;
  const historiqueBlocks=(Array.isArray(qe.historique)?qe.historique:[])
    .filter(h=>h && Array.isArray(h.periods) && h.periods.length)
    .map(h=>({
      year: h.year,
      html: colBlock(h.periods, null, null, {forceActual:true})
    }));
  const peCY=(cours>0&&epsCY>0)?(cours/epsCY):null;
  const peNY=(cours>0&&epsNY>0)?(cours/epsNY):null;
  const peFwd=(cours>0&&qe.epsForward12m>0)?(cours/qe.epsForward12m):null;
  const exCashPrice=(nd,sh)=>{
    if(nd==null||!(sh>0))return null;
    const p=cours+(nd/sh);
    return p>0?p:null;
  };
  const priceExCY=exCashPrice(ndCY,shCY);
  const priceExNY=exCashPrice(ndNY,shNY);
  const peExCY=(priceExCY!=null&&epsCY>0)?(priceExCY/epsCY):null;
  const peExFwd=(priceExCY!=null&&qe.epsForward12m>0)?(priceExCY/qe.epsForward12m):null;
  const peExNY=(priceExNY!=null&&epsNY>0)?(priceExNY/epsNY):null;
  const hasExCash=peExCY!=null||peExFwd!=null||peExNY!=null;
  const exCell=v=>hasExCash?`<div class="pe-exval">${v!=null?v.toFixed(1)+'×':'—'}</div>`:'';
  const peStack=`<div class="pe-stack">
      ${hasExCash?`<div></div><div></div><div class="pe-exhead">P/E ex-cash</div>`:''}
      <div class="pe-lbl">P/E ${CY}</div><div class="pe-val">${peCY?peCY.toFixed(1)+'×':'—'}</div>${exCell(peExCY)}
      <div class="pe-lbl">P/E 1Y FWD${qe.forwardPeriodLabel?` <span class="pe-sub">(${esc(qe.forwardPeriodLabel)})</span>`:''}</div><div class="pe-val">${peFwd?peFwd.toFixed(1)+'×':'—'}</div>${exCell(peExFwd)}
      <div class="pe-lbl">P/E ${CY+1}</div><div class="pe-val">${peNY?peNY.toFixed(1)+'×':'—'}</div>${exCell(peExNY)}
    </div>`;
  return {
    pyBlock,
    historiqueBlocks,
    chipsCY: colBlock(qe.CY,epsCY,qe.coherenceNoteCY,{legend:true,hideSum:true}),
    chipsNY: colBlock(qe.NY,epsNY,qe.coherenceNoteNY,{hideSum:true}),
    peStack
  };
}

function fmtBigNum(v){
  if(v===null||v===undefined||v==='')return null;
  const n=+v; if(!isFinite(n))return null;
  return Math.abs(n)>=1000 ? (n/1000).toFixed(2).replace(/\.00$/,'')+' Md' : n.toFixed(n<10&&n!==0?2:0)+' M';
}
function fmtPctDelta(actual,consensus){
  if(actual==null||consensus==null||consensus===0||!isFinite(+actual)||!isFinite(+consensus))return null;
  return ((+actual-+consensus)/Math.abs(+consensus))*100;
}
function pctBadge(delta){
  if(delta===null)return '';
  const col=delta>=0?'var(--teal-text)':'#e05252';
  const bg=delta>=0?'rgba(43,216,194,.14)':'rgba(224,82,82,.1)';
  return `<span style="font-size:10.5px;font-weight:800;font-family:'Poppins',sans-serif;color:${col};background:${bg};border-radius:5px;padding:1px 6px;white-space:nowrap;">${delta>=0?'+':''}${delta.toFixed(1)}%</span>`;
}

// ══════════════════════════════════════════════════════════════
// VALUE RANKINGS & HISTORIQUE DE VALORISATION
// Alimente par data/priceHistory.json (collectors/price_history.py,
// 2 captures/semaine, demarrage propre sans backfill - voir ce fichier).
// Chaque snapshot fige {price, cyYear, nyYear, epsByYear, epsFwd} : le P/E
// se lit soit PAR ANNEE ABSOLUE (ex. "P/E 2026", price/epsByYear["2026"]),
// soit PAR ROLE GLISSANT (ex. "P/E annee en cours", price/epsByYear[cyYear]
// - la cle regardee change chaque annee, ce qui rend deux annees civiles
// comparables entre elles). Les deux lectures sont deliberement exposees
// dans l'UI (E.3), pas une seule.
// ══════════════════════════════════════════════════════════════

function peFromRaw(price, eps){
  return (price>0 && eps>0) ? price/eps : null;
}
function snapPEByYear(snap, year){
  if(!snap || !snap.epsByYear) return null;
  return peFromRaw(snap.price, snap.epsByYear[String(year)]);
}
function snapPERole(snap, role){ // role: 'cy' | 'ny'
  if(!snap) return null;
  const y = role==='ny' ? snap.nyYear : snap.cyYear;
  return snapPEByYear(snap, y);
}
function snapPEFwd(snap){
  return snap ? peFromRaw(snap.price, snap.epsFwd) : null;
}
// series : {kind:'role', role:'cy'|'ny'} | {kind:'fwd'} | {kind:'year', year:2026}
function snapPEForSeries(snap, series){
  if(!snap || !series) return null;
  if(series.kind==='fwd') return snapPEFwd(snap);
  if(series.kind==='year') return snapPEByYear(snap, series.year);
  return snapPERole(snap, series.role);
}
function seriesRawEps(snap, series){
  if(!snap) return null;
  if(series.kind==='fwd') return (typeof snap.epsFwd==='number') ? snap.epsFwd : null;
  const year = series.kind==='year' ? series.year : (series.role==='ny' ? snap.nyYear : snap.cyYear);
  return snap.epsByYear ? (snap.epsByYear[String(year)] ?? null) : null;
}

const VALO_PERIOD_DAYS={'1s':7,'1m':30,'3m':91,'6m':182,'1y':365};
const VALO_PERIOD_LABELS={'1s':'1 sem.','1m':'1 mois','3m':'3 mois','6m':'6 mois','1y':'1 an'};
const VALO_GAP_TOLERANCE_DAYS=10; // ~1 capture manquee a raison de 2/semaine

function formatFrDate(iso){
  if(!iso) return '';
  const p=String(iso).split('-');
  if(p.length!==3) return iso;
  return `${parseInt(p[2],10)} ${MONTH_ABBR_FR[parseInt(p[1],10)]||''} ${p[0]}`;
}
function isoDateMinusDays(dateStr, days){
  const d=new Date(dateStr+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()-days);
  return d.toISOString().slice(0,10);
}
function isoDatePlusDays(dateStr, days){
  const d=new Date(dateStr+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function dayDiffISO(a,b){
  return Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/86400000);
}
// snapshots supposes tries par date croissante (garanti par l'ecriture
// append-only du collecteur) - renvoie le DERNIER snapshot dont la date
// est <= targetDate, ou null.
function nearestSnapshotBefore(snapshots, targetDate){
  let best=null;
  for(const s of snapshots){ if(s.date<=targetDate) best=s; else break; }
  return best;
}

function valoEarliestDate(){
  const ph=state.priceHistory;
  if(!ph || !ph.tickers) return null;
  let min=null;
  Object.values(ph.tickers).forEach(entry=>{
    (entry.snapshots||[]).forEach(s=>{ if(!min||s.date<min) min=s.date; });
  });
  return min;
}
function valoPeriodAvailableDate(periodKey){
  const earliest=valoEarliestDate();
  return earliest ? isoDatePlusDays(earliest, VALO_PERIOD_DAYS[periodKey]) : null;
}

function computeRankings(periodKey, seriesDesc, n){
  const days=VALO_PERIOD_DAYS[periodKey];
  const ph=state.priceHistory;
  const out=[];
  if(ph && ph.tickers && days){
    Object.keys(ph.tickers).forEach(tk=>{
      const snaps=ph.tickers[tk].snapshots||[];
      if(snaps.length<2) return;
      const latest=snaps[snaps.length-1];
      const targetDate=isoDateMinusDays(latest.date, days);
      const start=nearestSnapshotBefore(snaps, targetDate);
      if(!start || start===latest) return;
      if(dayDiffISO(targetDate, start.date) > VALO_GAP_TOLERANCE_DAYS) return;
      const peStart=snapPEForSeries(start, seriesDesc);
      const peEnd=snapPEForSeries(latest, seriesDesc);
      if(peStart==null || peEnd==null) return;
      out.push({ticker:tk, peStart, peEnd, deltaPct:(peEnd-peStart)/peStart*100, startDate:start.date, latestDate:latest.date});
    });
  }
  // Filtre par signe AVANT de couper a N : avec un petit nombre de titres
  // disposant d'assez d'historique, ne jamais faire remonter un titre en
  // hausse dans la liste "baisses" (ou l'inverse) juste pour completer le
  // quota - une liste plus courte que N est un resultat honnete valide.
  const gainers=out.filter(r=>r.deltaPct>0).sort((a,b)=>b.deltaPct-a.deltaPct || a.ticker.localeCompare(b.ticker)).slice(0,n);
  const losers=out.filter(r=>r.deltaPct<0).sort((a,b)=>a.deltaPct-b.deltaPct || a.ticker.localeCompare(b.ticker)).slice(0,n);
  return {gainers, losers, total:out.length};
}

function valoFilterByPeriod(snapshots, periodKey){
  if(!periodKey || periodKey==='all' || !VALO_PERIOD_DAYS[periodKey]) return snapshots;
  const latest=snapshots[snapshots.length-1];
  if(!latest) return snapshots;
  const cutoff=isoDateMinusDays(latest.date, VALO_PERIOD_DAYS[periodKey]);
  const filtered=snapshots.filter(s=>s.date>=cutoff);
  // garde au moins les 2 derniers points si la fenetre est trop stricte,
  // pour ne jamais afficher un graphique a 0/1 point alors que 2+ existent
  return filtered.length>=2 ? filtered : snapshots.slice(-2);
}

function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// Moteur de graphique SVG unique, partage entre les mini-cartes "Value
// Rankings" (compact:true) et la vue detaillee "Historique de
// valorisation" (compact:false) - voir plan de fonctionnalite. opts:
// {mode:'pe'|'price', series, periodKey, compact}
// Catmull-Rom -> Bezier cubique : courbe lissee qui passe EXACTEMENT par
// chaque point (pas d'overshoot visible sur des series courtes/eparses
// comme nos 2 snapshots/semaine) - rendu "app boursière premium" plutot
// que la ligne brisee d'un polyline brut.
function smoothPathD(pts){
  if(pts.length<2) return '';
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

function buildValoChartSVG(ticker, opts){
  const ph=state.priceHistory;
  const entry=ph && ph.tickers ? ph.tickers[ticker] : null;
  const allSnaps=entry ? (entry.snapshots||[]) : [];
  if(allSnaps.length<2) return null;

  const mode=opts.mode||'pe';
  const series=opts.series;
  const compact=!!opts.compact;
  // tone : accent de couleur pour les mini-cartes du Ranking (coherent
  // avec les couleurs de marque baisses=navy / hausses=turquoise, voir
  // .vr-panel-title) - null sur la fiche titre (courbe neutre navy).
  const tone=opts.tone||null;
  const snaps=valoFilterByPeriod(allSnaps, opts.periodKey);
  if(snaps.length<2) return null;

  const yVal=(snap)=> mode==='price' ? snap.price : snapPEForSeries(snap, series);
  const idxByDate=new Map(allSnaps.map((s,i)=>[s.date,i]));
  const points=snaps
    .map(s=>({snap:s, idx:idxByDate.get(s.date), y:yVal(s)}))
    .filter(p=>p.y!=null && isFinite(p.y));
  if(points.length<2) return null;

  const W=compact?260:640, H=compact?90:220;
  const padL=compact?4:46, padR=compact?4:50, padT=compact?10:18, padB=compact?12:28;
  const plotW=W-padL-padR, plotH=H-padT-padB;

  const t0=new Date(points[0].snap.date+'T00:00:00Z').getTime();
  const t1=new Date(points[points.length-1].snap.date+'T00:00:00Z').getTime();
  const tSpan=Math.max(1, t1-t0);
  const xOf=(dateStr)=> padL + ((new Date(dateStr+'T00:00:00Z').getTime()-t0)/tSpan)*plotW;

  const yVals=points.map(p=>p.y);
  let yMin=Math.min(...yVals), yMax=Math.max(...yVals);
  if(yMin===yMax){ yMin-=Math.abs(yMin*0.1)||1; yMax+=Math.abs(yMax*0.1)||1; }
  const margin=(yMax-yMin)*0.1;
  yMin-=margin; yMax+=margin;
  const yOf=(v)=> padT + (1-(v-yMin)/(yMax-yMin))*plotH;

  const lineColor=tone==='up' ? 'var(--teal-dark-text)' : tone==='down' ? 'var(--navy)' : 'var(--navy)';
  const areaColor=tone==='up' ? 'var(--teal)' : tone==='down' ? 'var(--navy)' : 'var(--navy-light)';
  const areaOpacity=tone ? .12 : .5;
  const dotColor=tone==='up' ? 'var(--teal-dark-text)' : 'var(--navy)';

  // Inflexion "refresh Omnium" : la valeur BRUTE de la serie affichee a
  // change entre deux snapshots CONSECUTIFS (dans l'historique complet du
  // titre, pas seulement la fenetre affichee) - detection precise, propre
  // a CHAQUE courbe (un refresh qui revise epsNY sans toucher epsCY ne
  // marque rien sur la courbe CY). Zero champ stocke a part, tout vient de
  // epsByYear/epsFwd deja present sur chaque snapshot.
  const inflexionIdx=new Set();
  for(let i=1;i<allSnaps.length;i++){
    const prevV=seriesRawEps(allSnaps[i-1], series), curV=seriesRawEps(allSnaps[i], series);
    if(prevV!=null && curV!=null && Math.abs(curV-prevV)>1e-9) inflexionIdx.add(i);
  }

  const earningsDates=(ph.earningsDates && ph.earningsDates[ticker]) || [];
  const winStart=points[0].snap.date, winEnd=points[points.length-1].snap.date;
  const visibleEarnings=compact ? [] : earningsDates.filter(d=>d>=winStart && d<=winEnd);

  const xyPts=points.map(p=>[xOf(p.snap.date), yOf(p.y)]);
  const lineD=smoothPathD(xyPts);
  const areaBase=(padT+plotH).toFixed(1);
  const areaPath=`${lineD} L${xyPts[xyPts.length-1][0].toFixed(1)},${areaBase} L${xyPts[0][0].toFixed(1)},${areaBase} Z`;

  // Axes (fiche titre uniquement - les mini-cartes du Ranking restent des
  // sparklines epurees sans grille, cf. Apple Stocks/Robinhood watchlist).
  const yAxis=compact ? '' : [yMax,(yMax+yMin)/2,yMin].map(v=>{
    const y=yOf(v).toFixed(1);
    const txt=mode==='price' ? (fmtBigNum(v)||v.toFixed(2)) : v.toFixed(1)+'×';
    return `<line x1="${padL}" x2="${(padL+plotW).toFixed(1)}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`+
      `<text x="${(padL-8).toFixed(1)}" y="${y}" font-size="9.5" font-family="Poppins,sans-serif" fill="var(--muted)" text-anchor="end" dominant-baseline="middle">${txt}</text>`;
  }).join('');
  const xAxis=compact ? '' : (()=>{
    const y=(padT+plotH+18).toFixed(1);
    return `<text x="${xyPts[0][0].toFixed(1)}" y="${y}" font-size="9.5" font-family="Poppins,sans-serif" fill="var(--muted)" text-anchor="start">${formatFrDate(points[0].snap.date)}</text>`+
      `<text x="${xyPts[xyPts.length-1][0].toFixed(1)}" y="${y}" font-size="9.5" font-family="Poppins,sans-serif" fill="var(--muted)" text-anchor="end">${formatFrDate(points[points.length-1].snap.date)}</text>`;
  })();

  const earningsMarks=visibleEarnings.map(d=>{
    const xd=xOf(d).toFixed(1);
    return `<line x1="${xd}" x2="${xd}" y1="${padT}" y2="${(padT+plotH).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2,3" opacity=".5"><title>Résultats – ${formatFrDate(d)}</title></line>`;
  }).join('');

  const dots=points.map(p=>{
    const isInflexion=inflexionIdx.has(p.idx);
    const cx=xOf(p.snap.date).toFixed(1), cy=yOf(p.y).toFixed(1);
    const r=isInflexion?(compact?3.5:5):(compact?2.25:3.5);
    return isInflexion
      ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--gold)" stroke="var(--navy)" stroke-width="1"/>`
      : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${dotColor}"/>`;
  }).join('');

  // Tooltip au survol : toujours actif sur la fiche titre (souris + tap) ;
  // sur les mini-cartes du Ranking, SOURIS UNIQUEMENT (pas de touchstart)
  // pour ne jamais interferer avec le tap-pour-ouvrir de la carte entiere
  // sur mobile.
  const hitTargets=points.map((p,i)=>{
    const cx=xOf(p.snap.date);
    const bandW=points.length>1 ? plotW/(points.length-1) : plotW;
    const rx=(cx-bandW/2).toFixed(1);
    const info={date:p.snap.date, price:p.snap.price, val:p.y, mode, isInflexion:inflexionIdx.has(p.idx)};
    const touchAttr=compact ? '' : ' ontouchstart="showValoTooltip(event)"';
    return `<rect x="${rx}" y="0" width="${Math.max(1,bandW).toFixed(1)}" height="${H}" fill="transparent" data-info="${escAttr(JSON.stringify(info))}" onmousemove="showValoTooltip(event)" onmouseleave="hideValoTooltip()"${touchAttr}/>`;
  }).join('');

  const endLabel=(()=>{
    const last=points[points.length-1];
    const txt=mode==='price' ? (fmtBigNum(last.y)||last.y.toFixed(2)) : last.y.toFixed(1)+'×';
    const lx=xyPts[xyPts.length-1][0], ly=yOf(last.y);
    if(compact){
      return `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.5" fill="#fff" stroke="${dotColor}" stroke-width="1.5"/>`;
    }
    const tw=txt.length*6.4+10;
    return `<rect x="${(lx+7).toFixed(1)}" y="${(ly-9).toFixed(1)}" width="${tw.toFixed(1)}" height="18" rx="5" fill="${lineColor}"/>`+
      `<text x="${(lx+7+tw/2).toFixed(1)}" y="${(ly+1).toFixed(1)}" font-size="11" font-weight="700" font-family="Poppins,sans-serif" fill="#fff" text-anchor="middle" dominant-baseline="middle">${txt}</text>`;
  })();

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible;">
    <path d="${areaPath}" fill="${areaColor}" opacity="${areaOpacity}"/>
    ${yAxis}
    ${earningsMarks}
    <path d="${lineD}" fill="none" stroke="${lineColor}" stroke-width="${compact?1.75:2.25}" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${endLabel}
    ${xAxis}
    ${hitTargets}
  </svg>`;
}

function showValoTooltip(evt){
  const rect=evt.currentTarget;
  let info; try{ info=JSON.parse(rect.dataset.info); }catch(e){ return; }
  let tip=document.getElementById('valo-tooltip');
  if(!tip){
    tip=document.createElement('div');
    tip.id='valo-tooltip';
    tip.className='valo-tooltip';
    document.body.appendChild(tip);
  }
  const valTxt=info.mode==='price' ? (info.price!=null?info.price.toFixed(2):'—') : (info.val!=null?info.val.toFixed(1)+'×':'—');
  tip.innerHTML=`<div class="valo-tooltip-date">${formatFrDate(info.date)}</div><div>${info.mode==='price'?'Prix':'P/E'} : <b>${valTxt}</b></div>${info.isInflexion?'<div class="valo-tooltip-flag">↳ Révision Omnium (inflexion)</div>':''}`;
  const r=rect.getBoundingClientRect();
  tip.style.left=(r.left+r.width/2+window.scrollX)+'px';
  tip.style.top=(r.top+window.scrollY-8)+'px';
  tip.style.display='block';
}
function hideValoTooltip(){
  const tip=document.getElementById('valo-tooltip');
  if(tip) tip.style.display='none';
}

// ── Value Rankings (onglet) ──────────────────────────────────────
let _valoRankState={n:5, period:'1m', role:'cy'};

function seriesDescForRole(role){
  return role==='fwd' ? {kind:'fwd'} : {kind:'role', role};
}

function renderValueRankings(){
  const wrap=document.getElementById('tab-valuerankings');
  if(!wrap) return;
  const st=_valoRankState;
  const seriesDesc=seriesDescForRole(st.role);
  const {gainers, losers}=computeRankings(st.period, seriesDesc, st.n);

  const pill=(group, key, label, active, disabled, title)=>
    `<button class="vr-pill${active?' active':''}" ${disabled?'disabled':''} title="${escAttr(title||'')}" onclick="setValoRankParam('${group}',${typeof key==='number'?key:`'${key}'`})">${label}</button>`;

  const nRow=[5,10,15].map(v=>pill('n', v, v, st.n===v, false)).join('');
  let anyPeriodUnavailable=false;
  const pRow=Object.keys(VALO_PERIOD_DAYS).map(pk=>{
    const avail=computeRankings(pk, seriesDesc, st.n).total>0;
    if(!avail) anyPeriodUnavailable=true;
    const availDate=!avail?valoPeriodAvailableDate(pk):null;
    const title=!avail?`Historique insuffisant${availDate?` — disponible à partir du ${formatFrDate(availDate)}`:''}`:'';
    return pill('period', pk, VALO_PERIOD_LABELS[pk], st.period===pk, !avail, title);
  }).join('');
  const periodHint=anyPeriodUnavailable
    ? `<div class="vr-hint">Périodes grisées : historique encore insuffisant — elles se débloquent automatiquement à mesure que la collecte (2×/semaine) s'accumule.</div>`
    : '';
  const nowYear=new Date().getFullYear();
  const rRow=[['cy',String(nowYear),'Année en cours'],['fwd','12m Forward',''],['ny',String(nowYear+1),'Année prochaine']]
    .map(([k,label,title])=>pill('role', k, label, st.role===k, false, title)).join('');

  const grid=(list)=> list.length
    ? `<div class="vr-grid">${list.map(r=>renderValueRankingCard(r, seriesDesc)).join('')}</div>`
    : `<div class="vr-empty">Pas assez d'historique pour cette période — la collecte vient de démarrer, revenez plus tard.</div>`;

// ── Courbe de projection (translation de la courbe EPS dans le temps) ──
// A la difference de buildValoChartSVG (une metrique dans le temps, axe X
// = dates), cette vue prend la courbe de projection ENTIERE (EPS par
// annee fiscale, axe X = annee) telle qu'elle existait a differents
// instants passes, et superpose plusieurs de ces courbes pour montrer
// comment la projection elle-meme a bouge - translation vers le haut/bas,
// changement de pente, revision concentree sur une annee precise.
function distinctEpsByYearStates(snapshots){
  // Un point par REVISION reelle, jamais un point par snapshot - la
  // courbe est identique entre deux refresh, la dupliquer n'apporterait
  // rien et surchargerait le graphique.
  const out=[];
  let lastKey=null;
  snapshots.forEach(s=>{
    if(!s.epsByYear) return;
    const key=JSON.stringify(Object.keys(s.epsByYear).sort().map(y=>[y,s.epsByYear[y]]));
    if(key!==lastKey){
      out.push({date:s.date, epsByYear:s.epsByYear});
      lastKey=key;
    }
  });
  return out;
}

function buildValoProjectionCurvesSVG(ticker, maxCurves){
  const ph=state.priceHistory;
  const entry=ph && ph.tickers ? ph.tickers[ticker] : null;
  const snaps=entry ? (entry.snapshots||[]) : [];
  const states=distinctEpsByYearStates(snaps);
  if(!states.length) return null;
  const shown=states.slice(-(maxCurves||6));

  const allYears=new Set();
  shown.forEach(s=>Object.keys(s.epsByYear).forEach(y=>allYears.add(+y)));
  const years=Array.from(allYears).sort((a,b)=>a-b);
  if(years.length<2) return null;

  let yMin=Infinity, yMax=-Infinity;
  shown.forEach(s=>years.forEach(y=>{
    const v=s.epsByYear[String(y)];
    if(typeof v==='number'){ if(v<yMin)yMin=v; if(v>yMax)yMax=v; }
  }));
  if(!isFinite(yMin)||!isFinite(yMax)) return null;
  if(yMin===yMax){ yMin-=Math.abs(yMin*0.1)||1; yMax+=Math.abs(yMax*0.1)||1; }
  const margin=(yMax-yMin)*0.12;
  yMin-=margin; yMax+=margin;

  const W=640, H=260, padL=48, padR=20, padT=16, padB=32;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const yFirst=years[0], yLast=years[years.length-1];
  const xOf=(year)=> yLast>yFirst ? padL + ((year-yFirst)/(yLast-yFirst))*plotW : padL+plotW/2;
  const yOf=(v)=> padT + (1-(v-yMin)/(yMax-yMin))*plotH;

  const ticks=4;
  const gridlines=Array.from({length:ticks+1},(_, i)=>{
    const v=yMin+(yMax-yMin)*(i/ticks);
    const y=yOf(v).toFixed(1);
    return `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${(padL-6).toFixed(1)}" y="${y}" font-size="9" fill="var(--muted)" text-anchor="end" dominant-baseline="middle">${v.toFixed(1)}</text>`;
  }).join('');
  const xLabels=years.map(y=>`<text x="${xOf(y).toFixed(1)}" y="${H-8}" font-size="10" font-weight="700" fill="var(--muted)" text-anchor="middle">${y}</text>`).join('');

  const n=shown.length;
  const curvesSvg=shown.map((s,i)=>{
    const isLast=i===n-1;
    const opacity=n>1 ? (0.2 + 0.8*(i/(n-1))) : 1;
    const ptYears=years.filter(y=>typeof s.epsByYear[String(y)]==='number');
    const pts=ptYears.map(y=>`${xOf(y).toFixed(1)},${yOf(s.epsByYear[String(y)]).toFixed(1)}`).join(' ');
    const dots=ptYears.map(y=>{
      const v=s.epsByYear[String(y)];
      const label=isLast?`<text x="${(xOf(y)+5).toFixed(1)}" y="${(yOf(v)-5).toFixed(1)}" font-size="9" font-weight="800" fill="var(--navy)">${v.toFixed(1)}</text>`:'';
      return `<circle cx="${xOf(y).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="${isLast?3.5:2.2}" fill="var(--navy)" opacity="${opacity}"/>${label}`;
    }).join('');
    return `<polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="${isLast?2.5:1.5}" opacity="${opacity}" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');

  const legendHtml=shown.map((s,i)=>{
    const opacity=n>1 ? (0.2 + 0.8*(i/(n-1))) : 1;
    return `<span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:11px;height:2.5px;background:var(--navy);opacity:${opacity};display:inline-block;border-radius:1px;"></span>${formatFrDate(s.date)}</span>`;
  }).join('');

  return {
    svg: `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible;">${gridlines}${curvesSvg}${xLabels}</svg>`,
    legendHtml,
    single: n<2
  };
}

let _valoHistState={mode:'pe', seriesKind:'role', role:'cy', year:null, period:'all'};

function renderValoHistory(ticker){
  const card=document.getElementById('valo-hist-card');
  if(!card) return;
  const ph=state.priceHistory;
  const entry=ph && ph.tickers ? ph.tickers[ticker] : null;
  const snaps=entry ? (entry.snapshots||[]) : [];

  if(_valoHistPending){
    _valoHistState.period=_valoHistPending.period;
    if(_valoHistPending.role==='fwd'){ _valoHistState.mode='pe'; _valoHistState.seriesKind='fwd'; }
    else { _valoHistState.mode='pe'; _valoHistState.seriesKind='role'; _valoHistState.role=_valoHistPending.role; }
    _valoHistPending=null;
  }

  if(snaps.length<2){
    const msg=snaps.length===1
      ? `Historique de valorisation disponible à partir du ${formatFrDate(snaps[0].date)} (collecte en cours, revenez après la prochaine capture).`
      : `Historique de valorisation pas encore disponible pour ce titre — la collecte démarre au prochain snapshot (2 fois/semaine).`;
    card.innerHTML=`<div class="card-title"><b>Historique de valorisation</b></div><div class="vr-empty">${msg}</div>`;
    return;
  }

  const latest=snaps[snaps.length-1];
  const earliest=snaps[0].date;
  const years=latest.epsByYear ? Object.keys(latest.epsByYear).map(Number).sort((a,b)=>a-b) : [];
  const st=_valoHistState;
  const seriesDesc=st.mode!=='pe' ? null
    : st.seriesKind==='fwd' ? {kind:'fwd'}
    : st.seriesKind==='year' ? {kind:'year', year: years.includes(st.year) ? st.year : years[0]}
    : {kind:'role', role:st.role};

  const modeBtn=(m,label)=>`<button class="vr-pill${st.mode===m?' active':''}" onclick="setValoHistMode('${m}')">${label}</button>`;
  const yearBtn=(y)=>`<button class="vr-pill${st.mode==='pe'&&st.seriesKind==='year'&&st.year===y?' active':''}" onclick="setValoHistSeries('year',${y})">P/E ${y}</button>`;
  const roleBtn=(r,label)=>`<button class="vr-pill${st.mode==='pe'&&st.seriesKind==='role'&&st.role===r?' active':''}" onclick="setValoHistSeries('role','${r}')">${label}</button>`;
  const fwdBtn=`<button class="vr-pill${st.mode==='pe'&&st.seriesKind==='fwd'?' active':''}" onclick="setValoHistSeries('fwd')">P/E 12m Fwd</button>`;

  const periodBtn=(pk,label)=>{
    const avail=dayDiffISO(latest.date, earliest)>=VALO_PERIOD_DAYS[pk];
    const availDate=!avail?isoDatePlusDays(earliest, VALO_PERIOD_DAYS[pk]):null;
    const title=!avail?`Disponible à partir du ${formatFrDate(availDate)}`:'';
    return `<button class="vr-pill${st.period===pk?' active':''}" ${avail?'':'disabled'} title="${escAttr(title)}" onclick="setValoHistPeriod('${pk}')">${label}</button>`;
  };
  const allBtn=`<button class="vr-pill${st.period==='all'?' active':''}" onclick="setValoHistPeriod('all')">Tout</button>`;

  let chartHtml, legendHtml;
  if(st.mode==='projection'){
    const proj=buildValoProjectionCurvesSVG(ticker, 6);
    if(!proj){
      chartHtml='<div class="vr-empty">Pas encore assez d\'historique pour tracer une courbe de projection (au moins 2 années projetées requises).</div>';
      legendHtml='';
    }else{
      chartHtml=proj.svg;
      legendHtml=proj.single
        ? '<span style="color:var(--muted);">Une seule courbe archivée pour l\'instant — revenez après une révision de la thèse.</span>'
        : proj.legendHtml;
    }
  }else{
    const chart=buildValoChartSVG(ticker, {mode:st.mode, series:seriesDesc, periodKey:st.period, compact:false});
    chartHtml=chart || '<div class="vr-empty">Pas assez de points sur cette période.</div>';
    legendHtml='<span><span class="vr-leg-dot"></span>Révision Omnium (refresh)</span><span><span class="vr-leg-dash"></span>Résultats</span>';
  }
  const showSeriesRow=st.mode==='pe';
  const showPeriodRow=st.mode!=='projection';

  card.innerHTML=`
    <div class="card-title"><b>Historique de valorisation</b></div>
    <div class="vr-hist-controls">
      <div class="vr-control-row">${modeBtn('pe','P/E')}${modeBtn('price','Prix')}${modeBtn('projection','Courbe de projection')}</div>
      ${showSeriesRow ? `<div class="vr-control-row">${years.map(yearBtn).join('')}${roleBtn('cy','Année en cours')}${roleBtn('ny','Année prochaine')}${fwdBtn}</div>` : ''}
      ${showPeriodRow ? `<div class="vr-control-row">${Object.keys(VALO_PERIOD_DAYS).map(pk=>periodBtn(pk,VALO_PERIOD_LABELS[pk])).join('')}${allBtn}</div>` : ''}
      ${st.mode==='projection' ? '<div class="vr-control-row" style="color:var(--muted);font-size:10.5px;">Chaque courbe = une révision détectée de la projection EPS (2026→2030) ; les plus récentes en plus foncé.</div>' : ''}
    </div>
    <div class="vr-hist-legend">${legendHtml}</div>
    <div class="vr-hist-chart">${chartHtml}</div>
  `;
}

function formatThesisText(txt, insertAfterFirst){
  const esc=s=>(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines=(txt||'').split(/\n/);
  let html='', buf=[], first=true, sectionCount=0, injected=false;
  const flush=()=>{
    const t=buf.join('\n');
    if(t.trim()){
      html+=`<div style="font-size:12px;color:var(--text);line-height:1.6;white-space:pre-wrap;margin-bottom:10px;padding-left:6px;">${esc(t)}</div>`;
    }
    buf=[];
  };
  lines.forEach(line=>{
    const m=line.trim().match(/^==\s*(.+?)\s*==$/);
    if(m){
      flush();
      sectionCount++;
      if(sectionCount===2 && insertAfterFirst && !injected){
        html+=insertAfterFirst;
        injected=true;
      }
      html+=`<div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:${first?'0':'14px'} 0 6px;">${esc(m[1])}</div>`;
      first=false;
    }else{
      buf.push(line);
      first=false;
    }
  });
  flush();
  if(insertAfterFirst && !injected){ html+=insertAfterFirst; }
  return html;
}

function calcScore(ticker){
  const d=state.tickers[ticker];
  if(!d||!d.data||d.data.length<2)return 0;
  const cours=d.cours||100;
  const{proj}=getProj(ticker);
  const {CY,LY}=yearsFor(ticker);
  const epsCY=proj[CY]?.eps||0,eps30=proj[LY]?.eps||0;
  if(epsCY<=0||eps30<=0)return 0;
  const cagrEps=((Math.pow(eps30/epsCY,0.25))-1)*100;
  const div=d.dividende||0;
  const yieldPct=(cours>0&&div>0?(div/cours)*100:0)+particulariteYieldPct(d);
  const peFwd=cours>0?cours/epsCY:null;
  if(!peFwd||peFwd<=0)return 0;
  return (cagrEps+yieldPct)/peFwd;
}

// MARKET ACTION - bandeau "hausse significative" (>=2% depuis la baseline
// du jour, voir collectors/market_reset.py + market_check.py). Meme
// pattern visuel que le bandeau news, en plus simple : un seul etat "du
// jour" (pas un digest multi-jours), donc une seule ligne possible a la
// fois. Dismissal en localStorage UNIQUEMENT (pas de sync serveur comme
// pour les news) - assume car cette notification ne vit qu'une seule
// journee de toute facon (voir la conversation de design du 12/08/2026) :
// la valeur d'une synchro multi-appareils est faible pour un etat qui
// disparait le lendemain.
// ══════════════════════════════════════════════════════════════
const MARKET_ACTION_DISMISS_KEY='omniumMarketActionDismissedDate';

// "Jour" cote Paris (PAS le fuseau local du visiteur) - le backend
// (market_check.py) raisonne en heure de Paris, la comparaison cote client
// doit utiliser le meme referentiel pour ne jamais afficher une ligne
// perimee (ou en cacher une valide) a cause d'un visiteur dans un autre
// fuseau horaire. Cutoff a 01h00 (pas minuit pile) - decision du
// 13/08/2026 : en retranchant 1h avant de lire la date, la notification
// de la veille reste affichee jusqu'a 01h00 heure de Paris plutot que de
// disparaitre a minuit pile, avant que market_reset.py (recale sur le
// meme cutoff, voir sa docstring) n'ait ecrit la nouvelle baseline du
// jour - utile pour une consultation tardive en soiree.
function todayParisDateStr(){
  const shifted=new Date(Date.now()-60*60*1000);
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(shifted);
}

function isMarketActionDismissed(dateStr){
  try{ return localStorage.getItem(MARKET_ACTION_DISMISS_KEY)===dateStr; }catch(e){ return false; }
}
function dismissMarketAction(dateStr){
  try{ localStorage.setItem(MARKET_ACTION_DISMISS_KEY,dateStr); }catch(e){}
  renderMarketActionBar();
}

// Ligne active uniquement si : donnee du jour (pas d'hier, voir date du
// fichier vs todayParisDateStr), au moins un titre concerne, et pas deja
// dismissee aujourd'hui.
function activeMarketAction(){
  const ma=state.marketAction;
  if(!ma || !ma.date || !Array.isArray(ma.movers) || !ma.movers.length)return null;
  if(ma.date!==todayParisDateStr())return null;
  if(isMarketActionDismissed(ma.date))return null;
  return ma;
}

  overlay.id='market-action-overlay';
  overlay.innerHTML=`<div class="market-action-modal">
      <div class="market-action-modal-title">Progression significative — ${esc(formatNewsDayMonth(ma.date))}</div>
      ${rows}
      <button class="market-action-modal-close" onclick="closeMarketActionDetail()">Fermer</button>
    </div>`;
  overlay.addEventListener('click',e=>{ if(e.target===overlay)closeMarketActionDetail(); });
  document.body.appendChild(overlay);
}

  const overlay=document.getElementById('market-action-overlay');

}

// filterDate : si fourni, ne conserve QUE les items dont dateCollecte
// correspond exactement - PAS dateEvenement (correctif : le digest, voir
// merge.py update_digest(), regroupe ses lignes par date de COLLECTE - le
// jour ou le run a tourne - pas par date de l'evenement sous-jacent. Un
// item dont l'evenement date d'hier mais collecte aujourd'hui est compte
// dans la ligne "aujourd'hui" du digest ; filtrer sur dateEvenement le
// faisait donc disparaitre a tort de la vue detaillee correspondante,
// donnant l'impression trompeuse d'une ligne "vide" alors que le compteur
// affichait bien un total > 0). Le tri interne reste sur dateEvenement
// (ordre de lecture chronologique de l'evenement lui-meme, inchange) -
// seul le FILTRE change de champ.
function groupNewsAll(filterDate){
  const all=(state.newsAll||[]).filter(it=>!filterDate || it.dateCollecte===filterDate);
  const byType={};
  all.forEach(it=>{
    if(!it||!it.type)return;
    (byType[it.type]=byType[it.type]||[]).push(it);
  });
  return NEWS_TYPE_ORDER.filter(t=>byType[t]&&byType[t].length).map(t=>{
    const byCompany={};
    byType[t].forEach(it=>{
      const key=it.ticker||it.name||'?';
      if(!byCompany[key])byCompany[key]={name:it.name||it.ticker||'?', items:[]};
      byCompany[key].items.push(it);
    });
    const companies=Object.values(byCompany).map(c=>{
      c.items.sort((a,b)=>String(b.dateEvenement||'').localeCompare(String(a.dateEvenement||'')));
      return c;
    }).sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'}));
    return {type:t, label:NEWS_TYPE_LABEL[t]||t, companies};
  });
}

function renderNewsDetail(){
  const el=document.getElementById('news-detail-content');
  if(!el)return;
  const esc=s=>(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const sections=groupNewsAll(newsDetailDateFilter);
  // Bandeau de filtre actif : n'apparait que si une date precise est
  // selectionnee, avec un lien explicite pour revenir a la vue complete -
  // rend visible et reversible le fait que la vue est restreinte a ce
  // jour-la, plutot qu'un filtrage silencieux.
  const filterBanner=newsDetailDateFilter?`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:10px 16px;background:var(--navy-light);border-radius:10px;">
      <span style="font-family:'Poppins',sans-serif;font-size:12.5px;font-weight:700;color:var(--navy);">Actualités du ${esc(formatNewsDayMonth(newsDetailDateFilter))}</span>
      <span style="font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;text-decoration:underline;" onclick="clearNewsDetailFilter()">Voir toutes les actualités</span>
    </div>`:'';
  if(!sections.length){
    el.innerHTML=filterBanner+'<div class="news-empty">Aucune actualité disponible pour le moment.</div>';
    return;
  }
  el.innerHTML=filterBanner+sections.map(sec=>`
    <div class="news-section">
      <div class="news-section-hd">
        ${NEWS_TYPE_ICON[sec.type]||''}
