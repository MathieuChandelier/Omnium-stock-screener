<html lang="en" translate="no"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Omnium — Investment Model</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000190">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Model">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&amp;family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
:root {
  --navy:#000190; --navy-dark:#00004a; --navy-light:#eeeffe;
  --teal:#2BD8C2; --teal-light:#e6faf8; --teal-text:#25CFB4; /* intermediaire entre les deux stops du logo (#1CBBA1 / #2EE3C6) */
  --teal-dark-text:#169886; /* turquoise de marque assombri (nuance B) */
  --gold:#FFD700; --gold-light:#fffce6;
  --bg:#ffffff; --surface:#fff; --border:#e6e6f0;
  --text:#0d0d1a; --muted:#64748b;
  --proj-bg:#f7f9ff;
  --ok:#10b981; --err:#ef4444; --gold-text:#92700a;
  --text-xs:11px; --text-sm:12px; --text-base:14px; --text-lg:16px; --text-2xl:28px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Quattrocento Sans',Georgia,serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;}
h1,h2,.tab,.kpi-value,.card-title,.step-title,.btn,.badge,.kpi-label,.adj-label,th{font-family:'Poppins',system-ui,sans-serif;}

header{background:linear-gradient(120deg, var(--navy) 0%, var(--navy-dark) 100%);color:#fff;padding:35px 34px 40px;display:flex;align-items:center;justify-content:space-between;}
.h-tagline{display:flex;align-items:center;gap:7px;margin-top:1px;margin-left:1px;}
.h-tagline span{font-size:27px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:1;font-family:'Poppins',sans-serif;}
.h-logo{height:79px;width:auto;display:block;}

.header-access-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:7px 14px;color:rgba(255,255,255,.85);font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:600;text-decoration:none;transition:background .12s,border-color .12s,color .12s;}
.header-access-btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.36);color:#fff;}
.header-access-btn svg{flex-shrink:0;}

.access-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(120deg, var(--navy) 0%, var(--navy-dark) 100%);}
.access-gate-card{max-width:360px;text-align:center;}
.access-gate-title{font-family:'Poppins',sans-serif;font-size:19px;font-weight:800;color:#fff;margin-bottom:10px;}
.access-gate-msg{font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.75);line-height:1.6;}

.guest-banner{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--gold-light);color:var(--gold-text);font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;padding:8px 14px;text-align:center;}
.guest-banner svg{flex-shrink:0;}

.tab-bar{background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 75%,var(--navy-dark) 100%);align-items:center;padding:11px 24px;}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 20px 8px 15px;cursor:pointer;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:22px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;box-shadow:0 1px 3px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.08);transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;}
.back-btn:hover{background:linear-gradient(160deg,#39e6d0,var(--teal) 65%);border-color:var(--teal);color:var(--navy);box-shadow:0 3px 10px rgba(43,216,194,.35),inset 0 1px 0 rgba(255,255,255,.5);transform:translateY(-1px);}
.back-btn:active{transform:scale(.96);}
.back-btn-arrow{font-size:15px;display:inline-block;transition:transform .15s;}
.back-btn:hover .back-btn-arrow{transform:translateX(-2px);}
.panel{display:none;}.panel.active{display:block;}

.container{max-width:1160px;margin:0 auto;padding:22px 29px;}

.card{background:var(--surface);border-radius:12px;box-shadow:0 2px 14px rgba(0,1,144,.06),0 1px 3px rgba(0,0,0,.04);padding:20px 24px;margin-bottom:18px;}
#analyse-tbl-card{background:transparent;box-shadow:none;padding:0;}
#return-block,#context-card{background:transparent;box-shadow:none;padding:0;}
.card-title{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin-bottom:14px;}
.card-title b{color:var(--navy);}

.pf-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.10em;font-family:'Poppins',sans-serif;}
.pf-count{font-size:11px;color:var(--muted);font-family:'Quattrocento Sans',serif;}
.pf-list{display:flex;flex-direction:column;gap:0;background:transparent;}
.pf-item{display:flex;align-items:center;gap:22px;background:transparent;padding:11px 22px;cursor:pointer;transition:background .12s;border-left:4px solid transparent;border-bottom:1px solid rgba(0,1,144,.16);}
.pf-item:last-child{border-bottom:none;}
.pf-metric-return .pf-mv,.pf-metric-pe .pf-mv{color:var(--teal-dark-text);font-weight:600;}
.pf-item:hover{background:rgba(43,216,194,.055);}
.pf-main{flex:1.6;min-width:0;}
.pf-name{font-size:14.5px;font-weight:600;color:var(--navy);font-family:'Poppins',sans-serif;}
.pf-sub{font-size:10.5px;color:var(--muted);margin-top:2px;font-family:'Quattrocento Sans',serif;}
.pf-metrics{display:flex;gap:28px;flex-shrink:0;}
.pf-metric{text-align:center;min-width:60px;}
.pf-ml{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-family:'Poppins',sans-serif;margin-bottom:5px;white-space:nowrap;}
.pf-mv{font-size:13.5px;font-weight:600;color:var(--muted);font-family:'Poppins',sans-serif;line-height:1;}
.pf-mv-event{font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.pf-col-header{display:flex;align-items:center;gap:22px;padding:0 22px 8px;margin-top:4px;}
.pf-col-name-spacer{flex:1 1 auto;max-width:360px;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;font-size:11px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.07em;}
.pf-name-sort-lbl{cursor:pointer;user-select:none;transition:color .12s;white-space:nowrap;flex-shrink:0;}
.pf-name-sort-lbl:hover{color:var(--teal-text);}
.pf-name-filter{flex:0 0 auto;width:118px;min-width:0;border:none;border-bottom:1.5px solid rgba(0,1,144,.18);background:transparent;color:var(--navy);font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;text-transform:none;letter-spacing:normal;line-height:1;padding:0 1px 1px;margin:0;height:14px;cursor:text;transition:border-color .12s;}
.pf-name-filter::placeholder{color:var(--muted);font-weight:500;}
.pf-name-filter:focus{outline:none;border-bottom-color:var(--teal-text);}
.pf-col-labels{display:flex;gap:28px;flex-shrink:0;}
.pf-col-lbl{min-width:60px;text-align:center;font-size:11px;font-weight:800;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;}
.pf-col-lbl.pf-col-sortable{cursor:pointer;user-select:none;position:relative;display:block;transition:color .12s;}
.pf-col-lbl.pf-col-sortable:hover{color:var(--teal-text);}
.pf-sort-arrow{font-size:8px;opacity:.75;display:inline-block;min-width:7px;position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:2px;}
.pf-metric-event{text-align:left;}
.pf-col-lbl.pf-metric-event{text-align:left;padding-left:2px;}
.pf-col-lbl.pf-metric-event .pf-sort-arrow{position:static;transform:none;margin-left:3px;}
.pf-score{text-align:center;min-width:52px;padding:7px 12px;background:rgba(0,1,144,.04);border-radius:9px;flex-shrink:0;}
.pf-score-val{font-size:20px;font-weight:900;color:var(--navy);font-family:'Poppins',sans-serif;line-height:1;}
.pf-score-lbl{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:'Poppins',sans-serif;margin-top:3px;}
.pf-empty{text-align:center;padding:48px;color:var(--muted);font-family:'Quattrocento Sans',serif;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:var(--surface);border-radius:12px;padding:16px 18px;box-shadow:0 2px 14px rgba(0,1,144,.06);border-left:3px solid var(--teal);}
.kpi.gold{border-left-color:var(--gold);}
.kpi.navy{border-left-color:var(--navy);}
.kpi.red{border-left-color:var(--err);}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;font-weight:700;}
.kpi-value{font-size:var(--text-2xl);font-weight:800;color:var(--navy);line-height:1.1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;font-family:'Quattrocento Sans',serif;}

table{width:100%;border-collapse:collapse;font-size:var(--text-base);}
thead th{background:var(--navy);color:#fff;text-align:right;padding:10px 14px;font-weight:600;font-size:12px;letter-spacing:.02em;white-space:nowrap;width:7%;}
thead th:first-child{width:16%;}
thead th:first-child{text-align:left;}
thead th.proj-head{background:var(--navy-light);color:var(--navy);}
tbody td{padding:9px 14px;text-align:right;white-space:nowrap;}
tbody td:first-child{text-align:left;font-weight:500;color:var(--navy);font-family:'Poppins',sans-serif;font-size:11px;}
tbody td.unit{text-align:left;font-size:10px;color:var(--muted);font-style:italic;font-weight:400;font-family:'Quattrocento Sans',serif;}
tbody tr:hover td{background:rgba(43,216,194,.03);}
tbody tr.hist-last td{background:rgba(0,1,144,.03);}
tbody tr.proj-row td{background:var(--proj-bg);color:var(--muted);font-style:italic;}
tbody tr.proj-row td:first-child{font-style:normal;color:var(--navy);opacity:.75;}
tbody td.proj-first{border-left:2px solid var(--teal);}
tbody tr.row-emph td:not(:first-child){font-weight:700;}
td input[type=number]{width:100%;border:1px solid transparent;background:transparent;text-align:right;font-size:12px;padding:2px 0;color:inherit;border-radius:4px;font-family:'Quattrocento Sans',serif;transition:border-color .1s,background .1s;-moz-appearance:textfield;}
td input[type=number]::-webkit-outer-spin-button,td input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
td input[type=number]:focus{border-color:var(--teal);background:var(--teal-light);outline:none;}
td input[type=number]:hover{border-color:var(--border);}

.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.02em;}
.badge-up{background:#dcfce7;color:var(--ok);}
.badge-dn{background:#fee2e2;color:var(--err);}
.badge-nu{background:#f1f5f9;color:#475569;}
.badge-tl{background:var(--teal-light);color:var(--teal-text);}
.badge-gd{background:var(--gold-light);color:var(--gold-text);}
.badge-nv{background:var(--navy-light);color:var(--navy);}

.alert{padding:9px 13px;border-radius:8px;font-size:11px;margin-bottom:14px;border-left:3px solid;line-height:1.5;}
.alert-warn{background:var(--gold-light);border-color:var(--gold);color:var(--gold-text);}
.alert-info{background:var(--teal-light);border-color:var(--teal);color:var(--teal-text);}

.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;}
.btn{padding:9px 20px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:transform .1s,box-shadow .1s,opacity .15s;letter-spacing:.02em;}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.1);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-light{background:var(--border);color:var(--text);}
.btn-danger{background:#fee2e2;color:#991b1b;}

.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:var(--navy-light);border-radius:10px;margin-bottom:18px;border:1px solid rgba(0,1,144,.08);}
.ctrl{display:flex;align-items:center;gap:8px;}
.ctrl label{font-size:11px;font-weight:700;color:var(--navy);white-space:nowrap;font-family:'Poppins',sans-serif;}
.ctrl input[type=number]{width:90px;border:1px solid rgba(0,1,144,.15);border-radius:6px;padding:5px 8px;font-size:12px;background:#fff;}

.analyse-header{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.analyse-id{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.analyse-name{font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.01em;line-height:1.1;margin-left:2px;}
.analyse-price-wrap{display:flex;align-items:baseline;gap:8px;}
.analyse-price{display:flex;align-items:baseline;gap:0;}
.analyse-price input#cours{border:none;border-bottom:1.5px solid transparent;background:transparent;font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:var(--navy);padding:0 1px 1px 0;width:60px;text-align:right;transition:border-color .15s;-moz-appearance:textfield;}
.analyse-price input#cours::-webkit-outer-spin-button,.analyse-price input#cours::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.analyse-price input#cours:hover{border-bottom-color:rgba(0,1,144,.18);}
.analyse-price input#cours:focus{outline:none;border-bottom-color:var(--teal);}
.analyse-price-cur{font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:var(--navy);}

select,input[type=text],input[type=date],textarea{border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12px;background:#fff;color:var(--text);font-family:'Quattrocento Sans',serif;transition:border-color .1s,box-shadow .1s;}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(43,216,194,.15);}
textarea{resize:vertical;width:100%;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-field label{font-size:11px;font-weight:700;color:var(--navy);display:block;margin-bottom:4px;font-family:'Poppins',sans-serif;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.sep{height:1px;background:var(--border);margin:16px 0;}

.step-box{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;}
.step-num{background:var(--navy);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px;}
.step-content{flex:1;}
.step-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;}

.adj-eps-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0;}
.adj-cell{text-align:center;}
.adj-label{font-size:10px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;}
.adj-cell input{width:100%;text-align:center;border:1px solid var(--border);border-radius:6px;padding:6px 4px;font-size:13px;font-weight:700;font-family:'Quattrocento Sans',serif;}
.metrics-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px;}
.metrics-tbl th{text-align:right;padding:5px 8px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.metrics-tbl th:first-child{text-align:left;}
.metrics-tbl td{padding:4px 6px;text-align:center;}
.metrics-tbl td:first-child{text-align:left;font-weight:700;color:var(--navy);font-size:11px;white-space:nowrap;}
.metrics-tbl td input{width:72px;text-align:center;border:1px solid var(--border);border-radius:5px;padding:4px;font-size:11px;font-family:'Quattrocento Sans',serif;}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

.annual-box{margin-top:14px;padding:12px 14px;background:var(--gold-light);border-radius:8px;border:1px solid rgba(255,215,0,.4);}
.annual-box label.main-lbl{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;}

@keyframes omn-spin{to{transform:rotate(360deg);}}
.omn-ring-active{stroke-dasharray:30 70 !important;transform-origin:center;transform-box:fill-box;animation:omn-spin 1s linear infinite;}
.btn-omn-wrap{display:inline-flex;flex-direction:column;gap:5px;}
.btn-omn-wrap.right{align-items:flex-end;}
.btn-omn-status{font-size:10px;font-weight:700;letter-spacing:.06em;height:13px;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none;}
.btn-omn-body{display:flex;align-items:center;border:none;cursor:pointer;padding:0;transition:background .15s,transform .12s,opacity .15s;}
.btn-omn-body:hover:not(:disabled){transform:translateY(-1px);}
.btn-omn-body:disabled{opacity:.6;cursor:not-allowed;transform:none !important;}
.btn-navy{background:linear-gradient(160deg,#0006d8 0%,#000190 55%,#00017e 100%);border-radius:10px;border:1px solid rgba(255,255,255,.13);box-shadow:0 3px 10px rgba(0,1,144,.35),inset 0 1px 0 rgba(255,255,255,.09);}
.btn-navy:hover:not(:disabled){background:linear-gradient(160deg,#0008f0 0%,#0001b0 55%,#000190 100%);}
.btn-teal{background:#2BD8C2;border-radius:11px;}
.btn-teal:hover:not(:disabled){background:#22c9b4;}
.omn-logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.omn-ring-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.omn-vsep-white{width:1px;background:rgba(255,255,255,.18);flex-shrink:0;align-self:stretch;}
.omn-vsep-navy{width:1px;background:rgba(0,1,144,.2);flex-shrink:0;align-self:stretch;}

.coll-hd{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:10px;user-select:none;}
.coll-hd span{font-size:11px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.04em;}
.coll-chevron{font-size:10px;color:var(--muted);transition:transform .2s;}
.coll-hd.open .coll-chevron{transform:rotate(180deg);}

.proj-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;font-family:'Poppins',sans-serif;padding:3px 10px;border-radius:10px;background:var(--gold-light);color:var(--gold-text);border:1px solid rgba(255,215,0,.4);}
.proj-pill.cagr{background:var(--teal-light);color:var(--teal-text);border-color:rgba(43,216,194,.4);}

.fy-pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;font-family:'Poppins',sans-serif;padding:4px 11px;border-radius:10px;background:var(--navy-light);color:var(--navy);border:1px solid rgba(0,1,144,.16);letter-spacing:.02em;}
.fy-pill .fy-dot{width:6px;height:6px;border-radius:50%;background:var(--navy);opacity:.55;flex-shrink:0;}
.fy-month-tag{display:block;font-size:9px;font-weight:600;color:var(--teal-text);opacity:.9;letter-spacing:.03em;margin-top:1px;}
thead th .fy-month-tag{color:#8be9dc;}

.news-bar-wrap{display:flex;flex-direction:column;gap:8px;margin:20px 0;}
.news-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:#f1f4ff;border-radius:14px;gap:12px;}
.news-bar-text{font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:600;color:var(--navy);cursor:pointer;flex:1;min-width:0;}
.news-bar-text b{font-weight:800;}
.news-bar-close{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:var(--navy);opacity:.55;transition:opacity .12s,background .12s;padding:0;}
.news-bar-close:hover{opacity:1;background:rgba(0,1,144,.08);}

/* ══ Pont "publie -> base Omnium" (EPS trimestriels) ══
   Un rang = UNE ligne : libelle + total a gauche, puces a droite. Le
   total est ainsi a hauteur des puces qu'il additionne, au lieu de
   flotter entre deux blocs. Sur mobile, libelle et total se replient en
   colonne etroite - le rang reste sur une seule ligne jusqu'a 320px.
   Echelle typo volontairement pauvre : 13px pour TOUS les nombres et
   libelles de rang, la hierarchie se fait a la couleur seule. */
.eps-rows{display:flex;flex-direction:column;gap:7px;}
.eps-row{display:flex;align-items:center;gap:12px;}
.eps-head{display:flex;align-items:baseline;gap:12px;flex:0 0 268px;min-width:0;}
.eps-lbl{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;flex:0 0 134px;}
.eps-tot{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;white-space:nowrap;}
.eps-tot .eps-cons{font-weight:600;color:var(--muted);}
.eps-tot .eps-analysts{font-weight:600;color:var(--muted);font-size:10.5px;}
.eps-cells{flex:1;display:flex;gap:8px;min-width:0;}
.eps-cells .qs-chip{padding:7px 3px;}
.eps-adj{flex:1;text-align:center;font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;color:var(--teal-text);padding:7px 3px;}
.eps-adj.nil{color:#c9cede;font-weight:600;}
.eps-row.pub .eps-lbl,.eps-row.pub .eps-tot{color:var(--muted);}
.eps-row.adj .eps-lbl,.eps-row.adj .eps-tot{color:var(--teal-text);}
.eps-row.base .eps-lbl,.eps-row.base .eps-tot{color:var(--navy);}
/* Rangee "publie" : puces blanches bordees - le fond bleute est reserve
   a la base Omnium, qui est desormais le chiffre retenu. Le trait plein
   (vs pointille) continue de distinguer publie et estime. */
.eps-row.pub .qs-chip.actual{background:#fff;border-color:var(--border);}
.eps-row.pub .qs-chip.actual .chip-v,.eps-row.pub .qs-chip.actual .chip-q{color:var(--muted);opacity:1;}
/* Sous-lignes de detail par cause : meme grille, registre secondaire. */
.eps-row.adj.sub{margin-top:-3px;}
.eps-lbl.reason{font-size:10.5px;font-weight:600;line-height:1.3;color:var(--teal-text);white-space:normal;}
.eps-adj.sub{font-size:11px;font-weight:600;padding:3px 3px;}
.eps-adj.sub.nil{color:#d7dbe8;}
.eps-yr-solo{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:9px;}

/* ══ These Omnium : l'equation posee ══
   Le rendement attendu est la SOMME de ses deux moteurs - on l'ecrit
   donc avec de vrais operateurs, au lieu d'une fleche qui pointait du
   resultat vers ses composants. L'horizon voyage sur le libelle du CAGR
   et l'hypothese de multiple constant, invisible jusqu'ici, est portee
   par une ligne grise uniforme. */
.th-eq{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:2px 0 0;}
.th-k{font-family:'Poppins',sans-serif;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;white-space:nowrap;}
.th-v{font-family:'Poppins',sans-serif;font-size:20px;font-weight:800;color:var(--navy);line-height:1;}
.th-col.sub .th-v{font-size:15px;}
.th-op{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;color:var(--muted);padding-bottom:2px;}
.th-assume{font-family:'Poppins',sans-serif;font-size:10.5px;font-weight:400;color:var(--muted);margin-top:12px;padding-bottom:2px;}
.eps-lbl-sm{display:none;}
.qs-sum{margin-top:5px;text-align:center;font-family:'Poppins',sans-serif;font-size:9px;font-weight:600;color:var(--muted);}
.qs-sum.ecart{color:#c0392b;}
.coherence{margin-top:6px;display:flex;align-items:flex-start;gap:6px;font-family:'Poppins',sans-serif;font-size:9.5px;color:var(--muted);font-weight:600;text-align:left;line-height:1.4;}

.pe-colhead{font-family:'Poppins',sans-serif;font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:right;margin-bottom:3px;}

<script>
(function(){
  var REF_WIDTH = 1440;
  var CAP_WIDTH = 1920;
  var MOBILE_BREAKPOINT = 760;
  var MIN_ZOOM = 0.80;
  var MAX_ZOOM = CAP_WIDTH / REF_WIDTH;
  function applyAppZoom(){
    var w = window.innerWidth;
    if(w <= MOBILE_BREAKPOINT){
      document.documentElement.style.zoom = 1;
      return;
    }
    var z = w / REF_WIDTH;
    if(z < MIN_ZOOM) z = MIN_ZOOM;
    if(z > MAX_ZOOM) z = MAX_ZOOM;
    document.documentElement.style.zoom = z;
  }
  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t=setTimeout(applyAppZoom,120); });
  applyAppZoom();
  window.__applyAppZoom = applyAppZoom;
})();
</script>

<script>
let state = { tickers: {} };
let CT = "";

const MONTH_ABBR_FR = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fyEndMonth(ticker){
  const d = state.tickers[ticker];
  const m = +d?.fyEndMonth;
  return (m>=1 && m<=12) ? m : 12;
}

function yearsFor(ticker){
  const d = state.tickers[ticker];
  const lastHist = (d && d.data && d.data.length) ? d.data[d.data.length-1].year : (new Date().getFullYear()-1);
  const cy = lastHist + 1;
  const py = [cy, cy+1, cy+2, cy+3, cy+4];
  return { CY: cy, PY: py, LY: py[4] };
}

function tickerCur(ticker){
  const sym=(state?.tickers?.[ticker]?.yahooSymbol||'').toUpperCase();
  if(!sym)return '';                            
  if(!sym.includes('.'))return'$';             
  if(sym.endsWith('.MI')||sym.endsWith('.PA')||sym.endsWith('.DE')||
     sym.endsWith('.AS')||sym.endsWith('.MC')||sym.endsWith('.BR')||
     sym.endsWith('.LS')||sym.endsWith('.HE')||sym.endsWith('.CO')||
     sym.endsWith('.ST')||sym.endsWith('.OL'))return'€';
  if(sym.endsWith('.L')||sym.endsWith('.IL'))return'£';
  if(sym.endsWith('.T')||sym.endsWith('.TK'))return'¥';
  if(sym.endsWith('.TO')||sym.endsWith('.V'))return'C$';
  if(sym.endsWith('.AX'))return'A$';
  if(sym.endsWith('.HK'))return'HK$';
  if(sym.endsWith('.SW')||sym.endsWith('.ZH'))return'CHF';
  return'$'; 
}

function nextEventLabel(ticker){
  const d=state.tickers[ticker];
  const ne=(state.nextEvents&&state.nextEvents[ticker])||d?.nextEvent;
  if(!ne || !ne.label) return '—';
  if(!ne.date) return ne.label;
  const dt=new Date(ne.date);
  if(isNaN(dt)) return ne.label;
  const formatted=dt.toLocaleDateString('en-US',{day:'numeric',month:'short'});
  return `${ne.label} - ${formatted}`;
}
function nextEventDate(ticker){
  const d=state.tickers[ticker];
  const ne=(state.nextEvents&&state.nextEvents[ticker])||d?.nextEvent;
  if(!ne || !ne.date) return null;
  const dt=new Date(ne.date);
  return isNaN(dt) ? null : dt.getTime();
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x+y,r);
    this.arcTo(x,y,x+r,y,r);this.closePath();return this;
  };
}

function normalizeTicker(key,d){
  if(!d.particularites)d.particularites=[];
  if(!d.nextEvent)d.nextEvent=null;
  return d;
}

function normalizeState(s){
  if(!s.tickers)s.tickers={};
  if(!s.nextEvents)s.nextEvents={};
  if(!s.newsDigest)s.newsDigest=[];
  if(!s.newsAll)s.newsAll=[];
  if(!s.dismissedNewsDates)s.dismissedNewsDates=new Set();
  if(!s.marketAction)s.marketAction=null;
  if(!s.webState)s.webState=null;
  if(!s.calendarProposals)s.calendarProposals=[];
  if(!s.priceHistory || typeof s.priceHistory!=='object') s.priceHistory={schemaVersion:1, tickers:{}, earningsDates:{}};
  if(!s.priceHistory.tickers) s.priceHistory.tickers={};
  if(!s.priceHistory.earningsDates) s.priceHistory.earningsDates={};
  Object.keys(s.tickers).forEach(key=>normalizeTicker(key,s.tickers[key]));
  return s;
}

function fingerprint(str){
  let h=5381;
  for(let i=0;i<str.length;i++){h=((h*33)^str.charCodeAt(i))>>>0;}
  return h.toString(16).padStart(8,'0');
}

// Endpoint PHP dedie (a deployer sur model.omnium-capital.com, meme serveur
// que price.php) pour synchroniser l'etat "news ignorees" entre TOUS les
// appareils - contrairement a l'ancien mecanisme localStorage, propre a
// chaque navigateur/appareil. GET renvoie la liste complete ; POST ajoute
// une date. Stockage cote serveur volontairement simple (fichier JSON plat),
// coherent avec le reste de l'infra (pas de base de donnees dediee pour
// cette app). Absence gracieuse : si l'endpoint n'est pas encore deploye ou
// injoignable, l'app degrade silencieusement vers "rien n'est jamais

const DISMISS_ENDPOINT='https://model.omnium-capital.com/dismiss.php';

// ══════════════════════════════════════════════════════════════
// ACCES A L'APP — trois profils, deux mecanismes :
// 1. UTILISATEUR INTERNE (identifiant, persistant) : approuve par
//    Mathieu via la zone admin de admin.html. Identifiant stocke en
//    localStorage (survit a la fermeture du navigateur, contrairement a
//    sessionStorage) et REVALIDE cote serveur a CHAQUE chargement - si
//    Mathieu retire l'identifiant de la liste, l'acces est coupe des le
//    prochain chargement. Pas de mot de passe individuel. Un utilisateur
//    interne peut generer des liens invites (admin.html) mais n'a jamais
//    acces a la liste des utilisateurs.
// 2. MATHIEU (mot de passe) : c'est un utilisateur interne comme les
//    autres cote app (meme identifiant/localStorage), avec en plus le
//    mot de passe admin qui deverrouille la gestion de la liste.
// 3. INVITE (lien temporaire) : token signe (horodatage d'expiration +
//    HMAC, cle secrete jamais exposee au navigateur) genere depuis
//    admin.html. Masque le bouton "Gérer l'accès" et affiche un bandeau
//    "acces temporaire" avec l'heure d'expiration exacte.
// ══════════════════════════════════════════════════════════════
const ACCESS_VERIFY_ENDPOINT='https://model.omnium-capital.com/verify.php';
const USERS_ENDPOINT='https://model.omnium-capital.com/users.php';
const ACCESS_TOKEN_KEY='omniumAccessToken';

// true = approuve, false = explicitement refuse, null = erreur reseau
// (a distinguer : un refus explicite doit bloquer, une panne reseau ne
// doit pas locker definitivement un identifiant deja approuve avant).
async function checkIdentifierApproved(slug){
  try{
    const r=await fetch(USERS_ENDPOINT+'?action=check&id='+encodeURIComponent(slug),{signal:AbortSignal.timeout(8000)});
    const j=await r.json();
    return typeof j?.allowed==='boolean' ? j.allowed : null;
  }catch(e){ return null; }
}

// Retourne 'valid' | 'invalid' | 'error' | 'none' (aucun lien present, on
// passera au parcours identifiant interne).
async function checkGuestLink(){
  const params=new URLSearchParams(location.search);
  const urlToken=params.get('access');
  if(urlToken){
    try{ sessionStorage.setItem(ACCESS_TOKEN_KEY, urlToken); }catch(e){}
    try{ history.replaceState({}, '', location.pathname); }catch(e){}
  }
  let token=urlToken;
  if(!token){ try{ token=sessionStorage.getItem(ACCESS_TOKEN_KEY); }catch(e){ token=null; } }
  if(!token)return 'none';
  try{
    const r=await fetch(ACCESS_VERIFY_ENDPOINT+'?token='+encodeURIComponent(token),{signal:AbortSignal.timeout(8000)});
    const j=await r.json();
    if(j && j.valid){ applyGuestUI(j.expires_at); return 'valid'; }
    try{ sessionStorage.removeItem(ACCESS_TOKEN_KEY); }catch(e){}
    return 'invalid';
  }catch(e){ return 'error'; }
}

// IDENTIFIANT (localStorage) — sert DEUX buts : c'est le controle
// d'acces des utilisateurs internes (voir bloc ci-dessus, revalide a
// chaque chargement via checkIdentifierApproved) ET la cle qui scope la
// dismissal des news PAR PERSONNE plutot que globalement. NORMALISATION :
// le nom saisi est reduit a un identifiant stable (minuscules, sans
// accents, sans espaces/ponctuation) - "MatChandelle" et "matchandelle "

const USER_ID_KEY='omniumUserId';

function slugifyUserName(name){
  return String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'').trim();
}
const USER_ID_SET_AT_KEY='omniumUserIdSetAt';
const USER_ID_MAX_AGE_MS=30*24*60*60*1000; // ~1 mois - redemande periodique de l'identifiant (confort/hygiene, en plus de la revalidation serveur a chaque chargement)

function getUserId(){
  try{ return localStorage.getItem(USER_ID_KEY)||''; }catch(e){ return ''; }
}
function setUserId(id){
  try{
    localStorage.setItem(USER_ID_KEY, id);
    localStorage.setItem(USER_ID_SET_AT_KEY, String(Date.now()));
  }catch(e){}
}
function userIdIsFresh(){
  try{
    const setAt=+localStorage.getItem(USER_ID_SET_AT_KEY);
    return !!setAt && (Date.now()-setAt)<USER_ID_MAX_AGE_MS;
  }catch(e){ return false; }
}

// Bloque le demarrage de l'app tant qu'aucun identifiant interne approuve
// et RECENT (< 1 mois) n'est etabli. Un identifiant frais est revalide
// silencieusement (checkIdentifierApproved) ; un identifiant perime ou
// absent declenche un mini-formulaire plein ecran (pre-rempli si on a
// juste besoin d'une reconfirmation), avec message d'erreur et nouvelle
// tentative en cas de refus.
function ensureUserIdentity(){
  return new Promise(async resolve=>{
    const existing=getUserId();
    let prefill='';
    if(existing){
      if(userIdIsFresh()){
        const ok=await checkIdentifierApproved(existing);
        if(ok!==false){ resolve(existing); return; } // true ou null (panne reseau) : on ne locke pas un acces deja etabli
        setUserId(''); // revoque - on n'en propose pas la reprise
      } else {
        prefill=existing; // perime (>1 mois) mais pas revoque - reconfirmation, pas ressaisie complete
      }
    }
    const overlay=document.createElement('div');
    overlay.id='uid-overlay';
    overlay.innerHTML=`
      <div class="uid-modal">
        <div class="uid-modal-title">Access restricted</div>
        <div class="uid-modal-sub">Enter your identifier to access the application.</div>
        <input type="text" id="uid-input" class="uid-modal-input" placeholder="Your identifier" autocomplete="off" value="${prefill.replace(/"/g,'&quot;')}">
        <div class="uid-modal-err" id="uid-err"></div>
        <button class="btn btn-primary uid-modal-btn" id="uid-submit-btn" type="button">Continue</button>
      </div>`;
    document.body.appendChild(overlay);
    const input=overlay.querySelector('#uid-input');
    const btn=overlay.querySelector('#uid-submit-btn');
    const errEl=overlay.querySelector('#uid-err');
    const submit=async ()=>{
      const slug=slugifyUserName(input.value);
      if(!slug){ input.focus(); return; }
      errEl.style.display='none';
      btn.disabled=true; btn.textContent='Verifying…';
      const ok=await checkIdentifierApproved(slug);
      btn.disabled=false; btn.textContent='Continue';
      if(ok===true){
        setUserId(slug);
        overlay.remove();
        resolve(slug);
        return;
      }
      errEl.textContent=ok===false
        ? 'Identifier not recognized. Contact Mathieu Chandelier to be added.'
        : 'Unable to verify your identifier right now. Please try again.';
      errEl.style.display='block';
      input.focus();
      input.select();
    };
    btn.addEventListener('click',submit);
    input.addEventListener('keydown',e=>{ if(e.key==='Enter')submit(); });
    setTimeout(()=>input.focus(),50);
  });
}

async function fetchDismissedNewsDates(){

// no-store sur tous les fetch de data/*.json : ces fichiers changent
// plusieurs fois par jour (news, market action, refresh de titres) et
// GitHub Pages les sert avec un cache-control de 10 min - un rechargement
// force cote navigateur (Cmd/Ctrl+Maj+R) ne garantit PAS de contourner le
// cache HTTP pour des fetch() declenches en JS (contrairement au
// chargement du document lui-meme), ce qui pouvait laisser l'app afficher
// des donnees perimees plusieurs minutes apres une mise a jour reelle -
// correctif du 14/08/2026.
const NO_STORE = { cache: 'no-store' };

async function loadState() {
  try {
    const manRes = await fetch('data/manifest.json', NO_STORE);
    if (!manRes.ok) throw new Error(`data/manifest.json introuvable: ${manRes.status}`);
    const manifest = await manRes.json();
    const codes = manifest.tickers || [];

    const [results, nextEvents, newsDigest, newsAll, dismissedNewsDates, marketAction, priceHistory, webState, calendarProposals] = await Promise.all([
      Promise.all(codes.map(async code => {
        try {
          const r = await fetch(`data/${code}.json`, NO_STORE);
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const obj = await r.json();
          return [code, obj];
        } catch (e) {
          console.error(`loadState: data/${code}.json illisible -`, e);
          showToast(`⚠ Ticker ${code} unreadable (data/${code}.json) - skipped.`, 6000);
          return null;
        }
      })),
      fetch('data/nextEvents.json', NO_STORE).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      fetch('data/newsDigest.json', NO_STORE).then(r => r.ok ? r.json() : []).catch(() => []),
      fetch('data/newsAll.json', NO_STORE).then(r => r.ok ? r.json() : []).catch(() => []),
      fetchDismissedNewsDates(),
      fetch('data/marketAction.json', NO_STORE).then(r => r.ok ? r.json() : null).catch(() => null),
      // Historique hebdo de prix/EPS pour "Value Rankings" et la section
      // "Historique de valorisation" - absence graciable (feature encore
      // recente, demarrage propre sans backfill) : null tant que le
      // collecteur n'a pas tourne au moins une fois, l'UI degrade
      // proprement plutot que de planter (voir normalizeState).
      fetch('data/priceHistory.json', NO_STORE).then(r => r.ok ? r.json() : null).catch(() => null),
      // Etat du collecteur web hebdomadaire (voir collectors/merge_web.py) -
      // sert uniquement a dater le dernier run reussi pour la notification
      // "Veille IA hebdo" ci-dessous. Absence graciable (fichier cree au
      // tout premier run reussi du pipeline hebdo, pas encore present avant
      // ca) : null degrade proprement, la notification ne s'affiche
      // simplement pas.
      fetch('data/webState.json', NO_STORE).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('data/calendarProposals.json', NO_STORE).then(r => r.ok ? r.json() : []).catch(() => [])
    ]);

    const tickers = {};
    results.forEach(pair => { if (pair) tickers[pair[0]] = pair[1]; });
    const jsonData = { tickers, nextEvents: nextEvents || {}, newsDigest: newsDigest || [], newsAll: newsAll || [], dismissedNewsDates, marketAction: marketAction || null, priceHistory: priceHistory || null, webState: webState || null, calendarProposals: calendarProposals || [] };

    const fp = fingerprint(JSON.stringify({tickers, nextEvents, newsDigest, newsAll}));
    const elFp = document.getElementById('data-fingerprint');
    if (elFp) elFp.textContent = fp;

    return normalizeState(jsonData);
  } catch (e) {
    console.error('loadState:', e);
    showToast('⚠ Unable to load data/manifest.json. Check that it exists.', 8000);
    return normalizeState({tickers:{}});
  }
}

const margeR=r=>r.ca>0?r.ebit/r.ca:0;
const dnebtR=r=>r.ebit>0?r.nd/r.ebit:null;

const PRICE_CACHE_PREFIX='omnium_price_v2_';

function cagr(arr){
  let i0=-1,i1=-1;
  arr.forEach((v,i)=>{if(v>0){if(i0<0)i0=i;i1=i;}});
  if(i0<0||i1<=i0)return 0;
  return Math.pow(arr[i1]/arr[i0],1/(i1-i0))-1;
}

function particulariteYieldPct(d){

}

function getProj(ticker){
  const d=state.tickers[ticker];
  if(!d || !d.data || d.data.length === 0) return {proj:{}, date:null, evtName:null};
  const ca=d.data.map(r=>r.ca),eb=d.data.map(r=>r.ebit),
        nt=d.data.map(r=>r.net),nd=d.data.map(r=>r.nd),sh=d.data.map(r=>r.shares);
  const ly=d.data[d.data.length-1].year;
  const PY=[ly+1,ly+2,ly+3,ly+4,ly+5];
  const lastCA=ca[ca.length-1],lastEB=eb[eb.length-1],
        lastNT=nt[nt.length-1],lastND=nd[nd.length-1],lastSH=sh[sh.length-1];
  const st=a=>{const s=cagr(a.slice(-3));return s||cagr(a);};
  const cCA_st=st(ca),cEB_st=st(eb),cNT_st=st(nt); 
  const cCA_lt=cagr(ca),cEB_lt=cagr(eb),cNT_lt=cagr(nt),cND_lt=cagr(nd);
  const grow=(last,h,rst,rlt)=>h<=2?last*Math.pow(1+rst,h):last*Math.pow(1+rst,2)*Math.pow(1+rlt,h-2);
  const cSH = sh.filter(v=>v>0).length>=2 ? cagr(sh) : 0;
  const base={};
  PY.forEach(y=>{
    const h=y-ly;
    const projShares=Math.max(1, lastSH*Math.pow(1+cSH,h));
    const projNet=grow(lastNT,h,cNT_st,cNT_lt);
    base[y]={
      eps:projNet/projShares,
      ca:grow(lastCA,h,cCA_st,cCA_lt),
      ebit:grow(lastEB,h,cEB_st,cEB_lt),
      net:projNet,
      nd:grow(lastND,h,cND_lt,cND_lt),
      shares:projShares
    };
  });
  const hyp=d.hypothese;
  const hasAdj=hyp&&['adjEPS','adjCA','adjEBIT','adjNet','adjND','adjShares'].some(k=>hyp[k]&&Object.values(hyp[k]).some(v=>v!=null&&v!==''));
  if(!hasAdj)return{proj:base,date:null,evtName:null};
  const out={};
  PY.forEach(y=>{ out[y]={...base[y]}; });
  const has=(o,y)=>o&&o[y]!=null&&o[y]!=='';
  PY.forEach(y=>{
    if(has(hyp.adjCA,y))     out[y].ca    =+hyp.adjCA[y];
    if(has(hyp.adjEBIT,y))   out[y].ebit  =+hyp.adjEBIT[y];
    if(has(hyp.adjNet,y))    out[y].net   =+hyp.adjNet[y];
    if(has(hyp.adjND,y))     out[y].nd    =+hyp.adjND[y];
    if(has(hyp.adjShares,y)) out[y].shares=+hyp.adjShares[y];
    if(has(hyp.adjEPS,y))    out[y].eps   =+hyp.adjEPS[y];
    else if((has(hyp.adjNet,y)||has(hyp.adjShares,y))&&out[y].shares>0)
      out[y].eps=out[y].net/out[y].shares;
  });
  return{proj:out,date:hyp.date,evtName:hyp.source||null};
}

function checkEpsCoherence(d){
  const hyp=d&&d.hypothese;
  if(!hyp)return [];
  const bad=[];
  Object.keys(hyp.adjEPS||{}).forEach(y=>{
    const eps=+hyp.adjEPS[y],net=+(hyp.adjNet?.[y]),sh=+(hyp.adjShares?.[y]);
    if(!eps||!net||!sh)return;
    const implied=net/sh;
    if(Math.abs(eps-implied)/Math.abs(implied)>0.02)
      bad.push({y,eps,implied});
  });
  return bad;
}

let _refreshAllInFlight=false;
function refreshAllPrices(){
  if(_refreshAllInFlight)return;
  const now=Date.now();
  const keys=Object.keys(state.tickers).filter(tk=>{
    const d=state.tickers[tk];
    if(!d||!(d.yahooSymbol||'').trim())return false;
    return !(d._priceCache&&(now-d._priceCache.ts)<PRICE_TTL);
  });
  if(!keys.length)return;
  _refreshAllInFlight=true;
  const CONCURRENCY=10;
  let i=0;
  const worker=async()=>{
    while(i<keys.length){
      const tk=keys[i++];
      try{ await autoFetchPrice(tk,false); }catch(e){}
    }
  };
  Promise.all(Array.from({length:CONCURRENCY},worker)).finally(()=>{_refreshAllInFlight=false;});
}

const PRICE_PROXY_URL='https://model.omnium-capital.com/price.php';
const _fetchInFlight={}; 

function _priceIsPlausible(p,ref,liveConfirmed){
  if(!Number.isFinite(p)||p<=0)return false;
  if(liveConfirmed && ref>0 && (p>ref*4 || p<ref/4))return false;
  return true;
}

async function _fetchPrice(sym){
  try{
    const r=await fetch(PRICE_PROXY_URL+'?ticker='+encodeURIComponent(sym),{signal:AbortSignal.timeout(12000)});
    if(!r.ok)return null;
    const j=await r.json();
    if(!j||!j.price)return null;
    return{price:+j.price, div:(j.div!=null?+j.div:null), source:j.source||null};
  }catch(e){ return null; }
}

async function autoFetchPrice(ticker,force){
  const d=state.tickers[ticker];
  if(!d||!(d.yahooSymbol||'').trim())return;
  updatePriceDot(d._priceUpdatedAt||d._lastFetchAttemptAt||null,true);
  if(!force && d._priceCache && (Date.now()-d._priceCache.ts)<PRICE_TTL){
    updatePriceDot(d._priceUpdatedAt||d._lastFetchAttemptAt||null,false);
    return;
  }
  if(_fetchInFlight[ticker])return;
  _fetchInFlight[ticker]=true;
  const sym=(d.yahooSymbol||'').trim();
  const ref=+d.cours||0;
  const liveConfirmed=!!d._liveConfirmed;
  let finalPrice=null, finalDiv=null, source='';
  try{
    const r=await _fetchPrice(sym);
    if(r && _priceIsPlausible(r.price,ref,liveConfirmed)){
      finalPrice=r.price; finalDiv=r.div; source=r.source||'price.php';
    }
  }catch(e){}
  d._lastFetchAttemptAt=Date.now();
  if(finalPrice!==null){
    d.cours=+finalPrice.toFixed(2);
    d._liveConfirmed=true;
    d._priceCache={price:d.cours,ts:Date.now()};
    d._priceUpdatedAt=Date.now();
    d._priceSource=source;
    if(finalDiv!==null && finalDiv>=0){
      d.dividende=+(+finalDiv).toFixed(4);
    }
    updatePriceDot(d._priceUpdatedAt,false);
    refreshPriceOnly(ticker);
    renderPortfolio();
  } else {
    updatePriceDot(d._priceUpdatedAt||d._lastFetchAttemptAt,true);
  }
  _fetchInFlight[ticker]=false;
}

    const _nm=(d.name||CT||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const fyBadge=isOffCalendar
      ? `<span class="fy-pill" title="This company closes its fiscal year in ${MONTH_ABBR_FR[fyEnd]} rather than December: the years in the table below denote offset fiscal years, not calendar years.">
           <span class="fy-dot"></span>FY ends ${MONTH_ABBR_FR[fyEnd]}
         </span>`
      : '';
    idWrap.innerHTML=`<span class="analyse-name">${_nm}</span>${fyBadge}`;
  }
  const refreshLine=document.getElementById('last-refresh-line');
  if(refreshLine){
    const hyp=d.hypothese;
    if(hyp && hyp.date){
      refreshLine.style.display='block';
      refreshLine.innerHTML=`Last data update: <span style="color:var(--navy);">${hyp.date}</span>`;
    } else {
      refreshLine.style.display='none';
    }

  if(!d.data || d.data.length<2){
    const tb=document.getElementById('analyse-body');
    if(tb) tb.innerHTML=`<tr><td colspan="12" style="color:var(--muted);padding:20px;">Select or add a valid ticker.</td></tr>`;
    return;
  }
  const cours=+document.getElementById('cours').value||1.0;
  const div=d.dividende||0;
  const {CY,PY,LY}=yearsFor(CT);
  let proj,date,evtName;
  try{({proj,date,evtName}=getProj(CT));}catch(e){console.error(e);return;}

  const _epsCY=proj?.[CY]?.eps||0;
  const divPY={};
  PY.forEach(y=>{
    const epsY=proj?.[y]?.eps||0;
    divPY[y]=(_epsCY>0&&div>0)?+(div*(epsY/_epsCY)).toFixed(2):div;
  });

  const ly=d.data[d.data.length-1].year;
  const cur=tickerCur(CT)||'€';
  const curCoursEl=document.getElementById('cours-cur'); if(curCoursEl)curCoursEl.textContent=cur;
  sizeCoursInput();
  const last5=d.data.slice(-5);

  const yearHeaderHtml=(year)=> isOffCalendar
    ? `${year}<span class="fy-month-tag">close ${MONTH_ABBR_FR[fyEnd]}</span>`
    : `${year}`;

  const headRow=document.getElementById('analyse-head');
  if(headRow){
    headRow.innerHTML=`<th>Indicator</th>`
      +last5.map(r=>`<th>${yearHeaderHtml(r.year)}</th>`).join('')
      +PY.map(y=>`<th style="${y===CY?'font-weight:900;':'font-weight:700;'}">${yearHeaderHtml(y)}</th>`).join('');
  }

  const caGrowthHist=r=>{
    const idx=d.data.findIndex(x=>x.year===r.year);
    const prev=idx>0?d.data[idx-1]:null;
    return(prev&&prev.ca>0)?((r.ca-prev.ca)/prev.ca*100):null;
  };
  const caGrowthProj=y=>{
    const prevCA=(y===PY[0])?d.data[d.data.length-1].ca:proj[y-1]?.ca;
    return(prevCA>0)?((proj[y].ca-prevCA)/prevCA*100):null;
  };
  const fGrowth=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(1)+'%';

  const latestCA=d.data[d.data.length-1]?.ca||0;
  const bigUnit=Math.abs(latestCA)>=10000?'Md':'M';
  const fBigTbl=v=>{
    if(v==null||v==='')return'—';
    return bigUnit==='Md' ? (+v/1000).toFixed(2) : fM(v);
  };

  const metrics=[
    {lbl:`Revenue (${bigUnit}${cur})`,        sep:false, hFn:r=>fBigTbl(r.ca),    pFn:y=>fBigTbl(proj[y].ca)},
    {lbl:'Growth %',       sep:false, hFn:r=>fGrowth(caGrowthHist(r)), pFn:y=>fGrowth(caGrowthProj(y))},
    {lbl:`EBIT (${bigUnit}${cur})`,      sep:false, hFn:r=>fBigTbl(r.ebit),  pFn:y=>fBigTbl(proj[y].ebit)},
    {lbl:'EBIT margin',          sep:false, hFn:r=>fpct(margeR(r)), pFn:y=>((proj[y].ebit/proj[y].ca)*100).toFixed(1)+'%'},
    {lbl:`Net income (${bigUnit}${cur})`, sep:false, hFn:r=>fBigTbl(r.net), pFn:y=>fBigTbl(proj[y].net)},
    {lbl:'Shares (M)', sep:false, hFn:r=>r.shares?fM(r.shares):'—', pFn:y=>proj[y].shares?fM(proj[y].shares):'—'},
    {lbl:`EPS (${cur})`,        sep:false, cls:'row-emph', hFn:r=>f2(epsR(r)), pFn:y=>f2(proj[y].eps)},
    {lbl:'P/E (x)',             sep:false, id:'pe-metric-row', cls:'row-emph', hFn:r=>'—', pFn:y=>{const e=proj[y]?.eps;return(cours>0&&e>0)?(cours/e).toFixed(1):'—';}},
    {lbl:`Net debt (${bigUnit}${cur})`, sep:false, hFn:r=>fBigTbl(r.nd),  pFn:y=>fBigTbl(proj[y].nd)},
    {lbl:'Debt / EBIT',        sep:false, hFn:r=>fX(dnebtR(r)), pFn:y=>fX(proj[y].nd/proj[y].ebit)},
    {lbl:`Dividend (${cur})`,   sep:false,  hFn:r=>r.div?f2(r.div):'—', pFn:y=>divPY[y]>0?divPY[y].toFixed(2):'—'},
    {lbl:'Div. yield',      sep:false, hFn:r=>'—', pFn:y=>divPY[y]>0&&cours>0?((divPY[y]/cours)*100).toFixed(1)+'%':'—'},
  ];

  const tbody=document.getElementById('analyse-body');
  if(!tbody)return;
  tbody.innerHTML='';
  
  metrics.forEach((m)=>{
    const tr=document.createElement('tr');
    if(m.cls)tr.className=m.cls;
    if(m.id)tr.id=m.id;
    let c=`<td>${m.lbl}</td>`;
    last5.forEach((row)=>{
      const isLast=row.year===ly;
      const val=m.hFn(row);
      c+=`<td${isLast?' class="hist-last"':''} style="text-align:right;">${val}</td>`;
    });
    PY.forEach((y,i)=>{c+=`<td class="proj-row${i===0?' proj-first':''}" style="background:rgba(43,216,194,.03);"> ${m.pFn(y)}</td>`;});
    tr.innerHTML=c;tbody.appendChild(tr);
  });

  scrollAnalyseTblToDefault(last5.length);
  renderReturnBlock(CT,proj,cours);
  renderContextBullets(CT,proj,cours);
  renderValoHistory(CT);
}

function scrollAnalyseTblToDefault(histCount){
  const headRow=document.getElementById('analyse-head');
  const table=document.getElementById('analyse-tbl');
  if(!headRow||!table)return;
  const wrap=table.parentElement;
  if(!wrap)return;
  const targetIdx=Math.max(0,histCount-2);
  const dataThs=Array.from(headRow.children).slice(1);
  const targetTh=dataThs[targetIdx];
  const firstTh=headRow.children[0];
  if(!targetTh||!firstTh)return;
  requestAnimationFrame(()=>{
    try{
      const stickyW=firstTh.getBoundingClientRect().width;
      wrap.scrollLeft=Math.max(0,targetTh.offsetLeft-stickyW);
    }catch(e){}
  });
}

function buildQuarterlyEPS(qe, cours, epsCY, epsNY, CY, cur, ndCY, shCY, ndNY, shNY, consInfo){
  if(!qe || !Array.isArray(qe.CY) || !Array.isArray(qe.NY) || !qe.CY.length || !qe.NY.length) return null;
  const esc=s=>(s||'').toString().replace(/</g,'&lt;');
  const chip=(p,forceActual,valueOverride)=>{
    const v=valueOverride!=null?valueOverride:(+p.eps);
    return `<div class="qs-chip ${(forceActual||p.actual)?'actual':'estim'}"><div class="chip-q">${esc(p.label)}</div><div class="chip-v">${v.toFixed(2)}</div></div>`;
  };
  const chipsRow=(arr,forceActual)=>`<div class="qs-chips-row">${arr.map(p=>chip(p,forceActual)).join('')}</div>`;
  // Convention du SCHEMA, sans exception :
  //     eps (clean Omnium) = publishedEps + SOMME(impact)
  // Donc `eps` STOCKE EST DEJA la base Omnium, et le chiffre publie se
  // DEDUIT : publishedEps = eps - somme(impact). `impact` n'est pas le
  // montant contenu dans le publie, c'est la CORRECTION a lui appliquer :
  // exclure un gain ponctuel donne un impact NEGATIF (la base Omnium
  // baisse), exclure une charge un impact POSITIF.
  const adjOf=p=>(Array.isArray(p.retraitements)?p.retraitements:[]).reduce((a,r)=>a+(+r.impact||0),0);
  const publishedOf=p=>(+p.eps)-adjOf(p);
  const hasAdj=arr=>arr.some(p=>Array.isArray(p.retraitements)&&p.retraitements.length);
  const fmtSigned=v=>`${v>=0?'+':'−'}${Math.abs(v).toFixed(2)}`;
  const lbl=(long,short)=>`<span class="eps-lbl-lg">${long}</span><span class="eps-lbl-sm">${short}</span>`;
  // Legende statique, discrete, toujours visible sous la ligne de chips -
  // jamais une interaction au tap/clic (revu le 17/08/2026 : l'utilisateur
  // n'avait pas identifie la pastille comme cliquable, l'info doit etre
  // lisible d'emblee, en petits caracteres).
  const retraitLegend=(arr)=>{
    // Regroupe PAR RAISON (pas par trimestre) - un meme retraitement
    // recurrent-mais-variable (ex. mark-to-market OpenAI) qui touche
    // plusieurs trimestres n'affiche le libelle qu'UNE fois, suivi de
    // chaque trimestre concerne (revu le 17/08/2026, evite de repeter le
    // meme libelle 3 fois pour 3 chiffres differents).
    const byRaison=new Map();
    arr.forEach(p=>{
      (p.retraitements||[]).forEach(r=>{
        if(!byRaison.has(r.raison)) byRaison.set(r.raison, []);
        byRaison.get(r.raison).push({label:p.label, impact:r.impact});
      });
    });
    if(!byRaison.size) return '';
    // Les montants ne sont PLUS repetes ici : ils vivent desormais dans la
    // ligne "Adjustments", calee sous chaque trimestre. Et des qu'il y a
    // plusieurs causes, chacune a sa propre sous-ligne chiffree (voir
    // reasonRows) - cette legende n'aurait alors plus rien a apprendre.
    if(byRaison.size>1) return '';
    const lines=[...byRaison.keys()].map(raison=>
      `<div class="qs-retrait-line"><b class="qs-retrait-raison">${esc(raison)}</b></div>`).join('');
    return `<div class="qs-retrait-legend">${lines}</div>`;
  };
  // Quand un exercice porte PLUSIEURS causes distinctes, la ligne
  // "Adjustments" n'en montre que le NET par trimestre - un T4 a -0.34
  // sans dire qu'il agrege -0.07 et -0.27. On eclate alors en une
  // sous-ligne par cause, calee sur la MEME grille de trimestres : chaque
  // montant se lit sous son trimestre, sans renvoi a une legende.
  const reasonRows=(arr)=>{
    const names=[];
    arr.forEach(p=>(p.retraitements||[]).forEach(r=>{ if(!names.includes(r.raison)) names.push(r.raison); }));
    if(names.length<2) return '';
    return names.map(nm=>{
      const cells=arr.map(p=>{
        const hits=(p.retraitements||[]).filter(r=>r.raison===nm);
        const v=hits.reduce((a,r)=>a+(+r.impact||0),0);
        return `<div class="eps-adj sub${hits.length?'':' nil'}">${hits.length?fmtSigned(v):'\u00b7'}</div>`;
      }).join('');
      return `<div class="eps-row adj sub">
        <div class="eps-head"><span class="eps-lbl reason">${esc(nm)}</span></div>
        <div class="eps-cells">${cells}</div>
      </div>`;
    }).join('');
  };
  const legendRow=`<div class="qtr-legend-row"><span class="qtr-legend"><span><span class="leg-dot" style="background:var(--navy);"></span>Published</span><span><span class="leg-dot" style="background:#fff;border:1.5px dashed var(--border);"></span>Estimated</span></span></div>`;

  // Un bloc d'annee = un rang par nature de chiffre, chaque rang sur UNE
  // ligne (libelle + total a gauche, puces a droite). Sans retraitement,
  // publie et base Omnium se confondent : il ne reste qu'un rang, donc
  // exactement l'entete d'avant - le cas courant est le cas degenere du
  // meme gabarit, pas une seconde mise en page.
  const yearBlock=(arr,opts={})=>{
    const consHtml=opts.consensusHtml||'';
    const totalTxt=v=>`${v.toFixed(2)}${cur||'$'}`;
    const cells=(fn)=>`<div class="eps-cells">${arr.map(fn).join('')}</div>`;
    if(!hasAdj(arr)){
      const shown=opts.annual!=null?opts.annual:arr.reduce((a,p)=>a+(+p.eps||0),0);
      return `<div class="qs-qtr-block"><div class="eps-rows">
        <div class="eps-row base">
          <div class="eps-head">
            <span class="eps-lbl" style="flex:0 0 auto;">${opts.label}</span>
            <span class="eps-tot">${shown>0?totalTxt(shown):'—'}${consHtml}</span>
          </div>
          ${cells(p=>chip(p,opts.forceActual))}
        </div>
      </div>${opts.legend?legendRow:''}</div>`;
    }
    // Le pont se lit vers le BAS comme une addition :
    //     publie  +  corrections Omnium  =  base Omnium
    const cleanTotal=arr.reduce((a,p)=>a+(+p.eps||0),0);
    const adjTotal=arr.reduce((a,p)=>a+adjOf(p),0);
    const pubTotal=cleanTotal-adjTotal;
    const nAdj=arr.filter(p=>adjOf(p)!==0).length;
    return `<div class="qs-qtr-block">
      <div class="eps-yr-solo">${opts.label}</div>
      <div class="eps-rows">
        <div class="eps-row pub">
          <div class="eps-head">
            <span class="eps-lbl">${lbl('Published','Published')}</span>
            <span class="eps-tot">${totalTxt(pubTotal)}</span>
          </div>
          ${cells(p=>chip(p,opts.forceActual,publishedOf(p)))}
        </div>
        <div class="eps-row adj">
          <div class="eps-head">
            <span class="eps-lbl">${lbl('Adjustments','Adjust.')}</span>
            <span class="eps-tot">${nAdj>=2?fmtSigned(adjTotal):''}</span>
          </div>
          <div class="eps-cells">${arr.map(p=>{
            const a=adjOf(p);
            return `<div class="eps-adj${a===0?' nil':''}">${a===0?'—':fmtSigned(a)}</div>`;
          }).join('')}</div>
        </div>
        ${reasonRows(arr)}
        <div class="eps-row base">
          <div class="eps-head">
            <span class="eps-lbl">${lbl('Omnium basis','Omnium')}</span>
            <span class="eps-tot">${totalTxt(cleanTotal)}${consHtml}</span>
          </div>
          ${cells(p=>chip(p,opts.forceActual))}
        </div>
      </div>${opts.legend?legendRow:''}${retraitLegend(arr)}</div>`;
  };
  // Le consensus est accole a la ligne "Omnium basis", jamais a la ligne
  // "Published" : un consensus sell-side est etabli hors elements non
  // recurrents, le comparer au chiffre publie brut ferait lire un
  // manquement (ou un depassement) qui n'existe pas.
  const consHtmlOf=(c)=>{
    if(!c||!(c.eps>0)) return '';
    return `<span class="eps-cons"> / ${lbl('Consensus','Cons.')} ${c.eps.toFixed(2)}${cur||'$'}</span>`
      +(c.analysts?`<span class="eps-analysts"> (${c.analysts} analysts)</span>`:'');
  };
  const pyBlock=(Array.isArray(qe.PY)&&qe.PY.length)?{
    year: CY-1,
    annualEps: qe.PY.reduce((a,p)=>a+(+p.eps||0),0),
    html: yearBlock(qe.PY, {label:`EPS ${CY-1}`, forceActual:true})
  }:null;
  const historiqueBlocks=(Array.isArray(qe.historique)?qe.historique:[])
    .filter(h=>h && Array.isArray(h.periods) && h.periods.length)
    .map(h=>({
      year: h.year,
      html: yearBlock(h.periods, {label:`EPS ${h.year}`, forceActual:true})
    }));
  const peCY=(cours>0&&epsCY>0)?(cours/epsCY):null;
  const peNY=(cours>0&&epsNY>0)?(cours/epsNY):null;
  const peFwd=(cours>0&&qe.epsForward12m>0)?(cours/qe.epsForward12m):null;
  const exCashPrice=(nd,sh)=>{
    if(nd==null||!(sh>0))return null;
    const p=cours+(nd/sh);
    return p>0?p:null;
  };
  const priceExCY=exCashPrice(ndCY,shCY);
  const priceExNY=exCashPrice(ndNY,shNY);
  const peExCY=(priceExCY!=null&&epsCY>0)?(priceExCY/epsCY):null;
  const peExFwd=(priceExCY!=null&&qe.epsForward12m>0)?(priceExCY/qe.epsForward12m):null;
  const peExNY=(priceExNY!=null&&epsNY>0)?(priceExNY/epsNY):null;
  const hasExCash=peExCY!=null||peExFwd!=null||peExNY!=null;
  const exCell=v=>hasExCash?`<div class="pe-exval">${v!=null?v.toFixed(1)+'×':'—'}</div>`:'';
  // "->" vient des donnees (forwardPeriodLabel, formats heterogenes selon
  // les titres) : on le rend proprement a l'affichage sans toucher au JSON.
  const fwdLbl=qe.forwardPeriodLabel?esc(qe.forwardPeriodLabel).replace(/\s*->\s*/g,' → '):'';
  const peStack=`<div class="pe-stack">
      <div></div><div class="pe-colhead">Reported</div>${hasExCash?`<div class="pe-colhead pe-exhead">Ex-cash</div>`:''}
      <div class="pe-lbl">${CY}</div><div class="pe-val">${peCY?peCY.toFixed(1)+'×':'—'}</div>${exCell(peExCY)}
      <div class="pe-lbl">12m fwd${fwdLbl?` <span class="pe-sub">(${fwdLbl})</span>`:''}</div><div class="pe-val">${peFwd?peFwd.toFixed(1)+'×':'—'}</div>${exCell(peExFwd)}
      <div class="pe-lbl">${CY+1}</div><div class="pe-val">${peNY?peNY.toFixed(1)+'×':'—'}</div>${exCell(peExNY)}
    </div>`;
  return {
    pyBlock,
    historiqueBlocks,
    legendRow,
    chipsCY: yearBlock(qe.CY,{label:`EPS ${CY}`, annual:epsCY, consensusHtml:consHtmlOf(consInfo&&consInfo.cy)}),
    chipsNY: yearBlock(qe.NY,{label:`EPS ${CY+1}`, annual:epsNY, consensusHtml:consHtmlOf(consInfo&&consInfo.ny)}),
    peStack
  };
}

function renderReturnBlock(ticker, proj, cours){
  const el=document.getElementById('return-block');
  if(!el)return;
  _epsHistOpen=false;
  const d=state.tickers[ticker];
  const {CY,LY}=yearsFor(ticker);
  const cur=tickerCur(ticker)||'€';
  const div=d.dividende||0;
  const epsCY=proj[CY]?.eps||0;
  const epsNY=proj[CY+1]?.eps||0;
  const epsLY=proj[LY]?.eps||0;
  const cagrEps=(epsCY>0&&epsLY>0)?((Math.pow(epsLY/epsCY,0.25))-1)*100:0;
  const bonusYield=particulariteYieldPct(d);
  const yieldPct=(cours>0&&div>0?(div/cours)*100:0)+bonusYield;
  const total=cagrEps+yieldPct;
  const cons=(d.epsConsensus?.year===CY)?d.epsConsensus:null;
  const consNY=d.epsConsensus?.epsNY||0;
  const analystsCY=cons?.analystsCount||null;
  const analystsNY=d.epsConsensus?.analystsCountNY||cons?.analystsCount||null;
  const rawSrc=(cons?.source||'').replace(/consensus sell-side[,\s]*/i,'').trim();
  const srcLine=[rawSrc,cons?.date].filter(Boolean).join(' · ');
  const ndCY=d.hypothese?.adjND?.[CY];
  const shCY=d.hypothese?.adjShares?.[CY];
  const ndNY=d.hypothese?.adjND?.[CY+1];
  const shNY=d.hypothese?.adjShares?.[CY+1];
  const qeBlock=buildQuarterlyEPS(d.hypothese?.quarterlyEPS||null, cours, epsCY, epsNY, CY, cur, ndCY, shCY, ndNY, shNY,
    {cy:(cons?.eps>0?{eps:cons.eps, analysts:analystsCY}:null), ny:(consNY>0?{eps:consNY, analysts:analystsNY}:null)});

  el.innerHTML = `
    <div style="border-top:1px solid var(--border);"></div>
    <div class="rb-header">
      <div class="card-title" style="margin-bottom:0;">Omnium Thesis</div>
    </div>
    <div class="th-eq">
      <div class="th-col"><div class="th-k">Expected return p.a.</div><div class="th-v">${total>=0?'+':''}${total.toFixed(1)}%</div></div>
      <div class="th-op">=</div>
      <div class="th-col sub"><div class="th-k">EPS CAGR ${String(CY).slice(2)}→${String(LY).slice(2)}</div><div class="th-v">${cagrEps>=0?'+':''}${cagrEps.toFixed(1)}%</div></div>
      <div class="th-op">+</div>
      <div class="th-col sub"><div class="th-k">Dividend yield</div><div class="th-v">+${yieldPct.toFixed(1)}%</div></div>
    </div>
    <div class="th-assume">At a constant multiple — no re-rating assumed.</div>
    ${d.hypothese?.cagrBridge?`<div class="rb-bridge-wrap">
      <div style="font-size:11.5px;color:var(--text);font-family:'Quattrocento Sans',serif;line-height:1.5;background:var(--navy-light);border-radius:8px;padding:8px 12px;">${(d.hypothese.cagrBridge||'').toString().replace(/</g,'&lt;')}</div>
    </div>`:''}
    <div style="border-top:1px solid var(--border);margin-bottom:4px;"></div>
    ${qeBlock?`<div class="card-title" style="margin:0 0 10px;">Price-to-Earnings Ratios</div>${qeBlock.peStack}`:''}
    ${qeBlock?.historiqueBlocks?.length?`
    <div class="rb-eps-py-toggle" id="eps-hist-toggle" onclick="toggleEpsHistBlock()">
      <span class="lbl">History (before ${qeBlock.pyBlock?qeBlock.pyBlock.year:CY-1})</span>
      <span class="rb-eps-py-chevron">▼</span>
    </div>
    <div class="rb-eps-py-content" id="eps-hist-content">
      ${qeBlock.historiqueBlocks.map(h=>`
      <div class="rb-eps-block rb-eps-block-py" style="margin-bottom:12px;">${h.html}</div>`).join('')}
    </div>`:''}
    <div class="card-title" style="margin:16px 0 6px;">Earnings Per Share</div>
    ${qeBlock?qeBlock.legendRow:''}
    <div class="rb-eps-grid">
      ${qeBlock?.pyBlock?`<div class="rb-eps-block">${qeBlock.pyBlock.html}</div>`:''}
      <div class="rb-eps-block">${qeBlock?qeBlock.chipsCY:''}</div>
      <div class="rb-eps-block">${qeBlock?qeBlock.chipsNY:''}</div>
