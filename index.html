    headRow.innerHTML=`<th>Indicator</th>`
      +last5.map(r=>`<th>${yearHeaderHtml(r.year)}</th>`).join('')
      +PY.map(y=>`<th style="${y===CY?'font-weight:900;':'font-weight:700;'}">${yearHeaderHtml(y)}</th>`).join('');
  }

  const caGrowthHist=r=>{
    const idx=d.data.findIndex(x=>x.year===r.year);
    const prev=idx>0?d.data[idx-1]:null;
    return(prev&&prev.ca>0)?((r.ca-prev.ca)/prev.ca*100):null;
  };
  const caGrowthProj=y=>{
    const prevCA=(y===PY[0])?d.data[d.data.length-1].ca:proj[y-1]?.ca;
    return(prevCA>0)?((proj[y].ca-prevCA)/prevCA*100):null;
  };
  const fGrowth=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(1)+'%';

  const latestCA=d.data[d.data.length-1]?.ca||0;
  const bigUnit=Math.abs(latestCA)>=10000?'Md':'M';
  const fBigTbl=v=>{
    if(v==null||v==='')return'—';
    return bigUnit==='Md' ? (+v/1000).toFixed(2) : fM(v);
  };

  // Contrainte de capital : presente uniquement pour un emetteur dont la
  // dette nette n'est pas une mesure de levier (banque, assureur).
  const cc=(d.issuerType && d.issuerType!=='industrial' && d.capitalConstraint) ? d.capitalConstraint : null;
  const metrics=[
    {lbl:`Revenue (${bigUnit}${cur})`,        sep:false, hFn:r=>fBigTbl(r.ca),    pFn:y=>fBigTbl(proj[y].ca)},
    {lbl:'Growth %',       sep:false, hFn:r=>fGrowth(caGrowthHist(r)), pFn:y=>fGrowth(caGrowthProj(y))},
    {lbl:`EBIT (${bigUnit}${cur})`,      sep:false, hFn:r=>fBigTbl(r.ebit),  pFn:y=>fBigTbl(proj[y].ebit)},
    {lbl:'EBIT margin',          sep:false, hFn:r=>fpct(margeR(r)), pFn:y=>((proj[y].ebit/proj[y].ca)*100).toFixed(1)+'%'},
    {lbl:`Net income (${bigUnit}${cur})`, sep:false, hFn:r=>fBigTbl(r.net), pFn:y=>fBigTbl(proj[y].net)},
    {lbl:'Shares (M)', sep:false, hFn:r=>r.shares?fM(r.shares):'—', pFn:y=>proj[y].shares?fM(proj[y].shares):'—'},
    {lbl:`EPS (${cur})`,        sep:false, cls:'row-emph', hFn:r=>f2(epsR(r)), pFn:y=>f2(proj[y].eps)},
    {lbl:'P/E (x)',             sep:false, id:'pe-metric-row', cls:'row-emph', hFn:r=>'—', pFn:y=>{const e=proj[y]?.eps;const px=exCashPriceForYear(d,cours,y);return(px>0&&e>0)?(px/e).toFixed(1):'—';}},
    // Le garde-fou de la projection, dont la METRIQUE depend de l'emetteur.
    // Pour un industriel c'est la dette nette : un rachat d'actions qui
    // ferait deriver le levier se voit tout de suite. Pour une banque ou un
    // assureur la dette nette est le metier, pas un levier - ces deux
    // lignes afficheraient des zeros - et la contrainte reelle est le
    // capital reglementaire. Meme emplacement, autre mesure.
    ...(cc ? [
      {lbl:`${cc.metric} (${cc.unit||'%'})`, sep:false, cls:'row-emph',
        hFn:r=>'—',
        pFn:y=>y===Object.keys(proj)[0] && typeof cc.current==='number'
          ? cc.current.toFixed(2).replace(/\.00$/,'')+(cc.unit||'%') : '—'},
      {lbl:`vs ${cc.requirementLabel||'requirement'}`, sep:false,
        hFn:r=>'—',
        pFn:y=>y===Object.keys(proj)[0] && typeof cc.current==='number' && typeof cc.requirement==='number'
          ? '+'+(cc.current-cc.requirement).toFixed(2).replace(/\.00$/,'')+' pt' : '—'},
    ] : [
      {lbl:`Net debt (${bigUnit}${cur})`, sep:false, hFn:r=>fBigTbl(r.nd),  pFn:y=>fBigTbl(proj[y].nd)},
      {lbl:'Debt / EBIT',        sep:false, hFn:r=>fX(dnebtR(r)), pFn:y=>fX(proj[y].nd/proj[y].ebit)},
    ]),
    {lbl:`Dividend (${cur})`,   sep:false,  hFn:r=>r.div?f2(r.div):'—', pFn:y=>divPY[y]>0?divPY[y].toFixed(2):'—'},
    {lbl:'Div. yield',      sep:false, hFn:r=>'—', pFn:y=>divPY[y]>0&&cours>0?((divPY[y]/cours)*100).toFixed(1)+'%':'—'},
  ];

  const tbody=document.getElementById('analyse-body');
  if(!tbody)return;
  tbody.innerHTML='';
  
  metrics.forEach((m)=>{
    const tr=document.createElement('tr');
    if(m.cls)tr.className=m.cls;
    if(m.id)tr.id=m.id;
    let c=`<td>${m.lbl}</td>`;
    last5.forEach((row)=>{
      const isLast=row.year===ly;
      const val=m.hFn(row);
      c+=`<td${isLast?' class="hist-last"':''} style="text-align:right;">${val}</td>`;
    });
    PY.forEach((y,i)=>{c+=`<td class="proj-row${i===0?' proj-first':''}" style="background:rgba(43,216,194,.03);"> ${m.pFn(y)}</td>`;});
    tr.innerHTML=c;tbody.appendChild(tr);
  });

  scrollAnalyseTblToDefault(last5.length);
  renderReturnBlock(CT,proj,cours);
  renderContextBullets(CT,proj,cours);
  renderValoHistory(CT);
}

function scrollAnalyseTblToDefault(histCount){
  const headRow=document.getElementById('analyse-head');
  const table=document.getElementById('analyse-tbl');
  if(!headRow||!table)return;
  const wrap=table.parentElement;
  if(!wrap)return;
  const targetIdx=Math.max(0,histCount-2);
  const dataThs=Array.from(headRow.children).slice(1);
  const targetTh=dataThs[targetIdx];
  const firstTh=headRow.children[0];
  if(!targetTh||!firstTh)return;
  requestAnimationFrame(()=>{
    try{
      const stickyW=firstTh.getBoundingClientRect().width;
      wrap.scrollLeft=Math.max(0,targetTh.offsetLeft-stickyW);
    }catch(e){}
  });
}

function refreshPriceOnly(ticker){
  const peRow=document.getElementById('pe-metric-row');
  if(ticker!==CT || !peRow) return;
  const d=state.tickers[ticker];
  if(!d)return;
  const coursEl=document.getElementById('cours');
  if(coursEl){ coursEl.value=d.cours; sizeCoursInput(); }
  const cours=+d.cours||0;
  let proj;
  try{({proj}=getProj(ticker));}catch(e){return;}
  renderReturnBlock(ticker,proj,cours);
  // Depuis la fusion des deux sections, le graphique vit DANS le bloc que
  // renderReturnBlock vient de reconstruire : sans ce rappel, chaque
  // rafraichissement de cours le faisait disparaitre silencieusement.
  renderValoHistory(ticker);
  const {PY}=yearsFor(ticker);
  const cells=peRow.querySelectorAll('td.proj-row');
  PY.forEach((y,i)=>{
    const e=proj[y]?.eps;
    if(cells[i]) cells[i].textContent=(cours>0&&e>0)?(cours/e).toFixed(1):'—';
  });
}

// Cours retraite de la tresorerie/dette nette de l'annee visee - base de
// reference des P/E depuis le 18/08/2026. omniumND NEGATIF = tresorerie nette
// (le cours baisse), POSITIF = dette nette (le cours monte). Repli sur le
// cours brut quand la donnee manque : pour une banque la dette nette n'a
// pas de sens economique, omniumND y est volontairement absent.
// Detail des retraitements, ouvert a la demande : un seul trimestre a la
// fois, dans le flux (jamais en surcouche flottante, qui demanderait un
// positionnement et pourrait sortir de l'ecran sur mobile).
let _adjDetails={}, _adjOpen=null;
function toggleAdjDetail(blockId, idx){
  const box=document.getElementById(blockId+'-d');
  if(!box) return;
  document.querySelectorAll('.eps-adj.open, .epsg-offc.open').forEach(c=>c.classList.remove('open'));
  const key=blockId+':'+idx;
  if(_adjOpen===key){ _adjOpen=null; box.classList.remove('open'); box.innerHTML=''; return; }
  const per=(_adjDetails[blockId]||[])[idx];
  if(!per||!per.items.length) return;
  _adjOpen=key;
  const cell=document.getElementById(blockId+'-c'+idx);
  if(cell) cell.classList.add('open');
  const esc=t=>(t||'').toString().replace(/</g,'&lt;');
  box.innerHTML=per.items.map(it=>{
    const v=it.impact, sgn=v>=0?'+':'−';
    return `<div class="ad-line"><span><span class="ad-q">${esc(per.q)}</span>${esc(it.raison)}</span>`
      +`<span class="ad-amt">${sgn}${Math.abs(v).toFixed(2)}</span></div>`;
  }).join('');
  box.classList.add('open');
}

// Emetteur financier : la dette nette est le metier (depots, funding du
// livre de credit), pas un levier - le retraitement ex-cash n'a pas de
// sens et les multiples se lisent sur la capitalisation. BNP porte nd=0
// donc le calcul retombait deja juste ; MERCADOLIBRE (classe bank le
// 18/08/2026) porte un nd REEL de funding, que l'ex-cash ajoutait a tort
// a la valeur d'entreprise.
function isFinancialIssuer(d){
  return !!d && ['bank','insurer','broker'].includes(d.issuerType);
}

function exCashPriceForYear(d, cours, year){
  if(!(cours>0)) return null;
  if(isFinancialIssuer(d)) return cours;
  const nd=d?.hypothese?.omniumND?.[year];
  const sh=d?.hypothese?.omniumShares?.[year];
  if(typeof nd!=='number' || !(sh>0)) return cours;
  const p=cours+(nd/sh);
  return p>0 ? p : cours;
}

function buildQuarterlyEPS(qe, cours, epsCY, epsNY, CY, cur, ndCY, shCY, ndNY, shNY, consInfo, proj2Eps, ndY2, shY2){
  if(!qe || !Array.isArray(qe.CY) || !Array.isArray(qe.NY) || !qe.CY.length || !qe.NY.length) return null;
  // Les blocs sont reconstruits a neuf : l'etat d'ouverture d'un detail ne
  // doit pas survivre au re-rendu, sinon le clic suivant sur la meme
  // cellule "referme" un panneau qui n'existe deja plus.
  _adjDetails={}; _adjOpen=null;
  const esc=s=>(s||'').toString().replace(/</g,'&lt;');
  // Convention du SCHEMA, sans exception :
  //     eps (clean Omnium) = publishedEps + SOMME(impact)
  // Donc `eps` STOCKE EST DEJA la base Omnium, et le chiffre publie se
  // DEDUIT : publishedEps = eps - somme(impact). `impact` n'est pas le
  // montant contenu dans le publie, c'est la CORRECTION a lui appliquer :
  // exclure un gain ponctuel donne un impact NEGATIF (la base Omnium
  // baisse), exclure une charge un impact POSITIF.
  const adjOf=p=>(Array.isArray(p.retraitements)?p.retraitements:[]).reduce((a,r)=>a+(+r.impact||0),0);
  const publishedOf=p=>(+p.eps)-adjOf(p);
  const hasAdj=arr=>arr.some(p=>Array.isArray(p.retraitements)&&p.retraitements.length);
  // "Reported" (et non "Published") : la ligne Published du pont porte
  // deja ce mot pour les chiffres bruts - deux sens pour un meme mot
  // rendaient la section ambigue au premier regard (retour 20/08).
  const legendRow=`<div class="qtr-legend-row"><span class="qtr-legend"><span><span class="leg-dot" style="background:var(--navy);"></span>Reported</span><span><span class="leg-dot" style="background:#fff;border:1.5px dashed var(--border);"></span>Estimated</span></span></div>`;

  // ── DESIGN FINAL 20/08/2026 ("tout aligne") ──
  // UNE grille partagee pour toute la section : les intitules T1..T4 (ou
  // S1/S2) vivent UNE seule fois en tete, chaque annee est UNE rangee
  // basse (valeur seule dans les blocs, hauteur uniforme). Le pont
  // published->Omnium devient SUBTIL : dans un bloc ajuste, le publie
  // apparait barre en petit au-dessus de la valeur avec une pastille
  // turquoise (clic -> detail des raisons, mecanisme _adjDetails
  // conserve), et une ligne discrete sous la rangee resume
  // "published X$ − Y$ (raison)". Les triples rangees
  // Published/Adjustments/Omnium disparaissent.
  // Idiome COMPTE DE RESULTAT (design definitif 20/08/2026) : lignes
  // indentees sous l'annee, "(−) One-offs", DOUBLE FILET comptable puis
  // "→ EPS Omnium" - le signal universel du sous-total, lisible au
  // premier regard. Les trimestres (T1..T4 / S1-S2) vivent DANS les
  // blocs de la ligne de resultat de chaque annee (pas d'en-tete
  // detache) ; seuls ces blocs sont "en blocs", les lignes Published et
  // One-offs restent des chiffres nus au-dessus du filet, comme dans un
  // vrai P&L. Totaux en bout de ligne ; YTD sur les lignes publiees d'un
  // exercice en cours ; badge de detail flottant pour ne pas desaxer la
  // valeur de sa colonne.
  const nPer=(qe.CY||[]).length||4;
  const gridStyle=`display:grid;grid-template-columns:var(--epsg-left,74px) repeat(${nPer},1fr) var(--epsg-fy,70px);gap:8px;align-items:center;`;
  const headerRow='';

  const yearBlock=(arr,opts={})=>{
    const blockId=`adj-${(opts.label||'').replace(/[^0-9A-Za-z]/g,'')}`;
    _adjDetails[blockId]=arr.map(p=>({
      q:p.label,
      items:(p.retraitements||[]).map(r=>({raison:r.raison, impact:+r.impact||0}))
    }));
    // Pas de suffixe devise sur les totaux : l'unite est portee UNE fois
    // par le titre de section ("in $"), comme sur le chart EPS (20/08).
    const totalTxt=v=>v.toFixed(2);
    const fmtSigned=v=>`${v>=0?'+':'−'}${Math.abs(v).toFixed(2)}`;
    const shown=opts.annual!=null?opts.annual:arr.reduce((a,p)=>a+(+p.eps||0),0);
    const baseCells=arr.map(p=>{
      const act=(opts.forceActual||p.actual);
      return `<div class="epsg-chip ${act?'act':'est'}"><span class="epsg-q">${esc(p.label)}</span><span class="epsg-v">${(+p.eps).toFixed(2)}</span></div>`;
    }).join('');
    // Le total annuel porte la MEME grammaire que les blocs : micro-label
    // "FY" au-dessus du chiffre (comme T1..T4 dans les blocs) - la
    // colonne de droite se declare total annuel sans en-tete dedie.
    // La serie CONSERVEE ne porte AUCUN libelle (retour 20/08 v4) : les
    // chiffres publies sont publies, les estimations sont evidemment de
    // l'Omnium (legende Reported/Estimated) - "Omnium" n'apprenait rien.
    // Sur une annee a pont, la ligne muette sous le double filet EST le
    // resultat de l'equation Published − One-offs : le filet comptable
    // l'annonce mieux qu'un mot. Seules les lignes d'ENTREE de
    // l'equation gardent un libelle.
    const resultRow=(tot)=>`<div class="epsg-yr" style="${gridStyle}">
        <span></span>
        ${baseCells}
        <span class="epsg-t res fy"><span class="epsg-q">FY</span>${tot>0?totalTxt(tot):'—'}</span>
      </div>`;
    // Annee sans retraitement : titre d'annee + la seule ligne de
    // resultat (cas degenere du meme gabarit).
    if(!hasAdj(arr)){
      return `<div class="epsg-yrhead">${opts.label}</div>${resultRow(shown)}`;
    }
    const cleanTotal=arr.reduce((a,p)=>a+(+p.eps||0),0);
    const adjTotal=arr.reduce((a,p)=>a+adjOf(p),0);
    // Le SIGNE vit sur les VALEURS, pas sur le libelle (retour 20/08 v4) :
    // impact negatif = gain retire du publie (-3.93), impact positif =
    // charge reintegree (+0.50). Il est rendu SUSPENDU (epsg-sg) pour
    // que la grandeur reste alignee au chiffre Published au-dessus.
    const offLbl='One-offs';
    const cellVal=(v)=>`<span class="epsg-sg">${v>=0?'+':'−'}</span>${Math.abs(v).toFixed(2)}`;
    // Exercice en cours : les totaux Published/One-offs ne couvrent que
    // les trimestres REALISES - marques "ytd" pour ne pas laisser croire
    // que l'equation boucle sur l'annee pleine avant sa cloture.
    const hasEst=arr.some(p=>!(opts.forceActual||p.actual));
    const actArr=arr.filter(p=>(opts.forceActual||p.actual));
    const pubTotal=actArr.reduce((a,p)=>a+publishedOf(p),0);
    // Exercice en cours : pas de totaux Published/One-offs (partiels et
    // trompeurs) - seul le total Omnium (annee pleine) s'affiche (20/08).
    const pubCells=arr.map(p=>{
      const act=(opts.forceActual||p.actual);
      return `<div class="epsg-pubcell${act?'':' nil'}">${act?publishedOf(p).toFixed(2):'—'}</div>`;
    }).join('');
    const adjCells=arr.map((p,i)=>{
      const n=(p.retraitements||[]).length;
      if(!n) return `<div class="epsg-offc nil">—</div>`;
      // Badge de compteur FLOTTANT (position absolue) : la valeur reste
      // centree pile dans sa colonne, alignee avec les autres rangees.
      // Le compteur s'affiche MEME a 1 (invite au clic).
      return `<div class="epsg-offc has" onclick="toggleAdjDetail('${blockId}',${i})" id="${blockId}-c${i}"><span class="epsg-vw">${cellVal(adjOf(p))}<span class="epsg-ct"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.5 L5 7 L8.5 3.5"/></svg></span></span></div>`;
    }).join('');
    return `<div class="epsg-yrhead">${opts.label}</div>
      <div class="epsg-yr" style="${gridStyle}">
        <span class="epsg-lbl pub">Published</span>
        ${pubCells}
        <span class="epsg-t pub">${hasEst?'':totalTxt(pubTotal)}</span>
      </div>
      <div class="epsg-yr" style="${gridStyle}">
        <span class="epsg-lbl adj">${offLbl}</span>
        ${adjCells}
        <span class="epsg-t adj">${hasEst?'':`<span class="epsg-vw" style="position:relative;">${cellVal(adjTotal)}</span>`}</span>
      </div>
      <div class="eps-detail" id="${blockId}-d"></div>
      <div class="epsg-dbl"></div>
      ${resultRow(cleanTotal)}`;
  };
  // Le consensus est accole a la ligne "Omnium basis", jamais a la ligne
  // "Published" : un consensus sell-side est etabli hors elements non
  // recurrents, le comparer au chiffre publie brut ferait lire un
  // manquement (ou un depassement) qui n'existe pas.
  // Plus de consensus dans les blocs EPS (retour 20/08) : le consensus
  // vit desormais en COURBE sur le graphique EPS au-dessus (voir
  // buildValoProjectionCurvesSVG), pas en texte redondant ici. Et le
  // libelle se reduit a l'annee seule - "EPS" est deja le titre de
  // section, le repeter sur chaque rang n'apportait rien.
  const pyBlock=(Array.isArray(qe.PY)&&qe.PY.length)?{
    year: CY-1,
    annualEps: qe.PY.reduce((a,p)=>a+(+p.eps||0),0),
    html: yearBlock(qe.PY, {label:`${CY-1}`, forceActual:true})
  }:null;
  const historiqueBlocks=(Array.isArray(qe.historique)?qe.historique:[])
    .filter(h=>h && Array.isArray(h.periods) && h.periods.length)
    .map(h=>({
      year: h.year,
      html: yearBlock(h.periods, {label:`${h.year}`, forceActual:true})
    }));
  const peCY=(cours>0&&epsCY>0)?(cours/epsCY):null;
  const peNY=(cours>0&&epsNY>0)?(cours/epsNY):null;
  const epsY2=proj2Eps!=null?proj2Eps:null;
  const peY2=(cours>0&&epsY2>0)?(cours/epsY2):null;
  const exCashPrice=(nd,sh)=>{
    if(nd==null||!(sh>0))return null;
    const p=cours+(nd/sh);
    return p>0?p:null;
  };
  const priceExCY=exCashPrice(ndCY,shCY);
  const priceExNY=exCashPrice(ndNY,shNY);
  const peExCY=(priceExCY!=null&&epsCY>0)?(priceExCY/epsCY):null;
  const priceExY2=exCashPrice(ndY2,shY2);
  const peExY2=(priceExY2!=null&&epsY2>0)?(priceExY2/epsY2):null;
  const peExNY=(priceExNY!=null&&epsNY>0)?(priceExNY/epsNY):null;
  const hasNdData=(ndCY!=null&&shCY>0)||(ndNY!=null&&shNY>0)||(ndY2!=null&&shY2>0);

  // La table de multiples EST le selecteur du graphique qui la suit : les
  // trois series y etaient nommees une premiere fois, et une seconde fois
  // dans une rangee de pastilles sous le graphique. Une cellule cliquee
  // choisit a la fois l'echeance ET la base (publiee ou ex-cash) ; une
  // cellule sans historique reste affichee mais n'est pas selectionnable.
  // ── P/E : l'ex-cash EST la reference (decision du 18/08/2026) ──
  // Le multiple retenu retraite le cours de la tresorerie/dette nette :
  // (cours + detteNette/actions) / BNA. Motif : un multiple doit refleter
  // la capacite d'une societe a completer sa croissance par du M&A ou des
  // rachats, ce que la seule capitalisation masque. Une seule colonne
  // desormais - le P/E sur capitalisation n'apparait plus que dans la note
  // des cas ou l'ecart depasse le seuil, la ou il manquerait vraiment.
  // REPLI : quand la dette nette n'existe pas (banques - BNP n'a aucun
  // omniumND, et c'est methodologiquement juste : la dette y est la matiere
  // premiere, pas un financement a retrancher), on retombe sur le P/E de
  // capitalisation, en le disant.
  const st=_valoHistState;
  const rows=[
    {key:'cy',  label:`${CY}`, series:{kind:'role',role:'cy'}, std:peCY,  ex:peExCY},
    {key:'ny',  label:`${CY+1}`, series:{kind:'role',role:'ny'}, std:peNY, ex:peExNY},
    {key:'y2',  label:`${CY+2}`, series:{kind:'role',role:'y2'}, std:peY2, ex:peExY2}
  ];
  const item=(r)=>{
    const useEx=r.ex!=null;
    const v=useEx?r.ex:r.std;
    if(v==null) return `<div class="pe-item dead"><span class="pe-lbl">${r.label}</span><span class="pe-val">—</span></div>`;
    // Plus de selection : les trois echeances sont tracees ensemble sur le
    // graphique et s'y nomment elles-memes. Cette table redevient un simple
    // rappel chiffre - elle etait un controle sans affordance, signale par
    // un seul survol, donc totalement invisible au doigt sur mobile.
    return `<div class="pe-item">`
      +`<span class="pe-lbl">${r.label}</span><span class="pe-val">${v.toFixed(1)}×</span></div>`;
  };

  // Note conditionnelle. Seuil a 15% d'ecart avec le P/E de capitalisation :
  // en dessous, la precision serait du bruit (l'ecart mediane du
  // portefeuille est de quelques points) ; au-dela, le multiple affiche
  // surprend et doit s'expliquer, en rendant le chiffre sur capitalisation.
  const PE_NOTE_SEUIL=15;
  const peNote=(()=>{
    if(peExCY==null){
      return hasNdData
        ? ''
        : `<div class="pe-note">Net debt is not meaningful for this issuer — multiples above are on market cap.</div>`;
    }
    if(!(peCY>0)) return '';
    const ecart=(peExCY-peCY)/peCY*100;
    if(Math.abs(ecart)<PE_NOTE_SEUIL) return '';
    const sens=ndCY>0?'net debt':'net cash';
    return `<div class="pe-note">Significant ${sens} — Omnium prices the business on enterprise value. The standard P/E is <b>${peCY.toFixed(1)}×</b> for ${CY}.</div>`;
  })();

  // La rangee de multiples n'est plus rendue : le dernier point de chaque
  // courbe porte deja sa valeur, sous un intitule commun. La note
  // conditionnelle (>15% d'ecart avec le P/E de capitalisation), elle,
  // reste - elle explique un chiffre surprenant et ne double rien.
  const peStack=peNote;
  return {
    pyBlock,
    historiqueBlocks,
    legendRow,
    headerRow,
    chipsCY: yearBlock(qe.CY,{label:`${CY}`, annual:epsCY}),
    chipsNY: yearBlock(qe.NY,{label:`${CY+1}`, annual:epsNY}),
    peStack
  };
}

// Accounting basis : paragraphe TOUJOURS calcule cote client, jamais
// stocke (meme logique que buildGuidanceScorecardSummary) - donc valide
// immediatement pour tout titre deja conforme au SCHEMA, sans aucune
// etape d'ecriture supplementaire a chaque refresh. Synthetise en une
// phrase les trois bases comptables potentiellement en jeu (Omnium,
// communication du groupe, consensus) et le pourquoi d'un ecart eventuel
// - jamais les chiffres eux-memes, deja portes par Earnings Per Share
// juste au-dessus (Published/Adjustments/Omnium/Consensus).
function buildAccountingBasisNote(d, CY){
  // Synthese en UNE phrase, et seulement quand une base DIFFERE (retour
  // 20/08 : le paragraphe long combinait trois phrases + la basisNote
  // brute). Si le groupe reporte GAAP/IFRS - ou si rien n'indique le
  // contraire - il n'y a rien a signaler : on n'affiche rien du tout.
  // Enum strict (voir E8-bis) : une valeur hors {GAAP, non-GAAP} est
  // traitee comme absente plutot que mal-affichee.
  const hyp=d.hypothese||{};
  const asBasis=v=>(v==='GAAP'||v==='non-GAAP')?v:null;
  const mgmtBasis=asBasis(hyp.dernierCall?.resultatsVsConsensus?.epsAdj?.basis);
  const consBasis=asBasis(d.epsConsensus?.basis);
  const name=(d.name||'').toString().replace(/</g,'&lt;');
  // DISTINCTION MESUREE (20/08 v2) : un drapeau "le call comparait en
  // non-GAAP" attrape a tort les DUAL reporters (Booking, Arista...)
  // dont l'ecart ajuste/GAAP est mineur. Depuis le refresh consensus,
  // epsConsensus.adjGapPct mesure l'ecart reel entre le consensus base
  // ajustee (stockanalysis) et le consensus ancre GAAP (MarketScreener)
  // sur le MEME exercice. En dessous de 12%, il n'y a rien a signaler ;
  // au-dela, c'est un vrai communicant ajuste (Sartorius, Danaher,
  // Broadcom...) et la note chiffre l'ecart. Un ecart aberrant (>60%,
  // typiquement un GAAP proche de zero ou de signe oppose) reste
  // signale mais sans pourcentage, qui n'aurait pas de sens.
  const gap=d.epsConsensus?.adjGapPct;
  if(typeof gap==='number'&&isFinite(gap)){
    if(Math.abs(gap)<12) return '';
    const pct=(Math.abs(gap)<=60)?` (≈${gap>0?'+':'−'}${Math.abs(Math.round(gap))}% vs reported this year)`:'';
    return `Omnium relies on reported GAAP/IFRS numbers, whereas ${name}'s guidance and market consensus are based on adjusted figures${pct}.`;
  }
  if(mgmtBasis==='non-GAAP')
    return `Omnium relies on reported GAAP/IFRS numbers, whereas ${name}'s guidance and market consensus are based on adjusted figures.`;
  if(consBasis==='non-GAAP')
    return `Omnium projections are on published GAAP/IFRS — the consensus on ${name} is on an adjusted non-GAAP basis.`;
  return '';
}

// These Omnium : le rendement attendu et la part de chacun de ses moteurs.
// Regles d'affichage :
// - un moteur a ZERO ne produit ni segment ni entree de legende (un titre
//   sans dividende ne doit pas trainer une legende "dividend yield 0%") ;
// - un moteur NON NUL mais minuscule garde une entree de legende ET un
//   segment, borne a une largeur minimale pour rester visible ;
// - le rendement du dividende en CASH et une eventuelle particularite
//   (ex. Vidrala : distribution gratuite d'actions recurrente valorisee
//   5%) sont deux moteurs SEPARES - les fondre masquerait que 5 des 7
//   points de "rendement" ne sont pas du cash ;
// - une particularite NEGATIVE (ex. perte d'exclusivite) ne peut pas se
//   dessiner dans une barre empilee : elle n'a pas de segment mais reste
//   listee en legende avec son signe.
function buildThesisBar(d, cagrEps, cours, div, total, CY, LY){
  const cashYield=(cours>0&&div>0)?(div/cours)*100:0;
  const specials=(d.particularites||[]).filter(p=>p.valuePct!==null&&p.valuePct!==undefined&&p.valuePct!=='');
  const specialPct=specials.reduce((s,p)=>s+(+p.valuePct||0),0);
  const specialTitle=specials.map(p=>(p.text||'').toString()).join(' ');
  const parts=[
    // Pas de periode ici : le titre de section porte deja "· CY → LY", la
    // repeter sur le driver ajoute une lecture sans ajouter d'information.
    {v:cagrEps,   cls:'g', label:'earnings growth', title:''},
    {v:cashYield, cls:'d', label:'dividend yield', title:''},
    {v:specialPct,cls:'s', label:'special items',  title:specialTitle}
  ].filter(p=>Math.abs(p.v)>=0.05);
  const posSum=parts.filter(p=>p.v>0).reduce((s,p)=>s+p.v,0);
  const bar=posSum>0
    ? `<div class="th-bar">${parts.filter(p=>p.v>0).map(p=>
        `<div class="th-seg ${p.cls}" style="flex:${(p.v/posSum).toFixed(4)};"></div>`).join('')}</div>`
    : '';
  // Un seul moteur : le total du titre EST ce moteur - repeter le meme
  // chiffre en legende faisait double emploi (retour Copart 20/08). La
  // legende ne garde alors que le nom du moteur, sans valeur. Le heros et
  // "Assuming constant valuation" vivent desormais dans l'en-tete de
  // section, pas ici.
  const legend=parts.length
    ? `<div class="th-leg">${parts.map(p=>
        `<span${p.title?` title="${escAttr(p.title)}"`:''}><span class="th-sw ${p.cls}${p.v<0?' neg':''}"></span>${parts.length>1?`<b>${p.v>=0?'+':'−'}${Math.abs(p.v).toFixed(1)}%</b> `:''}${p.label}</span>`).join('')}</div>`
    : '';
  return `${bar}${legend}`;
}

// Derniere annee de l'horizon affiche couverte par l'ANALYSE (omniumEPS,
// ou le couple omniumNet+omniumShares dont getProj derive l'EPS), en partant de
// CY sans trou. Le CAGR de tete de fiche ne doit jamais s'appuyer sur une
// annee servie par la base CAGR automatique (~37% d'erreur mediane sur le
// net au back-test du 18/08/2026) - cas MSFT : 2031 non couvert apres la
// cloture FY26, le titre affichait un CAGR contamine par l'extrapolation.
function analysisLY(ticker){
  const d=state.tickers[ticker];
  const {CY,LY}=yearsFor(ticker);
  const h=d?.hypothese;
  if(!h) return LY;
  const num=x=>typeof x==='number';
  const ok=y=>num(h.omniumEPS?.[y])||(num(h.omniumNet?.[y])&&num(h.omniumShares?.[y]));
  let last=null;
  for(let y=CY;y<=LY;y++){ if(ok(y)) last=y; else break; }
  return last===null?LY:last;
}

// ══════════════════════════════════════════════════════════════
// VALUE RANKINGS & HISTORIQUE DE VALORISATION
// Alimente par data/priceHistory.json (collectors/price_history.py,
// 2 captures/semaine, demarrage propre sans backfill - voir ce fichier).
// Chaque snapshot fige {price, cyYear, nyYear, epsByYear, ndCY/NY/Y2} : le P/E
// se lit soit PAR ANNEE ABSOLUE (ex. "P/E 2026", price/epsByYear["2026"]),
// soit PAR ROLE GLISSANT (ex. "P/E annee en cours", price/epsByYear[cyYear]
// - la cle regardee change chaque annee, ce qui rend deux annees civiles
// comparables entre elles). Les deux lectures sont deliberement exposees
// dans l'UI (E.3), pas une seule.
// ══════════════════════════════════════════════════════════════

function peFromRaw(price, eps){
  return (price>0 && eps>0) ? price/eps : null;
}
function snapPEByYear(snap, year){
  if(!snap || !snap.epsByYear) return null;
  return peFromRaw(snap.price, snap.epsByYear[String(year)]);
}
// role: 'cy' | 'ny' | 'y2' (N+2). Le 12 mois glissant a ete retire le
// 18/08/2026 : il n'existait que sur 43 des 60 fiches (il suppose un bloc
// quarterlyEPS renseigne) et faisait doublon avec l'annee en cours en
// debut d'exercice. Trois millesimes pleins le remplacent.
function roleYear(snap, role){
  if(!snap) return null;
  if(role==='ny') return snap.nyYear;
  if(role==='y2') return (typeof snap.cyYear==='number') ? snap.cyYear+2 : null;
  return snap.cyYear;
}
function snapPERole(snap, role){
  if(!snap) return null;
  return snapPEByYear(snap, roleYear(snap, role));
}
// Prix retraite de la tresorerie nette pour l'echeance visee. Les snapshots
// portent ndCY/shCY depuis le 17/08/2026 et ndNY/shNY depuis le 18/08 :
// l'ex-cash de l'annee SUIVANTE n'a donc d'historique qu'a partir des
// captures posterieures a cet ajout (renvoie null avant, ce qui retire
// proprement le point de la courbe plutot que de le calculer a faux).
function snapExCashPrice(snap, role){
  if(!snap || !(snap.price>0)) return null;
  const nd=role==='ny' ? snap.ndNY : role==='y2' ? snap.ndY2 : snap.ndCY;
  const sh=role==='ny' ? snap.shNY : role==='y2' ? snap.shY2 : snap.shCY;
  if(typeof nd==='number' && sh>0){
    const p=snap.price+(nd/sh);
    return p>0 ? p : null;
  }
  // Emetteur SANS AUCUNE donnee de dette nette (banque) : l'ex-cash n'a pas
  // de sens, on retombe sur le cours brut - c'est le repli assume, et il est
  // homogene sur toute la serie.
  if(typeof snap.ndCY!=='number') return snap.price;
  // La donnee existe pour ce titre mais pas pour CETTE echeance (ndNY n'est
  // archive que depuis le 18/08/2026) : surtout PAS de repli ici, il
  // melangerait deux bases au sein d'une meme courbe. Pas de point.
  return null;
}
// series : {kind:'role', role:'cy'|'ny'|'y2'} | {kind:'year', year}
//          + exCash:true pour lire le multiple net de tresorerie.
function snapPEForSeries(snap, series){
  if(!snap || !series) return null;
  if(series.exCash){
    const role=series.kind==='role' ? series.role
             : series.kind==='year' ? (series.year===snap.nyYear?'ny':(series.year===roleYear(snap,'y2')?'y2':'cy'))
             : 'cy';
    const px=snapExCashPrice(snap, role);
    if(px==null) return null;
    const eps=seriesRawEps(snap, series);
    return (eps>0) ? px/eps : null;
  }
  if(series.kind==='year') return snapPEByYear(snap, series.year);
  return snapPERole(snap, series.role);
}
function seriesRawEps(snap, series){
  if(!snap || !series) return null;
  const year = series.kind==='year' ? series.year : roleYear(snap, series.role);
  return snap.epsByYear ? (snap.epsByYear[String(year)] ?? null) : null;
}

const VALO_PERIOD_DAYS={'1s':7,'1m':30,'3m':91,'6m':182,'1y':365};
const VALO_PERIOD_LABELS={'1s':'1 wk','1m':'1 mo','3m':'3 mo','6m':'6 mo','1y':'1 yr'};
const VALO_GAP_TOLERANCE_DAYS=10; // ~1 capture manquee a raison de 2/semaine

function formatFrDate(iso){
  if(!iso) return '';
  const p=String(iso).split('-');
  if(p.length!==3) return iso;
  return `${parseInt(p[2],10)} ${MONTH_ABBR_FR[parseInt(p[1],10)]||''} ${p[0]}`;
}
function isoDateMinusDays(dateStr, days){
  const d=new Date(dateStr+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()-days);
  return d.toISOString().slice(0,10);
}
function isoDatePlusDays(dateStr, days){
  const d=new Date(dateStr+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function dayDiffISO(a,b){
  return Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/86400000);
}
// snapshots supposes tries par date croissante (garanti par l'ecriture
// append-only du collecteur) - renvoie le DERNIER snapshot dont la date
// est <= targetDate, ou null.
function nearestSnapshotBefore(snapshots, targetDate){
  let best=null;
  for(const s of snapshots){ if(s.date<=targetDate) best=s; else break; }
  return best;
}

// Un point d'inflexion (EPS revise) doit toujours afficher l'EVENEMENT qui
// l'explique (resultats, CMD...) et jamais un "refresh" generique - source
// prioritaire coherenceQualitative.historique (type+quarter deja
// disponibles), repli sur hypothese.guidanceHistory (quarter seul, type
// suppose "resultats") si absent. Tolerance +/-5j : la capture a lieu
// lundi/jeudi, pas forcement le jour exact du call.
const VALO_EVENT_TOLERANCE_DAYS=5;
function findRevisionEvent(ticker, dateStr){
  const t=state.tickers && state.tickers[ticker];
  if(!t) return null;
  const candidates=[];
  ((t.coherenceQualitative||{}).historique||[]).forEach(h=>{
    if(h && h.date && h.quarter) candidates.push({date:h.date, label:h.quarter, type:h.type||'resultats'});
  });
  ((t.hypothese||{}).guidanceHistory||[]).forEach(g=>{
    if(g && g.date && g.quarter && !candidates.some(c=>c.date===g.date)) candidates.push({date:g.date, label:g.quarter, type:'resultats'});
  });
  let best=null, bestGap=Infinity;
  candidates.forEach(c=>{
    const gap=Math.abs(dayDiffISO(dateStr, c.date));
    if(gap<=VALO_EVENT_TOLERANCE_DAYS && gap<bestGap){ best=c; bestGap=gap; }
  });
  return best;
}

// Une serie n'est tracable que si l'historique porte au moins 2 points
// exploitables pour ELLE : l'ex-cash de l'annee suivante, par exemple,
// n'existe qu'a partir des snapshots posterieurs a l'ajout de ndNY/shNY.
function valoSeriesPoints(ticker, seriesDesc){
  const ph=state.priceHistory;
  const entry=ph && ph.tickers ? ph.tickers[ticker] : null;
  return (entry ? (entry.snapshots||[]) : [])
    .map(s=>snapPEForSeries(s, seriesDesc))
    .filter(v=>v!=null && isFinite(v));
}
function valoSeriesHasHistory(ticker, seriesDesc){
  return valoSeriesPoints(ticker, seriesDesc).length>=2;
}
function valoEarliestDate(){
  const ph=state.priceHistory;
  if(!ph || !ph.tickers) return null;
  let min=null;
  Object.values(ph.tickers).forEach(entry=>{
    (entry.snapshots||[]).forEach(s=>{ if(!min||s.date<min) min=s.date; });
  });
  return min;
}
function valoPeriodAvailableDate(periodKey){
  const earliest=valoEarliestDate();
  return earliest ? isoDatePlusDays(earliest, VALO_PERIOD_DAYS[periodKey]) : null;
}

function computeRankings(periodKey, seriesDesc, n){
  const days=VALO_PERIOD_DAYS[periodKey];
  const ph=state.priceHistory;
  const out=[];
  if(ph && ph.tickers && days){
    Object.keys(ph.tickers).forEach(tk=>{
      const snaps=ph.tickers[tk].snapshots||[];
      if(snaps.length<2) return;
      const latest=snaps[snaps.length-1];
      const targetDate=isoDateMinusDays(latest.date, days);
      const start=nearestSnapshotBefore(snaps, targetDate);
      if(!start || start===latest) return;
      if(dayDiffISO(targetDate, start.date) > VALO_GAP_TOLERANCE_DAYS) return;
      // Meme gate financier que la fiche : les multiples d'un emetteur
      // financier se comparent sur capitalisation.
      const sd=isFinancialIssuer(state.tickers[tk]) ? {...seriesDesc, exCash:false} : seriesDesc;
      const peStart=snapPEForSeries(start, sd);
      const peEnd=snapPEForSeries(latest, sd);
      if(peStart==null || peEnd==null) return;
      out.push({ticker:tk, peStart, peEnd, deltaPct:(peEnd-peStart)/peStart*100, startDate:start.date, latestDate:latest.date});
    });
  }
  // Filtre par signe AVANT de couper a N : avec un petit nombre de titres
  // disposant d'assez d'historique, ne jamais faire remonter un titre en
  // hausse dans la liste "baisses" (ou l'inverse) juste pour completer le
  // quota - une liste plus courte que N est un resultat honnete valide.
  const gainers=out.filter(r=>r.deltaPct>0).sort((a,b)=>b.deltaPct-a.deltaPct || a.ticker.localeCompare(b.ticker)).slice(0,n);
  const losers=out.filter(r=>r.deltaPct<0).sort((a,b)=>a.deltaPct-b.deltaPct || a.ticker.localeCompare(b.ticker)).slice(0,n);
  return {gainers, losers, total:out.length};
}

function valoFilterByPeriod(snapshots, periodKey){
  if(!periodKey || periodKey==='all' || !VALO_PERIOD_DAYS[periodKey]) return snapshots;
  const latest=snapshots[snapshots.length-1];
  if(!latest) return snapshots;
  const cutoff=isoDateMinusDays(latest.date, VALO_PERIOD_DAYS[periodKey]);
  const filtered=snapshots.filter(s=>s.date>=cutoff);
  // garde au moins les 2 derniers points si la fenetre est trop stricte,
  // pour ne jamais afficher un graphique a 0/1 point alors que 2+ existent
  return filtered.length>=2 ? filtered : snapshots.slice(-2);
}

function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// Moteur de graphique SVG unique, partage entre les mini-cartes "Value
// Rankings" (compact:true) et la vue detaillee "Historique de
// valorisation" (compact:false) - voir plan de fonctionnalite. opts:
// {mode:'pe'|'price', series, periodKey, compact}
// Catmull-Rom -> Bezier cubique : courbe lissee qui passe EXACTEMENT par
// chaque point (pas d'overshoot visible sur des series courtes/eparses
// comme nos 2 snapshots/semaine) - rendu "app boursière premium" plutot
// que la ligne brisee d'un polyline brut.
function smoothPathD(pts){
  if(pts.length<2) return '';
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

// Graduations de l'axe des dates, adaptees a l'amplitude affichee. Le
// PREMIER libelle porte toujours son millesime : sans ca, une suite
// "T4 T2 T4 T2" ne dit jamais de quelle annee on parle. L'echantillonnage
// se fait en UNE fois avec un pas calcule - un elagage repete un sur deux
// supprimerait tous les millesimes de janvier une fois sur deux.
function buildValoXTicks(dates, maxTicks){
  const ms=d=>new Date(d+'T00:00:00Z').getTime();
  const t0=ms(dates[0]), t1=ms(dates[dates.length-1]);
  const spanDays=(t1-t0)/86400000;
  const shortDate=iso=>{const p=iso.split('-');return parseInt(p[2],10)+' '+(MONTH_ABBR_FR[parseInt(p[1],10)]||'');};
  const ticks=[];
  if(spanDays<=95){
    const n=Math.min(4, dates.length);
    for(let i=0;i<n;i++){
      const idx=Math.round(i*(dates.length-1)/(n-1||1));
      ticks.push({t:ms(dates[idx]), label:shortDate(dates[idx])});
    }
  }else if(spanDays<=550){
    const step=spanDays<=200?1:(spanDays<=380?2:3);
    const d=new Date(t0); d.setUTCDate(1);
    if(d.getTime()<t0) d.setUTCMonth(d.getUTCMonth()+1);
    let prevYear=null;
    while(d.getTime()<=t1){
      const m=d.getUTCMonth()+1, y=d.getUTCFullYear();
      ticks.push({t:d.getTime(), label:(prevYear!==null&&y!==prevYear)?`${MONTH_ABBR_FR[m]} ${String(y).slice(2)}`:MONTH_ABBR_FR[m]});
      prevYear=y; d.setUTCMonth(d.getUTCMonth()+step);
    }
  }else{
    const stepMonths=spanDays>1460?12:6;
    const d=new Date(t0); d.setUTCDate(1);
    while(d.getUTCMonth()%stepMonths!==0) d.setUTCMonth(d.getUTCMonth()+1);
    if(d.getTime()<t0) d.setUTCMonth(d.getUTCMonth()+stepMonths);
    while(d.getTime()<=t1){
      const m=d.getUTCMonth()+1, y=d.getUTCFullYear();
      ticks.push({t:d.getTime(), label:m===1?String(y):`${MONTH_ABBR_FR[m]} ${String(y).slice(2)}`});
      d.setUTCMonth(d.getUTCMonth()+stepMonths);
    }
  }
  const cap=maxTicks||6;
  if(ticks.length>cap){
    const step=Math.ceil(ticks.length/cap);
    const kept=ticks.filter((_,i)=>i%step===0);
    ticks.length=0; kept.forEach(k=>ticks.push(k));
  }
  if(ticks.length && !/\d{2}$/.test(ticks[0].label)){
    ticks[0].label+=' '+String(new Date(ticks[0].t).getUTCFullYear()).slice(2);
  }
  return ticks;
}

function buildValoChartSVG(ticker, opts){
  const ph=state.priceHistory;
  const entry=ph && ph.tickers ? ph.tickers[ticker] : null;
  const allSnaps=entry ? (entry.snapshots||[]) : [];
  if(allSnaps.length<2) return null;

  const mode=opts.mode||'pe';
  const series=opts.series;
  const compact=!!opts.compact;
  // tone : accent de couleur pour les mini-cartes du Ranking (coherent
  // avec les couleurs de marque baisses=navy / hausses=turquoise, voir
  // .vr-panel-title) - null sur la fiche titre (courbe neutre navy).
  const tone=opts.tone||null;
  const snaps=valoFilterByPeriod(allSnaps, opts.periodKey);
  if(snaps.length<2) return null;

  const yVal=(snap)=> mode==='price' ? snap.price : snapPEForSeries(snap, series);
  const idxByDate=new Map(allSnaps.map((s,i)=>[s.date,i]));
  const points=snaps
    .map(s=>({snap:s, idx:idxByDate.get(s.date), y:yVal(s)}))
    .filter(p=>p.y!=null && isFinite(p.y));
  if(points.length<2) return null;

  // Fiche titre : le trace demarre a x=0 (aucune gouttiere d'axe), les
  // graduations chiffrees vivant DANS le cadre - c'est ce qui colle le
  // graphique au bord gauche comme le reste de la section. Sur mobile on
  // retrecit le viewBox au lieu de laisser le SVG se reduire a 60% :
  // sinon un texte declare a 9.5px tombe a ~5.5px effectifs et devient
  // illisible.
  const narrow=!compact && typeof window!=='undefined' && window.innerWidth<620;
  // Le viewBox epouse la largeur REELLE du conteneur : a hauteur fixe et
  // largeur 100%, un viewBox de rapport different aurait ete mis a
  // l'echelle sur la hauteur puis CENTRE par preserveAspectRatio, d'ou
  // une large gouttiere vide a gauche. A 1:1 il n'y a ni mise a
  // l'echelle (le texte garde son corps declare) ni centrage.
  const W=compact?260:(opts.width||(narrow?380:640)), H=compact?90:(narrow?250:220);
  const padL=compact?4:0, padR=compact?4:54, padT=compact?10:40, padB=compact?12:30;
  const plotW=W-padL-padR, plotH=H-padT-padB;

  const t0=new Date(points[0].snap.date+'T00:00:00Z').getTime();
  const t1=new Date(points[points.length-1].snap.date+'T00:00:00Z').getTime();
  const tSpan=Math.max(1, t1-t0);
  const xOfT=(t)=> padL + ((t-t0)/tSpan)*plotW;
  const xOf=(dateStr)=> xOfT(new Date(dateStr+'T00:00:00Z').getTime());

  // Moyenne de la serie affichee : attribut permanent de CHAQUE courbe,
  // des le 2e point (pas d'option a activer). Pour la courbe "annee en
  // cours" (role glissant), elle s'accumule naturellement d'une annee
  // civile a l'autre puisque la serie elle-meme est continue.
  // Series secondaires (les autres echeances de la table de multiples) :
  // tracees ensemble plutot que choisies une par une. Elles n'ont ni
  // moyenne ni points - juste un trait fin et leur nom en bout, sinon
  // trois courbes plus trois moyennes feraient six lignes.
  const extras=(compact?[]:(opts.extraSeries||[])).map(ex=>({
    label: ex.label,
    pts: snaps.map(s=>({snap:s, y:snapPEForSeries(s, ex.series)}))
              .filter(p=>p.y!=null && isFinite(p.y))
  })).filter(e=>e.pts.length>=2);

  const yVals=points.map(p=>p.y);
  const avg=compact?null:yVals.reduce((a,b)=>a+b,0)/yVals.length;
  let yMin=Math.min(...yVals), yMax=Math.max(...yVals);
  extras.forEach(e=>e.pts.forEach(p=>{ if(p.y<yMin)yMin=p.y; if(p.y>yMax)yMax=p.y; }));
  if(avg!=null){ yMin=Math.min(yMin,avg); yMax=Math.max(yMax,avg); }
  if(yMin===yMax){ yMin-=Math.abs(yMin*0.1)||1; yMax+=Math.abs(yMax*0.1)||1; }
  // Marge plus genereuse hors mini-carte : les graduations chiffrees sont
  // posees dans ces bandes haute/basse, qu'aucun point n'atteint - c'est
  // ce qui leur evite tout aplat de fond (qui decouperait le trace).
  // Marges ASYMETRIQUES hors mini-carte : la bande haute loge les intitules
  // d'evenements, l'etiquette de moyenne et la graduation - a 16% le trace
  // culminait a ~11% du bord et tout s'y ecrasait (constat ABT mobile).
  const marginTop=(yMax-yMin)*(compact?0.1:0.30);
  const marginBot=(yMax-yMin)*(compact?0.1:0.12);
  yMin-=marginBot; yMax+=marginTop;
  const yOf=(v)=> padT + (1-(v-yMin)/(yMax-yMin))*plotH;

  const priceCur=mode==='price' ? tickerCur(ticker) : '';
  const fmtPrice=(v)=> v.toFixed(2)+priceCur;

  const lineColor=tone==='up' ? 'var(--teal-dark-text)' : tone==='down' ? 'var(--navy)' : 'var(--navy)';
  const areaColor=tone==='up' ? 'var(--teal)' : tone==='down' ? 'var(--navy)' : 'var(--navy-light)';
  const areaOpacity=tone ? .12 : .5;
  const dotColor=tone==='up' ? 'var(--teal-dark-text)' : 'var(--navy)';

  // Inflexion "refresh Omnium" : la valeur BRUTE de la serie affichee a
  // change entre deux snapshots CONSECUTIFS (dans l'historique complet du
  // titre, pas seulement la fenetre affichee) - detection precise, propre
  // a CHAQUE courbe (un refresh qui revise epsNY sans toucher epsCY ne
  // marque rien sur la courbe CY). Zero champ stocke a part, tout vient de
  // epsByYear deja present sur chaque snapshot.
  const earningsDates=(ph.earningsDates && ph.earningsDates[ticker]) || [];

  const inflexionIdx=new Set();   // conserve pour les mini-cartes (compact)
  const winStart=points[0].snap.date, winEnd=points[points.length-1].snap.date;
  const extraEvent=(state.tickers[ticker]?.hypothese||{}).revisionEvent;
  const allEventDates=earningsDates.concat(
    (extraEvent&&extraEvent.date&&!earningsDates.includes(extraEvent.date))?[extraEvent.date]:[]);
  const visibleEarnings=compact ? [] : allEventDates.filter(d=>d>=winStart && d<=winEnd).sort();

  const xyPts=points.map(p=>[xOf(p.snap.date), yOf(p.y)]);
  const lineD=smoothPathD(xyPts);
  const areaBase=(padT+plotH).toFixed(1);
  const areaPath=`${lineD} L${xyPts[xyPts.length-1][0].toFixed(1)},${areaBase} L${xyPts[0][0].toFixed(1)},${areaBase} Z`;

  // Axes (fiche titre uniquement - les mini-cartes du Ranking restent des
  // sparklines epurees sans grille, cf. Apple Stocks/Robinhood watchlist).
  // L'unite est portee UNE fois par une etiquette en tete d'axe, les
  // graduations restent des nombres nus - au lieu de repeter "×" ou la
  // devise sur chaque valeur.
  const fmtY=(v)=> v.toFixed(mode==='price'?2:1);
  const serieYear=(()=>{
    const last=allSnaps[allSnaps.length-1];
    if(!series||!last) return null;
    return series.kind==='year' ? series.year : roleYear(last, series.role);
  })();
  // "ex-cash" ne s'ecrit que si le retraitement a REELLEMENT lieu : sur un
  // emetteur sans dette nette (banque) le calcul retombe sur le cours brut,
  // et annoncer ex-cash serait faux.
  const exCashReel=!!(series&&series.exCash)
    && typeof (allSnaps[allSnaps.length-1]||{}).ndCY==='number';
  // L'annee ne figure dans l'unite que si UNE seule echeance est tracee :
  // des que les trois le sont, chacune se nomme au bout de sa courbe et
  // titrer l'axe "P/E 2027" designerait a tort l'ensemble du graphique.
  const axisUnit=mode==='price'
    ? `Price, in ${tickerCur(ticker)||'$'}`
    : `P/E${exCashReel?' ex-cash':''}${(serieYear&&!extras.length)?' '+serieYear:''}, in ×`;
  const axText=(x,y,txt,anchor)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="9.5" font-weight="400" font-family="Poppins,sans-serif" fill="var(--muted)" text-anchor="${anchor}">${txt}</text>`;
  // 3 graduations tracees, 2 seulement chiffrees (haut et bas) : la
  // mediane reste un trait muet. Les deux etiquettes sont posees hors de
  // la bande occupee par la courbe, donc SANS aucun aplat de fond.
  const vTop=yMax-marginTop*0.62, vBot=yMin+marginBot*0.62;
  const yAxis=compact ? '' : (
    `<text x="${padL}" y="15" font-size="13" font-weight="700" font-family="Poppins,sans-serif" fill="var(--navy)" text-anchor="start">${axisUnit}</text>`
    + [vTop,(yMax+yMin)/2,vBot].map(v=>{
      const y=yOf(v).toFixed(1);
      return `<line x1="${padL}" x2="${(padL+plotW).toFixed(1)}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    }).join('')
    + axText(padL, yOf(vTop)-6, fmtY(vTop), 'start')
    + axText(padL, yOf(vBot)+12, fmtY(vBot), 'start')
  );
  // Abscisses adaptatives : dates courtes en dessous de ~3 mois, mois
  // ensuite (millesime au changement d'annee), semestres/annees au-dela
  // de 18 mois - et jamais plus de ~5 etiquettes. Sans ca, a 2 captures
  // par semaine, l'axe devient illisible en quelques mois.
  const xAxis=compact ? '' : (()=>{
    const yb=(padT+plotH+17);
    const ticks=buildValoXTicks(points.map(p=>p.snap.date), narrow?4:6);
    return ticks.map((tk,i)=>{
      const anchor=i===0?'start':(i===ticks.length-1?'end':'middle');
      return axText(xOfT(tk.t), yb, tk.label, anchor);
    }).join('');
  })();

  // Ordonnee du trace principal a un x quelconque (interpolation lineaire).
  const curveYAtX=(x)=>{
    if(!xyPts.length) return padT+plotH/2;
    if(x<=xyPts[0][0]) return xyPts[0][1];
    const last=xyPts[xyPts.length-1];
    if(x>=last[0]) return last[1];
    for(let i=1;i<xyPts.length;i++){
      if(x<=xyPts[i][0]){
        const [x0,y0]=xyPts[i-1],[x1,y1]=xyPts[i];
        return y0+(y1-y0)*((x-x0)/((x1-x0)||1));
      }
    }
    return last[1];
  };
  // MARQUEURS D'EVENEMENTS SOCIETE (E7 quinquies) : pastille teal =
  // resultats, gold = evenement particulier (CMD, acquisition...), chacune
  // DOCUMENTEE par son intitule au-dessus - donc aucune legende requise.
  // L'intitule bascule sous la pastille si le haut du cadre le rognerait.
  const evMapPE=compact?{}:companyEventsMap(ticker);
  const earningsMarks=compact?'':visibleEarnings.map(d=>{
    const ev=evMapPE[d]||{label:'Earnings',type:'earnings'};
    const x=xOf(d), y=curveYAtX(x);
    const col=ev.type==='earnings'?'var(--teal)':'var(--gold)';
    const above=y-10>padT+8;
    const ly=above?y-9:y+16;
    const halfW=(ev.label||'').length*2.9;
    const lx=Math.min(Math.max(x,padL+halfW),padL+plotW-halfW);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${col}" stroke="var(--navy)" stroke-width="1"><title>${ev.label} – ${formatFrDate(d)}</title></circle>`
      +`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9.5" font-weight="600" font-family="Poppins,sans-serif" fill="var(--muted)" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;">${ev.label}</text>`;
  }).join('');


  // Moyenne : pointille gris discret, etiquette POSEE AU-DESSUS du trait
  // (jamais a cheval, elle serait barree) et sans aplat de fond. En
  // graisse normale, comme les graduations.
  const avgMark=(compact||avg==null) ? '' : (()=>{
    const y=yOf(avg);
    const n=points.length;
    // Nomme la SERIE, pas la periode couverte : la serie est un role
    // glissant qui s'accumule d'une annee civile a l'autre, donc
    // "2027 average" deviendrait faux en 2028 sur la meme courbe. Pas de
    // date de depart non plus - l'axe la porte deja, la repeter embrouille.
    // Sur ecran etroit le libelle long occupait ~45% du trace et finissait
    // colle a la courbe : forme courte, meme information (l'axe et le
    // pointille portent deja le contexte).
    const lbl=`${narrow?'avg':'current-year average'} ${fmtY(avg)}${mode==='price'?'':'\u00d7'}`;
    const lblW=lbl.length*5.2+10;
    // Ordonnee du trace pour un x quelconque (interpolation lineaire sur
    // la polyligne - suffisamment proche de la courbe lissee).
    const curveYAt=(x)=>{
      if(x<=xyPts[0][0]) return xyPts[0][1];
      const last=xyPts[xyPts.length-1];
      if(x>=last[0]) return last[1];
      for(let i=1;i<xyPts.length;i++){
        if(x<=xyPts[i][0]){
          const [x0,y0]=xyPts[i-1], [x1,y1]=xyPts[i];
          return y0+(y1-y0)*((x-x0)/((x1-x0)||1));
        }
      }
      return last[1];
    };
    // Balayage (fenetre x, cote) : la degagement est mesure entre la BANDE
    // DU TEXTE (a sa position reelle, au-dessus ou en dessous du trait) et
    // TOUTES les courbes tracees (principale + series secondaires) - l'ancien
    // critere ne regardait que l'ecart trace/ligne et posait le texte a 5px
    // du trait, ou la courbe pouvait passer (constat ABT mobile).
    const allCurves=[xyPts].concat(extras.map(e=>
      e.pts.map(p=>[xOf(p.snap.date), yOf(p.y)])));
    const anyCurveYAt=(x)=>allCurves.map(pts=>{
      if(!pts.length) return null;
      if(x<=pts[0][0]) return pts[0][1];
      const last=pts[pts.length-1];
      if(x>=last[0]) return last[1];
      for(let i=1;i<pts.length;i++){
        if(x<=pts[i][0]){
          const [x0,y0]=pts[i-1],[x1,y1]=pts[i];
          return y0+(y1-y0)*((x-x0)/((x1-x0)||1));
        }
      }
      return last[1];
    }).filter(v=>v!=null);
    let best={cx:padL+plotW/2, above:true, gap:-1};
    if(plotW>lblW){
      for(let i=0;i<=48;i++){
        const cx=padL+lblW/2+(plotW-lblW)*(i/48);
        for(const above of [true,false]){
          const yLc=above ? y-10 : y+10;   // centre vertical du texte
          if(yLc-6<padT+4 || yLc+6>padT+plotH-2) continue;
          let minD=Infinity;
          for(let k=0;k<=8;k++){
            anyCurveYAt(cx-lblW/2+lblW*k/8).forEach(cy=>{
              minD=Math.min(minD, Math.abs(cy-yLc));
            });
          }
          const score=minD+(above?0.5:0);   // a egalite, au-dessus
          if(score>best.gap) best={cx, above, gap:score};
        }
      }
    }
    const bestCx=best.cx;
    const ly=best.above ? y-6 : y+13;
    return `<line x1="${padL}" x2="${(padL+plotW).toFixed(1)}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#9aa3b2" stroke-width="1.25" stroke-dasharray="4,4"/>`
      +`<text x="${bestCx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9.5" font-weight="400" font-family="Poppins,sans-serif" fill="#6b7280" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;">${lbl}</text>`;
  })();

  // Au-dela de ~40 points, les pastilles individuelles se touchent et le
  // trace devient une chenille : on ne garde alors que les marqueurs de
  // revision. A 2 captures/semaine ce seuil tombe vers 5 mois d'historique.
  const dense=!compact && points.length>40;
  const dots=points.map(p=>{
    const isInflexion=inflexionIdx.has(p.idx);
    if(dense && !isInflexion) return '';
    const cx=xOf(p.snap.date).toFixed(1), cy=yOf(p.y).toFixed(1);
    const r=isInflexion?(compact?3.5:5):(compact?2.25:3.5);
    return isInflexion
      ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--gold)" stroke="var(--navy)" stroke-width="1"/>`
      : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${dotColor}"/>`;
  }).join('');

  // Remonte a l'appelant ce qui est REELLEMENT trace, pour que la legende
  // n'annonce jamais un marqueur absent de l'ecran.
  if(opts.out){
    opts.out.hasEarnings=visibleEarnings.length>0;
    opts.out.hasAvg=avg!=null;
  }

  // Tooltip au survol : toujours actif sur la fiche titre (souris + tap) ;
  // sur les mini-cartes du Ranking, SOURIS UNIQUEMENT (pas de touchstart)
  // pour ne jamais interferer avec le tap-pour-ouvrir de la carte entiere
  // sur mobile.
  const hitTargets=points.map((p,i)=>{
    const cx=xOf(p.snap.date);
    const bandW=points.length>1 ? plotW/(points.length-1) : plotW;
    const rx=(cx-bandW/2).toFixed(1);
    const isInflexion=inflexionIdx.has(p.idx);
    const event=isInflexion ? findRevisionEvent(ticker, p.snap.date) : null;
    const info={date:p.snap.date, price:p.snap.price, val:p.y, mode, isInflexion, eventLabel:event?event.label:null, eventType:event?event.type:null};
    return '';
  }).join('');

  // Traces des echeances secondaires : trait fin, aucun point, aucune
  // moyenne. Nuances de navy decroissantes = echeance plus lointaine.
  const EXTRA_TONES=['#4d4eb8','#9a9bd6'];
  const extrasSvg=extras.map((e,i)=>{
    const d=e.pts.map((p,j)=>`${j?'L':'M'}${xOf(p.snap.date).toFixed(1)} ${yOf(p.y).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${EXTRA_TONES[i]||EXTRA_TONES[1]}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');

  const endLabel=(()=>{
    const last=points[points.length-1];
    const txt=mode==='price' ? fmtPrice(last.y) : last.y.toFixed(1)+'×';
    const lx=xyPts[xyPts.length-1][0], ly=yOf(last.y);
    if(compact){
      return `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.5" fill="#fff" stroke="${dotColor}" stroke-width="1.5"/>`;
    }
    // Sans echeance secondaire, la pastille historique suffit : une seule
    // courbe, aucune ambiguite sur ce que designe le chiffre.
    if(!extras.length){
      const tw=txt.length*6.0+10;
      return `<rect x="${(lx+7).toFixed(1)}" y="${(ly-8.5).toFixed(1)}" width="${tw.toFixed(1)}" height="17" rx="5" fill="${lineColor}"/>`+
        `<text x="${(lx+7+tw/2).toFixed(1)}" y="${(ly+1).toFixed(1)}" font-size="9.5" font-weight="800" font-family="Poppins,sans-serif" fill="#fff" text-anchor="middle" dominant-baseline="middle">${txt}</text>`;
    }
    // Trois echeances tracees ensemble : chacune se nomme au bout de sa
    // propre courbe (annee au-dessus, multiple en dessous), ce qui rend le
    // selecteur inutile. Anti-chevauchement vertical sur les trois.
    const items=[{lab:opts.seriesLabel||'', val:txt, y:ly, col:lineColor, w:800}]
      .concat(extras.map((e,i)=>({
        lab:e.label, val:e.pts[e.pts.length-1].y.toFixed(1)+'×',
        y:yOf(e.pts[e.pts.length-1].y), col:EXTRA_TONES[i]||EXTRA_TONES[1], w:700
      })));
    const ord=items.map((it,i)=>({y:it.y,i})).sort((a,b)=>a.y-b.y);
    let cur=-1e9; ord.forEach(o=>{ o.ny=Math.max(o.y,cur+32); cur=o.ny; });
    const over=ord[ord.length-1].ny-(padT+plotH);
    if(over>0) ord.forEach(o=>o.ny-=over);
    ord.forEach(o=>{ items[o.i].ny=Math.max(o.ny,padT+7); });
    // Intitule de la colonne, ancre SUR la colonne (juste au-dessus de la
    // premiere valeur) et non sur une ligne de base lointaine : pose en
    // haut du cadre il flottait sans rattachement visible aux chiffres
    // qu'il annonce. "Today" plutot que "Current" - la moyenne s'appelle
    // deja "current-year average" et deux "current" voisins se
    // confondraient.
    // Ancre le TODAY sur la colonne elle-meme : juste au-dessus du premier
    // libelle d'annee (pas sur la ligne de tete du cadre, ou il flottait a
    // hauteur du titre HTML du chart, sans rattachement aux chiffres).
    // Centre sur la largeur reelle de la plus large valeur de la colonne.
    const vw=Math.max(...items.map(it=>it.val.length))*6.8;
    const colMid=lx+7+vw/2;
    const headY=Math.max(12, Math.min(...items.map(it=>it.ny))-22);
    const head=`<text x="${colMid.toFixed(1)}" y="${headY.toFixed(1)}" font-size="10" font-weight="800" font-family="Poppins,sans-serif" fill="var(--navy)" text-anchor="middle" letter-spacing=".05em">TODAY</text>`;
    return head+items.map(it=>{
      // Pas de filet de rappel entre le point et son etiquette deplacee
      // (retour 20/08 : ces petits traits intriguaient plus qu'ils ne
      // guidaient) - la couleur de l'annee suffit a rattacher l'etiquette.
      const lead='';
      return lead
        +`<circle cx="${lx.toFixed(1)}" cy="${it.y.toFixed(1)}" r="3" fill="${it.col}"/>`
        // L'annee garde la teinte de SA courbe (c'est ce qui rattache
        // l'etiquette au trace) ; la valeur passe en navy gras pour tous,
        // c'est le chiffre qu'on vient chercher et il doit ressortir.
        // L'annee respire au-dessus de son multiple (16px d'ecart de ligne
        // de base, contre 11 auparavant ou les deux se touchaient) et
        // s'allege : elle situe, elle n'est pas ce qu'on vient lire.
        +`<text x="${(lx+7).toFixed(1)}" y="${(it.ny-5).toFixed(1)}" font-size="9.5" font-weight="600" font-family="Poppins,sans-serif" fill="${it.col}" opacity=".85" letter-spacing=".03em">${it.lab}</text>`
        +`<text x="${(lx+7).toFixed(1)}" y="${(it.ny+11).toFixed(1)}" font-size="13" font-weight="800" font-family="Poppins,sans-serif" fill="var(--navy)">${it.val}</text>`;
    }).join('');
  })();

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="${compact?'xMidYMid':'xMinYMid'} meet" style="display:block;overflow:visible;">
    <path d="${areaPath}" fill="${areaColor}" opacity="${areaOpacity}"/>
    ${yAxis}
    ${earningsMarks}
    ${extrasSvg}
    <path d="${lineD}" fill="none" stroke="${lineColor}" stroke-width="${compact?1.75:2.25}" stroke-linejoin="round" stroke-linecap="round"/>
    ${avgMark}
    ${dots}
    ${endLabel}
    ${xAxis}
    ${hitTargets}
  </svg>`;
}
