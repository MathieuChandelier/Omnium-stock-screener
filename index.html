}

function fmtBigNum(v){
  if(v===null||v===undefined||v==='')return null;
  const n=+v; if(!isFinite(n))return null;
  return Math.abs(n)>=1000 ? (n/1000).toFixed(2).replace(/\.00$/,'')+' Md' : n.toFixed(n<10&&n!==0?2:0)+' M';
}
function fmtPctDelta(actual,consensus){
  if(actual==null||consensus==null||consensus===0||!isFinite(+actual)||!isFinite(+consensus))return null;
  return ((+actual-+consensus)/Math.abs(+consensus))*100;
}
function pctBadge(delta){
  if(delta===null)return '';
  const col=delta>=0?'var(--teal-text)':'#e05252';
  const bg=delta>=0?'rgba(43,216,194,.14)':'rgba(224,82,82,.1)';
  return `<span style="font-size:10.5px;font-weight:800;font-family:'Poppins',sans-serif;color:${col};background:${bg};border-radius:5px;padding:1px 6px;white-space:nowrap;">${delta>=0?'+':''}${delta.toFixed(1)}%</span>`;
}

// ══════════════════════════════════════════════════════════════
// VALUE RANKINGS & HISTORIQUE DE VALORISATION
// Alimente par data/priceHistory.json (collectors/price_history.py,
// 2 captures/semaine, demarrage propre sans backfill - voir ce fichier).
// Chaque snapshot fige {price, cyYear, nyYear, epsByYear, epsFwd} : le P/E
// se lit soit PAR ANNEE ABSOLUE (ex. "P/E 2026", price/epsByYear["2026"]),
// soit PAR ROLE GLISSANT (ex. "P/E annee en cours", price/epsByYear[cyYear]
// - la cle regardee change chaque annee, ce qui rend deux annees civiles
// comparables entre elles). Les deux lectures sont deliberement exposees
// dans l'UI (E.3), pas une seule.
// ══════════════════════════════════════════════════════════════

function peFromRaw(price, eps){
  return (price>0 && eps>0) ? price/eps : null;
}
function snapPEByYear(snap, year){
  if(!snap || !snap.epsByYear) return null;
  return peFromRaw(snap.price, snap.epsByYear[String(year)]);
}
function snapPERole(snap, role){ // role: 'cy' | 'ny'
  if(!snap) return null;
  const y = role==='ny' ? snap.nyYear : snap.cyYear;
  return snapPEByYear(snap, y);
}
function snapPEFwd(snap){
  return snap ? peFromRaw(snap.price, snap.epsFwd) : null;
}
// series : {kind:'role', role:'cy'|'ny'} | {kind:'fwd'} | {kind:'year', year:2026}
function snapPEForSeries(snap, series){
  if(!snap || !series) return null;
  if(series.kind==='fwd') return snapPEFwd(snap);
  if(series.kind==='year') return snapPEByYear(snap, series.year);
  return snapPERole(snap, series.role);
}
function seriesRawEps(snap, series){
  if(!snap || !series) return null;
  if(series.kind==='fwd') return (typeof snap.epsFwd==='number') ? snap.epsFwd : null;
  const year = series.kind==='year' ? series.year : (series.role==='ny' ? snap.nyYear : snap.cyYear);
  return snap.epsByYear ? (snap.epsByYear[String(year)] ?? null) : null;
}

const VALO_PERIOD_DAYS={'1s':7,'1m':30,'3m':91,'6m':182,'1y':365};
const VALO_PERIOD_LABELS={'1s':'1 wk','1m':'1 mo','3m':'3 mo','6m':'6 mo','1y':'1 yr'};
const VALO_GAP_TOLERANCE_DAYS=10; // ~1 capture manquee a raison de 2/semaine

function formatFrDate(iso){
  if(!iso) return '';
  const p=String(iso).split('-');
  if(p.length!==3) return iso;
  return `${parseInt(p[2],10)} ${MONTH_ABBR_FR[parseInt(p[1],10)]||''} ${p[0]}`;
}
function isoDateMinusDays(dateStr, days){
  const d=new Date(dateStr+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()-days);
  return d.toISOString().slice(0,10);
}
function isoDatePlusDays(dateStr, days){
  const d=new Date(dateStr+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function dayDiffISO(a,b){
  return Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/86400000);
}
// snapshots supposes tries par date croissante (garanti par l'ecriture
// append-only du collecteur) - renvoie le DERNIER snapshot dont la date
// est <= targetDate, ou null.
function nearestSnapshotBefore(snapshots, targetDate){
  let best=null;
  for(const s of snapshots){ if(s.date<=targetDate) best=s; else break; }
  return best;
}

// Un point d'inflexion (EPS revise) doit toujours afficher l'EVENEMENT qui
// l'explique (resultats, CMD...) et jamais un "refresh" generique - source
// prioritaire coherenceQualitative.historique (type+quarter deja
// disponibles), repli sur hypothese.guidanceHistory (quarter seul, type
// suppose "resultats") si absent. Tolerance +/-5j : la capture a lieu
// lundi/jeudi, pas forcement le jour exact du call.
const VALO_EVENT_TOLERANCE_DAYS=5;
function findRevisionEvent(ticker, dateStr){
  const t=state.tickers && state.tickers[ticker];
  if(!t) return null;
  const candidates=[];
  ((t.coherenceQualitative||{}).historique||[]).forEach(h=>{
    if(h && h.date && h.quarter) candidates.push({date:h.date, label:h.quarter, type:h.type||'resultats'});
  });
  ((t.hypothese||{}).guidanceHistory||[]).forEach(g=>{
    if(g && g.date && g.quarter && !candidates.some(c=>c.date===g.date)) candidates.push({date:g.date, label:g.quarter, type:'resultats'});
  });
  let best=null, bestGap=Infinity;
  candidates.forEach(c=>{
    const gap=Math.abs(dayDiffISO(dateStr, c.date));
    if(gap<=VALO_EVENT_TOLERANCE_DAYS && gap<bestGap){ best=c; bestGap=gap; }
  });
  return best;
}

function valoEarliestDate(){
  const ph=state.priceHistory;
  if(!ph || !ph.tickers) return null;
  let min=null;
  Object.values(ph.tickers).forEach(entry=>{
    (entry.snapshots||[]).forEach(s=>{ if(!min||s.date<min) min=s.date; });
  });
  return min;
}
function valoPeriodAvailableDate(periodKey){
  const earliest=valoEarliestDate();
  return earliest ? isoDatePlusDays(earliest, VALO_PERIOD_DAYS[periodKey]) : null;
}

function computeRankings(periodKey, seriesDesc, n){
  const days=VALO_PERIOD_DAYS[periodKey];
  const ph=state.priceHistory;
  const out=[];
  if(ph && ph.tickers && days){
    Object.keys(ph.tickers).forEach(tk=>{
      const snaps=ph.tickers[tk].snapshots||[];
      if(snaps.length<2) return;
      const latest=snaps[snaps.length-1];
      const targetDate=isoDateMinusDays(latest.date, days);
      const start=nearestSnapshotBefore(snaps, targetDate);
      if(!start || start===latest) return;
      if(dayDiffISO(targetDate, start.date) > VALO_GAP_TOLERANCE_DAYS) return;
      const peStart=snapPEForSeries(start, seriesDesc);
      const peEnd=snapPEForSeries(latest, seriesDesc);
      if(peStart==null || peEnd==null) return;
      out.push({ticker:tk, peStart, peEnd, deltaPct:(peEnd-peStart)/peStart*100, startDate:start.date, latestDate:latest.date});
    });
  }
  // Filtre par signe AVANT de couper a N : avec un petit nombre de titres
  // disposant d'assez d'historique, ne jamais faire remonter un titre en
  // hausse dans la liste "baisses" (ou l'inverse) juste pour completer le
  // quota - une liste plus courte que N est un resultat honnete valide.
  const gainers=out.filter(r=>r.deltaPct>0).sort((a,b)=>b.deltaPct-a.deltaPct || a.ticker.localeCompare(b.ticker)).slice(0,n);
  const losers=out.filter(r=>r.deltaPct<0).sort((a,b)=>a.deltaPct-b.deltaPct || a.ticker.localeCompare(b.ticker)).slice(0,n);
  return {gainers, losers, total:out.length};
}

function valoFilterByPeriod(snapshots, periodKey){
  if(!periodKey || periodKey==='all' || !VALO_PERIOD_DAYS[periodKey]) return snapshots;
  const latest=snapshots[snapshots.length-1];
  if(!latest) return snapshots;
  const cutoff=isoDateMinusDays(latest.date, VALO_PERIOD_DAYS[periodKey]);
  const filtered=snapshots.filter(s=>s.date>=cutoff);
  // garde au moins les 2 derniers points si la fenetre est trop stricte,
  // pour ne jamais afficher un graphique a 0/1 point alors que 2+ existent
  return filtered.length>=2 ? filtered : snapshots.slice(-2);
}

function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// Moteur de graphique SVG unique, partage entre les mini-cartes "Value
// Rankings" (compact:true) et la vue detaillee "Historique de
// valorisation" (compact:false) - voir plan de fonctionnalite. opts:
// {mode:'pe'|'price', series, periodKey, compact}
// Catmull-Rom -> Bezier cubique : courbe lissee qui passe EXACTEMENT par
// chaque point (pas d'overshoot visible sur des series courtes/eparses
// comme nos 2 snapshots/semaine) - rendu "app boursière premium" plutot
// que la ligne brisee d'un polyline brut.
function smoothPathD(pts){
  if(pts.length<2) return '';
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

// Graduations de l'axe des dates, adaptees a l'amplitude affichee. Le
// PREMIER libelle porte toujours son millesime : sans ca, une suite
// "T4 T2 T4 T2" ne dit jamais de quelle annee on parle. L'echantillonnage
// se fait en UNE fois avec un pas calcule - un elagage repete un sur deux
// supprimerait tous les millesimes de janvier une fois sur deux.
function buildValoXTicks(dates, maxTicks){
  const ms=d=>new Date(d+'T00:00:00Z').getTime();
  const t0=ms(dates[0]), t1=ms(dates[dates.length-1]);
  const spanDays=(t1-t0)/86400000;
  const shortDate=iso=>{const p=iso.split('-');return parseInt(p[2],10)+' '+(MONTH_ABBR_FR[parseInt(p[1],10)]||'');};
  const ticks=[];
  if(spanDays<=95){
    const n=Math.min(4, dates.length);
    for(let i=0;i<n;i++){
      const idx=Math.round(i*(dates.length-1)/(n-1||1));
      ticks.push({t:ms(dates[idx]), label:shortDate(dates[idx])});
    }
  }else if(spanDays<=550){
    const step=spanDays<=200?1:(spanDays<=380?2:3);
    const d=new Date(t0); d.setUTCDate(1);
    if(d.getTime()<t0) d.setUTCMonth(d.getUTCMonth()+1);
    let prevYear=null;
    while(d.getTime()<=t1){
      const m=d.getUTCMonth()+1, y=d.getUTCFullYear();
      ticks.push({t:d.getTime(), label:(prevYear!==null&&y!==prevYear)?`${MONTH_ABBR_FR[m]} ${String(y).slice(2)}`:MONTH_ABBR_FR[m]});
      prevYear=y; d.setUTCMonth(d.getUTCMonth()+step);
    }
  }else{
    const stepMonths=spanDays>1460?12:6;
    const d=new Date(t0); d.setUTCDate(1);
    while(d.getUTCMonth()%stepMonths!==0) d.setUTCMonth(d.getUTCMonth()+1);
    if(d.getTime()<t0) d.setUTCMonth(d.getUTCMonth()+stepMonths);
    while(d.getTime()<=t1){
      const m=d.getUTCMonth()+1, y=d.getUTCFullYear();
      ticks.push({t:d.getTime(), label:m===1?String(y):`${MONTH_ABBR_FR[m]} ${String(y).slice(2)}`});
      d.setUTCMonth(d.getUTCMonth()+stepMonths);
    }
  }
  const cap=maxTicks||6;
  if(ticks.length>cap){
    const step=Math.ceil(ticks.length/cap);
    const kept=ticks.filter((_,i)=>i%step===0);
    ticks.length=0; kept.forEach(k=>ticks.push(k));
  }
  if(ticks.length && !/\d{2}$/.test(ticks[0].label)){
    ticks[0].label+=' '+String(new Date(ticks[0].t).getUTCFullYear()).slice(2);
  }
  return ticks;
}

function buildValoChartSVG(ticker, opts){
  const ph=state.priceHistory;
  const entry=ph && ph.tickers ? ph.tickers[ticker] : null;
  const allSnaps=entry ? (entry.snapshots||[]) : [];
  if(allSnaps.length<2) return null;

  const mode=opts.mode||'pe';
  const series=opts.series;
  const compact=!!opts.compact;
  // tone : accent de couleur pour les mini-cartes du Ranking (coherent
  // avec les couleurs de marque baisses=navy / hausses=turquoise, voir
  // .vr-panel-title) - null sur la fiche titre (courbe neutre navy).
  const tone=opts.tone||null;
  const snaps=valoFilterByPeriod(allSnaps, opts.periodKey);
  if(snaps.length<2) return null;

  const yVal=(snap)=> mode==='price' ? snap.price : snapPEForSeries(snap, series);
  const idxByDate=new Map(allSnaps.map((s,i)=>[s.date,i]));
  const points=snaps
    .map(s=>({snap:s, idx:idxByDate.get(s.date), y:yVal(s)}))
    .filter(p=>p.y!=null && isFinite(p.y));
  if(points.length<2) return null;

  // Fiche titre : le trace demarre a x=0 (aucune gouttiere d'axe), les
  // graduations chiffrees vivant DANS le cadre - c'est ce qui colle le
  // graphique au bord gauche comme le reste de la section. Sur mobile on
  // retrecit le viewBox au lieu de laisser le SVG se reduire a 60% :
  // sinon un texte declare a 9.5px tombe a ~5.5px effectifs et devient
  // illisible.
  const narrow=!compact && typeof window!=='undefined' && window.innerWidth<620;
  // Le viewBox epouse la largeur REELLE du conteneur : a hauteur fixe et
  // largeur 100%, un viewBox de rapport different aurait ete mis a
  // l'echelle sur la hauteur puis CENTRE par preserveAspectRatio, d'ou
  // une large gouttiere vide a gauche. A 1:1 il n'y a ni mise a
  // l'echelle (le texte garde son corps declare) ni centrage.
  const W=compact?260:(opts.width||(narrow?380:640)), H=compact?90:(narrow?250:220);
  const padL=compact?4:0, padR=compact?4:54, padT=compact?10:40, padB=compact?12:30;
  const plotW=W-padL-padR, plotH=H-padT-padB;

  const t0=new Date(points[0].snap.date+'T00:00:00Z').getTime();
  const t1=new Date(points[points.length-1].snap.date+'T00:00:00Z').getTime();
  const tSpan=Math.max(1, t1-t0);
  const xOfT=(t)=> padL + ((t-t0)/tSpan)*plotW;
  const xOf=(dateStr)=> xOfT(new Date(dateStr+'T00:00:00Z').getTime());

  // Moyenne de la serie affichee : attribut permanent de CHAQUE courbe,
  // des le 2e point (pas d'option a activer). Pour la courbe "annee en
  // cours" (role glissant), elle s'accumule naturellement d'une annee
  // civile a l'autre puisque la serie elle-meme est continue.
  const yVals=points.map(p=>p.y);
  const avg=compact?null:yVals.reduce((a,b)=>a+b,0)/yVals.length;
  let yMin=Math.min(...yVals), yMax=Math.max(...yVals);
  if(avg!=null){ yMin=Math.min(yMin,avg); yMax=Math.max(yMax,avg); }
  if(yMin===yMax){ yMin-=Math.abs(yMin*0.1)||1; yMax+=Math.abs(yMax*0.1)||1; }
  // Marge plus genereuse hors mini-carte : les graduations chiffrees sont
  // posees dans ces bandes haute/basse, qu'aucun point n'atteint - c'est
  // ce qui leur evite tout aplat de fond (qui decouperait le trace).
  const margin=(yMax-yMin)*(compact?0.1:0.16);
  yMin-=margin; yMax+=margin;
  const yOf=(v)=> padT + (1-(v-yMin)/(yMax-yMin))*plotH;

  const priceCur=mode==='price' ? tickerCur(ticker) : '';
  const fmtPrice=(v)=> v.toFixed(2)+priceCur;

  const lineColor=tone==='up' ? 'var(--teal-dark-text)' : tone==='down' ? 'var(--navy)' : 'var(--navy)';
  const areaColor=tone==='up' ? 'var(--teal)' : tone==='down' ? 'var(--navy)' : 'var(--navy-light)';
  const areaOpacity=tone ? .12 : .5;
  const dotColor=tone==='up' ? 'var(--teal-dark-text)' : 'var(--navy)';

  // Inflexion "refresh Omnium" : la valeur BRUTE de la serie affichee a
  // change entre deux snapshots CONSECUTIFS (dans l'historique complet du
  // titre, pas seulement la fenetre affichee) - detection precise, propre
  // a CHAQUE courbe (un refresh qui revise epsNY sans toucher epsCY ne
  // marque rien sur la courbe CY). Zero champ stocke a part, tout vient de
  // epsByYear/epsFwd deja present sur chaque snapshot.
  const inflexionIdx=new Set();
  for(let i=1;i<allSnaps.length;i++){
    const prevV=seriesRawEps(allSnaps[i-1], series), curV=seriesRawEps(allSnaps[i], series);
    if(prevV!=null && curV!=null && Math.abs(curV-prevV)>1e-9) inflexionIdx.add(i);
  }

  const earningsDates=(ph.earningsDates && ph.earningsDates[ticker]) || [];
  const winStart=points[0].snap.date, winEnd=points[points.length-1].snap.date;
  const visibleEarnings=compact ? [] : earningsDates.filter(d=>d>=winStart && d<=winEnd);

  const xyPts=points.map(p=>[xOf(p.snap.date), yOf(p.y)]);
  const lineD=smoothPathD(xyPts);
  const areaBase=(padT+plotH).toFixed(1);
  const areaPath=`${lineD} L${xyPts[xyPts.length-1][0].toFixed(1)},${areaBase} L${xyPts[0][0].toFixed(1)},${areaBase} Z`;

  // Axes (fiche titre uniquement - les mini-cartes du Ranking restent des
  // sparklines epurees sans grille, cf. Apple Stocks/Robinhood watchlist).
  // L'unite est portee UNE fois par une etiquette en tete d'axe, les
  // graduations restent des nombres nus - au lieu de repeter "×" ou la
  // devise sur chaque valeur.
  const fmtY=(v)=> v.toFixed(mode==='price'?2:1);
  const axisUnit=mode==='price' ? `Price, in ${tickerCur(ticker)||'$'}` : 'P/E, in ×';
  const axText=(x,y,txt,anchor)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="9.5" font-weight="400" font-family="Poppins,sans-serif" fill="var(--muted)" text-anchor="${anchor}">${txt}</text>`;
  // 3 graduations tracees, 2 seulement chiffrees (haut et bas) : la
  // mediane reste un trait muet. Les deux etiquettes sont posees hors de
  // la bande occupee par la courbe, donc SANS aucun aplat de fond.
  const vTop=yMax-margin*0.62, vBot=yMin+margin*0.62;
  const yAxis=compact ? '' : (
    `<text x="${padL}" y="13" font-size="9.5" font-weight="700" font-family="Poppins,sans-serif" fill="var(--navy)" text-anchor="start">${axisUnit}</text>`
    + [vTop,(yMax+yMin)/2,vBot].map(v=>{
      const y=yOf(v).toFixed(1);
      return `<line x1="${padL}" x2="${(padL+plotW).toFixed(1)}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    }).join('')
    + axText(padL, yOf(vTop)-6, fmtY(vTop), 'start')
    + axText(padL, yOf(vBot)+12, fmtY(vBot), 'start')
  );
  // Abscisses adaptatives : dates courtes en dessous de ~3 mois, mois
  // ensuite (millesime au changement d'annee), semestres/annees au-dela
  // de 18 mois - et jamais plus de ~5 etiquettes. Sans ca, a 2 captures
  // par semaine, l'axe devient illisible en quelques mois.
  const xAxis=compact ? '' : (()=>{
    const yb=(padT+plotH+17);
    const ticks=buildValoXTicks(points.map(p=>p.snap.date), narrow?4:6);
    return ticks.map((tk,i)=>{
      const anchor=i===0?'start':(i===ticks.length-1?'end':'middle');
      return axText(xOfT(tk.t), yb, tk.label, anchor);
    }).join('');
  })();

  const earningsMarks=visibleEarnings.map(d=>{
    const xd=xOf(d).toFixed(1);
    return `<line x1="${xd}" x2="${xd}" y1="${padT}" y2="${(padT+plotH).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2,3" opacity=".5"><title>Earnings – ${formatFrDate(d)}</title></line>`;
  }).join('');

  // Moyenne : pointille gris discret, etiquette POSEE AU-DESSUS du trait
  // (jamais a cheval, elle serait barree) et sans aplat de fond. En
  // graisse normale, comme les graduations.
  const avgMark=(compact||avg==null) ? '' : (()=>{
    const y=yOf(avg);
    const n=points.length;
    const lbl=`average ${fmtY(avg)}${n<10?`  ·  ${n} pts`:''}`;
    const lblW=lbl.length*5.2+10;
    // Ordonnee du trace pour un x quelconque (interpolation lineaire sur
    // la polyligne - suffisamment proche de la courbe lissee).
    const curveYAt=(x)=>{
      if(x<=xyPts[0][0]) return xyPts[0][1];
      const last=xyPts[xyPts.length-1];
      if(x>=last[0]) return last[1];
      for(let i=1;i<xyPts.length;i++){
        if(x<=xyPts[i][0]){
          const [x0,y0]=xyPts[i-1], [x1,y1]=xyPts[i];
          return y0+(y1-y0)*((x-x0)/((x1-x0)||1));
        }
      }
      return last[1];
    };
    // Balayage : on retient la fenetre horizontale ou le trace s'ecarte
    // le PLUS de la ligne de moyenne, puis on pose l'etiquette du cote
    // oppose au trace. Elle ne peut donc jamais se retrouver dessus,
    // quelle que soit la forme de la courbe.
    let bestCx=padL+plotW/2, bestGap=-1, bestAbove=true;
    if(plotW>lblW){
      for(let i=0;i<=48;i++){
        const cx=padL+lblW/2+(plotW-lblW)*(i/48);
        let minD=Infinity, sum=0;
        for(let k=0;k<=8;k++){
          const cy=curveYAt(cx-lblW/2+lblW*k/8);
          minD=Math.min(minD, Math.abs(cy-y)); sum+=cy;
        }
        // sum/9 > y : le trace est EN DESSOUS de la moyenne sur cette
        // fenetre (l'axe y croit vers le bas), on pose donc au-dessus.
        if(minD>bestGap){ bestGap=minD; bestCx=cx; bestAbove=(sum/9)>y; }
      }
    }
    const ly=bestAbove ? y-5 : y+12;
    return `<line x1="${padL}" x2="${(padL+plotW).toFixed(1)}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#9aa3b2" stroke-width="1.25" stroke-dasharray="4,4"/>`
      +`<text x="${bestCx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9.5" font-weight="400" font-family="Poppins,sans-serif" fill="#6b7280" text-anchor="middle">${lbl}</text>`;
  })();

  // Au-dela de ~40 points, les pastilles individuelles se touchent et le
  // trace devient une chenille : on ne garde alors que les marqueurs de
  // revision. A 2 captures/semaine ce seuil tombe vers 5 mois d'historique.
  const dense=!compact && points.length>40;
  const dots=points.map(p=>{
    const isInflexion=inflexionIdx.has(p.idx);
    if(dense && !isInflexion) return '';
    const cx=xOf(p.snap.date).toFixed(1), cy=yOf(p.y).toFixed(1);
    const r=isInflexion?(compact?3.5:5):(compact?2.25:3.5);
    return isInflexion
      ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--gold)" stroke="var(--navy)" stroke-width="1"/>`
      : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${dotColor}"/>`;
  }).join('');

  // Remonte a l'appelant ce qui est REELLEMENT trace, pour que la legende
  // n'annonce jamais un marqueur absent de l'ecran.
  if(opts.out){
    opts.out.hasRevision=points.some(p=>inflexionIdx.has(p.idx));
    opts.out.hasEarnings=visibleEarnings.length>0;
    opts.out.hasAvg=avg!=null;
  }

  // Tooltip au survol : toujours actif sur la fiche titre (souris + tap) ;
  // sur les mini-cartes du Ranking, SOURIS UNIQUEMENT (pas de touchstart)
  // pour ne jamais interferer avec le tap-pour-ouvrir de la carte entiere
  // sur mobile.
  const hitTargets=points.map((p,i)=>{
    const cx=xOf(p.snap.date);
    const bandW=points.length>1 ? plotW/(points.length-1) : plotW;
    const rx=(cx-bandW/2).toFixed(1);
    const isInflexion=inflexionIdx.has(p.idx);
    const event=isInflexion ? findRevisionEvent(ticker, p.snap.date) : null;
    const info={date:p.snap.date, price:p.snap.price, val:p.y, mode, isInflexion, eventLabel:event?event.label:null, eventType:event?event.type:null};
    const touchAttr=compact ? '' : ' ontouchstart="showValoTooltip(event)"';
    return `<rect x="${rx}" y="0" width="${Math.max(1,bandW).toFixed(1)}" height="${H}" fill="transparent" data-info="${escAttr(JSON.stringify(info))}" onmousemove="showValoTooltip(event)" onmouseleave="hideValoTooltip()"${touchAttr}/>`;
  }).join('');

  const endLabel=(()=>{
    const last=points[points.length-1];
    const txt=mode==='price' ? fmtPrice(last.y) : last.y.toFixed(1)+'×';
    const lx=xyPts[xyPts.length-1][0], ly=yOf(last.y);
    if(compact){
      return `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.5" fill="#fff" stroke="${dotColor}" stroke-width="1.5"/>`;
    }
    const tw=txt.length*6.4+10;
    return `<rect x="${(lx+7).toFixed(1)}" y="${(ly-9).toFixed(1)}" width="${tw.toFixed(1)}" height="18" rx="5" fill="${lineColor}"/>`+
      `<text x="${(lx+7+tw/2).toFixed(1)}" y="${(ly+1).toFixed(1)}" font-size="11" font-weight="700" font-family="Poppins,sans-serif" fill="#fff" text-anchor="middle" dominant-baseline="middle">${txt}</text>`;
  })();

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible;">
    <path d="${areaPath}" fill="${areaColor}" opacity="${areaOpacity}"/>
    ${yAxis}
    ${earningsMarks}
    <path d="${lineD}" fill="none" stroke="${lineColor}" stroke-width="${compact?1.75:2.25}" stroke-linejoin="round" stroke-linecap="round"/>
    ${avgMark}
    ${dots}
    ${endLabel}
    ${xAxis}
    ${hitTargets}
  </svg>`;
}

function showValoTooltip(evt){
  const rect=evt.currentTarget;
  let info; try{ info=JSON.parse(rect.dataset.info); }catch(e){ return; }
  let tip=document.getElementById('valo-tooltip');
  if(!tip){
    tip=document.createElement('div');
    tip.id='valo-tooltip';
    tip.className='valo-tooltip';
    document.body.appendChild(tip);
  }
  const valTxt=info.mode==='price' ? (info.price!=null?info.price.toFixed(2):'—') : (info.val!=null?info.val.toFixed(1)+'×':'—');
  const eventTxt=info.eventLabel ? (info.eventType==='resultats'?`Earnings ${info.eventLabel}`:info.eventLabel) : 'Revised estimate';
  tip.innerHTML=`<div class="valo-tooltip-date">${formatFrDate(info.date)}</div><div>${info.mode==='price'?'Price':'P/E'}: <b>${valTxt}</b></div>${info.isInflexion?`<div class="valo-tooltip-flag">↳ ${eventTxt}</div>`:''}`;
  const r=rect.getBoundingClientRect();
  tip.style.left=(r.left+r.width/2+window.scrollX)+'px';
  tip.style.top=(r.top+window.scrollY-8)+'px';
  tip.style.display='block';
}
function hideValoTooltip(){
  const tip=document.getElementById('valo-tooltip');
  if(tip) tip.style.display='none';
}

  const nRow=[5,10,15].map(v=>pill('n', v, v, st.n===v, false)).join('');

    .map(([k,label,title])=>pill('role', k, label, st.role===k, false, title)).join('');

  const grid=(list)=> list.length
    ? `<div class="vr-grid">${list.map(r=>renderValueRankingCard(r, seriesDesc)).join('')}</div>`

  wrap.innerHTML=`
    <div class="card vr-controls">

      <div class="vr-control-group"><span class="vr-control-lbl">P/E</span><div class="vr-pill-row">${rRow}</div></div>
    </div>
    <div class="card">
      <div class="card-title vr-panel-title vr-down"><b>Biggest P/E declines</b></div>
      ${grid(losers)}
    </div>
    <div class="card">
      <div class="card-title vr-panel-title vr-up"><b>Biggest P/E gains</b></div>
      ${grid(gainers)}
    </div>
  `;
}

// ── Courbe de projection (translation de la courbe EPS dans le temps) ──
// A la difference de buildValoChartSVG (une metrique dans le temps, axe X
// = dates), cette vue prend la courbe de projection ENTIERE (EPS par
// annee fiscale, axe X = annee) telle qu'elle existait a differents
// instants passes, et superpose plusieurs de ces courbes pour montrer
// comment la projection elle-meme a bouge - translation vers le haut/bas,
// changement de pente, revision concentree sur une annee precise.
function distinctEpsByYearStates(snapshots){
  // Un point par REVISION reelle, jamais un point par snapshot - la
  // courbe est identique entre deux refresh, la dupliquer n'apporterait
  // rien et surchargerait le graphique.
  const out=[];
  let lastKey=null;
  snapshots.forEach(s=>{
    if(!s.epsByYear) return;
    const key=JSON.stringify(Object.keys(s.epsByYear).sort().map(y=>[y,s.epsByYear[y]]));
    if(key!==lastKey){
      out.push({date:s.date, epsByYear:s.epsByYear});
      lastKey=key;
    }
  });
  return out;
}

function buildValoProjectionCurvesSVG(ticker, maxCurves, chartW){
  const ph=state.priceHistory;
  const entry=ph && ph.tickers ? ph.tickers[ticker] : null;
  const snaps=entry ? (entry.snapshots||[]) : [];
  const states=distinctEpsByYearStates(snaps);
  if(!states.length) return null;
  const shown=states.slice(-(maxCurves||6));

  const allYears=new Set();
  shown.forEach(s=>Object.keys(s.epsByYear).forEach(y=>allYears.add(+y)));
  const years=Array.from(allYears).sort((a,b)=>a-b);
  if(years.length<2) return null;

  let yMin=Infinity, yMax=-Infinity;
  shown.forEach(s=>years.forEach(y=>{
    const v=s.epsByYear[String(y)];
    if(typeof v==='number'){ if(v<yMin)yMin=v; if(v>yMax)yMax=v; }
  }));
  if(!isFinite(yMin)||!isFinite(yMax)) return null;
  if(yMin===yMax){ yMin-=Math.abs(yMin*0.1)||1; yMax+=Math.abs(yMax*0.1)||1; }
  const margin=(yMax-yMin)*0.12;
  yMin-=margin; yMax+=margin;

  // Meme geometrie que le graphique P/E : viewBox a la largeur reelle du
  // conteneur (sinon preserveAspectRatio centre le trace), depart a x=0,
  // unite portee par une etiquette en tete d'axe.
  const W=chartW||640, H=260, padL=0, padR=34, padT=40, padB=32;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const yFirst=years[0], yLast=years[years.length-1];
  const xOf=(year)=> yLast>yFirst ? padL + ((year-yFirst)/(yLast-yFirst))*plotW : padL+plotW/2;
  const yOf=(v)=> padT + (1-(v-yMin)/(yMax-yMin))*plotH;

  const ticks=4;
  const gridlines=Array.from({length:ticks+1},(_, i)=>{
    const v=yMin+(yMax-yMin)*(i/ticks);
    const y=yOf(v).toFixed(1);
    return `<line x1="${padL}" x2="${(padL+plotW).toFixed(1)}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
  }).join('');
  // Seuls le haut et le bas sont chiffres, dans les bandes de marge que
  // le trace n'atteint jamais - donc sans aplat de fond.
  const vHi=yMax-margin*0.55, vLo=yMin+margin*0.55;
  const yLabels=`<text x="${padL}" y="${(yOf(vHi)-6).toFixed(1)}" font-size="9.5" font-family="Poppins,sans-serif" fill="var(--muted)">${vHi.toFixed(1)}</text>`
    +`<text x="${padL}" y="${(yOf(vLo)+12).toFixed(1)}" font-size="9.5" font-family="Poppins,sans-serif" fill="var(--muted)">${vLo.toFixed(1)}</text>`;
  const unitTxt=`EPS, in ${tickerCur(ticker)||'$'}`;
  const unitLabel=`<text x="${padL}" y="13" font-size="9.5" font-weight="700" font-family="Poppins,sans-serif" fill="var(--navy)">${unitTxt}</text>`;
  // Le trace demarrant a x=0, une etiquette centree sur le premier (ou le
  // dernier) point deborderait du viewBox et serait rognee : on ancre ces
  // deux-la sur leur bord.
  const xLabels=years.map((y,i)=>{
    const anchor=i===0?'start':(i===years.length-1?'end':'middle');
    return `<text x="${xOf(y).toFixed(1)}" y="${H-8}" font-size="10" font-weight="700" fill="var(--muted)" text-anchor="${anchor}">${y}</text>`;
  }).join('');

  const n=shown.length;
  const curvesSvg=shown.map((s,i)=>{
    const isLast=i===n-1;
    const opacity=n>1 ? (0.2 + 0.8*(i/(n-1))) : 1;
    const ptYears=years.filter(y=>typeof s.epsByYear[String(y)]==='number');
    const pts=ptYears.map(y=>`${xOf(y).toFixed(1)},${yOf(s.epsByYear[String(y)]).toFixed(1)}`).join(' ');
    const dots=ptYears.map((y,j)=>{
      const v=s.epsByYear[String(y)];
      const px=xOf(y), py=yOf(v);
      let label='';
      if(isLast){
        // L'etiquette est decalee PERPENDICULAIREMENT a la pente locale,
        // toujours du cote superieur : elle ne peut donc jamais se poser
        // sur le trace, quelle que soit son inclinaison.
        const pv=ptYears[j-1], nv=ptYears[j+1];
        const ax=pv!=null?xOf(pv):px, ay=pv!=null?yOf(s.epsByYear[String(pv)]):py;
        const bx=nv!=null?xOf(nv):px, by=nv!=null?yOf(s.epsByYear[String(nv)]):py;
        let dx=bx-ax, dy=by-ay;
        const len=Math.hypot(dx,dy)||1; dx/=len; dy/=len;
        let nx=-dy, ny=dx;
        if(ny>0){ nx=-nx; ny=-ny; }
        // Bornage horizontal : sur le premier/dernier point, le decalage
        // perpendiculaire peut sortir du viewBox - on rabat l'ancrage.
        const ox=px+nx*14, oy=py+ny*14;
        const txt=v.toFixed(1), halfW=txt.length*2.6;
        const anchor=(ox-halfW<padL)?'start':((ox+halfW>padL+plotW)?'end':'middle');
        const cx=anchor==='start'?Math.max(ox,padL):(anchor==='end'?Math.min(ox,padL+plotW):ox);
        label=`<text x="${cx.toFixed(1)}" y="${(oy+3).toFixed(1)}" font-size="9" font-weight="800" fill="var(--navy)" text-anchor="${anchor}">${txt}</text>`;
      }
      return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${isLast?3.5:2.2}" fill="var(--navy)" opacity="${opacity}"/>${label}`;
    }).join('');
    return `<polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="${isLast?2.5:1.5}" opacity="${opacity}" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');

  const legendHtml=shown.map((s,i)=>{
    const opacity=n>1 ? (0.2 + 0.8*(i/(n-1))) : 1;
    return `<span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:11px;height:2.5px;background:var(--navy);opacity:${opacity};display:inline-block;border-radius:1px;"></span>${formatFrDate(s.date)}</span>`;
  }).join('');

  return {
    svg: `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMinYMid meet" style="display:block;overflow:visible;">${unitLabel}${gridlines}${yLabels}${curvesSvg}${xLabels}</svg>`,
    legendHtml,
    single: n<2
  };
}

// ── Historique de valorisation (fiche titre) ─────────────────────
let _valoHistState={mode:'pe', seriesKind:'role', role:'cy', year:null, period:'all'};

function renderValoHistory(ticker){
  const card=document.getElementById('valo-hist-card');
  if(!card) return;
  const ph=state.priceHistory;
  const entry=ph && ph.tickers ? ph.tickers[ticker] : null;
  const snaps=entry ? (entry.snapshots||[]) : [];

  if(_valoHistPending){
    _valoHistState.period=_valoHistPending.period;
    if(_valoHistPending.role==='fwd'){ _valoHistState.mode='pe'; _valoHistState.seriesKind='fwd'; }
    else { _valoHistState.mode='pe'; _valoHistState.seriesKind='role'; _valoHistState.role=_valoHistPending.role; }
    _valoHistPending=null;
  }

  if(snaps.length<2){
    const msg=snaps.length===1
      ? `Valuation history available from ${formatFrDate(snaps[0].date)} (collection in progress, check back after the next capture).`
      : `Valuation history not yet available for this ticker — collection starts at the next snapshot (2 times/week).`;
    card.innerHTML=`<div class="card-title" style="text-align:left;"><b>Valuation history</b></div><div class="vr-empty">${msg}</div>`;
    return;
  }

  const latest=snaps[snaps.length-1];
  const earliest=snaps[0].date;
  const years=latest.epsByYear ? Object.keys(latest.epsByYear).map(Number).sort((a,b)=>a-b) : [];
  const st=_valoHistState;
  const seriesDesc=st.mode!=='pe' ? null
    : st.seriesKind==='fwd' ? {kind:'fwd'}
    : st.seriesKind==='year' ? {kind:'year', year: years.includes(st.year) ? st.year : years[0]}
    : {kind:'role', role:st.role};

  // Le millesime de l'annee EN COURS ne selectionne pas la serie absolue
  // mais le ROLE glissant : c'est la seule courbe continue d'une annee
  // civile a l'autre (au roll de janvier elle enchaine sur le nouveau
  // millesime), donc la seule dont la moyenne s'accumule vraiment.
  const curYear=latest.cyYear;
  const isCurSel=st.mode==='pe'&&st.seriesKind==='role'&&st.role==='cy';
  const modeBtn=(m,label)=>`<button class="vr-pill${st.mode===m?' active':''}" onclick="setValoHistMode('${m}')">${label}</button>`;
  const yearBtn=(y)=>{
    if(y===curYear){
      return `<button class="vr-pill${isCurSel?' active':''}" title="Current year — continuous series across the January roll" onclick="setValoHistSeries('role','cy')">${y}<span class="vr-cy-dot"></span></button>`;
    }
    const on=st.mode==='pe'&&st.seriesKind==='year'&&st.year===y;
    return `<button class="vr-pill${on?' active':''}" onclick="setValoHistSeries('year',${y})">${y}</button>`;
  };
  const fwdBtn=`<button class="vr-pill${st.mode==='pe'&&st.seriesKind==='fwd'?' active':''}" onclick="setValoHistSeries('fwd')">12m fwd</button>`;
  // 12m fwd s'intercale entre l'annee en cours et la suivante : c'est
  // chronologiquement sa place, un 12 mois glissant etant un melange des deux.
  const seriesBtns=(()=>{
    const out=[];
    years.forEach(y=>{ out.push(yearBtn(y)); if(y===curYear) out.push(fwdBtn); });
    if(!years.includes(curYear)) out.push(fwdBtn);
    return out.join('');
  })();

  // Ligne "periode" masquee tant qu'aucune fenetre n'est atteignable :
  // avec 3 points sur une semaine, proposer 1 mois / 3 mois / 1 an griss
  // n'apporte rien. Les boutons apparaissent au fur et a mesure que
  // l'historique les rend reellement selectionnables.
  const spanDays=dayDiffISO(latest.date, earliest);
  const availPeriods=Object.keys(VALO_PERIOD_DAYS).filter(pk=>spanDays>=VALO_PERIOD_DAYS[pk]);
  const periodBtn=(pk)=>`<button class="vr-pill${st.period===pk?' active':''}" onclick="setValoHistPeriod('${pk}')">${VALO_PERIOD_LABELS[pk]}</button>`;
  const allBtn=`<button class="vr-pill${st.period==='all'?' active':''}" onclick="setValoHistPeriod('all')">All</button>`;

  // Largeur reelle disponible : le viewBox s'y cale au pixel pres, ce qui
  // supprime a la fois la mise a l'echelle du texte et la gouttiere de
  // centrage laissee par preserveAspectRatio.
  const chartW=Math.max(280, Math.round(card.clientWidth||640));

  let chartHtml, legendHtml;
  if(st.mode==='projection'){
    const proj=buildValoProjectionCurvesSVG(ticker, 6, chartW);
    if(!proj){
      chartHtml='<div class="vr-empty">Not enough history yet to plot a projection curve (at least 2 projected years required).</div>';
      legendHtml='';
    }else{
      chartHtml=proj.svg;
      legendHtml=proj.single
        ? '<span style="color:var(--muted);">Only one curve archived so far — check back after a thesis revision.</span>'
        : proj.legendHtml;
    }
  }else{
    // La legende se construit APRES le trace, a partir de ce qu'il
    // contient reellement : annoncer "Revised estimate" alors qu'aucun
    // point or n'est a l'ecran etait le principal defaut de lecture.
    const out={};
    const chart=buildValoChartSVG(ticker, {mode:st.mode, series:seriesDesc, periodKey:st.period, compact:false, width:chartW, out});
    chartHtml=chart || '<div class="vr-empty">Not enough data points for this period.</div>';
    const legs=[];
    if(out.hasRevision) legs.push('<span><span class="vr-leg-dot"></span>Revised estimate (hover: event)</span>');
    if(out.hasEarnings) legs.push('<span><span class="vr-leg-dash"></span>Earnings</span>');
    if(out.hasAvg) legs.push('<span><span class="vr-leg-avg"></span>Average P/E</span>');
    legendHtml=legs.join('');
  }
  const showSeriesRow=st.mode==='pe';
  const showPeriodRow=st.mode!=='projection' && availPeriods.length>0;

  card.innerHTML=`
    <div class="card-title" style="text-align:left;"><b>Valuation history</b></div>
    <div class="vr-hist-controls">
      <div class="vr-control-row">${modeBtn('pe','P/E')}${modeBtn('projection','EPS')}</div>
      ${showSeriesRow ? `<div class="vr-control-row vr-series-row"><span class="vr-row-lbl">P/E</span>${seriesBtns}</div>` : ''}
      ${showPeriodRow ? `<div class="vr-control-row">${availPeriods.map(periodBtn).join('')}${allBtn}</div>` : ''}
      ${st.mode==='projection' ? '<div class="vr-control-row" style="color:var(--muted);font-size:10.5px;">Each curve = a detected revision of the EPS projection; more recent ones are darker.</div>' : ''}
    </div>
    <div class="vr-hist-legend">${legendHtml}</div>
    <div class="vr-hist-chart">${chartHtml}</div>
  `;
}

function formatThesisText(txt, insertAfterFirst){
  const esc=s=>(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines=(txt||'').split(/\n/);
  let html='', buf=[], first=true, sectionCount=0, injected=false;
  const flush=()=>{
    const t=buf.join('\n');
    if(t.trim()){
      html+=`<div style="font-size:12px;color:var(--text);line-height:1.6;white-space:pre-wrap;margin-bottom:10px;">${esc(t)}</div>`;
    }
    buf=[];
  };
  lines.forEach(line=>{
    const m=line.trim().match(/^==\s*(.+?)\s*==$/);
    if(m){
      flush();
      sectionCount++;
      if(sectionCount===2 && insertAfterFirst && !injected){
        html+=insertAfterFirst;
        injected=true;
      }
      html+=`<div style="font-size:10px;font-weight:700;color:var(--navy);font-family:'Poppins',sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:${first?'0':'14px'} 0 6px;">${esc(m[1])}</div>`;
      first=false;
    }else{
      buf.push(line);
      first=false;
    }
  });
  flush();
  if(insertAfterFirst && !injected){ html+=insertAfterFirst; }
  return html;
}

function buildGuidanceScorecardSummary(gs){
  const esc=s=>(s||'').toString().replace(/</g,'&lt;');
  const latest=(gs.timeline||[])[0]||null;
  const latestIsWarning=latest&&latest.type==='guidance_revision'&&latest.flag==='warning';
  if(gs.weightedBeatPct!=null){
    const verb=gs.weightedBeatPct>=0?'Beats':'Misses';
    const against=gs.comparedAgainst==='guidance'?'guidance':'consensus';
    const warnSuffix=latestIsWarning?' · guidance warning this cycle':'';
    return `${verb} ${against} by ${Math.abs(gs.weightedBeatPct).toFixed(1)}% on average${warnSuffix}`;
  }
  if(gs.paceCheckpoint) return esc(gs.paceCheckpoint);
  if(latest&&latest.type==='guidance_revision'){
    return `Guidance ${latest.flag==='warning'?'cut':'revised'} ${formatFrDate(latest.date)}${latestIsWarning?' · warning':''}`;
  }
  return 'No guidance or consensus track record yet.';
}

function calcScore(ticker){
  const d=state.tickers[ticker];
  if(!d||!d.data||d.data.length<2)return 0;
  const cours=d.cours||100;
  const{proj}=getProj(ticker);
  const {CY,LY}=yearsFor(ticker);
  const epsCY=proj[CY]?.eps||0,eps30=proj[LY]?.eps||0;
  if(epsCY<=0||eps30<=0)return 0;
  const cagrEps=((Math.pow(eps30/epsCY,0.25))-1)*100;
  const div=d.dividende||0;
  const yieldPct=(cours>0&&div>0?(div/cours)*100:0)+particulariteYieldPct(d);
  const peFwd=cours>0?cours/epsCY:null;
  if(!peFwd||peFwd<=0)return 0;
  return (cagrEps+yieldPct)/peFwd;
}

// pour les news) - assume car cette notification ne vit qu'une seule
// journee de toute facon (voir la conversation de design du 12/08/2026) :

const MARKET_ACTION_DISMISS_KEY='omniumMarketActionDismissedDate';

// "Jour" cote Paris (PAS le fuseau local du visiteur) - le backend
// (market_check.py) raisonne en heure de Paris, la comparaison cote client
// doit utiliser le meme referentiel pour ne jamais afficher une ligne
// perimee (ou en cacher une valide) a cause d'un visiteur dans un autre
// fuseau horaire. Cutoff a 01h00 (pas minuit pile) - decision du
// 13/08/2026 : en retranchant 1h avant de lire la date, la notification
// de la veille reste affichee jusqu'a 01h00 heure de Paris plutot que de
// disparaitre a minuit pile, avant que market_reset.py (recale sur le
// meme cutoff, voir sa docstring) n'ait ecrit la nouvelle baseline du
// jour - utile pour une consultation tardive en soiree.
function todayParisDateStr(){
  const shifted=new Date(Date.now()-60*60*1000);
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(shifted);
}

// filterDate : si fourni, ne conserve QUE les items dont dateCollecte
// correspond exactement - PAS dateEvenement (correctif : le digest, voir
// merge.py update_digest(), regroupe ses lignes par date de COLLECTE - le
// jour ou le run a tourne - pas par date de l'evenement sous-jacent. Un
// item dont l'evenement date d'hier mais collecte aujourd'hui est compte
// dans la ligne "aujourd'hui" du digest ; filtrer sur dateEvenement le
// faisait donc disparaitre a tort de la vue detaillee correspondante,
// donnant l'impression trompeuse d'une ligne "vide" alors que le compteur
// affichait bien un total > 0). Le tri interne reste sur dateEvenement
// (ordre de lecture chronologique de l'evenement lui-meme, inchange) -
// seul le FILTRE change de champ.
function groupNewsAll(filterDate){
  const all=(state.newsAll||[]).filter(it=>!filterDate || it.dateCollecte===filterDate);
  const byType={};
  all.forEach(it=>{
    if(!it||!it.type)return;
    (byType[it.type]=byType[it.type]||[]).push(it);
  });
  return NEWS_TYPE_ORDER.filter(t=>byType[t]&&byType[t].length).map(t=>{
    const byCompany={};
    byType[t].forEach(it=>{
      const key=it.ticker||it.name||'?';
      if(!byCompany[key])byCompany[key]={name:it.name||it.ticker||'?', items:[]};
      byCompany[key].items.push(it);
    });
    const companies=Object.values(byCompany).map(c=>{
      c.items.sort((a,b)=>String(b.dateEvenement||'').localeCompare(String(a.dateEvenement||'')));
      return c;
    }).sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'}));
    return {type:t, label:NEWS_TYPE_LABEL[t]||t, companies};
  });
}

  // Bandeau de filtre actif : n'apparait que si une date precise est

            <div class="news-company-name">${esc(c.name)}</div>

                <a href="${esc(it.url||'#')}" target="_blank" rel="noopener noreferrer">${esc(it.title||'')}</a>
                <span class="news-item-date">${formatNewsDayMonth(it.dateEvenement)}</span>

let pfNameFilter='';
function pfNormalize(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function pfFilterByName(v){
  pfNameFilter=v;
  renderPortfolio();
}
function pfOpenTicker(tk,cours){
  CT=tk;refreshSelects();
  const coursEl=document.getElementById('cours');
  if(coursEl){ coursEl.value=cours; sizeCoursInput(); }
  syncAnalyseHeader(tk);showTab('analyse',null);autoFetchPrice(tk,true);
}
function pfNameFilterKeydown(e){
  if(e.key==='Escape'){
    e.target.value='';pfFilterByName('');e.target.blur();
    return;
  }
  if(e.key!=='Enter')return;
  const q=pfNormalize(pfNameFilter);
  if(!q)return;
  const match=pfLastFilteredItems.find(({d,tk})=>pfNormalize(d.name||tk).startsWith(q));
  if(match) pfOpenTicker(match.tk,match.cours);
}
let pfLastFilteredItems=[];

let pfSort={key:'name',dir:'asc'};
function pfSortBy(key){
  if(pfSort.key===key){ pfSort.dir = pfSort.dir==='asc'?'desc':'asc'; }
  else{ pfSort.key=key; pfSort.dir = (key==='name'||key==='nextEvent'||key==='peN'||key==='peN1')?'asc':'desc'; }
  renderPortfolio();
}
function pfSortItems(items){
  const{key,dir}=pfSort;
  const mul=dir==='asc'?1:-1;
  return items.slice().sort((a,b)=>{
    if(key==='name'){
      return mul*(a.d.name||a.tk).localeCompare(b.d.name||b.tk,'fr',{sensitivity:'base'});
    }
    if(key==='nextEvent'){
      const av=a.nextEvtDate, bv=b.nextEvtDate;
      if(av==null&&bv==null)return 0;
      if(av==null)return 1;
      if(bv==null)return -1;
      return mul*(av-bv);
    }
    let av,bv;
    switch(key){
      case 'return': av=a.totalReturn; bv=b.totalReturn; break;
      case 'peN': av=a.peFwd??Infinity; bv=b.peFwd??Infinity; break;
      case 'peN1': av=a.pe27??Infinity; bv=b.pe27??Infinity; break;
      default: av=a.score; bv=b.score;
    }
    return mul*(av-bv);
  });
}
function pfUpdateSortHeaderUI(){
  document.querySelectorAll('.pf-sort-arrow').forEach(el=>{
    const k=el.getAttribute('data-key');
    el.textContent=(pfSort.key===k)?(pfSort.dir==='asc'?'▲':'▼'):'';
  });
  const sel=document.getElementById('pf-sort-select');
  if(sel && sel.value!==pfSort.key) sel.value=pfSort.key;
}

function renderPortfolio(){
  renderWeeklyAiBar();
  renderNewsBar();
  renderMarketActionBar();
  const list=document.getElementById('pf-list');
  const countEl=document.getElementById('pf-count');
  const esc=s=>(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(!list)return;list.innerHTML='';
  
  const items=Object.entries(state.tickers)
    .filter(([,d])=>d.data&&d.data.length>=2)
    .map(([tk,d])=>{
      try{
        const cours=d.cours||100;
        const{proj}=getProj(tk);
        const {CY,LY}=yearsFor(tk);
        const div=d.dividende||0;
        const epsCY=proj[CY]?.eps||0,eps27=proj[CY+1]?.eps||0,eps30=proj[LY]?.eps||0;
        const cagrEps=(epsCY>0&&eps30>0)?((Math.pow(eps30/epsCY,0.25))-1)*100:0;
        const yieldPct=((cours>0&&div>0)?(div/cours)*100:0)+particulariteYieldPct(d);
        const totalReturn=cagrEps+yieldPct;
        const peFwd=(cours>0&&epsCY>0)?cours/epsCY:null;
        const pe27=(cours>0&&eps27>0)?cours/eps27:null;
        const score=calcScore(tk);
        const nextEvt=nextEventLabel(tk);
        const nextEvtDate=nextEventDate(tk);
        return{tk,d,cours,totalReturn,peFwd,pe27,score,nextEvt,nextEvtDate};
      }catch(e){return null;}
    }).filter(Boolean);

  const hdr=document.getElementById('pf-col-header');
  if(hdr) hdr.style.display = items.length ? 'flex' : 'none';

  if(!items.length){
    if(countEl)countEl.textContent='0 tickers';
    list.innerHTML='<div class="pf-empty">No tickers. database.json may be empty or not configured.</div>';
    pfLastFilteredItems=[];
    return;
  }

  const q=pfNormalize(pfNameFilter);
  const filtered=q?items.filter(({tk,d})=>pfNormalize(d.name||tk).startsWith(q)||pfNormalize(tk).startsWith(q)):items;

  if(countEl)countEl.textContent=q
    ? filtered.length+' ticker'+(filtered.length!==1?'s':'')+' (of '+items.length+')'
    : items.length+' ticker'+(items.length!==1?'s':'');

  const sorted=q
    ? filtered.slice().sort((a,b)=>(a.d.name||a.tk).localeCompare(b.d.name||b.tk,'fr',{sensitivity:'base'}))
    : pfSortItems(filtered);
  pfLastFilteredItems=sorted;

  if(!sorted.length){
    list.innerHTML='<div class="pf-empty">No ticker matches "'+esc(pfNameFilter)+'".</div>';
    return;
  }

  const maxScore=Math.max(...items.map(x=>x.score),0.1);
  sorted.forEach(({tk,d,cours,totalReturn,peFwd,pe27,score,nextEvt},idx)=>{
    const el=document.createElement('div');
    el.className='pf-item'+(tk===CT?' pf-active':'');
    el.onclick=()=>pfOpenTicker(tk,cours);
    el.innerHTML=`
      <div class="pf-row-top">
        <div class="pf-main">
         <div class="pf-name">${d.name||tk}</div>
        </div>
      </div>
      <div class="pf-metrics">
        <div class="pf-metric pf-metric-return"><div class="pf-mv">${totalReturn>=0?'+':''}${totalReturn.toFixed(1)}%</div></div>
        <div class="pf-metric pf-metric-pe"><div class="pf-mv">${peFwd?peFwd.toFixed(1)+'×':'—'}</div></div>
        <div class="pf-metric pf-metric-pe"><div class="pf-mv">${pe27?pe27.toFixed(1)+'×':'—'}</div></div>
        <div class="pf-metric pf-metric-event"><div class="pf-mv pf-mv-event">${nextEvt}</div></div>
      </div>
    `;
    list.appendChild(el);
  });
  pfUpdateSortHeaderUI();
}

// que la banniere apparaisse pour un onglet deja ouvert).
const MARKET_ACTION_TTL=5*60*1000;
async function pollMarketAction(){
  try{
    const r=await fetch('data/marketAction.json', NO_STORE);
    if(r.ok){ state.marketAction=await r.json(); renderMarketActionBar(); }
  }catch(e){}
}
function startMarketActionPoll(){
  setInterval(pollMarketAction, MARKET_ACTION_TTL);
}
