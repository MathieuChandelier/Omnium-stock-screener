<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accès invité — Omnium</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#000190;--navy-dark:#00004a;--navy-light:#eeeffe;--teal:#2BD8C2;--teal-text:#25CFB4;--muted:#64748b;--border:#e6e6f0;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(120deg, var(--navy) 0%, var(--navy-dark) 100%);font-family:'Poppins',sans-serif;}
.card{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:28px 26px 26px;box-shadow:0 20px 60px rgba(0,0,20,.35);}
.card-title{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:4px;}
.card-sub{font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:20px;line-height:1.5;}
label{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;}
.field{margin-bottom:16px;}
input[type=password],select{width:100%;font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:var(--navy);background:var(--navy-light);border:1.5px solid transparent;border-radius:10px;padding:11px 13px;outline:none;transition:border-color .12s;}
input[type=password]:focus,select:focus{border-color:var(--navy);}
button{width:100%;font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:700;color:#fff;background:var(--navy);border:none;border-radius:10px;padding:12px;cursor:pointer;transition:background .12s,opacity .12s;}
button:hover{background:var(--navy-dark);}
button:disabled{opacity:.5;cursor:not-allowed;}
.error{margin-top:12px;font-size:12.5px;font-weight:600;color:#c0392b;display:none;}
.result{margin-top:18px;padding-top:18px;border-top:1px solid var(--border);display:none;}
.result-lbl{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;}
.result-row{display:flex;gap:8px;}
.result-row input{flex:1;font-size:12px;font-weight:600;color:var(--navy);background:var(--navy-light);border:none;border-radius:8px;padding:9px 10px;font-family:'Poppins',sans-serif;}
.copy-btn{width:auto;flex-shrink:0;padding:9px 14px;font-size:12px;background:var(--teal-text);}
.copy-btn:hover{background:#1cb89f;}
.copy-btn.copied{background:#10b981;}
.result-exp{margin-top:8px;font-size:12px;font-weight:600;color:var(--muted);}
.back-link{display:block;text-align:center;margin-top:18px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;}
.back-link:hover{color:var(--navy);}
</style>
</head>
<body>
<div class="card">
  <div class="card-title">Accès invité</div>
  <div class="card-sub">Génère un lien temporaire vers l'app, à usage unique par destinataire. Le lien expire automatiquement à l'heure indiquée — inutile d'y repenser après l'avoir envoyé.</div>

  <div class="field">
    <label for="pw">Mot de passe admin</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="•••••••••">
  </div>

  <div class="field">
    <label for="dur">Durée de validité</label>
    <select id="dur">
      <option value="1">1 heure</option>
      <option value="4" selected>4 heures</option>
      <option value="24">24 heures</option>
      <option value="48">48 heures</option>
      <option value="168">7 jours</option>
      <option value="8760">1 an (usage personnel)</option>
    </select>
  </div>

  <button id="genBtn" type="button">Générer le lien</button>
  <div class="error" id="errBox"></div>

  <div class="result" id="resultBox">
    <div class="result-lbl">Lien à partager</div>
    <div class="result-row">
      <input type="text" id="linkOut" readonly>
      <button class="copy-btn" id="copyBtn" type="button">Copier</button>
    </div>
    <div class="result-exp" id="expOut"></div>
  </div>

  <a class="back-link" href="index.html">← Retour à l'app</a>
</div>

<script>
const GENERATE_ENDPOINT='https://model.omnium-capital.com/generate.php';
const PW_SESSION_KEY='omniumAdminPw';

const pwInput=document.getElementById('pw');
const durSelect=document.getElementById('dur');
const genBtn=document.getElementById('genBtn');
const errBox=document.getElementById('errBox');
const resultBox=document.getElementById('resultBox');
const linkOut=document.getElementById('linkOut');
const expOut=document.getElementById('expOut');
const copyBtn=document.getElementById('copyBtn');

try{
  const saved=sessionStorage.getItem(PW_SESSION_KEY);
  if(saved)pwInput.value=saved;
}catch(e){}

function showError(msg){
  errBox.textContent=msg;
  errBox.style.display='block';
  resultBox.style.display='none';
}
function clearError(){
  errBox.style.display='none';
}

async function generate(){
  const password=pwInput.value;
  const hours=+durSelect.value;
  if(!password){ showError('Entrez le mot de passe admin.'); pwInput.focus(); return; }
  clearError();
  genBtn.disabled=true;
  genBtn.textContent='Génération…';
  try{
    const r=await fetch(GENERATE_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password, hours}),
      signal:AbortSignal.timeout(10000)
    });
    const j=await r.json();
    if(!r.ok || j.error){
      if(j.error==='invalid_password')showError('Mot de passe incorrect.');
      else showError('Une erreur est survenue. Réessayez.');
      return;
    }
    try{ sessionStorage.setItem(PW_SESSION_KEY, password); }catch(e){}
    linkOut.value=j.url;
    expOut.textContent='Expire le '+j.expires_at;
    resultBox.style.display='block';
    copyBtn.textContent='Copier';
    copyBtn.classList.remove('copied');
  }catch(e){
    showError('Impossible de contacter le serveur. Vérifiez votre connexion.');
  }finally{
    genBtn.disabled=false;
    genBtn.textContent='Générer le lien';
  }
}

genBtn.addEventListener('click', generate);
pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter')generate(); });

copyBtn.addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText(linkOut.value);
  }catch(e){
    linkOut.select();
    document.execCommand('copy');
  }
  copyBtn.textContent='Copié ✓';
  copyBtn.classList.add('copied');
  setTimeout(()=>{ copyBtn.textContent='Copier'; copyBtn.classList.remove('copied'); },2000);
});
</script>
</body>
</html>
